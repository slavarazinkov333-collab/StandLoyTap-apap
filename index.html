<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1,viewport-fit=cover">
<title>3D — простой мир</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#87b6d9;font-family:'Segoe UI',Arial,sans-serif}
#app{position:fixed;inset:0}
canvas{display:block}

/* МЕНЮ СТАРТА */
#menu{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(circle at 50% 40%,#1c2833 0%,#0b0f14 100%);z-index:100;gap:22px}
#menu h1{color:#fff;font-size:32px;font-weight:900;letter-spacing:1px;text-align:center}
#menu h1 span{color:#ffb800}
#menu p{color:#8899a6;font-size:13px;font-weight:600;text-align:center;max-width:280px;line-height:1.5}
#playBtn{background:linear-gradient(135deg,#ffb800,#ff8c00);border:none;color:#0b0f14;font-weight:900;font-size:20px;padding:18px 60px;border-radius:14px;cursor:pointer;letter-spacing:2px;box-shadow:0 8px 30px rgba(255,184,0,.35)}
#playBtn:active{transform:scale(.96)}

/* UI В ИГРЕ */
#ui{position:fixed;inset:0;pointer-events:none;display:none}
#ui.on{display:block}

/* ДЖОЙСТИК */
#joy{position:absolute;left:30px;bottom:40px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);pointer-events:auto;touch-action:none}
#joyBase{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:rgba(255,184,0,.85);box-shadow:0 0 20px rgba(255,184,0,.5)}

/* КНОПКА ДЕЙСТВИЯ */
#actBtn{position:absolute;right:40px;bottom:60px;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);pointer-events:auto;display:flex;justify-content:center;align-items:center;font-size:32px;color:#fff;touch-action:none}
#actBtn:active{background:rgba(255,184,0,.6)}

/* ПРИЦЕЛ/ИНФО */
#hud{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.4);border-radius:10px;padding:8px 16px;color:#fff;font-size:12px;font-weight:700;backdrop-filter:blur(6px)}
</style>
</head>
<body>

<div id="app"></div>

<div id="menu">
  <h1>ПРОСТОЙ <span>МИР</span></h1>
  <p>Джойстик слева — движение. Кнопка справа — прыжок. WASD тоже работают.</p>
  <button id="playBtn">ИГРАТЬ</button>
</div>

<div id="ui">
  <div id="hud">WASD / джойстик — идти · кнопка — прыжок</div>
  <div id="joy"><div id="joyBase"></div></div>
  <div id="actBtn">⤒</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ---------- СЦЕНА ----------
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b6d9);
scene.fog = new THREE.Fog(0x87b6d9, 30, 90);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 4, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = false; // без теней
app.appendChild(renderer.domElement);

// ---------- СВЕТ ----------
scene.add(new THREE.AmbientLight(0xffffff, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(20, 40, 15);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x88aaff, 0.8);
fill.position.set(-15, 10, -10);
scene.add(fill);

// ---------- ЗЕМЛЯ ----------
const groundSize = 120;
const groundGeo = new THREE.PlaneGeometry(groundSize, groundSize, 40, 40);
const groundMat = new THREE.MeshLambertMaterial({ color: 0x4a7c3a });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// лёгкие холмы через вершины
const pos = groundGeo.attributes.position;
for(let i=0;i<pos.count;i++){
  const x = pos.getX(i), y = pos.getY(i);
  const d = Math.sqrt(x*x + y*y);
  if(d > 5) pos.setZ(i, Math.sin(x*0.3)*Math.cos(y*0.3)*0.6 + (Math.random()-0.5)*0.15);
}
groundGeo.computeVertexNormals();

// ---------- ДЕРЕВЬЯ ----------
function makeTree(x,z){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.35,0.5,2.6,6),
    new THREE.MeshLambertMaterial({color:0x6b4423})
  );
  trunk.position.y = 1.3;
  g.add(trunk);
  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(1.6, 3, 7),
    new THREE.MeshLambertMaterial({color:0x2d6a2d})
  );
  leaves.position.y = 3.6;
  g.add(leaves);
  const leaves2 = new THREE.Mesh(
    new THREE.ConeGeometry(1.2, 2.2, 7),
    new THREE.MeshLambertMaterial({color:0x3a8a3a})
  );
  leaves2.position.y = 4.8;
  g.add(leaves2);
  g.position.set(x, 0, z);
  return g;
}
const obstacles = [];
for(let i=0;i<45;i++){
  const a = Math.random()*Math.PI*2, r = 10 + Math.random()*45;
  const x = Math.cos(a)*r, z = Math.sin(a)*r;
  const t = makeTree(x,z);
  scene.add(t);
  obstacles.push({x, z, r:0.8});
}

// ---------- КАМНИ ----------
for(let i=0;i<25;i++){
  const a = Math.random()*Math.PI*2, r = 8 + Math.random()*50;
  const x = Math.cos(a)*r, z = Math.sin(a)*r;
  const s = 0.5 + Math.random()*1.2;
  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(s, 0),
    new THREE.MeshLambertMaterial({color:0x777777, flatShading:true})
  );
  rock.position.set(x, s*0.6, z);
  rock.rotation.set(Math.random()*3, Math.random()*3, Math.random()*3);
  scene.add(rock);
  obstacles.push({x, z, r:s*0.8});
}

// ---------- СТЕНА ПО КРАЮ ----------
const wallMat = new THREE.MeshLambertMaterial({color:0x555566});
const wallGeo = new THREE.BoxGeometry(0.6, 3, 0.6);
const wallR = groundSize/2 - 2;
for(let i=0;i<80;i++){
  const a = (i/80)*Math.PI*2;
  const x = Math.cos(a)*wallR, z = Math.sin(a)*wallR;
  const w = new THREE.Mesh(wallGeo, wallMat);
  w.position.set(x, 1.5, z);
  scene.add(w);
}

// ---------- ПЕРСОНАЖ ----------
const player = new THREE.Group();
const body = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.45, 0.9, 6, 12),
  new THREE.MeshLambertMaterial({color:0xffb800})
);
body.position.y = 0.9;
player.add(body);
// голова
const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.35, 12, 12),
  new THREE.MeshLambertMaterial({color:0xffe4b3})
);
head.position.y = 1.85;
player.add(head);
// глаза
const eyeMat = new THREE.MeshBasicMaterial({color:0x111111});
const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.06,6,6), eyeMat);
eyeL.position.set(-0.12, 1.9, 0.3);
player.add(eyeL);
const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.06,6,6), eyeMat);
eyeR.position.set(0.12, 1.9, 0.3);
player.add(eyeR);
// нос-направление
const nose = new THREE.Mesh(
  new THREE.ConeGeometry(0.1, 0.3, 6),
  new THREE.MeshLambertMaterial({color:0xff8c00})
);
nose.position.set(0, 1.8, 0.38);
nose.rotation.x = Math.PI/2;
player.add(nose);
scene.add(player);

// ---------- ФИЗИКА ПЕРСОНАЖА ----------
const playerState = {
  x: 0, z: 0, y: 0,
  vy: 0,
  onGround: true,
  angle: 0,
  speed: 6,
  jumpPower: 8,
  gravity: 22
};

// ---------- УПРАВЛЕНИЕ ----------
const keys = {};
addEventListener('keydown', e=>{ keys[e.code]=true; });
addEventListener('keyup', e=>{ keys[e.code]=false; });

const joy = document.getElementById('joy');
const joyBase = document.getElementById('joyBase');
let joyActive = false;
let joyVec = {x:0, y:0};
let joyId = null;

function joyStart(e){
  joyActive = true;
  joyId = e.pointerId;
  joy.setPointerCapture(e.pointerId);
  joyMove(e);
}
function joyMove(e){
  if(!joyActive || e.pointerId !== joyId) return;
  const rect = joy.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  let dx = e.clientX - cx;
  let dy = e.clientY - cy;
  const max = rect.width/2 - 10;
  const d = Math.sqrt(dx*dx + dy*dy);
  if(d > max){ dx = dx/d*max; dy = dy/d*max; }
  joyBase.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  joyVec.x = dx / max;
  joyVec.y = dy / max;
}
function joyEnd(e){
  if(e.pointerId !== joyId) return;
  joyActive = false;
  joyId = null;
  joyVec.x = 0; joyVec.y = 0;
  joyBase.style.transform = 'translate(-50%,-50%)';
}
joy.addEventListener('pointerdown', joyStart);
joy.addEventListener('pointermove', joyMove);
joy.addEventListener('pointerup', joyEnd);
joy.addEventListener('pointercancel', joyEnd);

// Прыжок
const actBtn = document.getElementById('actBtn');
actBtn.addEventListener('pointerdown', ()=>{
  if(playerState.onGround){
    playerState.vy = playerState.jumpPower;
    playerState.onGround = false;
  }
});

// ---------- СТАРТ ----------
document.getElementById('playBtn').addEventListener('click', ()=>{
  document.getElementById('menu').style.display = 'none';
  document.getElementById('ui').classList.add('on');
});

// ---------- ЦИКЛ ----------
const clock = new THREE.Clock();

function collides(nx, nz){
  const pr = 0.5;
  for(const o of obstacles){
    const dx = nx - o.x, dz = nz - o.z;
    const rr = o.r + pr;
    if(dx*dx + dz*dz < rr*rr) return true;
  }
  // стена по кругу
  const d = Math.sqrt(nx*nx + nz*nz);
  if(d > wallR - 0.8) return true;
  return false;
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // ввод
  let ix = 0, iz = 0;
  if(keys['KeyW'] || keys['ArrowUp']) iz -= 1;
  if(keys['KeyS'] || keys['ArrowDown']) iz += 1;
  if(keys['KeyA'] || keys['ArrowLeft']) ix -= 1;
  if(keys['KeyD'] || keys['ArrowRight']) ix += 1;
  ix += joyVec.x;
  iz += joyVec.y;

  const len = Math.sqrt(ix*ix + iz*iz);
  if(len > 1){ ix /= len; iz /= len; }

  // движение относительно камеры
  if(len > 0.05){
    const camAngle = camera.rotation.y;
    const wx = ix*Math.cos(camAngle) - iz*Math.sin(camAngle);
    const wz = ix*Math.sin(camAngle) + iz*Math.cos(camAngle);

    const nx = playerState.x + wx * playerState.speed * dt;
    const nz = playerState.z + wz * playerState.speed * dt;

    // раздельное скольжение по осям
    if(!collides(nx, playerState.z)) playerState.x = nx;
    if(!collides(playerState.x, nz)) playerState.z = nz;

    playerState.angle = Math.atan2(wx, wz);
  }

  // гравитация
  playerState.vy -= playerState.gravity * dt;
  playerState.y += playerState.vy * dt;
  if(playerState.y <= 0){
    playerState.y = 0;
    playerState.vy = 0;
    playerState.onGround = true;
  }

  // применяем к мешу
  player.position.set(playerState.x, playerState.y, playerState.z);
  player.rotation.y = playerState.angle;

  // камера от третьего лица
  const camDist = 7;
  const camHeight = 3.5;
  const targetX = playerState.x - Math.sin(playerState.angle) * camDist;
  const targetZ = playerState.z - Math.cos(playerState.angle) * camDist;
  const targetY = playerState.y + camHeight;

  camera.position.x += (targetX - camera.position.x) * 0.08;
  camera.position.y += (targetY - camera.position.y) * 0.08;
  camera.position.z += (targetZ - camera.position.z) * 0.08;
  camera.lookAt(playerState.x, playerState.y + 1.2, playerState.z);

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
