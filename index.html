<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>StandFliutApap</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--red:#e50914;--red2:#8b0000;--dark:#0a0a0a;--dark2:#121214;--dark3:#1a1a1f;--dark4:#222228;--gray:#666;--gray2:#999;--green:#4CAF50;--purple:#9b8aff;--pink:#ff69b4;--blue:#4a9eff;--yellow:#ffd700;--gold:#ffb800}
body{background:var(--dark);color:#fff;min-height:100vh;overflow-x:hidden;padding-bottom:100px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,rgba(229,9,20,.08),transparent 40%),radial-gradient(circle at 80% 80%,rgba(139,0,0,.06),transparent 40%);pointer-events:none;z-index:0}
.top{position:sticky;top:0;z-index:10;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,10,.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(229,9,20,.15)}
.top-left{display:flex;align-items:center;gap:12px}
.logo-svg{width:38px;height:38px;filter:drop-shadow(0 0 8px rgba(229,9,20,.6))}
.stats{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--gray2);font-weight:600}
.stats .row-stat{display:flex;align-items:center;gap:6px}
.stats .dot{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 6px var(--red)}
.stats .up{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.stats .val{color:#fff;font-weight:800;font-size:11px}
.top-right{display:flex;align-items:center;gap:8px}
.cart-btn{width:40px;height:40px;background:var(--dark3);border:1.5px solid rgba(229,9,20,.2);border-radius:12px;display:flex;justify-content:center;align-items:center;cursor:pointer;position:relative}
.cart-btn svg{width:20px;height:20px;fill:var(--red)}
.cart-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:900;border-radius:10px;padding:2px 6px;border:2px solid var(--dark);display:none}
.bal-pill{display:flex;align-items:center;gap:8px;background:var(--dark3);padding:8px 12px;border-radius:14px;border:1px solid rgba(229,9,20,.2);cursor:pointer}
.bal-plus{width:26px;height:26px;background:linear-gradient(135deg,var(--red),var(--red2));border-radius:9px;display:flex;justify-content:center;align-items:center;font-size:17px;color:#fff;font-weight:900}
.bal-num{font-size:14px;font-weight:900;color:#fff}
.bal-g{font-size:11px;font-weight:900;color:var(--red)}
.av-top{width:40px;height:40px;border-radius:12px;background:var(--dark3);display:flex;justify-content:center;align-items:center;font-size:16px;cursor:pointer;border:2px solid var(--green);position:relative;overflow:hidden}
.av-top img{width:100%;height:100%;object-fit:cover}
.event-bar{padding:10px 16px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.event-bar::-webkit-scrollbar{display:none}
.event-card{flex-shrink:0;background:var(--dark2);border:1.5px solid rgba(229,9,20,.25);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;min-width:200px;position:relative}
.event-card.clickable{cursor:pointer}
.event-card.bonus-available{border-color:var(--gold);background:linear-gradient(135deg,rgba(255,184,0,.15),rgba(255,140,0,.05));animation:bonusPulse 2s ease-in-out infinite}
@keyframes bonusPulse{0%,100%{box-shadow:0 0 0 rgba(255,184,0,0)}50%{box-shadow:0 0 25px rgba(255,184,0,.6)}}
.event-card.bonus-cooldown{opacity:.5}
.event-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--red),var(--red2));display:flex;justify-content:center;align-items:center;font-size:20px;position:relative;flex-shrink:0}
.event-icon.gold{background:linear-gradient(135deg,#ffb800,#ff8c00);box-shadow:0 0 20px rgba(255,184,0,.6)}
.event-icon.pulsing::before{content:'';position:absolute;inset:-4px;border-radius:12px;background:linear-gradient(135deg,#ffb800,#ff8c00);opacity:.4;animation:iconPulse 1.5s ease-in-out infinite;z-index:-1}
@keyframes iconPulse{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.15);opacity:0}}
.event-info{flex:1;min-width:0}
.event-title{font-size:12px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.event-sub{font-size:10px;color:var(--gray2);font-weight:700;margin-top:2px}
.event-pct{font-size:10px;font-weight:900;color:#fff;background:var(--red);padding:3px 8px;border-radius:6px;display:inline-block;margin-top:4px;letter-spacing:.5px}
.event-pct.gold{background:linear-gradient(135deg,#ffb800,#ff8c00);color:#1a1a1a}
.event-pct.gray{background:var(--dark4);color:var(--gray2)}
.live-bar{margin:0 16px 8px;background:linear-gradient(135deg,rgba(30,20,20,.95),rgba(15,10,10,.95));border:1px solid rgba(229,9,20,.25);border-radius:12px;height:52px;overflow:hidden;position:relative;display:flex;align-items:center}
.live-bar::before{content:'🔴 LIVE';position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:9px;font-weight:900;color:#fff;background:var(--red);padding:3px 8px;border-radius:6px;letter-spacing:.5px;z-index:3;box-shadow:0 0 12px rgba(229,9,20,.6);animation:livePulse 1.5s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.7}}
.live-bar::after{content:'';position:absolute;right:0;top:0;bottom:0;width:50px;background:linear-gradient(90deg,transparent,rgba(15,10,10,.95));pointer-events:none;z-index:2}
.live-track{display:flex;gap:14px;white-space:nowrap;animation:scrollLeft 60s linear infinite;padding-left:75px;align-items:center;height:100%}
@keyframes scrollLeft{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.live-item{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:5px 10px 5px 5px;flex-shrink:0;height:40px}
.live-ava{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--red);background:var(--dark3);flex-shrink:0}
.live-ava-ph{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--red2));display:flex;justify-content:center;align-items:center;font-size:14px;flex-shrink:0}
.live-info{display:flex;flex-direction:column;gap:1px;min-width:0}
.live-name{font-size:10px;font-weight:900;color:#fff;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-meta{display:flex;align-items:center;gap:4px;font-size:9px;font-weight:900}
.live-arrow-up{color:var(--green)}
.live-arrow-down{color:#c084fc}
.live-pct{color:#fff}
.live-skin{width:34px;height:34px;object-fit:contain;background:rgba(0,0,0,.4);border-radius:8px;padding:2px;flex-shrink:0}
.live-skin-ph{width:34px;height:34px;background:rgba(0,0,0,.4);border-radius:8px;display:flex;justify-content:center;align-items:center;font-size:16px;flex-shrink:0}
.live-empty{padding-left:75px;font-size:11px;color:var(--gray);font-weight:700}
.main{padding:12px 16px}
.wheel-wrap{position:relative;width:280px;height:280px;margin:10px auto;display:flex;justify-content:center;align-items:center}
.wheel{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,#0d0d10,#050505);position:relative;display:flex;justify-content:center;align-items:center;box-shadow:0 0 80px rgba(229,9,20,.25),inset 0 0 100px rgba(0,0,0,.95);border:2px solid rgba(229,9,20,.2);overflow:hidden}
.wheel-zone{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:1}
.wheel-zone-fill{position:absolute;top:0;left:0;width:100%;height:100%;background:conic-gradient(from 180deg,#e50914 0deg,#8b0000 var(--pct-angle,0deg),transparent var(--pct-angle,0deg),transparent 360deg);opacity:0;transition:opacity .4s ease;border-radius:50%}
.wheel-zone-fill.visible{opacity:.85}
.wheel-zone-fill.blue{background:conic-gradient(from 180deg,#4a9eff 0deg,#1e5cb8 var(--blue-angle,0deg),transparent var(--blue-angle,0deg),transparent 360deg);opacity:0;transition:opacity .5s ease}
.wheel-zone-fill.blue.visible{opacity:.9}
.wheel-zone-glow{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle,transparent 60%,rgba(229,9,20,.3) 100%);opacity:0;transition:opacity .4s ease}
.wheel-zone-glow.visible{opacity:1}
.wheel-zone-glow.blue{background:radial-gradient(circle,transparent 55%,rgba(74,158,255,.5) 100%);opacity:0;transition:opacity .5s ease}
.wheel-zone-glow.blue.visible{opacity:1}
.wheel::before{content:'';position:absolute;width:78%;height:78%;border-radius:50%;background:radial-gradient(circle,#0a0a0a,#050505);border:1px solid rgba(229,9,20,.15);z-index:2}
.wheel-ticks{position:absolute;width:100%;height:100%;border-radius:50%;pointer-events:none;z-index:3}
.tick{position:absolute;top:2px;left:50%;width:2px;height:8px;background:rgba(229,9,20,.3);transform-origin:center 138px;transform:translateX(-50%) rotate(var(--a))}
.tick.major{width:3px;height:14px;background:var(--red)}
.wheel-center{position:relative;z-index:5;text-align:center}
.pt{font-size:48px;font-weight:900;color:rgba(255,255,255,.95);line-height:1;letter-spacing:-2px;transition:color .3s ease}
.pt.active{color:var(--red);text-shadow:0 0 30px rgba(229,9,20,.6)}
.pl{font-size:9px;color:rgba(255,255,255,.35);letter-spacing:3px;margin-top:8px;font-weight:700}
.arrow-wrap{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:25;transform-origin:center center;will-change:transform}
.arrow{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%) rotate(180deg)}
.arrow-svg{width:38px;height:50px;filter:drop-shadow(0 0 14px rgba(229,9,20,1))}
.boost-indicator{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#4a9eff,#1e5cb8);color:#fff;font-size:11px;font-weight:900;padding:6px 14px;border-radius:10px;letter-spacing:1px;box-shadow:0 0 25px rgba(74,158,255,.8);animation:boostFloat 2s ease-in-out infinite;z-index:30;display:none;border:1.5px solid rgba(255,255,255,.3);white-space:nowrap}
.boost-indicator.active{display:flex;align-items:center;gap:6px}
@keyframes boostFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}
.pcnt-row{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:16px}
.pb{background:var(--dark3);border:1.5px solid var(--dark4);border-radius:8px;padding:10px 4px;color:var(--gray);font-size:11px;font-weight:900;cursor:pointer;transition:all .2s}
.pb.sel{border-color:var(--red);background:rgba(229,9,20,.15);color:var(--red);box-shadow:0 0 12px rgba(229,9,20,.3)}
.pb:disabled{opacity:.4;cursor:not-allowed}
.action-row{display:flex;gap:8px;margin-top:16px}
.lightning-btn{width:64px;height:64px;background:var(--dark3);border:1.5px solid var(--dark4);border-radius:16px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;transition:all .2s;flex-shrink:0}
.lightning-btn.on{background:linear-gradient(135deg,rgba(255,184,0,.2),rgba(255,140,0,.1));border-color:var(--gold);box-shadow:0 0 25px rgba(255,184,0,.5)}
.lightning-btn.locked{opacity:.4;pointer-events:none}
.lightning-btn .ic{font-size:26px;line-height:1;filter:grayscale(1);transition:filter .2s}
.lightning-btn.on .ic{filter:grayscale(0);animation:lightningFlash 1s ease-in-out infinite}
@keyframes lightningFlash{0%,100%{transform:scale(1)}50%{transform:scale(1.15);filter:drop-shadow(0 0 8px #ffb800)}}
.lightning-btn .lbl{font-size:8px;font-weight:900;color:var(--gray2);letter-spacing:.5px}
.lightning-btn.on .lbl{color:var(--yellow)}
.upgrade-btn{flex:1;background:var(--dark4);color:var(--gray);border:none;padding:16px;border-radius:16px;font-weight:900;font-size:16px;letter-spacing:2px;cursor:pointer;transition:all .2s}
.upgrade-btn.active{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;box-shadow:0 0 30px rgba(229,9,20,.5)}
.upgrade-btn:disabled{opacity:.5;cursor:not-allowed}
.slots-preview{display:flex;gap:8px;margin-top:16px}
.slot-prev{flex:1;background:var(--dark2);border:1.5px solid rgba(229,9,20,.18);border-radius:14px;padding:14px;text-align:center;min-height:130px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.slot-prev-lbl{font-size:10px;font-weight:800;color:var(--gray2);margin-bottom:6px}
.slot-prev-cnt{font-size:9px;color:var(--gray);font-weight:700;margin-top:6px}
.slot-prev-icons{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.slot-prev-icons img{width:80px;height:80px;object-fit:contain}
.big-tabs{display:flex;gap:6px;margin-top:16px;background:var(--dark2);padding:6px;border-radius:16px;border:1px solid rgba(229,9,20,.12)}
.big-tab{flex:1;background:none;border:none;color:var(--gray2);font-size:12px;font-weight:900;padding:14px 6px;border-radius:12px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:6px}
.big-tab.active{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;box-shadow:0 0 20px rgba(229,9,20,.4)}
.big-tab svg{width:18px;height:18px;fill:currentColor}
.panel{display:none;margin-top:12px}
.panel.active{display:block}
.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.panel-title{font-size:18px;font-weight:900;color:#fff}
.history-btn{background:var(--dark3);border:1px solid rgba(229,9,20,.2);border-radius:10px;padding:8px 14px;color:var(--red);font-size:11px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px}
.history-btn svg{width:14px;height:14px;fill:currentColor}
.sub-tabs{display:flex;gap:6px;background:var(--dark2);padding:6px;border-radius:12px;margin-bottom:12px}
.sub-tab{flex:1;background:none;border:none;color:var(--gray);font-size:12px;font-weight:800;padding:12px;border-radius:10px;cursor:pointer}
.sub-tab.active{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff}
.shop-tabs{display:flex;gap:6px;margin-bottom:12px}
.shop-tab{flex:1;background:var(--dark3);border:1.5px solid var(--dark4);border-radius:12px;padding:12px 6px;color:var(--gray);font-size:11px;font-weight:800;cursor:pointer}
.shop-tab.active{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border-color:var(--red)}
.search-row{display:flex;gap:8px;margin-bottom:12px}
.search-inp{flex:1;background:var(--dark3);border:1px solid rgba(229,9,20,.12);border-radius:12px;padding:12px 16px;color:#fff;font-size:13px;outline:none;display:flex;align-items:center;gap:8px}
.search-inp input{background:none;border:none;color:#fff;outline:none;flex:1;font-size:13px;font-weight:600}
.search-inp input::placeholder{color:var(--gray)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--dark2);border-radius:16px;padding:10px;position:relative;cursor:pointer;border:1.5px solid transparent;transition:all .2s}
.card::before{content:'';position:absolute;inset:0;border-radius:16px;padding:1.5px;background:linear-gradient(135deg,var(--rarity,transparent),transparent 60%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.card:active{transform:scale(.97)}
.card.locked{pointer-events:none;opacity:.5;filter:grayscale(.5)}
.card.bonus{border-color:rgba(255,184,0,.4)}
.card.bonus::after{content:'🎁';position:absolute;top:8px;left:8px;font-size:16px;background:linear-gradient(135deg,#ffb800,#ff8c00);width:28px;height:28px;border-radius:8px;display:flex;justify-content:center;align-items:center;z-index:5;box-shadow:0 0 15px rgba(255,184,0,.6);animation:bonusIconPulse 2s ease-in-out infinite}
@keyframes bonusIconPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.card img{width:100%;height:110px;object-fit:contain;background:radial-gradient(circle,rgba(229,9,20,.04),transparent);border-radius:12px;padding:4px;margin-bottom:6px}
.card .cn{font-size:10px;font-weight:800;color:var(--gray2);letter-spacing:.5px;text-transform:uppercase}
.card .nn{font-size:12px;font-weight:900;color:#fff;line-height:1.2;min-height:30px;margin-top:2px}
.card .pn{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.05)}
.card .s1{font-size:9px;background:var(--dark3);color:var(--red);padding:2px 6px;border-radius:6px;font-weight:900}
.card .s1.bonus-tag{background:linear-gradient(135deg,#ffb800,#ff8c00);color:#1a1a1a}
.card .pr{font-size:14px;font-weight:900;color:var(--red)}
.card .check{position:absolute;top:8px;right:8px;width:26px;height:26px;background:linear-gradient(135deg,var(--red),var(--red2));border-radius:8px;display:flex;justify-content:center;align-items:center;color:#fff;font-weight:900;font-size:16px;z-index:5}
.card-actions{display:none;flex-direction:column;gap:4px;margin-top:8px}
.card.open .card-actions{display:flex}
.card-actions button{padding:8px;border-radius:8px;font-size:11px;font-weight:900;cursor:pointer;border:none}
.btn-upg{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff}
.btn-wd{background:linear-gradient(135deg,var(--green),#2E7D32);color:#fff}
.btn-sell{background:linear-gradient(135deg,#333,#111);color:#fff}
.btn-sell.disabled{opacity:.4;cursor:not-allowed}
.empty-block{text-align:center;padding:80px 20px;color:var(--gray)}
.empty-icon{width:80px;height:80px;background:var(--dark2);border-radius:20px;margin:0 auto 16px;display:flex;justify-content:center;align-items:center;border:1px solid rgba(229,9,20,.12);font-size:40px}
.empty-title{font-size:18px;font-weight:900;color:#fff;margin-bottom:6px}
.empty-sub{font-size:13px;color:var(--gray)}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(10,10,10,.98);backdrop-filter:blur(20px);border-top:1px solid rgba(229,9,20,.15);padding:8px 4px;display:flex;justify-content:space-around;align-items:center}
.nb{background:none;border:none;color:var(--gray);font-size:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;font-weight:800;letter-spacing:.5px;border-radius:10px;flex:1}
.nb svg{width:22px;height:22px;fill:currentColor}
.nb.active{color:var(--red)}
.nb.active svg{fill:var(--red);filter:drop-shadow(0 0 6px rgba(229,9,20,.6))}
.nb-center{position:relative;top:-18px;flex:0 0 auto}
.nb-center .circle{width:56px;height:56px;background:linear-gradient(135deg,var(--red),var(--red2));border-radius:18px;display:flex;justify-content:center;align-items:center;border:4px solid var(--dark);box-shadow:0 0 25px rgba(229,9,20,.6)}
.nb-center .circle svg{width:26px;height:26px;fill:#fff}
.scr{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--dark);z-index:600;flex-direction:column;overflow-y:auto;padding-bottom:90px}
.scr.open{display:flex}
.sh{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(229,9,20,.15);background:rgba(10,10,10,.98);position:sticky;top:0;z-index:10}
.sh h2{color:#fff;font-size:16px;font-weight:900;text-transform:uppercase}
.sh h2 span{color:var(--red)}
.cb{background:var(--dark3);border:none;color:var(--red);font-size:18px;cursor:pointer;width:36px;height:36px;border-radius:10px;display:flex;justify-content:center;align-items:center;font-weight:900}
.sb{flex:1;padding:16px;overflow-y:auto}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(10,10,10,.98);border:2px solid var(--red);border-radius:16px;padding:20px 30px;color:#fff;font-size:14px;font-weight:800;z-index:9999;opacity:0;pointer-events:none;transition:all .3s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast.win{border-color:var(--green)}
.toast.lose{border-color:var(--red)}
.confetti{position:fixed;width:8px;height:8px;background:var(--red);z-index:9998;pointer-events:none;animation:fall 3s linear forwards}
@keyframes fall{0%{transform:translateY(-100vh) rotate(0)}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.spark{position:fixed;width:6px;height:6px;border-radius:50%;z-index:9998;pointer-events:none}
@keyframes sparkFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
.result-screen{position:fixed;inset:0;z-index:4000;display:flex;justify-content:center;align-items:center;padding:24px;backdrop-filter:blur(14px);animation:bgFadeIn .4s ease}
.result-win{background:radial-gradient(circle at center,rgba(76,175,80,.28),rgba(0,0,0,.96) 70%)}
.result-lose{background:radial-gradient(circle at center,rgba(229,9,20,.3),rgba(0,0,0,.96) 70%)}
.result-bonus{background:radial-gradient(circle at center,rgba(255,184,0,.35),rgba(0,0,0,.96) 70%)}
@keyframes bgFadeIn{from{opacity:0}to{opacity:1}}
.result-inner{max-width:380px;width:100%;text-align:center;animation:slideUp .7s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{0%{transform:translateY(80px) scale(.85);opacity:0}60%{transform:translateY(-8px) scale(1.03);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
.result-box{width:220px;height:220px;margin:0 auto 24px;border-radius:32px;display:flex;justify-content:center;align-items:center;position:relative;animation:boxPop .8s cubic-bezier(.34,1.56,.64,1) .15s both}
.result-box img{width:85%;height:85%;object-fit:contain;filter:drop-shadow(0 8px 24px rgba(0,0,0,.6));animation:skinFloat 3s ease-in-out infinite}
@keyframes skinFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes boxPop{0%{transform:scale(.3) rotate(-8deg);opacity:0}70%{transform:scale(1.08) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.result-box.win{background:linear-gradient(135deg,#1b5e20,#0a2e0a);border:3px solid #4CAF50;box-shadow:0 0 40px rgba(76,175,80,.6),0 0 80px rgba(76,175,80,.4)}
.result-box.lose{background:linear-gradient(135deg,#5c0000,#1a0000);border:3px solid #e50914;box-shadow:0 0 40px rgba(229,9,20,.6),0 0 80px rgba(229,9,20,.4)}
.result-box.bonus{background:linear-gradient(135deg,#7a4400,#2a1500);border:3px solid #ffb800;box-shadow:0 0 40px rgba(255,184,0,.7),0 0 80px rgba(255,184,0,.5)}
.result-title{font-size:26px;font-weight:900;margin-bottom:10px;letter-spacing:-.5px}
.result-win .result-title{color:#4CAF50;text-shadow:0 0 20px rgba(76,175,80,.6)}
.result-lose .result-title{color:#e50914;text-shadow:0 0 20px rgba(229,9,20,.6)}
.result-bonus .result-title{color:#ffb800;text-shadow:0 0 30px rgba(255,184,0,.8)}
.result-sub{font-size:13px;font-weight:800;margin-bottom:20px;letter-spacing:1.5px}
.result-win .result-sub{color:#4CAF50}
.result-lose .result-sub{color:#e50914}
.result-bonus .result-sub{color:#ffb800}
.result-skin-name{font-size:20px;font-weight:900;margin-bottom:24px}
.result-win .result-skin-name{color:var(--yellow)}
.result-lose .result-skin-name{color:var(--blue)}
.result-bonus .result-skin-name{color:#ffb800}
.result-btn{width:100%;padding:18px;border-radius:18px;font-weight:900;font-size:16px;cursor:pointer;border:none;letter-spacing:1.5px}
.result-win .result-btn{background:linear-gradient(135deg,#ffd700,#ff9500);color:#1a1a1a;box-shadow:0 0 30px rgba(255,215,0,.5)}
.result-lose .result-btn{background:linear-gradient(135deg,#e50914,#8b0000);color:#fff;box-shadow:0 0 30px rgba(229,9,20,.5)}
.result-bonus .result-btn{background:linear-gradient(135deg,#ffb800,#ff8c00);color:#1a1a1a;box-shadow:0 0 30px rgba(255,184,0,.6)}
.ban-screen{position:fixed;inset:0;z-index:99999;background:radial-gradient(circle at center,rgba(229,9,20,.35),#000 70%);display:flex;justify-content:center;align-items:center;padding:24px}
.ban-inner{text-align:center;max-width:400px}
.ban-icon{font-size:110px;margin-bottom:20px;filter:drop-shadow(0 0 30px rgba(229,9,20,.9))}
.ban-title{font-size:32px;font-weight:900;color:#e50914;letter-spacing:2px;margin-bottom:14px}
.ban-reason{font-size:15px;color:var(--gray2);font-weight:700;margin-bottom:20px}
.ban-reason b{color:#fff;font-weight:900}
.ban-note{font-size:12px;color:#555;line-height:1.6;font-weight:700}
.settings-item{background:var(--dark2);border-radius:14px;padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(229,9,20,.1)}
.settings-item label{font-size:13px;font-weight:700;color:#fff}
.settings-item input{background:var(--dark);border:1px solid rgba(229,9,20,.2);color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700;outline:none;width:120px}
.settings-btn{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:900;font-size:11px;cursor:pointer}
.toggle{position:relative;width:50px;height:28px;background:var(--dark4);border-radius:14px;cursor:pointer;transition:all .3s}
.toggle.on{background:var(--green)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:all .3s}
.toggle.on::after{left:25px}
.btn-full{width:100%;padding:14px;border-radius:12px;font-weight:900;font-size:14px;cursor:pointer;border:none;margin-top:8px}
.profile-wrap{padding:16px;padding-bottom:100px}
.profile-top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.profile-top-bar h1{font-size:24px;font-weight:900;color:#fff;letter-spacing:-.5px}
.btn-topup-top{padding:12px 20px;background:linear-gradient(135deg,var(--red),var(--red2));border:none;border-radius:12px;color:#fff;font-size:13px;font-weight:900;letter-spacing:1px;cursor:pointer;box-shadow:0 0 20px rgba(229,9,20,.5);display:flex;align-items:center;gap:6px}
.profile-main-card{background:linear-gradient(165deg,rgba(30,30,35,.95),rgba(15,15,18,.95));border:1.5px solid rgba(229,9,20,.2);border-radius:24px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.profile-header-row{display:flex;align-items:center;gap:14px;position:relative;margin-bottom:18px}
.profile-avatar-big{width:90px;height:90px;border-radius:20px;overflow:hidden;border:3px solid rgba(229,9,20,.4);position:relative;flex-shrink:0;background:var(--dark3);box-shadow:0 8px 30px rgba(229,9,20,.25)}
.profile-avatar-big img{width:100%;height:100%;object-fit:cover}
.profile-avatar-big .online-dot{position:absolute;bottom:-2px;right:-2px;width:22px;height:22px;border-radius:50%;background:var(--green);border:3px solid var(--dark);box-shadow:0 0 15px rgba(76,175,80,.8);animation:onlinePulse 2s ease-in-out infinite}
@keyframes onlinePulse{0%,100%{box-shadow:0 0 15px rgba(76,175,80,.8)}50%{box-shadow:0 0 25px rgba(76,175,80,1)}}
.profile-user-info{flex:1;min-width:0}
.profile-username{font-size:22px;font-weight:900;color:#fff;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn-edit-name{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:var(--gray2);font-size:10px;font-weight:800;padding:4px 10px;border-radius:8px;cursor:pointer}
.profile-id-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.profile-id-text{font-size:12px;color:var(--gray2);font-weight:800;font-family:monospace}
.copy-id-btn{background:rgba(255,255,255,.06);border:none;color:var(--gray2);font-size:12px;cursor:pointer;padding:4px 6px;border-radius:6px}
.profile-balance-block{background:linear-gradient(135deg,rgba(229,9,20,.1),rgba(139,0,0,.05));border:1.5px solid rgba(229,9,20,.3);border-radius:18px;padding:16px 18px;position:relative}
.profile-balance-label{font-size:11px;color:var(--gray2);font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.profile-balance-row{display:flex;align-items:center;justify-content:space-between}
.profile-balance-val{font-size:38px;font-weight:900;color:#fff;letter-spacing:-1.5px;display:flex;align-items:baseline;gap:8px}
.profile-balance-val .g-badge{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;background:linear-gradient(135deg,var(--red),var(--red2));border-radius:50%;font-size:18px;font-weight:900;color:#fff;box-shadow:0 0 20px rgba(229,9,20,.6)}
.profile-coins-ico{font-size:22px;opacity:.4}
.profile-actions-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.profile-action-btn{padding:14px 10px;background:var(--dark2);border:1.5px solid rgba(229,9,20,.2);border-radius:14px;color:#fff;font-size:12px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.5px}
.profile-action-btn.telegram{background:linear-gradient(135deg,rgba(74,158,255,.15),rgba(74,158,255,.05));border-color:rgba(74,158,255,.4);color:var(--blue)}
.profile-action-btn.full{grid-column:span 2}
.profile-section{background:linear-gradient(165deg,rgba(30,30,35,.95),rgba(15,15,18,.95));border:1.5px solid rgba(229,9,20,.15);border-radius:22px;padding:18px;margin-bottom:14px}
.profile-section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.06)}
.profile-section-title h2{font-size:15px;font-weight:900;color:#fff;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.profile-section-title h2 .ic{color:var(--red);font-size:18px}
.profile-section-badge{padding:5px 12px;background:rgba(229,9,20,.15);border:1px solid rgba(229,9,20,.3);border-radius:8px;font-size:10px;font-weight:900;color:var(--red)}
.stats-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.stat-block{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.06);border-radius:14px;padding:14px 8px;text-align:center}
.stat-block.green{border-color:rgba(76,175,80,.35);background:linear-gradient(135deg,rgba(76,175,80,.1),rgba(76,175,80,.02))}
.stat-block.red{border-color:rgba(229,9,20,.35);background:linear-gradient(135deg,rgba(229,9,20,.1),rgba(229,9,20,.02))}
.stat-block-label{font-size:9px;font-weight:800;color:var(--gray2);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.stat-block-val{font-size:24px;font-weight:900;color:#fff;letter-spacing:-.5px}
.stat-block.green .stat-block-val{color:var(--green)}
.stat-block.red .stat-block-val{color:var(--red)}
.progress-win{margin-bottom:16px}
.progress-win-label{display:flex;justify-content:space-between;font-size:11px;font-weight:900;color:var(--gray2);margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase}
.progress-win-label .val{color:var(--green);font-size:14px}
.progress-win-bar{height:10px;background:rgba(255,255,255,.05);border-radius:5px;overflow:hidden}
.progress-win-fill{height:100%;background:linear-gradient(90deg,var(--red),#ff4444);border-radius:5px;transition:width .6s ease;box-shadow:0 0 15px rgba(229,9,20,.6)}
.best-drop-card{background:linear-gradient(135deg,rgba(255,184,0,.12),rgba(255,140,0,.04));border:1.5px solid rgba(255,184,0,.4);border-radius:18px;padding:16px}
.best-drop-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.best-drop-header h3{font-size:13px;font-weight:900;color:#ffb800;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.best-drop-badge{padding:4px 10px;background:linear-gradient(135deg,#ffb800,#ff8c00);color:#1a1a1a;border-radius:8px;font-size:10px;font-weight:900}
.best-drop-body{display:flex;align-items:center;justify-content:space-between;gap:12px}
.best-drop-info{flex:1;min-width:0}
.best-drop-name{font-size:11px;color:var(--gray2);font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.best-drop-skin{font-size:20px;font-weight:900;color:#fff;letter-spacing:-.5px;margin-bottom:8px;line-height:1.2}
.best-drop-price{font-size:20px;font-weight:900;color:var(--red);display:flex;align-items:center;gap:6px}
.best-drop-price .g-badge-small{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:linear-gradient(135deg,var(--red),var(--red2));border-radius:50%;font-size:12px;color:#fff}
.best-drop-img{width:100px;height:100px;object-fit:contain;flex-shrink:0}
.best-drop-empty{text-align:center;padding:20px;color:var(--gray);font-size:13px;font-weight:700}
.topup-sum-row{display:flex;justify-content:space-between;align-items:center;padding-top:14px;margin-top:14px;border-top:1px solid rgba(255,255,255,.06);font-size:11px}
.topup-sum-label{color:var(--gray2);font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.topup-sum-val{color:#fff;font-weight:900;font-size:16px}
.profile-tabs{display:flex;gap:6px;background:rgba(0,0,0,.4);padding:6px;border-radius:16px;margin-bottom:14px;border:1px solid rgba(229,9,20,.15)}
.profile-tab{flex:1;background:none;border:none;color:var(--gray2);font-size:12px;font-weight:900;padding:12px 6px;border-radius:12px;cursor:pointer;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.profile-tab.active{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;box-shadow:0 0 20px rgba(229,9,20,.5)}
.profile-tab .cnt{padding:2px 7px;background:rgba(255,255,255,.12);border-radius:8px;font-size:10px;font-weight:900}
.profile-tab.active .cnt{background:rgba(255,255,255,.25)}
.profile-tab-content{display:none}
.profile-tab-content.active{display:block}
.profile-sort-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.profile-sort-btn{padding:8px 14px;background:var(--dark3);border:1px solid rgba(255,255,255,.08);border-radius:10px;color:var(--gray2);font-size:11px;font-weight:800;cursor:pointer}
.profile-sort-btn.active{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border-color:transparent}
.profile-sort-btn.danger{color:var(--red);border-color:rgba(229,9,20,.3)}
.profile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.profile-empty{text-align:center;padding:40px 20px;color:var(--gray)}
.profile-empty-ic{width:70px;height:70px;background:var(--dark3);border-radius:20px;margin:0 auto 14px;display:flex;justify-content:center;align-items:center;font-size:32px;border:1px solid rgba(255,255,255,.06)}
.profile-empty-txt{font-size:13px;font-weight:800;color:var(--gray2)}
.legend-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:linear-gradient(135deg,rgba(74,158,255,.25),rgba(0,150,255,.08));border:1.5px solid rgba(74,158,255,.7);border-radius:12px;font-size:13px;font-weight:900;color:#4a9eff;letter-spacing:2px;text-shadow:0 0 15px rgba(74,158,255,.9);box-shadow:0 0 20px rgba(74,158,255,.4);animation:legendBadgePulse 2.5s ease-in-out infinite}
@keyframes legendBadgePulse{0%,100%{box-shadow:0 0 20px rgba(74,158,255,.4)}50%{box-shadow:0 0 40px rgba(74,158,255,.9)}}
.legend-badge .ic{font-size:16px;animation:crownBounce 1.5s ease-in-out infinite}
@keyframes crownBounce{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-8deg)}}
.ref-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);backdrop-filter:blur(14px);z-index:5000;display:flex;justify-content:center;align-items:flex-start;padding:16px;overflow-y:auto}
.ref-modal{background:linear-gradient(165deg,#16161a,#0a0a0d);border:1.5px solid rgba(229,9,20,.35);border-radius:26px;padding:22px;max-width:480px;width:100%;margin-top:16px;position:relative;overflow:hidden;box-shadow:0 25px 80px rgba(229,9,20,.35);animation:refSlide .55s cubic-bezier(.16,1,.3,1)}
@keyframes refSlide{0%{transform:translateY(60px) scale(.92);opacity:0}60%{transform:translateY(-6px) scale(1.01);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
.ref-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid rgba(229,9,20,.2)}
.ref-head h2{font-size:19px;font-weight:900;color:#fff;letter-spacing:1px;display:flex;align-items:center;gap:10px}
.ref-head h2 .ic{width:38px;height:38px;background:linear-gradient(135deg,var(--red),var(--red2));border-radius:12px;display:flex;justify-content:center;align-items:center;font-size:20px;box-shadow:0 0 25px rgba(229,9,20,.6)}
.ref-close{background:var(--dark3);border:none;color:var(--red);width:38px;height:38px;border-radius:11px;cursor:pointer;font-size:18px;font-weight:900}
.ref-legend-banner{background:linear-gradient(135deg,rgba(74,158,255,.2),rgba(0,150,255,.08));border:1.5px solid rgba(74,158,255,.6);border-radius:16px;padding:14px;margin-bottom:16px;text-align:center;animation:legendPulse 2s ease-in-out infinite}
@keyframes legendPulse{0%,100%{box-shadow:0 0 20px rgba(74,158,255,.4)}50%{box-shadow:0 0 40px rgba(74,158,255,.8)}}
.ref-legend-title{font-size:18px;font-weight:900;color:#4a9eff;letter-spacing:2px;text-shadow:0 0 20px rgba(74,158,255,.9),0 0 40px rgba(74,158,255,.6);animation:neonFlicker 3s ease-in-out infinite}
@keyframes neonFlicker{0%,100%{opacity:1}50%{opacity:.85;text-shadow:0 0 30px rgba(74,158,255,1),0 0 60px rgba(74,158,255,.8)}}
.ref-legend-sub{font-size:11px;color:#4a9eff;font-weight:800;letter-spacing:1px;margin-top:6px;opacity:.85}
.ref-my-code-block{background:linear-gradient(135deg,rgba(229,9,20,.12),rgba(139,0,0,.04));border:1.5px solid rgba(229,9,20,.35);border-radius:18px;padding:16px;margin-bottom:14px}
.ref-label{font-size:10px;color:var(--gray2);font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.ref-code-display{font-size:28px;font-weight:900;color:#fff;letter-spacing:4px;font-family:'Courier New',monospace;text-align:center;padding:14px;background:rgba(0,0,0,.5);border-radius:12px;border:1px dashed rgba(229,9,20,.4);text-shadow:0 0 15px rgba(229,9,20,.8);animation:codeGlow 2.5s ease-in-out infinite;margin-bottom:10px}
@keyframes codeGlow{0%,100%{border-color:rgba(229,9,20,.4)}50%{border-color:rgba(229,9,20,.8);text-shadow:0 0 25px rgba(229,9,20,1)}}
.ref-code-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ref-action-btn{padding:12px;border-radius:12px;font-size:12px;font-weight:900;cursor:pointer;border:none;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.ref-action-btn.copy{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;box-shadow:0 0 20px rgba(229,9,20,.5)}
.ref-action-btn.share{background:linear-gradient(135deg,#229ED9,#1682b8);color:#fff;box-shadow:0 0 20px rgba(34,158,217,.5)}
.ref-progress-block{background:rgba(0,0,0,.35);border:1.5px solid rgba(255,184,0,.3);border-radius:18px;padding:16px;margin-bottom:14px}
.ref-progress-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ref-progress-head .lbl{font-size:11px;color:var(--gray2);font-weight:900;letter-spacing:1.5px;text-transform:uppercase}
.ref-progress-head .cnt{font-size:15px;font-weight:900;color:#ffb800;text-shadow:0 0 15px rgba(255,184,0,.6)}
.ref-progress-bar{height:14px;background:rgba(0,0,0,.5);border-radius:7px;overflow:hidden;border:1px solid rgba(255,184,0,.2)}
.ref-progress-fill{height:100%;background:linear-gradient(90deg,#ffb800,#ff8c00,#ffb800);border-radius:7px;transition:width 1s ease-out;box-shadow:0 0 20px rgba(255,184,0,.8);background-size:200% 100%;animation:progressShine 3s linear infinite}
@keyframes progressShine{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.ref-stages{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px}
.ref-stage{padding:8px 6px;border-radius:10px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08);text-align:center;font-size:10px;font-weight:900;color:var(--gray2)}
.ref-stage.done{background:linear-gradient(135deg,rgba(76,175,80,.2),rgba(76,175,80,.05));border-color:rgba(76,175,80,.5);color:var(--green);box-shadow:0 0 15px rgba(76,175,80,.3)}
.ref-stage.current{background:linear-gradient(135deg,rgba(255,184,0,.2),rgba(255,140,0,.05));border-color:rgba(255,184,0,.6);color:#ffb800;animation:stagePulse 1.5s ease-in-out infinite}
@keyframes stagePulse{0%,100%{box-shadow:0 0 10px rgba(255,184,0,.4)}50%{box-shadow:0 0 25px rgba(255,184,0,.8)}}
.ref-stage .st-num{font-size:14px;color:#fff;display:block;margin-top:2px}
.ref-stats-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.ref-stat-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px;text-align:center}
.ref-stat-lbl{font-size:9px;color:var(--gray2);font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.ref-stat-val{font-size:22px;font-weight:900;color:#fff}
.ref-stat-val.green{color:var(--green);text-shadow:0 0 15px rgba(76,175,80,.5)}
.ref-stat-val.gold{color:#ffb800;text-shadow:0 0 15px rgba(255,184,0,.5)}

function getRarity(c){c=String(c).toLowerCase();if(c==='#ffd700')return'#ffd700';if(c==='#ff4444'||c==='#ff8c00')return'#ff4444';if(c==='#ff69b4'||c==='#ff00ff')return'#ff69b4';if(c==='#9b8aff'||c==='#7b61ff')return'#9b8aff';if(c==='#4a9eff'||c==='#00ffff')return'#4a9eff';return'transparent'}
function getUserId(){const t=window.Telegram?.WebApp?.initDataUnsafe?.user;return t?.id?String(t.id):'guest'}
function getUser(){return window.Telegram?.WebApp?.initDataUnsafe?.user||null}
let gold=0,inv=[],stats={spins:0,wins:0,loses:0},jackpot=1000,totalWithdraw=0,history=[],totalTopup=0;
let selectedItems=[],targetSkin=null,selPct=null,isSpinning=false;
let cart=[],invMode='inv',bigTab='inv',shopTab='skins';
let soundEnabled=localStorage.getItem('sfap_sound')!=='0';
let gameLoaded=false;
let lightningOn=false;
let currentWheelAngle=0;
let wheelAnimId=null;
let bonusState={available:true,nextAt:0};
let profileTab='inv';
let refData={code:'',invited:0,earned:0,stage:1,nextGoal:10,isLegend:false};
let refBoost={spinsLeft:0,expire:0};
let audioCtx=null;
function initAudio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}}
function beep(f,t,d,v){if(!soundEnabled)return;try{initAudio();if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=f;o.type=t||'sine';g.gain.setValueAtTime(v||.1,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.start();o.stop(audioCtx.currentTime+d)}catch(e){}}
function sClick(){beep(600,'square',.05,.05)}
function sTick(){beep(1500,'sine',.04,.05)}
function sWin(){beep(800,'sine',.3,.15);setTimeout(()=>beep(1000,'sine',.3,.15),100);setTimeout(()=>beep(1300,'sine',.5,.15),200)}
function sLose(){beep(200,'sawtooth',.5,.15)}
function sBonus(){beep(1000,'sine',.2,.15);setTimeout(()=>beep(1300,'sine',.2,.15),120);setTimeout(()=>beep(1700,'sine',.4,.15),240);setTimeout(()=>beep(2100,'sine',.5,.15),360)}
document.addEventListener('click',e=>{if(e.target.tagName==='BUTTON'||e.target.closest('button'))sClick()},true);
function saveGame(){try{const uid=getUserId();if(uid==='guest')return;if(!gameLoaded)return;const u=getUser();const data={gold,inv,stats,jackpot,totalWithdraw,history,totalTopup,photoUrl:u?.photo_url||'',firstName:u?.first_name||'Игрок',ts:Date.now()};localStorage.setItem('sfap_save_'+uid,JSON.stringify(data));fetch(BOT_URL+'/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,data})})}catch(e){}}
async function loadGame(){
try{
const uid=getUserId();
if(uid==='guest'){gameLoaded=true;return}
try{const b=await fetch(BOT_URL+'/api/ban/'+uid);const bd=await b.json();if(bd.ok&&bd.banned){showBanScreen(bd.reason||'Нарушение');return}}catch(e){}
try{
const r=await fetch(BOT_URL+'/api/load/'+uid);
const d=await r.json();
if(d.ok&&d.data){applySaveData(d.data);localStorage.setItem('sfap_save_'+uid,JSON.stringify(d.data));gameLoaded=true;return}
}catch(e){}
const l=localStorage.getItem('sfap_save_'+uid);
if(l)applySaveData(JSON.parse(l));
gameLoaded=true;
}catch(e){gameLoaded=true}
}
function showBanScreen(reason){document.body.innerHTML='<div class="ban-screen"><div class="ban-inner"><div class="ban-icon">🚫</div><div class="ban-title">ВЫ ЗАБАНЕНЫ</div><div class="ban-reason">Причина: <b>'+reason+'</b></div><div class="ban-note">Если считаешь это ошибкой — свяжись с администратором</div></div></div>'}
function applySaveData(d){if(!d)return;if(typeof d.gold==='number')gold=d.gold;if(Array.isArray(d.inv))inv=d.inv;if(d.stats)stats=d.stats;if(typeof d.jackpot==='number')jackpot=d.jackpot;if(typeof d.totalWithdraw==='number')totalWithdraw=d.totalWithdraw;if(typeof d.totalTopup==='number')totalTopup=d.totalTopup;if(Array.isArray(d.history))history=d.history}
setInterval(saveGame,5000);
function toast(m,t){const e=document.getElementById('toast');e.className='toast '+(t||'')+' show';e.innerText=m;setTimeout(()=>e.classList.remove('show'),2500)}
function confetti(){for(let i=0;i<80;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=['#e50914','#8b0000','#4CAF50','#fff','#ffd700'][Math.floor(Math.random()*5)];c.style.animationDelay=Math.random()*.5+'s';c.style.width=(6+Math.random()*8)+'px';c.style.height=c.style.width;document.body.appendChild(c);setTimeout(()=>c.remove(),3500)}}
function confettiGold(){for(let i=0;i<120;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=['#ffb800','#ff8c00','#ffd700','#fff','#ff6b00'][Math.floor(Math.random()*5)];c.style.animationDelay=Math.random()*.6+'s';c.style.width=(8+Math.random()*10)+'px';c.style.height=c.style.width;c.style.borderRadius=Math.random()>.5?'50%':'2px';document.body.appendChild(c);setTimeout(()=>c.remove(),4000)}}
function sparksRed(){for(let i=0;i<50;i++){const s=document.createElement('div');s.className='spark';s.style.left='50%';s.style.top='40%';s.style.background=['#e50914','#ff4444','#8b0000','#ff6b6b'][Math.floor(Math.random()*4)];s.style.setProperty('--tx',(Math.random()*300-150)+'px');s.style.setProperty('--ty',(Math.random()*300-150)+'px');s.style.animation='sparkFly 1.2s ease-out forwards';s.style.animationDelay=(Math.random()*.3)+'s';s.style.boxShadow='0 0 8px currentColor';document.body.appendChild(s);setTimeout(()=>s.remove(),2000)}}
function updateBal(){document.getElementById('goldTop').innerText=Math.floor(gold).toLocaleString('ru-RU');document.getElementById('incomeVal').innerText=Math.floor(totalWithdraw).toLocaleString('ru-RU')}
function formatPct(p){if(p>=0.1)return p.toFixed(1)+'%';if(p>=0.01)return p.toFixed(2)+'%';if(p>=0.001)return p.toFixed(3)+'%';return '0.01%'}
function openS(id){document.getElementById(id).classList.add('open');if(id==='profileScreen')rendProfile();if(id==='settingsScreen')rendSettings()}
function closeS(id){document.getElementById(id).classList.remove('open')}
function scrollToShop(){switchBigTab('inv');switchSub('shop');document.getElementById('invList').scrollIntoView({behavior:'smooth'})}
function drawTicks(){const t=document.getElementById('wheelTicks');if(!t)return;let h='';for(let i=0;i<36;i++){const a=i*(360/36);const maj=i%3===0;h+=`<div class="tick ${maj?'major':''}" style="--a:${a}deg"></div>`}t.innerHTML=h}
function switchBigTab(m){bigTab=m;document.getElementById('bigTabInv').classList.toggle('active',m==='inv');document.getElementById('bigTabTarget').classList.toggle('active',m==='target');document.getElementById('panelInv').classList.toggle('active',m==='inv');document.getElementById('panelTarget').classList.toggle('active',m==='target');if(m==='target')rendTargetList()}
function switchSub(m){invMode=m;document.getElementById('subInv').classList.toggle('active',m==='inv');document.getElementById('subShop').classList.toggle('active',m==='shop');const st=document.getElementById('shopTabs');if(st)st.style.display=m==='shop'?'flex':'none';rendInv()}
function switchShopTab(t){shopTab=t;document.getElementById('tabSkins').classList.toggle('active',t==='skins');document.getElementById('tabCases').classList.toggle('active',t==='cases');document.getElementById('tabAgents').classList.toggle('active',t==='agents');rendInv()}
function rendInv(){const b=document.getElementById('invList');if(!b)return;const q=(document.getElementById('searchInp')?.value||'').toLowerCase();
if(invMode==='shop'){let list=shopTab==='skins'?allSkins:(shopTab==='cases'?allCases:allAgents);let f=list.filter(s=>s.name.toLowerCase().includes(q));f.sort((a,b)=>a.price-b.price);b.innerHTML=f.map(s=>{const r=getRarity(s.color);const inCart=cart.find(c=>c.name===s.name);return `<div class="card ${isSpinning?'locked':''}" style="--rarity:${r}" onclick="toggleCart('${s.name}',${s.price})">${inCart?'<div class="check">✓</div>':''}${s.img?`<img src="${s.img}" onerror="this.style.display='none'">`:''}<div class="cn">${s.name.split(' ')[0]}</div><div class="nn">${s.name}</div><div class="pn"><span class="s1">S1</span><span class="pr">${s.price.toLocaleString('ru-RU')} G</span></div></div>`}).join('')}
else{const f=inv.filter(it=>it.name.toLowerCase().includes(q));if(f.length===0){b.innerHTML='<div class="empty-block" style="grid-column:span 2"><div class="empty-icon">📦</div><div class="empty-title">Инвентарь пуст</div></div>';return}b.innerHTML=f.map(it=>{const r=getRarity(it.color||'#888');const realIdx=inv.indexOf(it);const isBonus=it.bonus===true;return `<div class="card ${isSpinning?'locked':''} ${isBonus?'bonus':''}" style="--rarity:${r}" id="card-${realIdx}" onclick="toggleCard(${realIdx})">${it.img?`<img src="${it.img}" onerror="this.style.display='none'">`:''}<div class="cn">${it.name.split(' ')[0]}</div><div class="nn">${it.name}</div><div class="pn"><span class="s1 ${isBonus?'bonus-tag':''}">${isBonus?'🎁 БОНУС':'S1'}</span><span class="pr">${(it.price||0).toLocaleString('ru-RU')} G</span></div><div class="card-actions"><button class="btn-upg" onclick="event.stopPropagation();addToUpgrade(${realIdx})">⬆ АПГРЕЙД</button><button class="btn-wd" onclick="event.stopPropagation();withdrawSkinDirect(${realIdx})">📤 ВЫВЕСТИ</button>${isBonus?`<button class="btn-sell disabled" onclick="event.stopPropagation();">💸 НЕЛЬЗЯ ПРОДАТЬ</button>`:`<button class="btn-sell" onclick="event.stopPropagation();sellSkin(${realIdx})">💸 ПРОДАТЬ</button>`}</div></div>`}).join('')}}
function rendTargetList(){const b=document.getElementById('targetList');if(!b)return;const q=(document.getElementById('targetSearchInp')?.value||'').toLowerCase();let f=allSkins.filter(s=>s.name.toLowerCase().includes(q));f.sort((a,b)=>a.price-b.price);b.innerHTML=f.map(s=>{const r=getRarity(s.color);const isSel=targetSkin&&targetSkin.name===s.name;return `<div class="card ${isSpinning?'locked':''}" style="--rarity:${r};${isSel?'border-color:var(--red)':''}" onclick="pickTargetCard('${s.name}',${s.price},'${s.color}')">${isSel?'<div class="check">✓</div>':''}${s.img?`<img src="${s.img}" onerror="this.style.display='none'">`:''}<div class="cn">${s.name.split(' ')[0]}</div><div class="nn">${s.name}</div><div class="pn"><span class="s1">S1</span><span class="pr">${s.price.toLocaleString('ru-RU')} G</span></div></div>`}).join('')}
function toggleCard(idx){if(isSpinning)return;const c=document.getElementById('card-'+idx);if(!c)return;const isOpen=c.classList.contains('open');document.querySelectorAll('.card.open').forEach(x=>x.classList.remove('open'));if(!isOpen)c.classList.add('open')}
function toggleCart(name,price){if(isSpinning){toast('⏳ Идёт спин','lose');return}const i=cart.findIndex(c=>c.name===name);if(i>=0)cart.splice(i,1);else{if(gold<price){toast('❌ Мало G','lose');return}cart.push({name,price})}updateCartBadge();rendInv()}
function updateCartBadge(){const b=document.getElementById('cartBadge');if(!b)return;if(cart.length>0){b.style.display='block';b.innerText=cart.length}else b.style.display='none'}
function pickTargetCard(name,price,color){if(isSpinning){toast('⏳ Идёт спин','lose');return}const skin=allSkins.find(s=>s.name===name);targetSkin={name,price,color,img:skin?skin.img:null};const invSum=selectedItems.reduce((s,it)=>s+(it.price||0),0);if(invSum>0){const autoPct=Math.min(99,(invSum/targetSkin.price)*100);selPct=autoPct;updateWheelPct(autoPct)}rendMain();rendTargetList();checkUpgradeBtn();toast('🎯 '+name,'win')}
function addToUpgrade(idx){if(isSpinning){toast('⏳ Идёт спин','lose');return}const it=inv[idx];if(!it)return;if(!selectedItems.includes(it)){if(selectedItems.length>=6){toast('❌ Макс 6','lose');return}selectedItems.push(it)}rendMain();recomputePct();document.querySelectorAll('.card.open').forEach(c=>c.classList.remove('open'));toast('⬆️ Добавлен','win')}
function sellSkin(idx){if(isSpinning){toast('⏳ Идёт спин','lose');return}if(idx<0||idx>=inv.length)return;const it=inv[idx];if(it.bonus){toast('🚫 Бонусный скин нельзя продать','lose');return}const sp=Math.round((it.price||50)*0.7);gold+=sp;inv.splice(idx,1);const k=it.name+'|'+it.price+'|'+it.img;selectedItems=selectedItems.filter(i=>!(i.name+'|'+i.price+'|'+i.img===k));updateBal();saveGame();rendInv();rendMain();toast('💸 +'+sp+' G','win')}
function recomputePct(){if(selectedItems.length===0||!targetSkin){selPct=null;checkUpgradeBtn();return}const invSum=selectedItems.reduce((s,it)=>s+(it.price||0),0);let pct=(invSum/targetSkin.price)*100;if(pct>99)pct=99;if(pct<0.01)pct=0.01;selPct=pct;updateWheelPct(pct);checkUpgradeBtn()}
function updateWheelPct(pct){document.getElementById('pt').innerText=formatPct(pct);document.getElementById('pt').classList.add('active');const fill=document.getElementById('wheelZoneFill');const glow=document.getElementById('wheelZoneGlow');const targetAngle=(pct/100)*360;fill.classList.add('visible');glow.classList.add('visible');if(wheelAnimId)cancelAnimationFrame(wheelAnimId);const startAngle=currentWheelAngle;const startTime=performance.now();const duration=600;function anim(now){const t=Math.min(1,(now-startTime)/duration);const eased=1-Math.pow(1-t,3);currentWheelAngle=startAngle+(targetAngle-startAngle)*eased;fill.style.setProperty('--pct-angle',currentWheelAngle+'deg');if(t<1)wheelAnimId=requestAnimationFrame(anim);else wheelAnimId=null}wheelAnimId=requestAnimationFrame(anim)}
function clearWheelPct(){document.getElementById('pt').innerText='?%';document.getElementById('pt').classList.remove('active');document.getElementById('wheelZoneFill').classList.remove('visible');document.getElementById('wheelZoneGlow').classList.remove('visible');currentWheelAngle=0;if(wheelAnimId){cancelAnimationFrame(wheelAnimId);wheelAnimId=null}}
function setPct(p,el){if(isSpinning){toast('⏳ Идёт спин','lose');return}if(inv.length===0){toast('❌ Инвентарь пуст','lose');return}if(selectedItems.length===0){toast('❌ Выбери скины в апгрейд','lose');return}const invSum=selectedItems.reduce((s,it)=>s+(it.price||0),0);const idealPrice=invSum/(p/100);let closest=allSkins[0],minDiff=Math.abs(allSkins[0].price-idealPrice);allSkins.forEach(s=>{const d=Math.abs(s.price-idealPrice);if(d<minDiff){minDiff=d;closest=s}});targetSkin={name:closest.name,price:closest.price,color:closest.color,img:closest.img};const realPct=Math.min(99,(invSum/targetSkin.price)*100);selPct=realPct;document.querySelectorAll('.pb').forEach(b=>b.classList.remove('sel'));if(el)el.classList.add('sel');updateWheelPct(realPct);rendMain();rendTargetList();checkUpgradeBtn()}
function checkUpgradeBtn(){const hs=selectedItems.length>0,ht=targetSkin!==null,hp=selPct!==null;const btn=document.getElementById('upgradeBtn');if(hs&&ht&&hp&&!isSpinning){btn.disabled=false;btn.classList.add('active')}else{btn.disabled=true;btn.classList.remove('active')}}
function rendMain(){if(selectedItems.length===0){document.getElementById('leftIcons').innerHTML='';document.getElementById('selCount').innerText='0 ИЗ 6'}else{const ic=selectedItems.map(s=>s.img?`<img src="${s.img}">`:`<span style="font-size:50px">${s.icon||'📦'}</span>`).join('');document.getElementById('leftIcons').innerHTML=ic;document.getElementById('selCount').innerText=selectedItems.length+' ИЗ 6'}if(targetSkin){const ih=targetSkin.img?`<img src="${targetSkin.img}">`:`<span style="font-size:50px">📦</span>`;document.getElementById('rightIcons').innerHTML=ih;document.getElementById('targetCount').innerText=targetSkin.price+' G'}else{document.getElementById('rightIcons').innerHTML='';document.getElementById('targetCount').innerText='НЕ ВЫБРАНА'}checkUpgradeBtn()}
function toggleLightning(){if(isSpinning){toast('⏳ Идёт спин','lose');return}lightningOn=!lightningOn;const btn=document.getElementById('lightningBtn');const lbl=document.getElementById('lightningLbl');if(lightningOn){btn.classList.add('on');lbl.innerText='ВКЛ';toast('⚡ Быстрый спин ВКЛ','win')}else{btn.classList.remove('on');lbl.innerText='ВЫКЛ';toast('⚡ Быстрый спин ВЫКЛ','lose')}}
function lockUI(lock){document.getElementById('upgradeBtn').disabled=lock;document.querySelectorAll('.pb').forEach(b=>b.disabled=lock);const lb=document.getElementById('lightningBtn');if(lock)lb.classList.add('locked');else lb.classList.remove('locked')}
function removeItemsFromInv(items){const counts={};items.forEach(x=>{const k=x.name+'|'+x.price+'|'+x.img;counts[k]=(counts[k]||0)+1});return inv.filter(it=>{const k=it.name+'|'+it.price+'|'+it.img;if(counts[k]&&counts[k]>0){counts[k]--;return false}return true})}
function spinUpgrade(){
if(selectedItems.length===0){toast('❌ Выбери скины','lose');return}

function renderProfileInv(sort){const g=document.getElementById('profileInvGrid');if(!g)return;let list=[...inv];if(sort==='exp')list.sort((a,b)=>(b.price||0)-(a.price||0));else list.sort((a,b)=>(a.price||0)-(b.price||0));if(list.length===0){g.innerHTML='<div class="profile-empty" style="grid-column:span 2"><div class="profile-empty-ic">📦</div><div class="profile-empty-txt">Инвентарь пуст</div></div>';return}g.innerHTML=list.map(it=>{const r=getRarity(it.color||'#888');const realIdx=inv.indexOf(it);const isBonus=it.bonus===true;return `<div class="card ${isBonus?'bonus':''}" style="--rarity:${r}" id="pcard-${realIdx}" onclick="toggleProfileCard(${realIdx})">${it.img?`<img src="${it.img}" onerror="this.style.display='none'">`:''}<div class="cn">${it.name.split(' ')[0]}</div><div class="nn">${it.name}</div><div class="pn"><span class="s1 ${isBonus?'bonus-tag':''}">${isBonus?'🎁 БОНУС':'S1'}</span><span class="pr">${(it.price||0).toLocaleString('ru-RU')} G</span></div><div class="card-actions"><button class="btn-upg" onclick="event.stopPropagation();addToUpgrade(${realIdx});closeS('profileScreen')">⬆ АПГРЕЙД</button><button class="btn-wd" onclick="event.stopPropagation();withdrawSkinDirect(${realIdx})">📤 ВЫВЕСТИ</button>${isBonus?`<button class="btn-sell disabled" onclick="event.stopPropagation();">💸 НЕЛЬЗЯ ПРОДАТЬ</button>`:`<button class="btn-sell" onclick="event.stopPropagation();sellSkinProfile(${realIdx})">💸 ПРОДАТЬ</button>`}</div></div>`}).join('')}
function toggleProfileCard(idx){const c=document.getElementById('pcard-'+idx);if(!c)return;const isOpen=c.classList.contains('open');document.querySelectorAll('#profileInvGrid .card.open').forEach(x=>x.classList.remove('open'));if(!isOpen)c.classList.add('open')}

function sellSkinProfile(idx){if(idx<0||idx>=inv.length)return;const it=inv[idx];if(it.bonus){toast('🚫 Бонусный скин нельзя продать','lose');return}const sp=Math.round((it.price||50)*0.7);gold+=sp;inv.splice(idx,1);const k=it.name+'|'+it.price+'|'+it.img;selectedItems=selectedItems.filter(i=>!(i.name+'|'+i.price+'|'+i.img===k));updateBal();saveGame();rendInv();rendMain();rendProfile();toast('💸 +'+sp+' G','win')}
function sellAllInv(){const sellable=inv.filter(x=>!x.bonus);if(sellable.length===0){toast('❌ Нечего продавать','lose');return}const total=sellable.reduce((s,x)=>s+Math.round((x.price||50)*0.7),0);if(!confirm('Продать '+sellable.length+' скинов за '+total+' G?'))return;inv=inv.filter(x=>x.bonus);gold+=total;updateBal();saveGame();rendInv();rendMain();rendProfile();toast('💸 +'+total+' G','win');confetti()}

async function claimBonus(){if(bonusState.available===false){const left=Math.floor((bonusState.nextAt-Date.now())/1000/60);const h=Math.floor(left/60);const m2=left%60;toast('⏳ Через '+h+'ч '+m2+'м','lose');return}const uid=getUserId();if(uid==='guest'){toast('❌ Открой через Telegram','lose');return}const card=document.getElementById('bonusCard');card.classList.add('bonus-cooldown');try{const r=await fetch(BOT_URL+'/api/bonus/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid})});const d=await r.json();if(!d.ok){toast('❌ '+(d.error||'Ошибка'),'lose');card.classList.remove('bonus-cooldown');return}const skin=d.skin;if(!Array.isArray(inv))inv=[];inv.push(skin);saveGame();rendInv();const isRare=skin.price>=5;if(isRare){confettiGold();sBonus()}else{sWin();confetti()}showBonusModal(skin,isRare);await checkBonusStatus()}catch(e){toast('❌ Нет связи','lose');card.classList.remove('bonus-cooldown')}}

const badgeTxt=x.win?'✅ УСПЕХ':'❌ ПОТЕРЯ';
const dateStr=formatHistDate(x.ts);
const pctVal=(x.pct||0).toFixed(2);
const pctWidth=Math.min(100,x.pct||0);
const nameEsc=(x.name||'Игрок').slice(0,12).replace(/[<>&]/g,'');

</div>
<div class="hist-icons">
${x.skinImg?`<img src="${x.skinImg}" class="hist-skin-sm" onerror="this.style.display='none'">`:`<div class="hist-skin-sm" style="display:flex;justify-content:center;align-items:center;font-size:24px">📦</div>`}
<div class="hist-arrow">→</div>
${x.targetImg?`<img src="${x.targetImg}" class="hist-target-big" onerror="this.style.display='none'">`:`<div class="hist-target-big" style="display:flex;justify-content:center;align-items:center;font-size:36px">📦</div>`}

<div class="hist-model">${(x.targetName||'').split(' ')[0]||'—'}</div>

<div class="hist-price">${(x.targetPrice||0).toLocaleString('ru-RU')}<span class="g-sm">G</span></div>
</div>
</div>
<div class="hist-bottom">

<div class="hist-pct-val">${pctVal}%</div>

</div>
<div class="hist-badge ${badgeCls}">${badgeTxt}</div>
</div>
</div>`;
}).join('');
}
function formatHistDate(ts){
if(!ts)return '';
const d=new Date(ts);
const months=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const day=d.getDate();
const mon=months[d.getMonth()];
const hh=String(d.getHours()).padStart(2,'0');
const mm=String(d.getMinutes()).padStart(2,'0');
return day+' '+mon+'. '+hh+':'+mm;
}

function shareRefCode(){const text='🎮 Играй в StandFliutApap! Введи мой код: '+refData.code+' и получи БОНУС скин 1-20 G!';const url='https://t.me/share/url?url='+encodeURIComponent('https://t.me/Haloysemagasin_bot')+'&text='+encodeURIComponent(text);window.open(url,'_blank')}
async function applyRefCode(){const input=document.getElementById('refInput');const btn=document.getElementById('refApplyBtn');if(!input||!btn)return;const code=input.value.trim().toUpperCase();if(!code){toast('❌ Введи код','lose');return}const uid=getUserId();if(uid==='guest'){toast('❌ Открой через Telegram','lose');return}btn.disabled=true;btn.innerText='ПРОВЕРКА...';try{const r=await fetch(BOT_URL+'/api/ref/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,code})});const d=await r.json();if(!d.ok){if(d.error==='Not found')toast('❌ Код не найден','lose');else if(d.error==='Self use')toast('❌ Свой код нельзя','lose');else if(d.error==='Already used')toast('❌ Уже активирован','lose');else toast('❌ '+(d.error||'Ошибка'),'lose');btn.disabled=false;btn.innerText='✅ АКТИВИРОВАТЬ';return}if(!Array.isArray(inv))inv=[];inv.push(d.skin);saveGame();rendInv();showRefSuccessModal(d.skin);const isRare=(d.skin.price>=5);if(isRare){confettiGold();sBonus()}else{sWin();confetti()}const mm=document.getElementById('refModal');if(mm)mm.remove();await loadRefData()}catch(e){toast('❌ Нет связи','lose');btn.disabled=false;btn.innerText='✅ АКТИВИРОВАТЬ'}}
async function applyPromoFromModal(){const input=document.getElementById('promoInputModal');const btn=document.getElementById('promoApplyBtn');if(!input||!btn)return;const code=input.value.trim().toLowerCase();if(!code){toast('❌ Введи промокод','lose');return}const uid=getUserId();if(uid==='guest'){toast('❌ Открой через Telegram','lose');return}btn.disabled=true;btn.innerText='ПРОВЕРКА...';try{const r=await fetch(BOT_URL+'/api/promo/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,code})});const d=await r.json();if(!d.ok){if(d.error==='Already used')toast('❌ Уже активирован','lose');else if(d.error==='Not found')toast('❌ Промокод не найден','lose');else if(d.error==='Limit reached')toast('❌ Лимит исчерпан','lose');else toast('❌ '+(d.error||'Ошибка'),'lose');btn.disabled=false;btn.innerText='✅ АКТИВИРОВАТЬ';return}gold+=d.amount;updateBal();saveGame();toast('🎁 +'+d.amount+' G','win');confetti();input.value='';btn.disabled=false;btn.innerText='✅ АКТИВИРОВАТЬ'}catch(e){toast('❌ Нет связи','lose');btn.disabled=false;btn.innerText='✅ АКТИВИРОВАТЬ'}}
function showRefSuccessModal(skin){const m=document.createElement('div');m.className='result-screen result-bonus';m.innerHTML=`<div class="result-inner"><div class="result-box bonus">${skin.img?`<img src="${skin.img}">`:''}</div><div class="result-title">КОД АКТИВИРОВАН!</div><div class="result-sub">ТЫ ПОЛУЧИЛ СКИН</div><div class="result-skin-name">${skin.name} <span style="color:#fff;font-size:14px">(${skin.price} G)</span></div><button class="result-btn" onclick="this.closest('.result-screen').remove()">ЗАБРАТЬ</button></div>`;document.body.appendChild(m)}
function updateBoostUI(){const uid=getUserId();if(uid==='guest')return;fetch(BOT_URL+'/api/load/'+uid).then(r=>r.json()).then(d=>{if(!d.ok||!d.data)return;const b=d.data.refBoost;if(b&&b.spinsLeft>0&&Date.now()<b.expire){refBoost={spinsLeft:b.spinsLeft,expire:b.expire};showBoostIndicator()}else{refBoost={spinsLeft:0,expire:0};hideBoostIndicator()}}).catch(()=>{})}
function showBoostIndicator(){const ind=document.getElementById('boostIndicator');const blueFill=document.getElementById('wheelZoneFillBlue');const blueGlow=document.getElementById('wheelZoneGlowBlue');if(ind){ind.classList.add('active');ind.innerHTML='⚡ БУСТ +5% • '+refBoost.spinsLeft+'/3'}if(blueFill)blueFill.classList.add('visible');if(blueGlow)blueGlow.classList.add('visible')}
function hideBoostIndicator(){const ind=document.getElementById('boostIndicator');const blueFill=document.getElementById('wheelZoneFillBlue');const blueGlow=document.getElementById('wheelZoneGlowBlue');if(ind)ind.classList.remove('active');if(blueFill)blueFill.classList.remove('visible');if(blueGlow)blueGlow.classList.remove('visible')}
async function consumeBoost(){if(refBoost.spinsLeft<=0)return;refBoost.spinsLeft--;const uid=getUserId();if(uid==='guest')return;try{const r=await fetch(BOT_URL+'/api/load/'+uid);const d=await r.json();if(d.ok&&d.data&&d.data.refBoost){d.data.refBoost.spinsLeft=Math.max(0,(d.data.refBoost.spinsLeft||0)-1);await fetch(BOT_URL+'/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,data:d.data})})}}catch(e){}if(refBoost.spinsLeft>0){const ind=document.getElementById('boostIndicator');if(ind)ind.innerHTML='⚡ БУСТ +5% • '+refBoost.spinsLeft+'/3'}else{hideBoostIndicator()}}
(async()=>{await loadGame();drawTicks();updateBal();rendMain();rendInv();rendTargetList();updateCartBadge();await checkBonusStatus();loadLiveFeed();loadRefData();setTimeout(updateBoostUI,1000);setInterval(updateBoostUI,30000);setInterval(async()=>{try{const uid=getUserId();if(uid==='guest')return;if(!gameLoaded)return;if(isSpinning)return;const r=await fetch(BOT_URL+'/api/load/'+uid);const d=await r.json();if(d.ok&&d.data){const oldGold=gold;const oldInv=JSON.stringify(inv);const oldWD=totalWithdraw;applySaveData(d.data);localStorage.setItem('sfap_save_'+uid,JSON.stringify(d.data));updateBal();if(oldGold!==gold||oldInv!==JSON.stringify(inv)||oldWD!==totalWithdraw){rendMain();rendInv();const pb=document.getElementById('profileBody');if(pb&&document.getElementById('profileScreen')?.classList.contains('open'))rendProfile()}}}catch(e){}},10000);const el=document.getElementById('onlineCount');if(el){el.innerText=Math.floor(Math.random()*10)+1;setInterval(()=>el.innerText=Math.floor(Math.random()*10)+1,5000)}})();
</script></body></html>
