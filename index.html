<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>StandDash</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a0c;--panel:#121216;--panel-l:#1a1a22;--border:#272730;--gold:#ffb800;--red:#e50914;--green:#2e7d32;--green-l:#4CAF50;--gray:#666;--gray2:#999;--white:#fff;--blue:#4a9eff;--purple:#9b8aff}
body{background:var(--bg);color:var(--white);min-height:100vh;overflow-x:hidden;padding-bottom:20px}
body.light{--bg:#f0f0f5;--panel:#fff;--panel-l:#e8e8f0;--border:#d0d0dd;--white:#1a1a2a;--gray2:#666}

/* ПРЕЛОАДЕР */
#preloader{position:fixed;inset:0;background:var(--bg);z-index:99999;display:none;justify-content:center;align-items:center;flex-direction:column;gap:20px}
#preloader.on{display:flex}
.preload-logo{font-size:32px;font-weight:900;letter-spacing:4px;color:var(--white);text-shadow:0 0 30px rgba(255,184,0,.5)}
.preload-logo span{color:var(--gold)}
.preload-bar{width:200px;height:4px;background:var(--panel-l);border-radius:2px;overflow:hidden}
.preload-bar-fill{height:100%;width:0;background:linear-gradient(90deg,#ffd700,#ff8c00);animation:preloadFill 1.2s ease-in-out forwards}
@keyframes preloadFill{0%{width:0}100%{width:100%}}
.preload-text{font-size:11px;color:var(--gray2);font-weight:800;letter-spacing:2px}

/* ШАПКА */
.top{position:sticky;top:0;z-index:100;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,12,.95);border-bottom:1px solid var(--border)}
.top-left{display:flex;align-items:center;gap:12px;cursor:pointer}
.logo-svg{width:34px;height:34px}
.rank-badge{display:flex;flex-direction:column;font-size:9px;font-weight:800;color:var(--gray2)}
.rank-badge .rn{color:var(--gold);font-size:11px}
.top-right{display:flex;align-items:center;gap:8px}
.cart-btn{width:38px;height:38px;border-radius:10px;background:var(--panel);display:flex;justify-content:center;align-items:center;cursor:pointer;border:1px solid var(--border);position:relative}
.cart-btn svg{width:18px;height:18px;fill:var(--white)}
.cart-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:9px;font-weight:900;border-radius:10px;padding:2px 5px;border:2px solid var(--bg);display:none}
.bal-pill{display:flex;align-items:center;gap:8px;background:var(--panel);padding:6px 12px;border-radius:10px;border:1px solid var(--border);cursor:pointer}
.bal-plus{width:24px;height:24px;background:linear-gradient(135deg,#ffd700,#ff8c00);border-radius:6px;display:flex;justify-content:center;align-items:center;font-size:16px;color:#1a1a1a;font-weight:900}
.bal-num{font-size:14px;font-weight:900}
.bal-g{font-size:11px;font-weight:900;color:var(--gold)}
.av-top{width:38px;height:38px;border-radius:10px;background:var(--panel);display:flex;justify-content:center;align-items:center;font-size:16px;cursor:pointer;border:1px solid var(--border);overflow:hidden}
.av-top img{width:100%;height:100%;object-fit:cover}

.profile-menu{position:fixed;top:60px;right:16px;width:260px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;z-index:150;transform:translateY(-20px);opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.4,0,.2,1);box-shadow:0 10px 40px rgba(0,0,0,.6)}
.profile-menu.open{transform:translateY(0);opacity:1;pointer-events:auto}
.pm-header{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:12px}
.pm-avatar{width:48px;height:48px;border-radius:12px;background:var(--panel-l);border:2px solid var(--gold);overflow:hidden;display:flex;justify-content:center;align-items:center;font-size:20px;flex-shrink:0}
.pm-avatar img{width:100%;height:100%;object-fit:cover}
.pm-name{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-id{font-size:10px;color:var(--gray2);font-family:monospace}
.pm-btn{display:flex;align-items:center;gap:10px;padding:12px;background:var(--panel-l);border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:13px;font-weight:800;transition:.15s;border:none;color:var(--white);width:100%;text-align:left}
.pm-btn:active{background:var(--border);transform:scale(.98)}
.pm-btn .ico{font-size:16px;width:24px;text-align:center}

.live-bar{margin:12px 16px;background:var(--panel);border:1px solid var(--border);border-radius:12px;height:56px;overflow:hidden;position:relative;display:flex;align-items:center}
.live-bar::before{content:'LIVE';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:9px;font-weight:900;color:#fff;background:var(--red);padding:3px 8px;border-radius:4px;z-index:3}
.live-track{display:flex;gap:12px;white-space:nowrap;animation:scrollLeft 40s linear infinite;padding-left:65px;align-items:center;height:100%}
@keyframes scrollLeft{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.live-item{display:flex;align-items:center;gap:10px;flex-shrink:0;padding:6px 12px;background:var(--panel-l);border-radius:8px;border:1px solid var(--border);border-left:4px solid var(--gold)}
.live-name{font-size:12px;font-weight:900}
.live-pct{font-size:10px;font-weight:900;color:#1a1a1a;background:var(--gold);padding:2px 6px;border-radius:4px}
.live-skin{width:44px;height:28px;object-fit:contain}
.live-empty{padding-left:65px;font-size:10px;color:var(--gray);font-weight:700}

.main{padding:0 16px}
.wheel-wrap{position:relative;width:100%;aspect-ratio:1;max-width:340px;margin:10px auto;display:flex;justify-content:center;align-items:center}
.wheel{width:90%;height:90%;border-radius:50%;background:radial-gradient(circle at center,var(--panel-l) 0%,var(--panel) 60%,#0a0a0c 100%);position:relative;display:flex;justify-content:center;align-items:center;box-shadow:0 0 60px rgba(0,0,0,.9),0 0 80px rgba(255,184,0,.15),inset 0 0 40px rgba(0,0,0,.6);border:4px solid #1a1a22;transition:border-color .5s,box-shadow .5s}
.wheel.zone-green{border-color:var(--green-l);box-shadow:0 0 60px rgba(76,175,80,.5),0 0 90px rgba(76,175,80,.2),inset 0 0 40px rgba(0,0,0,.6)}
.wheel.zone-yellow{border-color:var(--gold);box-shadow:0 0 60px rgba(255,184,0,.5),0 0 90px rgba(255,184,0,.2),inset 0 0 40px rgba(0,0,0,.6)}
.wheel.zone-red{border-color:var(--red);box-shadow:0 0 60px rgba(229,9,20,.5),0 0 90px rgba(229,9,20,.2),inset 0 0 40px rgba(0,0,0,.6)}
.wheel::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(255,184,0,.3);pointer-events:none;animation:pulseRing 2s ease-in-out infinite}
@keyframes pulseRing{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.05);opacity:.8}}
.wheel.zone-green::after{border-color:rgba(76,175,80,.4)}
.wheel.zone-red::after{border-color:rgba(229,9,20,.4)}

.wheel-zone{position:absolute;inset:-4px;border-radius:50%;pointer-events:none;z-index:1;overflow:hidden}
.wheel-zone-fill{position:absolute;top:0;left:0;width:100%;height:100%;background:conic-gradient(from 180deg,var(--zone-color,var(--gold)) 0deg,var(--zone-color,var(--gold)) var(--pct-angle,0deg),#1a1a22 var(--pct-angle,0deg),#1a1a22 360deg);opacity:0;transition:opacity .4s}
.wheel-zone-fill.visible{opacity:.95}
.wheel::before{content:'';position:absolute;width:75%;height:75%;border-radius:50%;background:var(--bg);border:1px solid var(--border);z-index:2}
.wheel-ticks{position:absolute;width:100%;height:100%;border-radius:50%;pointer-events:none;z-index:3}
.tick{position:absolute;top:0;left:50%;width:2px;height:8px;background:rgba(255,184,0,.4);transform-origin:center 150px;transform:translateX(-50%) rotate(var(--a));border-radius:1px}
.tick.major{width:3px;height:14px;background:var(--gold);box-shadow:0 0 8px rgba(255,184,0,.8)}
.wheel-center{position:relative;z-index:5;text-align:center}
.pt{font-size:52px;font-weight:900;line-height:1;letter-spacing:-2px;text-shadow:0 0 20px rgba(255,184,0,.4);transition:color .4s}
.pl{font-size:9px;color:var(--gray2);letter-spacing:4px;margin-top:4px;font-weight:700}
.chance-label{font-size:10px;font-weight:900;letter-spacing:2px;margin-top:6px;padding:3px 10px;border-radius:6px;display:inline-block;transition:.3s}
.chance-label.green{background:rgba(76,175,80,.2);color:var(--green-l);border:1px solid rgba(76,175,80,.5)}
.chance-label.yellow{background:rgba(255,184,0,.2);color:var(--gold);border:1px solid rgba(255,184,0,.5)}
.chance-label.red{background:rgba(229,9,20,.2);color:var(--red);border:1px solid rgba(229,9,20,.5)}

.arrow-wrap{position:absolute;inset:0;pointer-events:none;z-index:25;will-change:transform;transform:rotate(0deg)}
.arrow{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:32px;height:44px;filter:drop-shadow(0 4px 10px rgba(255,184,0,.8))}
.arrow-wrap.spinning .arrow{animation:arrowGlow .4s ease-in-out infinite alternate}
@keyframes arrowGlow{0%{filter:drop-shadow(0 4px 10px rgba(255,184,0,.6))}100%{filter:drop-shadow(0 6px 20px rgba(255,184,0,1))}}

.pcnt-row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:20px}
.pb{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 4px;color:var(--gray2);font-size:11px;font-weight:800;cursor:pointer;transition:.15s}
.pb.sel{border-color:var(--gold);background:rgba(255,184,0,.1);color:var(--gold);box-shadow:0 0 10px rgba(255,184,0,.2)}
.pb.sel.green{border-color:var(--green-l);background:rgba(76,175,80,.1);color:var(--green-l);box-shadow:0 0 10px rgba(76,175,80,.2)}
.pb.sel.red{border-color:var(--red);background:rgba(229,9,20,.1);color:var(--red);box-shadow:0 0 10px rgba(229,9,20,.2)}

.action-row{display:flex;gap:8px;margin-top:12px}
.lightning-btn{width:56px;height:56px;background:var(--panel);border:1px solid var(--border);border-radius:12px;cursor:pointer;display:flex;justify-content:center;align-items:center}
.lightning-btn.on{border-color:var(--gold);background:rgba(255,184,0,.1)}
.lightning-btn .ic{font-size:20px;filter:grayscale(1);opacity:.5}
.lightning-btn.on .ic{filter:grayscale(0);opacity:1}
.upgrade-btn{flex:1;background:linear-gradient(135deg,var(--gold),#ff8c00);color:#1a1a1a;border:none;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer;padding:16px;letter-spacing:2px}
.upgrade-btn:disabled{opacity:.5;background:var(--panel);color:var(--gray2);cursor:not-allowed}

.slots-preview{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.slot-prev{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;min-height:130px}
.slot-prev-lbl{font-size:10px;font-weight:800;color:var(--gray2);margin-bottom:10px}
.slot-prev-icons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:180px;margin:0 auto;justify-items:center}
.slot-cell{width:100%;aspect-ratio:1;display:flex;justify-content:center;align-items:center;position:relative}
.slot-cell img{width:100%;height:100%;object-fit:contain;background:var(--panel-l);border-radius:8px;padding:4px;border:1px solid var(--border)}
.slot-prev-icons .empty-slot{width:100%;aspect-ratio:1;background:var(--panel-l);border:1px dashed var(--border);border-radius:8px}
.slot-prev-icons .slot-remove{position:absolute;top:-6px;right:-6px;width:20px;height:20px;background:var(--red);border-radius:50%;display:flex;justify-content:center;align-items:center;color:#fff;font-size:12px;font-weight:900;cursor:pointer;border:2px solid var(--bg)}
.slot-sum{font-size:11px;font-weight:900;color:var(--gold);margin-top:6px}
.slot-clear{font-size:9px;font-weight:900;color:var(--red);margin-top:4px;cursor:pointer;background:none;border:none}

.big-tabs{display:flex;gap:4px;margin-top:20px;background:var(--panel);padding:4px;border-radius:12px}
.big-tab{flex:1;background:none;border:none;color:var(--gray2);font-size:11px;font-weight:800;padding:10px;border-radius:8px;cursor:pointer}
.big-tab.active{background:var(--panel-l);color:var(--white)}
.panel{display:none;margin-top:16px}
.panel.active{display:block}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--panel);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border);position:relative;cursor:pointer;transition:transform .2s;min-height:170px}
.card:active{transform:scale(.97)}
.card.expanded{border-color:var(--gold);box-shadow:0 0 20px rgba(255,184,0,.3)}
.card-img-wrap{width:100%;aspect-ratio:1.2;background:radial-gradient(circle at center,var(--panel-l) 0%,transparent 70%);display:flex;justify-content:center;align-items:center;padding:10px;transition:filter .2s}
.card.expanded .card-img-wrap{filter:blur(4px)}
.card-img-wrap img{width:90%;height:90%;object-fit:contain}
.card-info{padding:10px;display:flex;flex-direction:column;gap:4px}
.card-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-price{font-size:13px;font-weight:900;color:var(--gold)}
.card-price::after{content:' G';font-size:9px;color:var(--gray2)}
.card-actions{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;gap:6px;padding:14px;background:rgba(10,10,12,.85);z-index:20}
.card.expanded .card-actions{display:flex}
.btn-act{width:100%;padding:9px;border-radius:8px;border:none;font-weight:900;font-size:11px;cursor:pointer}
.btn-act:active{transform:scale(.96)}
.btn-act.upg{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#1a1a1a}
.btn-act.sell{background:linear-gradient(135deg,#e50914,#8b0000);color:#fff}
.btn-act.wd{background:linear-gradient(135deg,#4a9eff,#2e6db8);color:#fff}
.card-check{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#4CAF50,#66bb6a);display:none;justify-content:center;align-items:center;color:#fff;font-size:14px;font-weight:900;box-shadow:0 0 12px rgba(76,175,80,.8);z-index:15}
.card.checked .card-check{display:flex}

.r-common{border-color:var(--border)}
.r-uncommon{border-color:#4a9eff}
.r-rare{border-color:#9b8aff}
.r-epic{border-color:#ff4444;box-shadow:0 0 12px rgba(255,68,68,.2)}
.r-legend{border-color:#ffd700;box-shadow:0 0 18px rgba(255,215,0,.3)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;display:flex;justify-content:center;align-items:center;padding:16px;overflow-y:auto}
.modal-content{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;max-width:400px;position:relative;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:900;margin-bottom:16px;text-align:center}
.modal-close{position:absolute;top:16px;right:16px;background:var(--panel-l);border:none;color:var(--gray2);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;z-index:10}

.scr{position:fixed;inset:0;background:var(--bg);z-index:600;display:none;flex-direction:column}
.scr.open{display:flex}
.sh{padding:16px;display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-bottom:1px solid var(--border)}
.sh h2{font-size:16px;font-weight:900}
.cb{background:var(--panel-l);border:none;color:var(--gray2);width:30px;height:30px;border-radius:8px;cursor:pointer}
.sb{flex:1;overflow-y:auto;padding:16px}

.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--border);padding:16px 24px;border-radius:12px;color:var(--white);font-size:13px;font-weight:800;z-index:9999;text-align:center;display:none}

.filter-bar{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--gray2);font-size:10px;font-weight:800;cursor:pointer}
.filter-chip.active{border-color:var(--gold);color:var(--gold);background:rgba(255,184,0,.1)}

.profile-wrap{padding:16px}
.profile-main-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.profile-header-row{display:flex;align-items:center;gap:12px}
.profile-avatar-big{width:70px;height:70px;border-radius:12px;overflow:hidden;border:2px solid var(--gold);background:var(--panel-l);display:flex;justify-content:center;align-items:center;font-size:30px}
.profile-avatar-big img{width:100%;height:100%;object-fit:cover}
.profile-username{font-size:16px;font-weight:900}
.profile-id-text{font-size:11px;color:var(--gray2);font-family:monospace}
.profile-balance-block{background:var(--panel-l);border-radius:12px;padding:12px;margin-top:16px;display:flex;justify-content:space-between;align-items:center}
.profile-balance-val{font-size:24px;font-weight:900;color:var(--gold)}
.profile-section{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.profile-section-title h2{font-size:12px;font-weight:900;color:var(--gray2);text-transform:uppercase;margin-bottom:12px}
.stats-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat-block{background:var(--panel-l);border-radius:8px;padding:10px;text-align:center}
.stat-block-label{font-size:9px;color:var(--gray2);font-weight:800}
.stat-block-val{font-size:16px;font-weight:900}
.best-drop-card{background:linear-gradient(135deg,#1a1408,#0a0800);border:2px solid var(--gold);border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px}
.best-drop-img{width:70px;height:70px;object-fit:contain;flex-shrink:0}
.best-drop-info{flex:1}
.best-drop-label{font-size:10px;font-weight:900;color:var(--gold);margin-bottom:4px}
.best-drop-name{font-size:14px;font-weight:900;margin-bottom:4px}
.best-drop-price{font-size:16px;font-weight:900;color:var(--gold)}
.best-drop-empty{background:var(--panel-l);border:1px dashed var(--border);border-radius:16px;padding:20px;text-align:center;color:var(--gray2);font-size:12px;font-weight:800}

.hist-item{background:var(--panel-l);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:8px;border-left:3px solid var(--gray2)}
.hist-item.win{border-left-color:var(--green-l)}
.hist-item.lose{border-left-color:var(--red)}
.hist-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.hist-skin{width:40px;height:40px;object-fit:contain;background:var(--bg);border-radius:8px;padding:3px;flex-shrink:0}
.hist-details{flex:1;min-width:0}
.hist-label{font-size:9px;color:var(--gray2);font-weight:800;margin-bottom:2px}
.hist-name{font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-sum{font-size:11px;font-weight:900;color:var(--gold)}
.hist-arrow{font-size:16px;color:var(--gray2);padding:0 4px}
.hist-result{font-size:11px;font-weight:900;padding:3px 8px;border-radius:6px;align-self:flex-start}
.hist-result.win{background:rgba(76,175,80,.2);color:var(--green-l)}
.hist-result.lose{background:rgba(229,9,20,.2);color:var(--red)}

.settings-item{background:var(--panel-l);border-radius:12px;padding:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.settings-btn{background:var(--red);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:900;font-size:11px;cursor:pointer}
.toggle{position:relative;width:50px;height:28px;background:var(--border);border-radius:14px;cursor:pointer;transition:.3s}
.toggle.on{background:var(--green-l)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.3s}
.toggle.on::after{left:25px}

@keyframes popupIn{0%{opacity:0;transform:scale(.7) translateY(30px)}60%{transform:scale(1.05)}100%{opacity:1;transform:scale(1) translateY(0)}}
.popup-in{animation:popupIn .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes itemFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.02)}}
.popup-item{animation:itemFloat 2s ease-in-out infinite}

.craft-screen{position:fixed;inset:0;background:var(--bg);z-index:700;display:none;flex-direction:column;overflow-y:auto}
.craft-screen.open{display:flex}
.craft-header{padding:16px;display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.craft-header h2{font-size:16px;font-weight:900}
.craft-body{padding:16px;flex:1}
.craft-preview{width:180px;height:180px;margin:0 auto 20px;background:linear-gradient(135deg,var(--panel-l),var(--panel));border:3px solid var(--border);border-radius:24px;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden;transition:all .4s}
.craft-preview img{width:80%;height:80%;object-fit:contain;transition:all .3s}
.craft-preview.shuffling img{animation:shuffleCard .3s ease-in-out}
@keyframes shuffleCard{0%{transform:scale(.8);opacity:.3}50%{transform:scale(1.05);opacity:.8}100%{transform:scale(1);opacity:1}}
.craft-preview.revealed{border-color:var(--gold);box-shadow:0 0 40px rgba(255,184,0,.5)}
.craft-preview.revealed.win{border-color:var(--green-l);box-shadow:0 0 40px rgba(76,175,80,.6)}
.craft-preview.revealed.lose{border-color:var(--red);box-shadow:0 0 40px rgba(229,9,20,.6)}
.craft-preview .placeholder{font-size:60px;opacity:.4}
.craft-slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.craft-slot{aspect-ratio:1;background:var(--panel-l);border:2px dashed var(--border);border-radius:10px;display:flex;justify-content:center;align-items:center;cursor:pointer;position:relative;transition:.2s}
.craft-slot.filled{border-style:solid;border-color:var(--gold);background:rgba(255,184,0,.05)}
.craft-slot.filled img{width:85%;height:85%;object-fit:contain}
.craft-slot .rm{position:absolute;top:-5px;right:-5px;width:18px;height:18px;background:var(--red);border-radius:50%;color:#fff;font-size:10px;font-weight:900;display:flex;justify-content:center;align-items:center;border:2px solid var(--bg)}
.craft-rarity-tabs{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.craft-rarity-tab{flex-shrink:0;background:var(--panel-l);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--gray2);font-size:10px;font-weight:900;cursor:pointer}
.craft-rarity-tab.active{border-color:var(--gold);color:var(--gold);background:rgba(255,184,0,.1)}
.craft-chance-box{background:var(--panel-l);border-radius:12px;padding:14px;margin-bottom:14px}
.craft-chance-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;font-weight:800}
.craft-chance-row:last-child{margin-bottom:0}
.craft-chance-lose{color:var(--red)}
.craft-chance-win{color:var(--green-l)}
.craft-btn{width:100%;padding:16px;border-radius:12px;background:linear-gradient(135deg,#e50914,#8b0000);color:#fff;font-weight:900;font-size:15px;letter-spacing:2px;border:none;cursor:pointer}
.craft-btn:disabled{opacity:.4;background:var(--panel);color:var(--gray2);cursor:not-allowed}
.craft-skin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:260px;overflow-y:auto;padding:4px}
.craft-skin-cell{background:var(--panel-l);border:1px solid var(--border);border-radius:8px;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.craft-skin-cell.disabled{opacity:.35;cursor:not-allowed}
.craft-skin-cell img{width:100%;height:50px;object-fit:contain}
.craft-skin-cell .nm{font-size:8px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.result-overlay{position:fixed;inset:0;z-index:4000;display:flex;justify-content:center;align-items:center;padding:24px}
.result-overlay.win{background:radial-gradient(circle at center,rgba(76,175,80,.5),rgba(0,0,0,.98) 70%)}
.result-overlay.lose{background:radial-gradient(circle at center,rgba(229,9,20,.5),rgba(0,0,0,.98) 70%)}
.result-card{max-width:380px;width:100%;text-align:center;padding:20px}
.result-title{font-size:14px;font-weight:900;letter-spacing:4px;margin-bottom:10px}
.result-overlay.win .result-title{color:var(--green-l);text-shadow:0 0 15px rgba(76,175,80,.8)}
.result-overlay.lose .result-title{color:var(--red);text-shadow:0 0 15px rgba(229,9,20,.8)}
.result-subtitle{font-size:34px;font-weight:900;margin-bottom:20px;letter-spacing:2px}
.result-overlay.win .result-subtitle{color:var(--green-l)}
.result-overlay.lose .result-subtitle{color:var(--red)}
.result-item{width:200px;height:200px;margin:0 auto 20px;border-radius:24px;display:flex;justify-content:center;align-items:center;padding:20px}
.result-overlay.win .result-item{background:linear-gradient(135deg,#1b5e20,#0a2e0a);border:3px solid var(--green-l);box-shadow:0 0 60px rgba(76,175,80,.8)}
.result-overlay.lose .result-item{background:linear-gradient(135deg,#5c0000,#1a0000);border:3px solid var(--red);box-shadow:0 0 60px rgba(229,9,20,.8)}
.result-item img{max-width:100%;max-height:100%;object-fit:contain}
.result-name{font-size:22px;font-weight:900;margin-bottom:8px}
.result-price{font-size:18px;font-weight:900;margin-bottom:20px}
.result-overlay.win .result-price{color:var(--gold)}
.result-overlay.lose .result-price{color:var(--red)}
.result-btn{width:100%;padding:16px;border-radius:14px;border:none;font-weight:900;font-size:15px;letter-spacing:2px;cursor:pointer}
.result-overlay.win .result-btn{background:linear-gradient(135deg,#ffd700,#ff9500);color:#1a1a1a}
.result-overlay.lose .result-btn{background:linear-gradient(135deg,#e50914,#8b0000);color:#fff}

.cart-item-row{background:var(--panel-l);border-radius:8px;padding:10px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.qty-btn{width:24px;height:24px;background:var(--border);border:none;border-radius:6px;color:#fff;font-weight:900;cursor:pointer}
.vip-buy-btn{width:100%;padding:14px;border-radius:10px;background:var(--gold);color:#000;font-weight:900;border:none;cursor:pointer;margin-bottom:8px}
.vip-close-btn{width:100%;padding:12px;border-radius:10px;background:var(--panel);color:var(--gray2);font-weight:900;border:none;cursor:pointer}
.vip-price-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.vip-price-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;cursor:pointer}
.vip-price-value{font-size:18px;font-weight:900;margin-top:4px}
.vip-features{background:rgba(255,184,0,.06);border:1px solid rgba(255,184,0,.25);border-radius:12px;padding:12px;margin-bottom:16px}
.vip-feature{font-size:11px;font-weight:700;color:#fff;margin-bottom:6px}
.vip-modal{background:linear-gradient(165deg,#1a1408,#0a0800);border:1px solid var(--gold);border-radius:16px;padding:20px;width:100%;max-width:400px}
</style>
</head>

function sTick(){beep(1500,'sine',.04,.05)}
function sWin(){beep(800,'sine',.3,.15);setTimeout(()=>beep(1300,'sine',.5,.15),200)}
function sLose(){beep(200,'sawtooth',.5,.15)}

function toggleCart(name,price){
  if(isSpinning)return;
  const i=cart.findIndex(c=>c.name===name);
  if(i>=0)cart.splice(i,1);
  else{if(gold<price){toast('❌ Мало G','lose');return}cart.push({name,price,qty:1})}
  updateCartBadge();rendInv();
}
function updateCartBadge(){
  const b=document.getElementById('cartBadge');if(!b)return;
  const totalQty=cart.reduce((s,c)=>s+(c.qty||1),0);
  if(totalQty>0){b.style.display='block';b.innerText=totalQty}
  else b.style.display='none';
}
function openCart(){
  if(cart.length===0){toast('🛒 Корзина пуста','lose');return}
  const m=document.createElement('div');m.className='modal-overlay';m.id='cartModal';
  m.onclick=(e)=>{if(e.target===m)m.remove()};
  const total=cart.reduce((s,c)=>s+c.price*(c.qty||1),0);
  m.innerHTML=`<div class="modal-content" style="max-width:450px">
    <button class="modal-close" onclick="document.getElementById('cartModal').remove()">✕</button>
    <div class="modal-title">🛒 КОРЗИНА</div>
    <div style="max-height:50vh;overflow-y:auto;margin-bottom:16px">
      ${cart.map((c,i)=>{
        const s=allSkins.find(x=>x.name===c.name);
        return `<div class="cart-item-row">
          <img src="${s?.img||''}" style="width:44px;height:44px;object-fit:contain;background:var(--bg);border-radius:6px" onerror="this.style.display='none'">
          <div style="flex:1;min-width:0"><div style="font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.name}</div><div style="font-size:11px;color:var(--gold);font-weight:900">${c.price} G × ${c.qty||1}</div></div>
          <div style="display:flex;align-items:center;gap:4px">
            <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
            <span style="min-width:24px;text-align:center;font-weight:900;font-size:12px">${c.qty||1}</span>
            <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
            <button class="qty-btn" style="background:var(--red)" onclick="removeFromCart(${i})">✕</button>
          </div>
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border);margin-bottom:16px"><div style="font-size:12px;color:var(--gray2);font-weight:800">ИТОГО:</div><div style="font-size:20px;font-weight:900;color:var(--gold)">${total} G</div></div>
    <button class="vip-buy-btn" onclick="checkout()">✅ КУПИТЬ</button>
  </div>`;
  document.body.appendChild(m);
}
function changeQty(i,delta){
  if(!cart[i])return;
  const newQty=(cart[i].qty||1)+delta;
  if(newQty<1)return;
  cart[i].qty=newQty;updateCartBadge();
  const cm=document.getElementById('cartModal');if(cm){cm.remove();openCart()}
}
function removeFromCart(i){
  cart.splice(i,1);updateCartBadge();
  const cm=document.getElementById('cartModal');if(cm){cm.remove();if(cart.length>0)openCart()}
  rendInv();
}
async function checkout(){
  const total=cart.reduce((s,c)=>s+c.price*(c.qty||1),0);
  if(gold<total){toast('❌ Мало G','lose');return}
  cart.forEach(c=>{
    const qty=c.qty||1;gold-=c.price*qty;
    const s=allSkins.find(x=>x.name===c.name);
    for(let k=0;k<qty;k++){inv.push({name:c.name,price:c.price,img:s?.img||null,color:s?.color||'#888'})}
  });
  cart=[];updateCartBadge();
  const cm=document.getElementById('cartModal');if(cm)cm.remove();
  updateBal();rendInv();markDirty();saveGame();
  toast('✅ Куплено!','win');confetti();
}

// ============ АПГРЕЙД ============
function addToUpgrade(idx){
  if(isSpinning)return;
  const it=inv[idx];if(!it)return;
  if(selectedItems.indexOf(it)>=0){toast('⚠️ Уже в апгрейде','lose');return}
  if(selectedItems.length>=MAX_UPGRADE){toast('❌ Макс '+MAX_UPGRADE,'lose');return}
  selectedItems.push(it);rendMain();recomputePct();
}
function removeFromUpgradeItem(item){
  if(isSpinning)return;
  const i=selectedItems.indexOf(item);if(i<0)return;
  selectedItems.splice(i,1);recomputePct();rendMain();
  if(selectedItems.length===0){selPct=null;clearWheelPct();checkUpgradeBtn()}
}
function clearUpgrade(){if(isSpinning)return;selectedItems=[];selPct=null;clearWheelPct();rendMain()}
function sellSkin(idx){
  const it=inv[idx];if(!it)return;
  const sp=Math.round((it.price||50)*0.7);
  if(confirm(`Продать ${it.name} за ${sp} G?`)){
    gold+=sp;inv.splice(idx,1);selectedItems=selectedItems.filter(i=>i!==it);
    updateBal();markDirty();saveGame();rendInv();rendMain();
    toast('💸 +'+sp+' G','win');
  }
}
function recomputePct(){
  if(selectedItems.length===0||!targetSkin){selPct=null;checkUpgradeBtn();updateChanceZone(null);return}
  const invSum=selectedItems.reduce((s,it)=>s+(it.price||0),0);
  let pct=(invSum/targetSkin.price)*100;
  if(pct>90)pct=90;if(pct<0.5)pct=0.5;
  selPct=pct;updateWheelPct(pct);updateChanceZone(pct);checkUpgradeBtn();
}
function updateChanceZone(pct){
  const wheel=document.getElementById('wheel');
  const label=document.getElementById('chanceLabel');
  const fill=document.getElementById('wheelZoneFill');
  if(!wheel||!label||!fill)return;
  wheel.classList.remove('zone-green','zone-yellow','zone-red');
  label.className='chance-label';
  if(pct===null||pct===undefined){label.style.display='none';fill.style.setProperty('--zone-color','#ffb800');return}
  label.style.display='inline-block';
  if(pct>=50){wheel.classList.add('zone-green');label.classList.add('green');label.innerText='🛡 БЕЗОПАСНЫЙ';fill.style.setProperty('--zone-color','#4CAF50')}
  else if(pct>=20){wheel.classList.add('zone-yellow');label.classList.add('yellow');label.innerText='⚖ СРЕДНИЙ';fill.style.setProperty('--zone-color','#ffb800')}
  else{wheel.classList.add('zone-red');label.classList.add('red');label.innerText='🔥 МИНИМАЛЬНЫЙ';fill.style.setProperty('--zone-color','#e50914')}
  const ptEl=document.getElementById('pt');
  if(ptEl){ptEl.style.color=pct>=50?'var(--green-l)':(pct>=20?'var(--gold)':'var(--red)')}
}
function updateWheelPct(pct){
  const ptEl=document.getElementById('pt');if(ptEl){ptEl.innerText=formatPct(pct)}
  const fill=document.getElementById('wheelZoneFill');if(!fill)return;
  const targetAngle=(pct/100)*360;
  fill.classList.add('visible');
  const startAngle=currentWheelAngle;
  const startTime=performance.now();
  const duration=900;
  function anim(now){
    const t=Math.min(1,(now-startTime)/duration);
    const eased=1-Math.pow(1-t,4);
    currentWheelAngle=startAngle+(targetAngle-startAngle)*eased;
    fill.style.setProperty('--pct-angle',currentWheelAngle+'deg');
    if(t<1)wheelAnimId=requestAnimationFrame(anim);else wheelAnimId=null;
  }
  if(wheelAnimId)cancelAnimationFrame(wheelAnimId);
  wheelAnimId=requestAnimationFrame(anim);
}
function clearWheelPct(){
  const ptEl=document.getElementById('pt');if(ptEl)ptEl.innerText='?%';
  const fill=document.getElementById('wheelZoneFill');if(fill)fill.classList.remove('visible');
  currentWheelAngle=0;
  if(wheelAnimId){cancelAnimationFrame(wheelAnimId);wheelAnimId=null}
  updateChanceZone(null);
}
function setPct(p,el){
  if(isSpinning)return;
  if(selectedItems.length===0){toast('❌ Выбери скины','lose');return}
  const safePct=Math.min(90,Math.max(0.5,p));
  const invSum=selectedItems.reduce((s,it)=>s+(it.price||0),0);
  const idealPrice=invSum/(safePct/100);
  let closest=allSkins[0],minDiff=Math.abs(allSkins[0].price-idealPrice);
  allSkins.forEach(s=>{const d=Math.abs(s.price-idealPrice);if(d<minDiff){minDiff=d;closest=s}});
  targetSkin={name:closest.name,price:closest.price,color:closest.color,img:closest.img};
  let realPct=(invSum/targetSkin.price)*100;
  if(realPct>90)realPct=90;if(realPct<0.5)realPct=0.5;
  selPct=realPct;
  document.querySelectorAll('.pb').forEach(b=>b.classList.remove('sel','green','red'));
  if(el)el.classList.add('sel');
  updateWheelPct(realPct);updateChanceZone(realPct);rendMain();rendTargetList();checkUpgradeBtn();
}
function checkUpgradeBtn(){
  const btn=document.getElementById('upgradeBtn');if(!btn)return;
  btn.disabled=!(selectedItems.length>0&&targetSkin&&selPct&&!isSpinning);
}
function rendMain(){
  const leftIcons=document.getElementById('leftIcons');
  if(leftIcons){
    let h='';
    for(let i=0;i<MAX_UPGRADE;i++){
      const s=selectedItems[i];
      if(s){h+=`<div class="slot-cell">${s.img?`<img src="${s.img}">`:'📦'}<div class="slot-remove" onclick="removeFromUpgradeItem(selectedItems[${i}])">✕</div></div>`}
      else if(i<6){h+='<div class="empty-slot"></div>'}
    }
    leftIcons.innerHTML=h;
  }
  const selCount=document.getElementById('selCount');if(selCount)selCount.innerText=selectedItems.length+' ИЗ '+MAX_UPGRADE;
  const sum=selectedItems.reduce((s,it)=>s+(it.price||0),0);
  const sumEl=document.getElementById('selSum');if(sumEl)sumEl.innerText=sum.toLocaleString('ru-RU')+' G';
  const rightIcons=document.getElementById('rightIcons');
  if(rightIcons){
    if(targetSkin){
      rightIcons.innerHTML=`<div class="slot-cell" style="grid-column:1/-1;max-width:80px"><img src="${targetSkin.img}"></div>`;
      const tc=document.getElementById('targetCount');if(tc)tc.innerText=targetSkin.price+' G';
    } else {
      rightIcons.innerHTML='<div class="empty-slot"></div>';
      const tc=document.getElementById('targetCount');if(tc)tc.innerText='НЕ ВЫБРАНА';
    }
  }
  checkUpgradeBtn();
}
function pickTargetCard(name,price,color){
  if(isSpinning)return;
  const skin=allSkins.find(s=>s.name===name);
  targetSkin={name,price,color,img:skin?skin.img:null};
  const invSum=selectedItems.reduce((s,it)=>s+(it.price||0),0);
  if(invSum>0){selPct=Math.min(90,Math.max(0.5,(invSum/targetSkin.price)*100));updateWheelPct(selPct);updateChanceZone(selPct)}
  rendMain();rendTargetList();checkUpgradeBtn();
}
function toggleLightning(){if(isSpinning)return;lightningOn=!lightningOn;document.getElementById('lightningBtn').classList.toggle('on',lightningOn)}
function lockUI(lock){const ub=document.getElementById('upgradeBtn');if(ub)ub.disabled=lock;document.querySelectorAll('.pb').forEach(b=>b.disabled=lock)}

// ============ СПИН — СТРЕЛКА ОСТАЁТСЯ НА МЕСТЕ ============
function animateArrowTo(startAngle, endAngle, duration, easing, onDone){
  const wrap=document.getElementById('arrowWrap');
  const startTime=performance.now();
  function anim(now){
    const t=Math.min(1,(now-startTime)/duration);
    let eased;
    if(easing==='smooth'){eased=t*t*(3-2*t)}
    else if(easing==='bounce'){eased=1-Math.pow(1-t,3)}
    else if(easing==='slowstart'){eased=t<0.2?t*0.3:0.06+0.94*(1-Math.pow(1-(t-0.2)/0.8,3))}
    else{eased=t}
    const current=startAngle+(endAngle-startAngle)*eased;
    wrap.style.transform=`rotate(${current}deg)`;
    if(t<1)requestAnimationFrame(anim);
    else onDone && onDone();
  }
  requestAnimationFrame(anim);
}

async function spinUpgrade(){
  if(selectedItems.length===0||!targetSkin||!selPct||isSpinning)return;
  isSpinning=true;lockUI(true);rendInv();rendTargetList();

  const spinPct=Math.min(90,selPct);
  const totalPct=Math.min(90,spinPct+(refBoost.spinsLeft>0?5:0)+(vipData.isVip?5:0));
  const isFirstSpin = stats.spins === 0;
  let win=false,serverDecided=false,animation=null;

  if(isFirstSpin){win=true;animation=2}
  else{
    try{
      const ctrl=new AbortController();
      const tId=setTimeout(()=>ctrl.abort(),3500);
      const sc=await fetch(BOT_URL+'/api/spinControl/'+getUserId(),{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({pct:totalPct,betSum:selectedItems.reduce((s,it)=>s+(it.price||0),0),target:targetSkin.name,targetPrice:targetSkin.price}),
        signal:ctrl.signal
      });
      clearTimeout(tId);
      const scd=await sc.json();
      if(scd && (scd.result==='win'||scd.result==='lose')){
        win=scd.result==='win';
        serverDecided=true;
        if(scd.animation && scd.animation>=1 && scd.animation<=4) animation=scd.animation;
      }
    }catch(e){}
  }
  if(!isFirstSpin && !serverDecided){win=(Math.random()*100)<totalPct}
  // ВСЕГДА рандомим анимацию, если сервер не дал
  if(!animation){animation=Math.floor(Math.random()*3)+1}

  // ЦЕЛЬ — куда встанет стрелка (абсолютный угол от верхней точки)
  const winDeg=(totalPct/100)*360;
  let targetAbsolute;
  if(win){targetAbsolute=(180+winDeg/2+(Math.random()-0.5)*winDeg*0.3+360)%360}
  else{targetAbsolute=(180+winDeg+(360-winDeg)/2+(Math.random()-0.5)*(360-winDeg)*0.3+360)%360}

  // Сколько оборотов добавить (всегда положительное направление = по часовой)
  let fullTurns, duration, easing;
  if(lightningOn||vipData.isVip){fullTurns=3;duration=1500;easing='smooth'}
  else if(animation===1){fullTurns=2;duration=1200;easing='bounce'}
  else if(animation===2){fullTurns=6;duration=8000;easing='smooth'}
  else if(animation===3){fullTurns=9;duration=6500;easing='slowstart'}
  else{fullTurns=4;duration=4000;easing='smooth'}

  // Ключевая формула: старт = текущий сохранённый угол. Идём всегда в отрицательном направлении (по часовой).
  const start = arrowCurrentAngle;
  // Конечный абсолютный угол = targetAbsolute, но учитываем сколько уже накоплено
  // Хотим: финальный мод 360 = targetAbsolute
  const startMod = ((start % 360) + 360) % 360;
  // разница в градусах, чтобы попасть в targetAbsolute по часовой
  let delta = targetAbsolute - startMod;
  if(delta <= 0) delta += 360; // всегда идём вперёд
  const totalDelta = fullTurns*360 + delta;
  const end = start - totalDelta; // минус = по часовой (стрелка top → rotate clockwise)

  const wrap=document.getElementById('arrowWrap');
  wrap.classList.add('spinning');

  if(soundEnabled){
    let tc=0;const tickI=setInterval(()=>{sTick();tc++;if(tc>=Math.floor(duration/200))clearInterval(tickI)},200);
  }

  animateArrowTo(start, end, duration, easing, ()=>{
    wrap.classList.remove('spinning');
    // СОХРАНЯЕМ финальный угол, НЕ сбрасываем в 0
    arrowCurrentAngle = end;
    // нормализуем чтобы не уходило в -10000
    if(arrowCurrentAngle < -36000) arrowCurrentAngle = arrowCurrentAngle % 360;

    setTimeout(()=>{
      const lostItems=[...selectedItems];
      for(let i=lostItems.length-1;i>=0;i--){const idx=inv.indexOf(lostItems[i]);if(idx>=0)inv.splice(idx,1)}
      const totalValue=lostItems.reduce((s,it)=>s+(it.price||0),0);
      const avgImg=lostItems[0]?.img||null;
      const avgName=lostItems.length===1?lostItems[0].name:(lostItems.length+' скинов');
      selectedItems=[];

      if(win){
        inv.push({...targetSkin});stats.wins++;haptic('heavy');sWin();confetti();
        if(!bestDrop||targetSkin.price>bestDrop.price)bestDrop={name:targetSkin.name,img:targetSkin.img,price:targetSkin.price,ts:Date.now()};
        showResultModal(targetSkin,true);
        upgradeHistory.unshift({win:true,targetName:targetSkin.name,targetPrice:targetSkin.price,targetImg:targetSkin.img,betName:avgName,betPrice:totalValue,betImg:avgImg,betCount:lostItems.length,pct:spinPct,ts:Date.now()});
      } else {
        stats.loses++;haptic('light');sLose();
        const lost=lostItems[0]||{name:'—',img:'',price:0};
        showResultModal(lost,false);
        upgradeHistory.unshift({win:false,targetName:targetSkin.name,targetPrice:targetSkin.price,targetImg:targetSkin.img,betName:avgName,betPrice:totalValue,betImg:avgImg,betCount:lostItems.length,pct:spinPct,ts:Date.now()});
      }
      if(upgradeHistory.length>100)upgradeHistory.pop();
      if(refBoost.spinsLeft>0)refBoost.spinsLeft--;
      stats.spins++;checkAchievements();
      isSpinning=false;clearWheelPct();document.querySelectorAll('.pb').forEach(b=>b.classList.remove('sel','green','red'));
      lockUI(false);updateRankUI();markDirty();saveGame();
      loadLiveFeed();
    },300);
  });
}

function saveGame(){
  try{
    const uid=getUserId();if(uid==='guest')return;if(!gameLoaded)return;
    const data={gold,inv,stats,bestDrop,upgradeHistory,isVip:vipData.isVip||false,ts:Date.now()};
    localStorage.setItem('sfap_save_'+uid,JSON.stringify(data));
    fetch(BOT_URL+'/api/save-merge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,data})}).catch(()=>{});
  }catch(e){}
}
async function loadGame(){
  try{
    const uid=getUserId();
    if(uid==='guest'){gameLoaded=true;return}
    try{
      const r=await fetch(BOT_URL+'/api/load/'+uid);
      const d=await r.json();
      if(d.ok&&d.data){applySaveData(d.data);try{localStorage.setItem('sfap_save_'+uid,JSON.stringify(d.data))}catch(e){};gameLoaded=true;return}
    }catch(e){}
    const l=localStorage.getItem('sfap_save_'+uid);
    if(l){try{applySaveData(JSON.parse(l))}catch(e){console.warn('corrupt save',e)}}
    gameLoaded=true;
  }catch(e){gameLoaded=true}
}
function applySaveData(d){
  if(!d)return;
  if(typeof d.gold==='number'&&Number.isFinite(d.gold))gold=d.gold;
  if(Array.isArray(d.inv))inv=d.inv.filter(x=>x&&typeof x.name==='string'&&Number.isFinite(Number(x.price))).map(x=>({...x,price:Number(x.price)}));
  if(d.stats&&typeof d.stats==='object'&&!Array.isArray(d.stats)){stats={spins:Number(d.stats.spins)||0,wins:Number(d.stats.wins)||0,loses:Number(d.stats.loses)||0,crafts:Number(d.stats.crafts)||0}}
  if(d.bestDrop&&typeof d.bestDrop==='object')bestDrop=d.bestDrop;
  if(Array.isArray(d.upgradeHistory))upgradeHistory=d.upgradeHistory.slice(0,100);
  if(d.isVip!==undefined)vipData.isVip=!!d.isVip;
}

  if(!pattern){toast('❌ Введи паттерн','lose');return}
  const it=inv[idx];if(!it)return;
  try{await fetch(BOT_URL+'/api/withdraw/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:getUserId(),skinName:it.name,skinPrice:it.price,pattern,skinImg:it.img})}).catch(()=>{})}catch(e){}
  inv.splice(idx,1);markDirty();saveGame();rendInv();rendMain();
  document.getElementById('wdModal')?.remove();
  toast('✅ Заявка создана','win');confetti();
}

// ============ АДМИН-ПАНЕЛЬ ============
function openAdminPanel(){
  if(getUserId()!==ADMIN_ID){toast('❌ Доступ запрещён','lose');return}
  const m=document.createElement('div');m.className='modal-overlay';m.id='adminModal';
  m.onclick=(e)=>{if(e.target===m)m.remove()};
  m.innerHTML=`<div class="modal-content" style="max-width:450px"><button class="modal-close" onclick="document.getElementById('adminModal').remove()">✕</button>
    <div class="modal-title" style="color:var(--red)">🔒 АДМИН-ПАНЕЛЬ</div>
    <div style="background:var(--panel-l);border-radius:10px;padding:12px;margin-bottom:12px">
      <div style="font-size:11px;color:var(--gray2)">Баланс</div>
      <div style="font-size:24px;font-weight:900;color:var(--gold)">${Math.floor(gold).toLocaleString('ru-RU')} G</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      <button class="settings-btn" style="background:var(--green-l);padding:14px" onclick="adminAddGold(1000)">+1 000 G</button>
      <button class="settings-btn" style="background:var(--green-l);padding:14px" onclick="adminAddGold(10000)">+10 000 G</button>
      <button class="settings-btn" style="background:var(--blue);padding:14px" onclick="adminAddGold(100000)">+100 000 G</button>
      <button class="settings-btn" style="background:var(--purple);padding:14px" onclick="adminUnlockAll()">Все скины</button>
      <button class="settings-btn" style="background:var(--red);padding:14px;grid-column:1/-1" onclick="adminReset()">Сбросить баланс и инвентарь</button>
    </div>
  </div>`;
  document.body.appendChild(m);
}
function adminAddGold(n){gold+=n;updateBal();markDirty();saveGame();toast('✅ +'+n+' G','win');document.getElementById('adminModal')?.remove();openAdminPanel()}
function adminUnlockAll(){allSkins.forEach(s=>{if(!inv.find(i=>i.name===s.name)){inv.push({name:s.name,price:s.price,color:s.color,img:s.img})}});markDirty();saveGame();rendInv();toast('✅ Все скины добавлены','win');document.getElementById('adminModal')?.remove();openAdminPanel()}
function adminReset(){gold=0;inv=[];updateBal();markDirty();saveGame();rendInv();toast('✅ Сброшено','win');document.getElementById('adminModal')?.remove();openAdminPanel()}

// ============ ДОСТИЖЕНИЯ ============
function getRank(){let r=RANKS[0];for(const rank of RANKS){if(stats.spins>=rank.need)r=rank;else break}return r}
function getRankName(){const r=RANKS.find(r=>r.title===currentTitle);return r?r.name:'НОВИЧОК'}
function getAvatarDisplay(){const avs=[{id:'emoji1',v:'👤'},{id:'emoji2',v:'😎'}];const av=avs.find(a=>a.id===currentAvatar);return av?av.v:'👤'}
function updateRankUI(){const r=getRank();const rn=document.getElementById('rankNameTop');const rl=document.getElementById('rankLevelTop');if(rn)rn.innerText=r.name;if(rl)rl.innerText='LVL '+(RANKS.indexOf(r)+1)}
function updateTopAvatar(){const el=document.getElementById('topAv');if(!el)return;const u=getUser();if(u?.photo_url)el.innerHTML=`<img src="${u.photo_url}">`;else el.innerText='👤'}
function checkAchievements(){
  let n=[];ACHIEVEMENTS.forEach(a=>{if(!unlockedAch.includes(a.id)&&a.cond(stats)){unlockedAch.push(a.id);n.push(a)}});
  if(n.length>0){localStorage.setItem('sfap_ach',JSON.stringify(unlockedAch));n.forEach(a=>{gold+=a.reward||0;toast('🏅 '+a.ico+' '+a.name+' +'+a.reward+'G','win')});updateBal();markDirty();saveGame()}
}
function openAchievements(){
  const m=document.createElement('div');m.className='modal-overlay';m.id='achModal';
  m.onclick=(e)=>{if(e.target===m)m.remove()};
  m.innerHTML=`<div class="modal-content" style="max-width:450px"><button class="modal-close" onclick="document.getElementById('achModal').remove()">✕</button><div class="modal-title">🏅 ДОСТИЖЕНИЯ (${unlockedAch.length}/${ACHIEVEMENTS.length})</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${ACHIEVEMENTS.map(a=>{const un=unlockedAch.includes(a.id);return `<div style="padding:12px;background:${un?'rgba(255,184,0,.1)':'var(--panel-l)'};border:1px solid ${un?'var(--gold)':'var(--border)'};border-radius:10px;text-align:center"><div style="font-size:26px;filter:${un?'grayscale(0)':'grayscale(1)'};opacity:${un?'1':'.4'}">${a.ico}</div><div style="font-size:9px;font-weight:900;color:${un?'var(--gold)':'var(--gray2)'};margin-top:4px">${a.name}</div></div>`}).join('')}</div></div>`;
  document.body.appendChild(m);
}

// ============ НАСТРОЙКИ ============
function rendSettings(){
  const b=document.getElementById('settingsBody');
  b.innerHTML=`<div class="settings-item"><label>🔊 Звуки</label><div class="toggle ${soundEnabled?'on':''}" onclick="toggleSound()"></div></div><div class="settings-item"><label>📳 Вибрация</label><div class="toggle ${hapticEnabled?'on':''}" onclick="toggleHaptic()"></div></div><div class="settings-item"><label>🎨 Тема</label><button class="settings-btn" style="background:var(--blue)" onclick="toggleTheme();rendSettings()">${lightTheme?'СВЕТЛАЯ':'ТЁМНАЯ'}</button></div><div class="settings-item"><label>🗑 Сброс</label><button class="settings-btn" onclick="if(confirm('Сбросить?')){localStorage.clear();location.reload()}">СБРОС</button></div>`;
}
function toggleSound(){soundEnabled=!soundEnabled;localStorage.setItem('sfap_sound',soundEnabled?'1':'0');rendSettings()}
function toggleHaptic(){hapticEnabled=!hapticEnabled;localStorage.setItem('sfap_haptic',hapticEnabled?'1':'0');rendSettings()}
function toggleTheme(){lightTheme=!lightTheme;document.body.classList.toggle('light',lightTheme);localStorage.setItem('sfap_theme',lightTheme?'light':'dark')}

// ============ КРАФТ ============
function openCraft(){craftSelected=[];openS('craftScreen')}
function renderCraftScreen(){renderCraftPreview();renderCraftSlots();renderCraftRarityTabs();renderCraftSkinList();updateCraftButton()}
function renderCraftPreview(){
  const p=document.getElementById('craftPreview');if(!p)return;
  p.className='craft-preview';
  if(craftSelected.length>0){const last=craftSelected[craftSelected.length-1];p.innerHTML=`<img src="${last.img}" onerror="this.style.display='none'">`}
  else{p.innerHTML='<div class="placeholder">🔮</div>'}
  const cnt=document.getElementById('craftCount');if(cnt)cnt.innerText=craftSelected.length+' / '+CRAFT_NEED;
}
function renderCraftSlots(){
  const g=document.getElementById('craftSlots');if(!g)return;
  let h='';
  for(let i=0;i<CRAFT_NEED;i++){const it=craftSelected[i];if(it){h+=`<div class="craft-slot filled"><img src="${it.img}" onerror="this.style.display='none'"><div class="rm" onclick="removeCraftItem(${i})">✕</div></div>`}else{h+='<div class="craft-slot"></div>'}}
  g.innerHTML=h;
}
function renderCraftRarityTabs(){
  const tabs=document.getElementById('craftRarityTabs');if(!tabs)return;
  const rs=['r-common','r-uncommon','r-rare','r-epic','r-legend'];
  tabs.innerHTML=rs.map(r=>{const c=inv.filter(it=>getRarity(it.color||'#888')===r).length;return `<div class="craft-rarity-tab ${craftRarity===r?'active':''}" onclick="switchCraftRarity('${r}')">${RARITY_LABEL[r]} (${c})</div>`}).join('');
}
function switchCraftRarity(r){craftRarity=r;craftSelected=[];renderCraftScreen()}
function renderCraftSkinList(){
  const list=document.getElementById('craftSkinList');if(!list)return;
  const available=inv.filter(it=>getRarity(it.color||'#888')===craftRarity);
  if(available.length===0){list.innerHTML='<div style="text-align:center;padding:20px;color:var(--gray2);font-size:11px;font-weight:800;grid-column:1/-1">Нет скинов этой редкости</div>';return}
  list.innerHTML=available.map(it=>{
    const idx=inv.indexOf(it);
    const selCount=craftSelected.filter(x=>x===it).length;
    return `<div class="craft-skin-cell ${selCount>0?'disabled':''}" onclick="addToCraft(${idx})">
      <img src="${it.img}" onerror="this.style.display='none'">
      <div class="nm">${it.name}</div>
      ${selCount>0?`<div style="font-size:9px;color:var(--gold);font-weight:900">× ${selCount}</div>`:''}
    </div>`;
  }).join('');
}
function addToCraft(idx){
  if(craftInProgress)return;
  const it=inv[idx];if(!it)return;
  if(getRarity(it.color||'#888')!==craftRarity){toast('❌ Только одной редкости','lose');return}
  // ФИКС: не добавлять уже выбранный
  if(craftSelected.indexOf(it)>=0){toast('⚠️ Уже выбран','lose');return}
  if(craftSelected.length>=CRAFT_NEED){toast('❌ Уже '+CRAFT_NEED,'lose');return}
  craftSelected.push(it);
  renderCraftSlots();renderCraftPreview();renderCraftSkinList();updateCraftButton();
  const p=document.getElementById('craftPreview');p.classList.add('shuffling');setTimeout(()=>p.classList.remove('shuffling'),300);
}
function removeCraftItem(i){
  if(craftInProgress)return;
  if(i<0||i>=craftSelected.length)return;
  craftSelected.splice(i,1);
  renderCraftSlots();renderCraftPreview();renderCraftSkinList();updateCraftButton();
}
function updateCraftButton(){
  const btn=document.getElementById('craftBtn');if(!btn)return;
  btn.disabled=craftSelected.length!==CRAFT_NEED||craftInProgress;
}
function doCraft(){
  if(craftInProgress)return;
  if(craftSelected.length!==CRAFT_NEED){toast('❌ Нужно '+CRAFT_NEED+' скинов','lose');return}
  if(!craftSelected.every(it=>getRarity(it.color||'#888')===craftRarity)){toast('❌ Все скины одной редкости','lose');return}

  craftInProgress=true;
  const currentOrder=RARITY_ORDER[craftRarity];
  const isWin=Math.random()<0.30;
  const preview=document.getElementById('craftPreview');
  const btn=document.getElementById('craftBtn');
  btn.disabled=true;

  let shuffleCount=0;
  const shuffleInterval=setInterval(()=>{
    const randomSkin=allSkins[Math.floor(Math.random()*allSkins.length)];
    preview.innerHTML=`<img src="${randomSkin.img}" onerror="this.style.display='none'">`;
    preview.classList.add('shuffling');
    setTimeout(()=>preview.classList.remove('shuffling'),300);
    shuffleCount++;
    if(shuffleCount>=12){clearInterval(shuffleInterval);showCraftResult()}
  },200);

  function showCraftResult(){
    const targetOrder=isWin?Math.min(4,currentOrder+1):Math.max(0,currentOrder-1);
    const targetRarityKey=Object.keys(RARITY_ORDER).find(k=>RARITY_ORDER[k]===targetOrder);
    let pool=allSkins.filter(s=>getRarity(s.color)===targetRarityKey);
    if(pool.length===0||targetOrder===currentOrder){
      const avgPrice=craftSelected.reduce((s,it)=>s+(it.price||0),0)/craftSelected.length;
      const allSame=allSkins.filter(s=>getRarity(s.color)===craftRarity);
      if(isWin){pool=allSame.filter(s=>s.price>avgPrice);if(pool.length===0)pool=allSame}
      else{pool=allSame.filter(s=>s.price<avgPrice);if(pool.length===0)pool=allSame}
    }
    const result=pool[Math.floor(Math.random()*pool.length)];
    for(let i=0;i<craftSelected.length;i++){const idx=inv.indexOf(craftSelected[i]);if(idx>=0)inv.splice(idx,1)}
    inv.push({name:result.name,price:result.price,color:result.color,img:result.img});
    stats.crafts=(stats.crafts||0)+1;checkAchievements();markDirty();saveGame();

    preview.innerHTML=`<img src="${result.img}" onerror="this.style.display='none'">`;
    preview.classList.add('revealed',isWin?'win':'lose');

    setTimeout(()=>{
      craftSelected=[];craftInProgress=false;
      renderCraftSlots();renderCraftRarityTabs();renderCraftSkinList();updateCraftButton();
      sCraft();
      if(isWin){haptic('heavy');confetti();showResultModal(result,true)}
      else{haptic('light');showResultModal(result,false)}
    },1200);
  }
}

// ============ ИНИЦИАЛИЗАЦИЯ ============
(async()=>{
  try{
    await loadGame();
    drawTicks();renderPctRow();updateBal();rendMain();renderFilters();rendInv();rendTargetList();updateRankUI();updateTopAvatar();
    checkWelcomeBonus();loadLiveFeed();
    // показать админ-кнопку если админ
    if(getUserId()===ADMIN_ID){
      const ab=document.getElementById('adminBtn');if(ab)ab.style.display='flex';
    }
    // показать прелоадер при старте если переход по ref
    const urlParams=new URLSearchParams(location.search);
    if(urlParams.get('ref')){
      toast('🎁 Реф-ссылка распознана','win');
    }
    try{if(window.Telegram?.WebApp){window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}}catch(e){}
  }catch(err){console.error('INIT ERROR:',err)}
})();
</script>
