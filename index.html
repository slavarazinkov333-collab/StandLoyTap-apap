<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>StandCraft Bot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 50% 30%, #1a1a2e, #0a0a0f);
            color: white;
            font-family: -apple-system, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ — АККАУНТ */
        .top-bar {
            background: linear-gradient(180deg, #1a1a2e, #0f0f1a);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0c419;
            box-shadow: 0 4px 20px rgba(240, 196, 25, 0.15);
        }
        .account {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f0c419, #e6a800);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            border: 2px solid #fff3b0;
        }
        .nickname {
            font-size: 13px;
            font-weight: bold;
            color: #fff;
        }
        .balance-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            font-weight: bold;
        }
        .balance-item .icon { font-size: 16px; }
        .coins { color: #f0c419; }
        .gold { color: #ffd700; }

        /* ЦЕНТР — БОЛЬШОЙ КРУГ */
        .center {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
        }
        .big-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #2a2a4e, #0f0f1a);
            border: 4px solid #f0c419;
            box-shadow: 
                0 0 60px rgba(240, 196, 25, 0.3),
                inset 0 0 40px rgba(240, 196, 25, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        .big-circle:active {
            transform: scale(0.95);
            box-shadow: 0 0 100px rgba(240, 196, 25, 0.6);
        }
        .big-circle .inner-icon {
            font-size: 60px;
            margin-bottom: 5px;
        }
        .big-circle .inner-text {
            font-size: 14px;
            font-weight: bold;
            color: #f0c419;
            letter-spacing: 1px;
        }

        /* НИЖНЯЯ ПАНЕЛЬ */
        .bottom-bar {
            background: linear-gradient(0deg, #1a1a2e, #0f0f1a);
            padding: 12px 8px;
            display: flex;
            justify-content: space-around;
            border-top: 2px solid #f0c419;
            box-shadow: 0 -4px 20px rgba(240, 196, 25, 0.15);
        }
        .nav-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            transition: all 0.2s;
            border-radius: 12px;
        }
        .nav-btn .icon { font-size: 24px; }
        .nav-btn:active {
            background: rgba(240, 196, 25, 0.15);
            color: #f0c419;
            transform: scale(0.95);
        }

        /* МОДАЛЬНОЕ ОКНО */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal.open { display: flex; }
        .modal-content {
            background: #1a1a2e;
            border: 2px solid #f0c419;
            border-radius: 20px;
            padding: 24px;
            width: 85%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 50px rgba(240, 196, 25, 0.4);
        }
        .modal-content h2 {
            color: #f0c419;
            margin-bottom: 16px;
            font-size: 20px;
        }
        .modal-content p {
            color: #aaa;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }
        .modal-content button {
            background: linear-gradient(135deg, #f0c419, #e6a800);
            color: #1a1a2e;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ — АККАУНТ -->
    <div class="top-bar">
        <div class="account">
            <div class="avatar">👤</div>
            <div class="nickname">Игрок</div>
        </div>
        <div style="display:flex; gap:12px;">
            <div class="balance-item coins">
                <span class="icon">💰</span>
                <span id="coins">100</span>
            </div>
            <div class="balance-item gold">
                <span class="icon">⭐</span>
                <span id="gold">0</span>
            </div>
        </div>
    </div>

    <!-- ЦЕНТР — БОЛЬШОЙ КРУГ -->
    <div class="center">
        <div class="big-circle" onclick="spinWheel()">
            <span class="inner-icon">🎰</span>
            <span class="inner-text">КРУТИТЬ</span>
        </div>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ -->
    <div class="bottom-bar">
        <button class="nav-btn" onclick="openModal('Инвентарь', 'Здесь твои предметы и ресурсы.')">
            <span class="icon">🎒</span>
            <span>Инвентарь</span>
        </button>
        <button class="nav-btn" onclick="openModal('Магазин', 'Здесь можно купить оружие и ресурсы.')">
            <span class="icon">🛒</span>
            <span>Магазин</span>
        </button>
        <button class="nav-btn" onclick="spinWheel()">
            <span class="icon">🎰</span>
            <span>Спин</span>
        </button>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent">
            <h2 id="modalTitle">Заголовок</h2>
            <p id="modalText">Текст</p>
            <button onclick="closeModal()">Закрыть</button>
        </div>
    </div>

    <script>
        let coins = 100;
        let gold = 0;

        function updateBalance() {
            document.getElementById('coins').innerText = coins;
            document.getElementById('gold').innerText = gold;
        }

        function openModal(title, text) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalText').innerText = text;
            document.getElementById('modal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('open');
        }

        function spinWheel() {
            const prizes = [
                { name: '50 монет', coins: 50, gold: 0, icon: '💰' },
                { name: '10 голды', coins: 0, gold: 10, icon: '⭐' },
                { name: '100 монет', coins: 100, gold: 0, icon: '💰' },
                { name: 'Пусто', coins: 0, gold: 0, icon: '❌' },
                { name: '25 голды', coins: 0, gold: 25, icon: '⭐' },
                { name: '200 монет', coins: 200, gold: 0, icon: '💰' }
            ];

            const randomIndex = Math.floor(Math.random() * prizes.length);
            const prize = prizes[randomIndex];

            coins += prize.coins;
            gold += prize.gold;
            updateBalance();

            openModal('🎰 Результат спина', 
                `${prize.icon} Ты выиграл: ${prize.name}!\n\n` +
                `💰 Монеты: ${coins}\n⭐ Голда: ${gold}`
            );
        }

        updateBalance();
    </script>

</body>
</html>
