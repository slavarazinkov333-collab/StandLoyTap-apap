<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>StandFliutApap</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a0c;--panel:#121216;--panel-l:#1a1a22;--border:#272730;--gold:#ffb800;--red:#e50914;--green:#2e7d32;--green-l:#4CAF50;--gray:#666;--gray2:#999;--white:#fff;--blue:#4a9eff;--purple:#9b8aff}
body{background:var(--bg);color:var(--white);min-height:100vh;overflow-x:hidden;padding-bottom:100px}
body.light{--bg:#f0f0f5;--panel:#fff;--panel-l:#e8e8f0;--border:#d0d0dd;--white:#1a1a2a;--gray2:#666}
body.modal-open{overflow:hidden}
.top{position:sticky;top:0;z-index:100;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,12,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.top-left{display:flex;align-items:center;gap:12px}
.logo-svg{width:34px;height:34px}
.rank-badge{display:flex;flex-direction:column;font-size:9px;font-weight:800;color:var(--gray2)}
.rank-badge .rn{color:var(--gold);font-size:11px}
.top-right{display:flex;align-items:center;gap:8px}
.cart-btn{width:38px;height:38px;border-radius:10px;background:var(--panel);display:flex;justify-content:center;align-items:center;cursor:pointer;border:1px solid var(--border);position:relative}
.cart-btn svg{width:18px;height:18px;fill:var(--white)}
.cart-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:9px;font-weight:900;border-radius:10px;padding:2px 5px;border:2px solid var(--bg);display:none}
.bal-pill{display:flex;align-items:center;gap:8px;background:var(--panel);padding:6px 12px;border-radius:10px;border:1px solid var(--border);cursor:pointer}
.bal-plus{width:24px;height:24px;background:linear-gradient(135deg,#ffd700,#ff8c00);border-radius:6px;display:flex;justify-content:center;align-items:center;font-size:16px;color:#1a1a1a;font-weight:900}
.bal-num{font-size:14px;font-weight:900}
.bal-g{font-size:11px;font-weight:900;color:var(--gold)}
.av-top{width:38px;height:38px;border-radius:10px;background:var(--panel);display:flex;justify-content:center;align-items:center;font-size:16px;cursor:pointer;border:1px solid var(--border);overflow:hidden}
.av-top img{width:100%;height:100%;object-fit:cover}
.live-bar{margin:12px 16px;background:var(--panel);border:1px solid var(--border);border-radius:12px;height:60px;overflow:hidden;position:relative;display:flex;align-items:center}
.live-bar::before{content:'LIVE';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:9px;font-weight:900;color:#fff;background:var(--red);padding:3px 8px;border-radius:4px;z-index:3}
.live-track{display:flex;gap:12px;white-space:nowrap;animation:scrollLeft 25s linear infinite;padding-left:65px;align-items:center;height:100%}
@keyframes scrollLeft{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.live-item{display:flex;align-items:center;gap:10px;flex-shrink:0;padding:6px 12px;background:var(--panel-l);border-radius:8px;border:1px solid var(--border);border-left:4px solid var(--gold);cursor:pointer}
.live-name{font-size:12px;font-weight:900}
.live-pct{font-size:10px;font-weight:900;color:#1a1a1a;background:var(--gold);padding:2px 6px;border-radius:4px}
.live-skin{width:50px;height:30px;object-fit:contain}
.live-empty{padding-left:65px;font-size:10px;color:var(--gray);font-weight:700}
.friends-btn-wrap{margin:0 16px 12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.friends-btn-wrap::-webkit-scrollbar{display:none}
.friends-btn{flex-shrink:0;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--gray2);font-size:11px;font-weight:800;cursor:pointer}
.main{padding:0 16px}
.wheel-wrap{position:relative;width:100%;aspect-ratio:1;max-width:340px;margin:10px auto;display:flex;justify-content:center;align-items:center}
.wheel{width:90%;height:90%;border-radius:50%;background:radial-gradient(circle at center,var(--panel-l) 0%,var(--panel) 60%,#0a0a0c 100%);position:relative;display:flex;justify-content:center;align-items:center;box-shadow:0 0 60px rgba(0,0,0,.9),0 0 80px rgba(255,184,0,.15),inset 0 0 40px rgba(0,0,0,.6);border:4px solid #1a1a22}
.wheel-zone{position:absolute;inset:-4px;border-radius:50%;pointer-events:none;z-index:1;overflow:hidden}
.wheel-zone-fill{position:absolute;top:0;left:0;width:100%;height:100%;background:conic-gradient(from 180deg,var(--gold) 0deg,var(--gold) var(--pct-angle,0deg),#1a1a22 var(--pct-angle,0deg),#1a1a22 360deg);opacity:0;transition:opacity .4s}
.wheel-zone-fill.visible{opacity:.9}
.wheel::before{content:'';position:absolute;width:75%;height:75%;border-radius:50%;background:var(--bg);border:1px solid var(--border);z-index:2}
.wheel-ticks{position:absolute;width:100%;height:100%;border-radius:50%;pointer-events:none;z-index:3}
.tick{position:absolute;top:0;left:50%;width:2px;height:8px;background:rgba(255,184,0,.4);transform-origin:center 150px;transform:translateX(-50%) rotate(var(--a));border-radius:1px}
.tick.major{width:3px;height:14px;background:var(--gold);box-shadow:0 0 8px rgba(255,184,0,.8)}
.wheel-center{position:relative;z-index:5;text-align:center}
.pt{font-size:52px;font-weight:900;line-height:1;letter-spacing:-2px;text-shadow:0 0 20px rgba(255,184,0,.4)}
.pl{font-size:9px;color:var(--gray2);letter-spacing:4px;margin-top:4px;font-weight:700}
.arrow-wrap{position:absolute;inset:0;pointer-events:none;z-index:25}
.arrow{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:32px;height:44px;filter:drop-shadow(0 4px 10px rgba(255,184,0,.8))}
.pcnt-row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:20px}
.pb{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 4px;color:var(--gray2);font-size:11px;font-weight:800;cursor:pointer}
.pb.sel{border-color:var(--gold);background:rgba(255,184,0,.1);color:var(--gold)}
.action-row{display:flex;gap:8px;margin-top:12px}
.lightning-btn{width:56px;height:56px;background:var(--panel);border:1px solid var(--border);border-radius:12px;cursor:pointer;display:flex;justify-content:center;align-items:center}
.lightning-btn.on{border-color:var(--gold);background:rgba(255,184,0,.1)}
.lightning-btn .ic{font-size:20px;filter:grayscale(1);opacity:.5}
.lightning-btn.on .ic{filter:grayscale(0);opacity:1}
.upgrade-btn{flex:1;background:linear-gradient(135deg,var(--gold),#ff8c00);color:#1a1a1a;border:none;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer}
.upgrade-btn:disabled{opacity:.5;background:var(--panel)}
.slots-preview{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.slot-prev{background:linear-gradient(180deg,#1a1a1c 0%,#0f0f11 100%);border:1.5px solid #2a2a2e;border-radius:18px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;min-height:190px;position:relative;cursor:pointer}
.slot-prev-lbl{font-size:11px;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;text-align:center}
.slot-prev-cnt{font-size:13px;font-weight:900;color:#ffb800;margin-bottom:12px;text-align:center}
.slot-prev-icons{display:flex;flex-direction:column;gap:8px;width:100%;flex:1;justify-content:center;align-items:center;position:relative}
.slot-cell{width:100%;display:flex;justify-content:center;align-items:center;position:relative}
.slot-cell img{width:80px;height:80px;object-fit:contain;filter:drop-shadow(0 8px 15px rgba(0,0,0,0.7))}
.slot-cell .empty-slot{width:70px;height:70px;border:2px dashed #333;border-radius:16px;display:flex;justify-content:center;align-items:center;font-size:24px;color:#444}
.slot-remove{position:absolute;top:-5px;right:calc(50% - 45px);width:24px;height:24px;background:var(--red);border-radius:50%;display:flex;justify-content:center;align-items:center;color:#fff;font-size:14px;font-weight:900;cursor:pointer;border:2px solid #0a0a0c;z-index:5}
.slot-sum{font-size:16px;font-weight:900;color:#ffb800;margin-top:10px;text-align:center}
.slot-clear{font-size:11px;font-weight:900;color:var(--red);margin-top:8px;cursor:pointer;background:rgba(229,9,20,0.1);border:1px solid rgba(229,9,20,0.3);padding:6px 14px;border-radius:8px}
.big-tabs{display:flex;gap:4px;margin-top:20px;background:var(--panel);padding:4px;border-radius:12px}
.big-tab{flex:1;background:none;border:none;color:var(--gray2);font-size:11px;font-weight:800;padding:10px;border-radius:8px;cursor:pointer}
.big-tab.active{background:var(--panel-l);color:var(--white)}
.panel{display:none;margin-top:16px}
.panel.active{display:block}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--panel);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border)}
.card-img-wrap{width:100%;aspect-ratio:1.2;background:radial-gradient(circle at center,var(--panel-l) 0%,transparent 70%);display:flex;justify-content:center;align-items:center;padding:10px}
.card-img-wrap img{width:90%;height:90%;object-fit:contain}
.card-info{padding:10px;display:flex;flex-direction:column;gap:4px}
.card-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-price{font-size:13px;font-weight:900;color:var(--gold)}
.card-actions{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border)}
.card-actions button{padding:10px;border:none;font-size:10px;font-weight:900;cursor:pointer;background:var(--panel-l);color:var(--white)}
.card-actions button:first-child{border-right:1px solid var(--border)}
.r-common{border-color:var(--border)}
.r-uncommon{border-color:#4a9eff}
.r-rare{border-color:#9b8aff}
.r-epic{border-color:#ff4444}
.r-legend{border-color:#ffd700;box-shadow:0 0 15px rgba(255,215,0,.25)}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(10,10,12,.9);border-top:1px solid var(--border);padding:8px 4px;display:flex;justify-content:space-around}
.nb{background:none;border:none;color:var(--gray);font-size:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;font-weight:800}
.nb svg{width:22px;height:22px;fill:currentColor}
.nb.active{color:var(--white)}
.nb.active svg{fill:var(--white)}
.nb-center{position:relative;top:-15px}
.nb-center .circle{width:50px;height:50px;background:var(--panel-l);border-radius:16px;display:flex;justify-content:center;align-items:center;border:1px solid var(--border)}
.nb-center .circle svg{width:24px;height:24px;fill:var(--gold)}
.scr{position:fixed;inset:0;background:var(--bg);z-index:600;display:none;flex-direction:column}
.scr.open{display:flex}
.sh{padding:16px;display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-bottom:1px solid var(--border)}
.sh h2{font-size:16px;font-weight:900}
.cb{background:var(--panel-l);border:none;color:var(--gray2);width:30px;height:30px;border-radius:8px;cursor:pointer}
.sb{flex:1;overflow-y:auto;padding:16px}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--border);padding:16px 24px;border-radius:12px;color:var(--white);font-size:13px;font-weight:800;z-index:9999;text-align:center;display:none}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(5px);z-index:1000;display:flex;justify-content:center;align-items:center;padding:16px;overflow-y:auto}
.modal-content{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;max-width:400px;position:relative;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:900;margin-bottom:16px;text-align:center}
.modal-close{position:absolute;top:16px;right:16px;background:var(--panel-l);border:none;color:var(--gray2);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;z-index:10}
.filter-bar{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--gray2);font-size:10px;font-weight:800;cursor:pointer}
.filter-chip.active{border-color:var(--gold);color:var(--gold);background:rgba(255,184,0,.1)}
@keyframes popupIn{0%{opacity:0;transform:scale(.7) translateY(30px)}60%{transform:scale(1.05) translateY(-5px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.popup-win-card{animation:popupIn .5s cubic-bezier(.34,1.56,.64,1)}
.popup-lose-card{animation:popupIn .5s cubic-bezier(.34,1.56,.64,1)}
.popup-item{animation:itemFloat 2s ease-in-out infinite}
@keyframes itemFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.02)}}
.popup-title-win{background:linear-gradient(135deg,#4CAF50,#8BC34A,#4CAF50);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.popup-title-lose{background:linear-gradient(135deg,#e50914,#ff6b6b,#e50914);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.skeleton{background:linear-gradient(90deg,var(--panel-l) 25%,var(--border) 50%,var(--panel-l) 75%);background-size:200% 100%;animation:skel 1.5s infinite;border-radius:8px}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
.vip-btn{width:100%;padding:14px;border-radius:10px;background:var(--gold);color:#000;font-weight:900;border:none;cursor:pointer;margin-bottom:8px}
</style></head><body>

<div class="top">
  <div class="top-left">
    <svg class="logo-svg" viewBox="0 0 40 40"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e50914"/><stop offset="1" stop-color="#8b0000"/></linearGradient></defs><path fill="url(#lg)" d="M20 2L4 20h8v16h16V20h8L20 2zm0 6l8 10h-4v10h-8V18h-4l8-10z"/></svg>
    <div class="rank-badge"><div class="rn" id="rankNameTop">НОВИЧОК</div><div id="rankLevelTop">LVL 1</div></div>
  </div>
  <div class="top-right">
    <div class="cart-btn" onclick="openCart()"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg><div class="cart-badge" id="cartBadge">0</div></div>
    <div class="bal-pill"><div class="bal-plus">+</div><div class="bal-num" id="goldTop">0</div><div class="bal-g">G</div></div>
    <div class="av-top" id="topAv">👤</div>
  </div>
</div>

<div class="live-bar"><div class="live-track" id="liveTrack"><span class="live-empty">Загрузка...</span></div></div>

<div class="friends-btn-wrap">
  <button class="friends-btn" onclick="openTasksModal()">🎯 ЗАДАНИЯ</button>
  <button class="friends-btn" onclick="openVipModal()" style="color:var(--gold)">👑 VIP</button>
</div>

<div class="main">
  <div class="wheel-wrap">
    <div class="wheel" id="wheel">
      <div class="wheel-zone"><div class="wheel-zone-fill" id="wheelZoneFill"></div></div>
      <div class="wheel-ticks" id="wheelTicks"></div>
      <div class="wheel-center"><div class="pt" id="pt">?%</div><div class="pl">CHANCE</div></div>
    </div>
    <div class="arrow-wrap" id="arrowWrap"><div class="arrow"><svg viewBox="0 0 40 52"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb800"/><stop offset="1" stop-color="#ff8c00"/></linearGradient></defs><path fill="url(#ag)" d="M20 52L8 32h7V8h10v24h7L20 52z"/></svg></div></div>
  </div>
  <div class="pcnt-row" id="pcntRow"></div>
  <div class="action-row">
    <button class="lightning-btn" id="lightningBtn" onclick="toggleLightning()"><div class="ic">⚡</div></button>
    <button class="upgrade-btn" id="upgradeBtn" onclick="spinUpgrade()" disabled>UPGRADE</button>
  </div>
  <div class="slots-preview">
    <div class="slot-prev" onclick="switchBigTab('inv')"><div class="slot-prev-lbl">ВАШ ИНВЕНТАРЬ</div><div class="slot-prev-icons" id="leftIcons"></div><div class="slot-prev-cnt" id="selCount" style="font-size:9px;color:var(--gray);margin-top:8px;">0 ИЗ 10</div><div class="slot-sum" id="selSum">0 G</div><button class="slot-clear" onclick="clearUpgrade()">✕ ОЧИСТИТЬ</button></div>
    <div class="slot-prev" onclick="switchBigTab('target')"><div class="slot-prev-lbl">ЦЕЛЬ</div><div class="slot-prev-icons" id="rightIcons"></div><div class="slot-prev-cnt" id="targetCount" style="font-size:9px;color:var(--gold);margin-top:8px;">НЕ ВЫБРАНА</div></div>
  </div>
  <div class="big-tabs"><button class="big-tab active" id="bigTabInv" onclick="switchBigTab('inv')">ИНВЕНТАРЬ</button><button class="big-tab" id="bigTabTarget" onclick="switchBigTab('target')">ПРОКАЧАТЬ ДО</button></div>
  <div class="panel active" id="panelInv">
    <div style="display:flex;gap:4px;margin-top:16px;background:var(--panel);padding:4px;border-radius:12px;">
      <button id="subInv" onclick="switchSub('inv')" style="flex:1;background:var(--panel-l);border:none;color:var(--white);font-size:11px;font-weight:800;padding:10px;border-radius:8px;cursor:pointer;">МОИ СКИНЫ</button>
      <button id="subShop" onclick="switchSub('shop')" style="flex:1;background:none;border:none;color:var(--gray2);font-size:11px;font-weight:800;padding:10px;border-radius:8px;cursor:pointer;">МАГАЗИН</button>
    </div>
    <div style="margin-top:12px;"><input type="text" id="searchInp" placeholder="Поиск..." oninput="rendInv()" style="width:100%;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--white);outline:none;font-size:12px;"></div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="grid" id="invList"></div>
  </div>
  <div class="panel" id="panelTarget">
    <div style="margin-top:12px;"><input type="text" id="targetSearchInp" placeholder="Поиск цели..." oninput="rendTargetList()" style="width:100%;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--white);outline:none;font-size:12px;"></div>
    <div class="grid" id="targetList"></div>
  </div>
</div>

<div class="bottom">
  <button class="nb" onclick="scrollToShop()"><span>SHOP</span></button>
  <button class="nb nb-center active"><div class="circle">👤</div></button>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== GLOBALS ====================
const BOT_URL = 'https://admin-bot-03ly.onrender.com';
const tg = window.Telegram?.WebApp;
if(tg){ tg.ready(); tg.expand(); }
const tgUser = tg?.initDataUnsafe?.user;
const tgInitData = tg?.initData || '';
const userId = tgUser?.id ? String(tgUser.id) : 'dev_test_user';

// Заголовок авторизации
function authHeaders(extra){
  return Object.assign({ 'Content-Type': 'application/json', 'X-TG-Init-Data': tgInitData }, extra || {});
}

// ==================== STATE ====================
let gold = 0;
let inv = [];
let stats = { spins: 0, wins: 0, loses: 0 };
let bestDrop = null;
let selectedItems = [];
let targetSkin = null;
let selPct = null;
let isSpinning = false;
let cart = [];
let invMode = 'inv';
let invFilter = 'all';
let lightningOn = false;
let currentWheelAngle = 0;
let wheelAnimId = null;
let vipData = { isVip: false, expires: 0 };
const DEFAULT_PCTS = [90, 67, 55, 44, 33, 22];
let customPcts = [...DEFAULT_PCTS];
let gameLoaded = false;

// ==================== КАТАЛОГ (только для отображения) ====================
const CATALOG_CLIENT = {
  'AKR Carbon': { price: 56, color: '#4a9eff', img: 'https://raw.githubusercontent.com/slavarazinkov333-collab/StandLoyTap-apap/main/skins/AKR_CARBON.jpg' },
  'AKR Evolution': { price: 3, color: '#4a9eff', img: 'https://raw.githubusercontent.com/slavarazinkov333-collab/StandLoyTap-apap/main/skins/AKR_EVOLUTION.jpg' },

// ==================== UTILS ====================
function toast(msg, type){
  const e = document.getElementById('toast');
  e.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid ' + (type === 'win' ? 'var(--green-l)' : type === 'lose' ? 'var(--red)' : 'var(--border)') + ';padding:16px 24px;border-radius:12px;color:var(--white);font-size:13px;font-weight:800;z-index:9999;text-align:center;display:block';
  e.innerText = msg;
  setTimeout(() => e.style.display = 'none', 2500);
}
function formatPct(p){
  if(p >= 0.1) return p.toFixed(1) + '%';
  if(p >= 0.01) return p.toFixed(2) + '%';
  return p.toFixed(3) + '%';
}
function getRarity(c){
  c = String(c || '#888').toLowerCase();
  if(c === '#ffd700') return 'r-legend';
  if(c === '#ff4444') return 'r-epic';
  if(c === '#ff69b4') return 'r-rare';
  if(c === '#9b8aff') return 'r-uncommon';
  return 'r-common';
}
function updateBal(){ document.getElementById('goldTop').innerText = Math.floor(gold).toLocaleString('ru-RU'); }
function lockBody(v){ document.body.classList.toggle('modal-open', v); }

// ==================== API ====================
async function apiCall(path, opts){
  opts = opts || {};
  const headers = authHeaders(opts.headers);
  const res = await fetch(BOT_URL + path, { ...opts, headers });
  const text = await res.text();
  let data;
  try{ data = JSON.parse(text); } 
  catch(e){ 
    console.error('Non-JSON response:', text.substring(0, 200)); 
    throw new Error('Сервер вернул ошибку. Попробуй позже.'); 
  }
  if(!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
  return data;
}

// ==================== LOAD ====================
async function loadGame(){
  try{
    const d = await apiCall('/api/load/' + userId);
    if(d.ok && d.data){
      gold = d.data.gold || 0;
      inv = Array.isArray(d.data.inv) ? d.data.inv : [];
      stats = d.data.stats || { spins: 0, wins: 0, loses: 0 };
      bestDrop = d.data.bestDrop || null;
      vipData = { isVip: !!d.data.isVip, expires: Number(d.data.vipExpires || 0) };
      if(d.data.photoUrl){ document.getElementById('topAv').innerHTML = '<img src="' + d.data.photoUrl + '">'; }
    }
    gameLoaded = true;
  }catch(e){
    console.error('loadGame', e);
    toast('❌ ' + e.message, 'lose');
    gameLoaded = true;
  }
}

// ==================== WHEEL ====================
function drawTicks(){
  const t = document.getElementById('wheelTicks');
  if(!t) return;
  let h = '';
  for(let i = 0; i < 36; i++){
    const a = i * (360/36);
    h += '<div class="tick' + (i % 3 === 0 ? ' major' : '') + '" style="--a:' + a + 'deg"></div>';
  }
  t.innerHTML = h;
}
function renderPctRow(){
  const b = document.getElementById('pcntRow');
  if(!b) return;
  b.innerHTML = customPcts.map(p => '<button class="pb" onclick="setPct(' + p + ',this)">' + p + '%</button>').join('');
}
function updateWheelPct(pct){
  const ptEl = document.getElementById('pt');
  if(ptEl) ptEl.innerText = formatPct(pct);
  const fill = document.getElementById('wheelZoneFill');
  if(!fill) return;
  const targetAngle = (pct/100) * 360;
  fill.classList.add('visible');
  const startAngle = currentWheelAngle;
  const startTime = performance.now();
  const duration = 600;
  if(wheelAnimId) cancelAnimationFrame(wheelAnimId);
  function anim(now){
    const t = Math.min(1, (now - startTime) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    currentWheelAngle = startAngle + (targetAngle - startAngle) * eased;
    fill.style.setProperty('--pct-angle', currentWheelAngle + 'deg');
    if(t < 1) wheelAnimId = requestAnimationFrame(anim);
    else wheelAnimId = null;
  }
  wheelAnimId = requestAnimationFrame(anim);
}
function clearWheelPct(){
  document.getElementById('pt').innerText = '?%';
  const fill = document.getElementById('wheelZoneFill');
  if(fill) fill.classList.remove('visible');
  currentWheelAngle = 0;
  if(wheelAnimId){ cancelAnimationFrame(wheelAnimId); wheelAnimId = null; }
}

// ==================== UPGRADE ====================
function addToUpgrade(name){
  if(isSpinning) return toast('⏳ Подожди спин', 'lose');
  if(selectedItems.length >= 10) return toast('❌ Макс 10', 'lose');
  if(selectedItems.find(x => x.name === name)) return toast('⚠️ Уже добавлен', 'lose');
  const it = inv.find(x => x.name === name);
  if(!it) return toast('❌ Нет скина', 'lose');
  selectedItems.push(it);
  recomputePct();
  rendMain();
  toast('⬆️ Добавлен', 'win');
}
function removeFromUpgrade(name){
  if(isSpinning) return;
  selectedItems = selectedItems.filter(x => x.name !== name);
  recomputePct();
  rendMain();
}
function clearUpgrade(){
  if(isSpinning) return;
  selectedItems = [];
  targetSkin = null;
  selPct = null;
  clearWheelPct();
  rendMain();
  toast('✕ Очищено', 'win');
}
function pickTarget(name){
  if(isSpinning) return;
  const s = CATALOG_CLIENT[name];
  if(!s) return;
  targetSkin = { name, price: s.price, color: s.color, img: s.img };
  recomputePct();
  rendMain();
  rendTargetList();
  switchBigTab('inv');
}
function recomputePct(){
  if(selectedItems.length === 0 || !targetSkin){ selPct = null; checkUpgradeBtn(); return; }
  const invSum = selectedItems.reduce((s, it) => s + (it.price || 0), 0);
  let pct = Math.min(90, Math.max(0.01, (invSum / targetSkin.price) * 100));
  selPct = pct;
  updateWheelPct(pct);
  checkUpgradeBtn();
}
function setPct(p, el){
  if(isSpinning) return;
  if(selectedItems.length === 0) return toast('❌ Выбери скины', 'lose');
  const safePct = Math.min(90, Math.max(1, p));
  const invSum = selectedItems.reduce((s, it) => s + (it.price || 0), 0);
  const idealPrice = invSum / (safePct / 100);
  let closest = allSkins[0], minDiff = Math.abs(allSkins[0].price - idealPrice);
  allSkins.forEach(s => { const d = Math.abs(s.price - idealPrice); if(d < minDiff){ minDiff = d; closest = s; } });
  targetSkin = { name: closest.name, price: closest.price, color: closest.color, img: closest.img };
  recomputePct();
  document.querySelectorAll('.pb').forEach(b => b.classList.remove('sel'));
  if(el) el.classList.add('sel');
  rendMain();
  rendTargetList();
}
function checkUpgradeBtn(){
  const btn = document.getElementById('upgradeBtn');
  if(!btn) return;
  btn.disabled = !(selectedItems.length > 0 && targetSkin && selPct && !isSpinning);
}
function rendMain(){
  const left = document.getElementById('leftIcons');
  if(left){
    if(selectedItems.length === 0){
      left.innerHTML = '<div class="empty-slot" style="margin:0 auto;">+</div>';
    } else {
      left.innerHTML = selectedItems.map(s =>
        '<div class="slot-cell"><img src="' + (s.img || '') + '"><div class="slot-remove" onclick="event.stopPropagation();removeFromUpgrade(\'' + s.name.replace(/'/g, "\\'") + '\')">✕</div></div>'
      ).join('');
    }
  }
  document.getElementById('selCount').innerText = selectedItems.length + ' ИЗ 10';
  const sum = selectedItems.reduce((s, it) => s + (it.price || 0), 0);
  document.getElementById('selSum').innerText = sum.toLocaleString('ru-RU') + ' G';
  const right = document.getElementById('rightIcons');
  if(targetSkin){
    right.innerHTML = '<div class="slot-cell"><img src="' + targetSkin.img + '"></div>';
    document.getElementById('targetCount').innerText = targetSkin.price.toLocaleString('ru-RU') + ' G';
  } else {
    right.innerHTML = '<div class="empty-slot" style="margin:0 auto;">🎯</div>';
    document.getElementById('targetCount').innerText = 'НЕ ВЫБРАНА';
  }
  checkUpgradeBtn();
}
function toggleLightning(){
  if(isSpinning) return;
  lightningOn = !lightningOn;
  document.getElementById('lightningBtn').classList.toggle('on', lightningOn);
}

// ==================== SPIN ====================
async function spinUpgrade(){
  if(selectedItems.length === 0 || !targetSkin || !selPct || isSpinning) return;
  if(!gameLoaded) return toast('⏳ Загрузка...', 'lose');
  
  isSpinning = true;
  document.getElementById('upgradeBtn').disabled = true;
  document.getElementById('upgradeBtn').innerText = '⏳...';
  
  const selectedNames = selectedItems.map(x => x.name);
  let result;
  try{
    result = await apiCall('/api/spin/commit', {
      method: 'POST',
      body: JSON.stringify({ userId, targetName: targetSkin.name, selectedNames })
    });
  }catch(e){
    toast('❌ ' + e.message, 'lose');
    isSpinning = false;
    document.getElementById('upgradeBtn').innerText = 'UPGRADE';
    checkUpgradeBtn();
    return;
  }
  
  if(!result.ok){
    toast('❌ ' + (result.error || 'Ошибка'), 'lose');
    isSpinning = false;
    document.getElementById('upgradeBtn').innerText = 'UPGRADE';
    checkUpgradeBtn();
    return;
  }
  
  gold = result.newGold;
  inv = result.newInv;
  stats.spins++;
  if(result.win){ stats.wins++; if(!bestDrop || result.target.price > (bestDrop.price || 0)) bestDrop = result.target; }
  else stats.loses++;
  updateBal();
  
  const duration = (lightningOn || vipData.isVip) ? 2000 : 10000;
  const durSec = duration / 1000;
  const spinPct = result.pct;
  const winDeg = (spinPct/100) * 360;
  let targetAngle;
  if(result.win){
    const mid = 180 + winDeg/2;
    const jitter = (Math.random() - 0.5) * winDeg * 0.6;
    targetAngle = (mid + jitter + 360) % 360;
  } else {
    const grayStart = (180 + winDeg) % 360;
    const grayLen = 360 - winDeg;
    const mid = grayStart + grayLen/2;
    const jitter = (Math.random() - 0.5) * grayLen * 0.6;
    targetAngle = (mid + jitter + 360) % 360;
  }
  const targetMod = (360 - targetAngle) % 360;
  const totalRotation = 5 * 360 + targetMod;
  const wrap = document.getElementById('arrowWrap');
  wrap.style.transition = 'none';
  wrap.style.transform = 'rotate(0deg)';
  wrap.offsetHeight;
  wrap.style.transition = 'transform ' + durSec + 's cubic-bezier(.15,.6,.2,1)';
  wrap.style.transform = 'rotate(' + (-totalRotation) + 'deg)';
  
  setTimeout(() => {
    if(result.win){
      showWinModal(result.target);
    } else {
      showLoseModal(selectedItems);
    }
    isSpinning = false;
    wrap.style.transition = 'none';
    wrap.style.transform = 'rotate(0deg)';
    selectedItems = [];
    targetSkin = null;
    selPct = null;
    clearWheelPct();
    document.getElementById('upgradeBtn').innerText = 'UPGRADE';
    rendMain();
    rendInv();
    rendTargetList();
    checkUpgradeBtn();
  }, duration);
}

// ==================== CART ====================
function toggleCart(name, price){
  if(isSpinning) return;
  const i = cart.findIndex(c => c.name === name);
  if(i >= 0) cart.splice(i, 1);
  else cart.push({ name, price });
  updateCartBadge();
  rendInv();
}
function updateCartBadge(){
  const b = document.getElementById('cartBadge');
  if(cart.length > 0){ b.style.display = 'block'; b.innerText = cart.length; }
  else b.style.display = 'none';
}
async function openCart(){
  if(cart.length === 0) return toast('🛒 Корзина пуста', 'lose');
  const m = document.createElement('div');
  m.className = 'modal-overlay';
  m.id = 'cartModal';
  m.onclick = (e) => { if(e.target === m){ m.remove(); lockBody(false); } };
  const total = cart.reduce((s, c) => s + c.price, 0);
  m.innerHTML = '<div class="modal-content"><button class="modal-close" onclick="document.getElementById(\'cartModal\').remove();lockBody(false)">✕</button><div class="modal-title">🛒 КОРЗИНА</div><div style="max-height:50vh;overflow-y:auto;margin-bottom:16px">' +
    cart.map((c, i) => '<div style="background:var(--panel-l);border-radius:8px;padding:10px;margin-bottom:8px;display:flex;align-items:center;gap:12px"><div style="flex:1"><div style="font-size:12px;font-weight:900">' + c.name + '</div><div style="font-size:13px;color:var(--gold);font-weight:900">' + c.price + ' G</div></div><button onclick="cart.splice(' + i + ',1);document.getElementById(\'cartModal\').remove();lockBody(false);openCart();updateCartBadge();rendInv()" style="background:none;border:none;color:var(--red);font-size:16px;cursor:pointer">✕</button></div>').join('') +
    '</div><div style="display:flex;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border);margin-bottom:16px"><div style="font-size:12px;color:var(--gray2);font-weight:800">ИТОГО:</div><div style="font-size:20px;font-weight:900;color:var(--gold)">' + total + ' G</div></div><button class="vip-btn" onclick="checkout()" id="checkoutBtn">✅ КУПИТЬ</button></div>';
  document.body.appendChild(m);
  lockBody(true);
}
async function checkout(){
  const btn = document.getElementById('checkoutBtn');
  if(btn){ btn.disabled = true; btn.innerText = '⏳...'; }
  const items = cart.map(c => ({ name: c.name }));
  try{
    const d = await apiCall('/api/buy', {
      method: 'POST',
      body: JSON.stringify({ userId, items })
    });
    if(!d.ok) throw new Error(d.error || 'Error');
    gold = d.newGold;
    inv = d.newInv;
    cart = [];
    updateBal();
    updateCartBadge();
    document.getElementById('cartModal').remove();
    lockBody(false);
    rendInv();
    toast('✅ Куплено!', 'win');
  }catch(e){
    toast('❌ ' + e.message, 'lose');
    if(btn){ btn.disabled = false; btn.innerText = '✅ КУПИТЬ'; }
  }
}

async function submitWithdraw(name){
  const pattern = document.getElementById('wdPattern')?.value.trim();
  if(!/^\d{1,4}$/.test(pattern || '')) return toast('❌ Паттерн: число 0-9999', 'lose');
  const btn = document.getElementById('wdBtn');
  if(btn){ btn.disabled = true; btn.innerText = '⏳...'; }
  try{
    const d = await apiCall('/api/withdraw', {
      method: 'POST',
      body: JSON.stringify({ userId, skinName: name, pattern })
    });
    if(!d.ok) throw new Error(d.error || 'Error');
    inv = inv.filter(it => it.name !== name);
    document.getElementById('wdModal').remove();
    lockBody(false);
    rendInv();
    toast('✅ Заявка создана', 'win');
  }catch(e){
    toast('❌ ' + e.message, 'lose');
    if(btn){ btn.disabled = false; btn.innerText = '✅ ОТПРАВИТЬ'; }
  }
}

// ==================== LIVE ====================
let liveRetries = 0;
async function loadLiveFeed(){
  const track = document.getElementById('liveTrack');
  if(!track) return;
  try{
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 8000);
    const r = await fetch(BOT_URL + '/api/live', { signal: ctrl.signal });
    clearTimeout(to);
    const d = await r.json();
    const list = d.list || [];
    if(!Array.isArray(list) || list.length === 0){
      track.innerHTML = '<span class="live-empty">Пока нет рекордов</span>';
      return;
    }
    const items = list.slice(0, 20).map(x =>
      '<div class="live-item"><div><div class="live-name">' + (x.playerName || 'Игрок') + '</div><div class="live-pct">' + (x.pct || 0) + '%</div></div>' + (x.skinImg ? '<img src="' + x.skinImg + '" class="live-skin" onerror="this.style.display=\'none\'">' : '') + '</div>'
    ).join('');
    track.innerHTML = items + items;
    liveRetries = 0;
  }catch(e){
    console.error('LIVE', e);
    liveRetries++;
    track.innerHTML = '<span class="live-empty">' + (liveRetries >= 3 ? 'Сервер недоступен' : 'Загрузка...') + '</span>';
  }
}
setInterval(loadLiveFeed, 30000);
