<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>StandFliutApap</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh;overflow-y:auto;overflow-x:hidden;user-select:none;position:relative;padding-bottom:70px}
body::before{content:'StandFliutApap';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-size:60px;font-weight:900;color:rgba(255,255,255,0.04);white-space:nowrap;z-index:0;pointer-events:none}
.top{background:#0f0f1a;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2a4e;position:relative;z-index:1}
.acc{display:flex;align-items:center;gap:8px;cursor:pointer}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7b61ff,#4a3aff);display:flex;justify-content:center;align-items:center;font-size:15px;border:2px solid #9b8aff}
.nick{font-size:12px;font-weight:600}
.bal{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:#ffd700}
.plus{background:linear-gradient(135deg,#7b61ff,#4a3aff);color:#fff;border:none;width:24px;height:24px;border-radius:50%;font-size:16px;font-weight:700;cursor:pointer;margin-left:6px}
.set{background:none;border:none;color:#7b61ff;font-size:20px;cursor:pointer;margin-left:8px}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:12px;position:relative;z-index:1;min-height:100vh}
.skins{display:flex;justify-content:space-between;width:100%;gap:10px;margin-bottom:10px}
.slot{flex:1;background:#12121f;border:2px solid #2a2a4e;border-radius:14px;padding:10px;text-align:center;min-height:110px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.slot .si{font-size:40px;margin-bottom:6px}
.slot .sn{font-size:11px;font-weight:600}
.slot .sl{font-size:9px;color:#888;margin-top:2px}
.slot .spr{font-size:11px;color:#4CAF50;margin-top:4px;font-weight:700}
.wheel-box{position:relative;width:280px;height:280px;margin:10px 0}
.wheel{width:100%;height:100%;border-radius:50%;background:conic-gradient(from 180deg,#ffd700 0deg, #ff8c00 var(--wa,90deg), #0a0a0f var(--wa,90deg) 360deg);border:8px solid #2a2a4e;position:relative;display:flex;justify-content:center;align-items:center;transition:background 0.8s ease}
.pt{font-size:36px;font-weight:900;color:#ffd700;z-index:2}
.pl{position:absolute;bottom:35%;font-size:12px;color:#aaa;z-index:2}
.arrow{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:20px solid #ffd700;filter:drop-shadow(0 0 10px rgba(255,215,0,.9));z-index:10}
.ubtn{width:100%;background:linear-gradient(135deg,#7b61ff,#4a3aff);color:#fff;border:none;padding:14px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;margin-top:10px}
.ubtn:disabled{background:#2a2a4e;color:#666;cursor:not-allowed}
.pcnt{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%;margin-top:10px}
.pb{background:#12121f;border:2px solid #2a2a4e;border-radius:10px;padding:10px 4px;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.pb.sel{border-color:#7b61ff;background:rgba(123,97,255,.15)}
.pb.gray{color:#666;border-color:#1a1a2e}
.mult{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;margin-top:6px}
.mb{background:#12121f;border:2px solid #2a2a4e;border-radius:10px;padding:8px;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.mb.sel{border-color:#7b61ff;background:rgba(123,97,255,.15)}
.mb.gray{color:#666;border-color:#1a1a2e;cursor:not-allowed}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0f0f1a;padding:8px;display:flex;justify-content:space-around;border-top:1px solid #2a2a4e;z-index:100}
.nb{background:none;border:none;color:#666;font-size:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 10px;border-radius:10px}
.nb .ic{font-size:20px}
.scr{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0f;z-index:50;flex-direction:column;overflow-y:auto;padding-bottom:70px}
.scr.open{display:flex}
.sh{padding:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2a4e;background:#0f0f1a;position:sticky;top:0;z-index:1}
.sh h2{color:#7b61ff;font-size:16px}
.cb{background:none;border:none;color:#7b61ff;font-size:20px;cursor:pointer}
.sb{flex:1;overflow-y:auto;padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#12121f;border:1px solid #2a2a4e;border-radius:10px;margin-bottom:8px}
.row label{font-size:13px}
.row input[type=text]{background:#0a0a0f;border:1px solid #2a2a4e;color:#fff;padding:7px 10px;border-radius:7px;font-size:13px;width:100px}
.ph{text-align:center;padding:18px;background:#12121f;border-radius:14px;margin-bottom:14px}
.pa{font-size:50px;margin-bottom:8px}
.pn{font-size:18px;font-weight:700;margin-bottom:4px}
.pr{font-size:13px;color:#ffd700;font-weight:600}
.al{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.ao{font-size:24px;text-align:center;padding:8px;background:#12121f;border:2px solid #2a2a4e;border-radius:10px;cursor:pointer}
.admin-panel{background:#1a0a0a;border:2px solid #ff4444;border-radius:12px;padding:12px;margin-bottom:10px}
.admin-panel h3{color:#ff4444;font-size:14px;margin-bottom:8px}
.admin-panel .row{background:#2a0a0a;border-color:#ff4444}
.admin-panel input[type=text]{width:80px}
.case{background:#12121f;border:2px solid #2a2a4e;border-radius:12px;padding:12px;text-align:center;margin-bottom:10px}
.case .ci{font-size:50px}
.case .cn{font-size:14px;font-weight:600;margin-top:6px}
.case .cp{font-size:12px;color:#ffd700;margin-top:4px}
.case .cr{font-size:11px;color:#888;margin-top:4px}
.inv-tabs{display:flex;gap:8px;width:100%;padding:10px 0;position:sticky;top:0;background:#0a0a0f;z-index:20}
.inv-tab{flex:1;padding:14px;background:#12121f;border:2px solid #2a2a4e;border-radius:12px;color:#888;font-weight:700;font-size:14px;cursor:pointer;text-align:center}
.inv-tab.active{background:#ffd700;color:#1a1a2e;border-color:#ffd700}
.inv-search{display:flex;align-items:center;gap:8px;background:#12121f;border:1px solid #2a2a4e;border-radius:10px;padding:10px;margin-bottom:10px;width:100%}
.inv-search input{flex:1;background:none;border:none;color:#fff;font-size:13px;outline:none}
.inv-empty{text-align:center;padding:60px 20px;color:#666}
.inv-empty .icon{font-size:60px;margin-bottom:10px}
.inv-empty .title{font-size:18px;font-weight:700;color:#aaa}
.inv-empty .sub{font-size:12px;color:#666;margin-top:5px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.card{background:#12121f;border:1px solid #2a2a4e;border-radius:12px;padding:10px;text-align:center;cursor:pointer;transition:all .2s}
.card:active{transform:scale(.97);border-color:#7b61ff}
.card .icon{font-size:32px;margin-bottom:6px}
.card .name{font-size:11px;font-weight:600;line-height:1.2}
.card .price{font-size:11px;color:#ffd700;margin-top:4px;font-weight:700}
.card .buy{background:linear-gradient(135deg,#7b61ff,#4a3aff);color:#fff;border:none;padding:6px 10px;border-radius:12px;font-size:10px;font-weight:700;margin-top:6px;cursor:pointer;width:100%}
.card .buy:disabled{background:#2a2a4e;color:#666}
.footer-block{background:#12121f;border:1px solid #2a2a4e;border-radius:12px;padding:16px;margin-top:20px;text-align:center;width:100%}
.footer-block .ft-title{font-size:14px;font-weight:700;color:#7b61ff;margin-bottom:8px}
.footer-block .ft-sub{font-size:12px;color:#888;margin-bottom:12px}
.footer-block .ft-btn{display:inline-block;background:linear-gradient(135deg,#7b61ff,#4a3aff);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;text-decoration:none;margin:4px}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.9);background:#0f0f1a;border:2px solid #7b61ff;border-radius:16px;padding:20px 30px;color:#fff;font-size:15px;font-weight:700;z-index:999;opacity:0;pointer-events:none;transition:all .3s;box-shadow:0 0 40px rgba(123,97,255,.5);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast.win{border-color:#4CAF50;box-shadow:0 0 40px rgba(76,175,80,.5)}
.toast.lose{border-color:#ff4444;box-shadow:0 0 40px rgba(255,68,68,.5)}
.confetti{position:fixed;width:10px;height:10px;background:#ffd700;z-index:998;pointer-events:none;animation:fall 3s linear forwards}
@keyframes fall{0%{transform:translateY(-100vh) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="top">
<div class="acc" onclick="openS('profileScreen')">
<div class="av" id="topAv">👤</div>
<div class="nick" id="nick">Игрок</div>
</div>
<div style="display:flex;align-items:center">
<div class="bal"><span>⭐</span><span id="gold">20000</span></div>
<button class="plus" onclick="openS('shopScreen')">+</button>
<button class="set" onclick="openS('settingsScreen')">☰</button>
</div>
</div>
<div class="main">
<div class="skins">
<div class="slot" id="leftSlot"><div class="si">❓</div><div class="sn">Мой скин</div><div class="sl">Выбери в инвентаре</div></div>
<div class="slot" id="rightSlot"><div class="si">❓</div><div class="sn">Хочу получить</div><div class="sl">Выбери процент</div></div>
</div>
<div class="wheel-box">
<div class="arrow" id="arrow"></div>
<div class="wheel" id="wheel"><div class="pt" id="pt">?%</div><div class="pl">средний шанс</div></div>
</div>
<button class="ubtn" id="upgradeBtn" onclick="spinUpgrade()" disabled>⬆️ ПРОКАЧАТЬ</button>
<div class="pcnt" id="pcntList"></div>
<div class="mult">
<button class="mb gray" onclick="setMulti(2)">x2</button>
<button class="mb gray" onclick="setMulti(4)">x4</button>
<button class="mb gray" onclick="setMulti(5)">x5</button>
<button class="mb gray" onclick="setMulti(10)">x10</button>
</div>
<div class="inv-tabs">
<div class="inv-tab active" onclick="switchInv('inv')">🎒 Инвентарь</div>
<div class="inv-tab" onclick="switchInv('shop')">🛒 Магазин</div>
</div>
<div class="inv-search"><span>🔍</span><input type="text" placeholder="Поиск..." id="invSearch" oninput="rendInv()"></div>
<div id="invList"></div>
<div class="footer-block">
<div class="ft-title">🏢 Моя компания</div>
<div class="ft-sub">StandFliutApap — торговая площадка скинов</div>
<a href="https://t.me/Hak2ud" class="ft-btn">💬 Связь с поддержкой</a>
</div>
</div>
<div class="bottom">
<button class="nb" onclick="spinUpgradeFast()"><span class="ic">⚡</span><span>Быстро</span></button>
<button class="nb" onclick="openS('casesScreen')"><span class="ic">📦</span><span>Кейсы</span></button>
<button class="nb" onclick="openS('tasksScreen')"><span class="ic">📋</span><span>Задания</span></button>
</div>
<div class="scr" id="profileScreen">
<div class="sh"><h2>👤 Профиль</h2><button class="cb" onclick="closeS('profileScreen')">✕</button></div>
<div class="sb">
<div class="ph"><div class="pa" id="pAv">👤</div><div class="pn" id="pName">Игрок</div><div class="pr" id="pRank">Новичок</div></div>
<div style="color:#7b61ff;font-size:13px;margin-bottom:8px">Аватарка:</div>
<div class="al" id="avList"></div>
<div style="margin-top:16px;color:#888;font-size:12px;">Баланс: <span id="profileBal" style="color:#ffd700;font-weight:700;">0</span></div>
</div>
</div>
<div class="scr" id="casesScreen">
<div class="sh"><h2>📦 Кейсы</h2><button class="cb" onclick="closeS('casesScreen')">✕</button></div>
<div class="sb" id="casesBody"></div>
</div>
<div class="scr" id="tasksScreen">
<div class="sh"><h2>📋 Задания</h2><button class="cb" onclick="closeS('tasksScreen')">✕</button></div>
<div class="sb" id="tasksBody"></div>
</div>
<div class="scr" id="settingsScreen">
<div class="sh"><h2>⚙️ Настройки</h2><button class="cb" onclick="closeS('settingsScreen')">✕</button></div>
<div class="sb">
<div class="row"><label>Имя</label><input type="text" id="nameIn" value="Игрок" onchange="changeName()"></div>
<div class="row"><label>Купон</label><input type="text" placeholder="Купон" id="couponIn"><button class="bb" onclick="applyCoupon()">ОК</button></div>
<div class="admin-panel">
<h3>👑 АДМИН</h3>
<div class="row"><label>Вкл. подкрутку</label><input type="checkbox" id="adminToggle" onchange="adminToggleFunc()"></div>
<div class="row"><label>Процент выигрыша</label><input type="text" id="adminChance" placeholder="90"></div>
<div class="row"><label>Выдать голду</label><input type="text" id="adminGold" placeholder="1000"><button class="bb" onclick="adminGiveGold()">ОК</button></div>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
let gold=20000,isSpinning=false,curAv='👤',selItem=null,selPct=null,adminChance=null,adminAlwaysWin=false,multi=1;
let stats={spins:0,wins:0,loses:0};
let inv=[];
let invMode='inv';
const pcts=[90,67,55,44,33,22];
const avatars=['👤','🐺','🦁','🐉','👑','💀','🔥','⚡','🎯','💎'];
const allSkins=[
{name:'AKR «Ржавый»',icon:'🔫',price:50,color:'#888'},
{name:'AKR «Синий»',icon:'🔫',price:100,color:'#4a9eff'},
{name:'AKR «Красный»',icon:'🔫',price:200,color:'#ff4444'},
{name:'AKR «Фиолетовый»',icon:'🔫',price:500,color:'#9b8aff'},
{name:'AKR «Золотой»',icon:'🔫',price:1000,color:'#ffd700'},
{name:'AKR «Легендарный»',icon:'🔫',price:5000,color:'#ff00ff'},
{name:'M4A1 «Ворон»',icon:'🔫',price:50,color:'#888'},
{name:'M4A1 «Лёд»',icon:'🔫',price:100,color:'#4a9eff'},
{name:'M4A1 «Огонь»',icon:'🔫',price:200,color:'#ff4444'},
{name:'M4A1 «Фиолет»',icon:'🔫',price:500,color:'#9b8aff'},
{name:'M4A1 «Золото»',icon:'🔫',price:1000,color:'#ffd700'},
{name:'AWM «Хищник»',icon:'🎯',price:50,color:'#888'},
{name:'AWM «Пустыня»',icon:'🎯',price:100,color:'#c2a878'},
{name:'AWM «Лёд»',icon:'🎯',price:200,color:'#4a9eff'},
{name:'AWM «Фиолет»',icon:'🎯',price:500,color:'#9b8aff'},
{name:'Нож «Тень»',icon:'🔪',price:50,color:'#888'},
{name:'Нож «Золото»',icon:'🔪',price:1000,color:'#ffd700'},
{name:'Перчатки «Боец»',icon:'🧤',price:200,color:'#888'},
{name:'Перчатки «Золото»',icon:'🧤',price:1000,color:'#ffd700'}
];
const cases=[
{name:'Обычный кейс',icon:'📦',price:100,chances:{legendary:5,red:10,epic:20,blue:20,uncommon:45}},
{name:'Редкий кейс',icon:'🎁',price:500,chances:{legendary:10,red:20,epic:30,blue:20,uncommon:20}},
{name:'Легендарный кейс',icon:'💎',price:2000,chances:{legendary:30,red:30,epic:20,blue:10,uncommon:10}}
];
const tasks=[
{name:'Первый спин',done:false,reward:10},
{name:'10 спинов',done:false,reward:50},
{name:'Первый выигрыш',done:false,reward:20},
{name:'5 побед',done:false,reward:100},
{name:'Открыть кейс',done:false,reward:30}
];
function toast(msg,type){
const t=document.getElementById('toast');
t.className='toast '+(type||'')+' show';
t.innerText=msg;
setTimeout(()=>t.classList.remove('show'),2000);
}
function confetti(){
for(let i=0;i<50;i++){
const c=document.createElement('div');
c.className='confetti';
c.style.left=Math.random()*100+'%';
c.style.background=['#ffd700','#7b61ff','#4CAF50','#ff4444','#4a9eff'][Math.floor(Math.random()*5)];
c.style.animationDelay=Math.random()*0.5+'s';
document.body.appendChild(c);
setTimeout(()=>c.remove(),3500);
}
}
function sound(type){
try{
const ctx=new (window.AudioContext||window.webkitAudioContext)();
const o=ctx.createOscillator();
const g=ctx.createGain();
o.connect(g);g.connect(ctx.destination);
if(type==='win'){o.frequency.value=800;o.type='sine'}else{o.frequency.value=200;o.type='sawtooth'}
g.gain.setValueAtTime(0.1,ctx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);
o.start();o.stop(ctx.currentTime+0.3);
}catch(e){}
}
function updateBal(){document.getElementById('gold').innerText=gold;document.getElementById('profileBal').innerText=gold}
function openS(id){
if(id==='profileScreen')rendProf();
if(id==='casesScreen')rendCases();
if(id==='tasksScreen')rendTasks();
document.getElementById(id).classList.add('open');
}
function closeS(id){document.getElementById(id).classList.remove('open')}
function rendProf(){
document.getElementById('pAv').innerText=curAv;
document.getElementById('pName').innerText=document.getElementById('nick').innerText;
document.getElementById('avList').innerHTML=avatars.map(a=>`<div class="ao ${a===curAv?'sel':''}" onclick="setAv('${a}')">${a}</div>`).join('');
document.getElementById('profileBal').innerText=gold;
}
function setAv(a){curAv=a;document.getElementById('topAv').innerText=a;document.getElementById('pAv').innerText=a}
function switchInv(mode){
invMode=mode;
document.querySelectorAll('.inv-tab').forEach((t,i)=>{t.classList.toggle('active',i===(mode==='inv'?0:1))});
rendInv();
}
function rendInv(){
const b=document.getElementById('invList');
const q=document.getElementById('invSearch').value.toLowerCase();
if(invMode==='inv'){
const filtered=inv.filter(it=>it.name.toLowerCase().includes(q));
if(filtered.length===0){b.innerHTML='<div class="inv-empty"><div class="icon">📦</div><div class="title">Инвентарь пуст</div><div class="sub">У вас пока нет предметов</div></div>';return}
b.innerHTML='<div class="grid">'+filtered.map((it,i)=>`<div class="card" onclick="selI(${i})"><div class="icon">${it.icon}</div><div class="name">${it.name}</div><div class="price">${it.price||0} голды</div></div>`).join('')+'</div>';
}else{
const filtered=allSkins.filter(s=>s.name.toLowerCase().includes(q));
b.innerHTML='<div class="grid">'+filtered.map(s=>{
const can=gold>=s.price;
return `<div class="card"><div class="icon">${s.icon}</div><div class="name" style="color:${s.color}">${s.name}</div><div class="price">${s.price} голды</div><button class="buy" ${can?'':'disabled'} onclick="buySkin('${s.name}','${s.icon}',${s.price})">${can?'Купить':'Мало'}</button></div>`;
}).join('')+'</div>';
}
}
function buySkin(n,ic,p){
if(gold<p){toast('❌ Мало голды','lose');return}
gold-=p;inv.push({name:n,icon:ic,price:p});updateBal();rendInv();
toast('✅ Куплено: '+n+'\n- '+p+' голды','win');
sound('win');confetti();
}
function selI(i){selItem=inv[i];rendMain();toast('✅ Выбран: '+selItem.name,'win')}
function rendMain(){
if(!selItem){document.getElementById('leftSlot').innerHTML='<div class="si">❓</div><div class="sn">Мой скин</div><div class="sl">Выбери в инвентаре</div>'}
else{document.getElementById('leftSlot').innerHTML=`<div class="si">${selItem.icon}</div><div class="sn">${selItem.name}</div><div class="sl">Мой скин</div>`}
document.getElementById('rightSlot').innerHTML='<div class="si">❓</div><div class="sn">Хочу получить</div><div class="sl">Выбери процент</div>';
document.getElementById('pcntList').innerHTML=pcts.map(p=>`<button class="pb ${selItem?'':'gray'}" onclick="${selItem?`selP(${p})`:''}">${p}%</button>`).join('');
const mbBtns=document.querySelectorAll('.mb');
const canMulti = selItem && selPct!==null;
mbBtns.forEach(b=>{b.classList.toggle('gray',!canMulti)});
const btn=document.getElementById('upgradeBtn');
if(selItem&&selPct!==null){btn.disabled=false;btn.style.background='linear-gradient(135deg,#7b61ff,#4a3aff)'}
else{btn.disabled=true;btn.style.background='#2a2a4e'}
document.getElementById('pt').innerText=selPct===null?'?%':selPct.toFixed(1)+'%';
}
function selP(p){
selPct=p;
document.querySelectorAll('.pb').forEach(b=>{b.classList.remove('sel');if(b.innerText===p+'%')b.classList.add('sel')});
if(selItem){
const bonus = Math.round((selItem.price||0) * (p/100));
const total = Math.round((selItem.price||0) + bonus);
const available = allSkins.filter(s => s.price <= total).slice(0,3);
const names = available.map(s=>`<span style="color:${s.color}">${s.name}</span>`).join('<br>');
document.getElementById('rightSlot').innerHTML=`<div class="si">${selItem.icon}</div><div class="sn">${selItem.name}</div><div class="spr">+${bonus} голды</div><div class="sl">Итог: ${total} голды</div><div style="font-size:9px;color:#888;margin-top:6px;">Доступно:<br>${names||'—'}</div>`;
}
document.getElementById('pt').innerText=p.toFixed(1)+'%';
const wheel = document.getElementById('wheel');
const wa = (p/100)*360;
wheel.style.transition = 'background 0.8s ease';
wheel.style.setProperty('--wa', wa+'deg');
rendMain();
}
function setMulti(v){
if(!selItem || selPct===null){toast('❌ Сначала выбери скин и процент','lose');return}
multi=v;
document.querySelectorAll('.mb').forEach(b=>{b.classList.remove('sel');if(b.innerText==='x'+v)b.classList.add('sel')});
toast('✅ Множитель: x'+v,'win');
sound('win');
}
function spinUpgrade(){
if(!selItem){toast('❌ Выбери скин','lose');return}
if(selPct===null){toast('❌ Выбери процент','lose');return}
if(isSpinning)return;
isSpinning=true;
const a=document.getElementById('arrow');
a.style.transition='transform 6s cubic-bezier(0.15,0.6,0.3,1)';
a.style.transform=`translateX(-50%) rotate(1440deg)`;
setTimeout(()=>{
let ec=selPct;
if(gold<1000)ec=60;else ec=30;
if(adminChance!==null)ec=adminChance;
if(adminAlwaysWin)ec=100;
const roll=Math.floor(Math.random()*100)+1;
const win=roll<=ec;
stats.spins++;
if(win){
stats.wins++;
const bonus = Math.round((selItem.price||0) * (selPct/100)) * multi;
gold += bonus;updateBal();
toast('🎉 Улучшено! +'+bonus+' голды (x'+multi+')','win');
sound('win');confetti();
}else{
stats.loses++;
toast('😢 Сгорел! '+selItem.name,'lose');
sound('lose');
inv=inv.filter(i=>i!==selItem);
}
isSpinning=false;selItem=null;selPct=null;multi=1;
a.style.transition='none';a.style.transform='translateX(-50%) rotate(0deg)';
document.getElementById('wheel').style.setProperty('--wa','90deg');
document.querySelectorAll('.mb').forEach(b=>{b.classList.remove('sel');b.classList.add('gray')});
rendMain();rendInv();
},6000);
}
function spinUpgradeFast(){if(!selItem){toast('❌ Выбери скин','lose');return}if(selPct===null){toast('❌ Выбери процент','lose');return}spinUpgrade()}
function rendCases(){
const b=document.getElementById('casesBody');
b.innerHTML=cases.map((c,i)=>`<div class="case"><div class="ci">${c.icon}</div><div class="cn">${c.name}</div><div class="cp">${c.price} голды</div><div class="cr">🎰 ${c.chances.legendary}% / 🔴 ${c.chances.red}% / 🟣 ${c.chances.epic}% / 🔵 ${c.chances.blue}% / ⚪ ${c.chances.uncommon}%</div><button class="bb" style="margin-top:8px" onclick="openCase(${i})">Открыть</button></div>`).join('');
}
function openCase(i){
const c=cases[i];
if(gold<c.price){toast('❌ Мало голды','lose');return}
gold-=c.price;updateBal();
const roll=Math.floor(Math.random()*100)+1;
let skin;
if(roll<=c.chances.legendary)skin=allSkins.find(s=>s.color==='#ff00ff')||allSkins[0];
else if(roll<=c.chances.legendary+c.chances.red)skin=allSkins.find(s=>s.color==='#ff4444')||allSkins[0];
else if(roll<=c.chances.legendary+c.chances.red+c.chances.epic)skin=allSkins.find(s=>s.color==='#9b8aff')||allSkins[0];
else if(roll<=c.chances.legendary+c.chances.red+c.chances.epic+c.chances.blue)skin=allSkins.find(s=>s.color==='#4a9eff')||allSkins[0];
else skin=allSkins.find(s=>s.color==='#888')||allSkins[0];
inv.push({name:skin.name,icon:skin.icon,price:skin.price});
toast('📦 Выпало: '+skin.name,'win');
sound('win');confetti();
rendCases();
}
function rendTasks(){
const b=document.getElementById('tasksBody');
b.innerHTML=tasks.map((t,i)=>`<div class="it"><div class="ii"><span class="ic">📋</span><div><div class="nm">${t.name}</div><div class="pr">${t.done?'✅ Выполнено':'⏳ Не выполнено'}</div></div></div>${t.done?'':'<button class="bb" onclick="doneTask('+i+')">+'+t.reward+'</button>'}</div>`).join('');
}
function doneTask(i){if(tasks[i].done)return;tasks[i].done=true;gold+=tasks[i].reward;updateBal();rendTasks();toast('✅ +'+tasks[i].reward+' голды','win');sound('win');confetti()}
function adminGiveGold(){const v=parseInt(document.getElementById('adminGold').value);if(!isNaN(v)){gold+=v;updateBal();toast('✅ +'+v+' голды','win')}}
function adminToggleFunc(){adminAlwaysWin=document.getElementById('adminToggle').checked}
function applyCoupon(){const c=document.getElementById('couponIn').value.trim().toLowerCase();if(c==='flayy'){gold+=100;updateBal();toast('✅ Купон активирован!','win');sound('win');confetti()}else toast('❌ Неверный купон','lose')}
function changeName(){const n=document.getElementById('nameIn').value;document.getElementById('nick').innerText=n;document.getElementById('pName').innerText=n}
updateBal();rendMain();rendInv();
</script>
</body>
</html>
