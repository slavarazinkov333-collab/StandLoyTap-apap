<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>StandCraft Bot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: white;
            font-family: -apple-system, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .top-bar {
            background: #0f0f1a;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a4e;
        }
        .account { display: flex; align-items: center; gap: 10px; }
        .avatar {
            width: 34px; height: 34px; border-radius: 50%;
            background: linear-gradient(135deg, #7b61ff, #4a3aff);
            display: flex; justify-content: center; align-items: center;
            font-size: 16px; border: 2px solid #9b8aff;
        }
        .nickname { font-size: 13px; font-weight: 600; }
        .balance-item {
            display: flex; align-items: center; gap: 5px;
            font-size: 13px; font-weight: 700; color: #ffd700;
        }

        .center {
            flex: 1; display: flex; justify-content: center;
            align-items: center; flex-direction: column; padding: 20px;
        }
        .wheel-wrapper {
            position: relative; width: 300px; height: 300px;
            display: flex; justify-content: center; align-items: center;
        }
        .wheel {
            width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(
                #1a1a2e 0deg 45deg, #16162a 45deg 90deg,
                #1a1a2e 90deg 135deg, #16162a 135deg 180deg,
                #1a1a2e 180deg 225deg, #16162a 225deg 270deg,
                #1a1a2e 270deg 315deg, #16162a 315deg 360deg
            );
            border: 3px solid #7b61ff;
            box-shadow: 0 0 40px rgba(123, 97, 255, 0.4), inset 0 0 30px rgba(0,0,0,0.8);
            transition: transform 20s cubic-bezier(0.1, 0.7, 0.1, 1);
            display: flex; justify-content: center; align-items: center;
            position: relative;
        }
        .wheel::before {
            content: ''; position: absolute; width: 90%; height: 90%;
            border-radius: 50%; border: 2px dashed rgba(123, 97, 255, 0.4);
        }
        .wheel::after {
            content: ''; position: absolute; width: 70%; height: 70%;
            border-radius: 50%; border: 2px solid rgba(123, 97, 255, 0.3);
        }
        .wheel-center {
            width: 60px; height: 60px; border-radius: 50%;
            background: linear-gradient(135deg, #7b61ff, #4a3aff);
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; z-index: 2;
            box-shadow: 0 0 20px rgba(123, 97, 255, 0.8);
        }
        .arrow {
            position: absolute; top: -15px; left: 50%;
            transform: translateX(-50%);
            font-size: 45px; color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.9);
            z-index: 10;
        }

        .upgrade-btn {
            margin-top: 25px;
            background: linear-gradient(135deg, #7b61ff, #4a3aff);
            color: white; border: none;
            padding: 14px 50px; border-radius: 50px;
            font-weight: 700; font-size: 15px; cursor: pointer;
            box-shadow: 0 5px 20px rgba(123, 97, 255, 0.4);
            transition: all 0.2s;
        }
        .upgrade-btn:active { transform: scale(0.95); }

        .bottom-bar {
            background: #0f0f1a;
            padding: 10px 8px;
            display: flex; justify-content: space-around;
            border-top: 1px solid #2a2a4e;
        }
        .nav-btn {
            background: none; border: none; color: #666;
            font-size: 10px; cursor: pointer;
            display: flex; flex-direction: column;
            align-items: center; gap: 3px; padding: 6px 14px;
            transition: all 0.2s; border-radius: 10px;
        }
        .nav-btn .icon { font-size: 22px; }
        .nav-btn:active { background: rgba(123, 97, 255, 0.15); color: #7b61ff; }

        .screen {
            display: none; position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0a0a0f; z-index: 50; flex-direction: column;
        }
        .screen.open { display: flex; }
        .screen-header {
            padding: 16px; display: flex;
            justify-content: space-between; align-items: center;
            border-bottom: 1px solid #2a2a4e; background: #0f0f1a;
        }
        .screen-header h2 { color: #7b61ff; font-size: 17px; }
        .close-btn { background: none; border: none; color: #7b61ff; font-size: 22px; cursor: pointer; }
        .screen-body { flex: 1; overflow-y: auto; padding: 16px; }

        .item {
            background: #12121f; border: 1px solid #2a2a4e;
            border-radius: 12px; padding: 14px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: all 0.2s;
        }
        .item:active { border-color: #7b61ff; transform: scale(0.98); }
        .item-info { display: flex; align-items: center; gap: 12px; }
        .item-icon { font-size: 26px; }
        .item-name { font-size: 14px; font-weight: 600; }
        .item-price { font-size: 12px; color: #ffd700; }
        .buy-btn {
            background: linear-gradient(135deg, #7b61ff, #4a3aff);
            color: white; border: none; padding: 8px 16px;
            border-radius: 20px; font-weight: 600; font-size: 12px; cursor: pointer;
        }
        .buy-btn:disabled { background: #2a2a4e; color: #666; cursor: not-allowed; }

        /* ЭКРАН УЛУЧШЕНИЯ */
        .upgrade-layout {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .upgrade-skin {
            flex: 1;
            background: #12121f;
            border: 2px solid #2a2a4e;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
        .upgrade-skin .icon { font-size: 60px; margin-bottom: 10px; }
        .upgrade-skin .name { font-size: 14px; font-weight: 600; color: #fff; }
        .upgrade-skin .label { font-size: 11px; color: #888; margin-top: 5px; }

        .upgrade-wheel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .mini-wheel {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: conic-gradient(
                #4CAF50 0deg 180deg, #ff4444 180deg 360deg
            );
            border: 3px solid #7b61ff;
            box-shadow: 0 0 30px rgba(123, 97, 255, 0.4);
            transition: transform 8s cubic-bezier(0.1, 0.7, 0.1, 1);
            position: relative;
        }
        .mini-wheel .arrow-small {
            position: absolute;
            top: -12px; left: 50%;
            transform: translateX(-50%);
            font-size: 24px; color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.9);
            z-index: 5;
        }

        .percent-list {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 10px; margin-top: 20px;
        }
        .percent-btn {
            background: #12121f; border: 2px solid #2a2a4e;
            border-radius: 12px; padding: 14px; color: white;
            font-size: 16px; font-weight: 700; cursor: pointer;
            transition: all 0.2s;
        }
        .percent-btn:active { border-color: #7b61ff; }
        .percent-btn.selected { border-color: #7b61ff; background: rgba(123, 97, 255, 0.15); }

        .result { text-align: center; padding: 30px; }
        .result .big-icon { font-size: 70px; margin-bottom: 20px; }
        .result .title { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
        .result .subtitle { font-size: 14px; color: #888; }
        .result.win .title { color: #4CAF50; }
        .result.lose .title { color: #ff4444; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="account">
            <div class="avatar">👤</div>
            <div class="nickname">Игрок</div>
        </div>
        <div class="balance-item">
            <span>⭐</span><span id="gold">4000</span>
        </div>
    </div>

    <div class="center">
        <div class="wheel-wrapper">
            <div class="arrow">▼</div>
            <div class="wheel" id="wheel">
                <div class="wheel-center">🎰</div>
            </div>
        </div>
        <button class="upgrade-btn" onclick="openScreen('upgradeScreen')">⬆️ УЛУЧШИТЬ</button>
    </div>

    <div class="bottom-bar">
        <button class="nav-btn" onclick="openScreen('inventoryScreen')">
            <span class="icon">🎒</span><span>Инвентарь</span>
        </button>
        <button class="nav-btn" onclick="openScreen('shopScreen')">
            <span class="icon">🛒</span><span>Магазин</span>
        </button>
        <button class="nav-btn" onclick="openScreen('upgradeScreen')">
            <span class="icon">⬆️</span><span>Прокачать</span>
        </button>
    </div>

    <div class="screen" id="shopScreen">
        <div class="screen-header">
            <h2>🛒 Магазин</h2>
            <button class="close-btn" onclick="closeScreen('shopScreen')">✕</button>
        </div>
        <div class="screen-body" id="shopBody"></div>
    </div>

    <div class="screen" id="inventoryScreen">
        <div class="screen-header">
            <h2>🎒 Инвентарь</h2>
            <button class="close-btn" onclick="closeScreen('inventoryScreen')">✕</button>
        </div>
        <div class="screen-body" id="inventoryBody"></div>
    </div>

    <div class="screen" id="upgradeScreen">
        <div class="screen-header">
            <h2>⬆️ Улучшение скина</h2>
            <button class="close-btn" onclick="closeScreen('upgradeScreen')">✕</button>
        </div>
        <div class="screen-body">
            <div class="upgrade-layout">
                <div class="upgrade-skin" id="skinPreview">
                    <div class="icon">🔫</div>
                    <div class="name">AKR «Дракон»</div>
                    <div class="label">Твой скин</div>
                </div>
                <div class="upgrade-wheel">
                    <div class="mini-wheel" id="miniWheel">
                        <div class="arrow-small">▼</div>
                    </div>
                </div>
            </div>

            <div style="text-align:center; color:#7b61ff; font-size:14px; margin-top:10px;">
                Выбери шанс улучшения:
            </div>
            <div class="percent-list" id="percentList"></div>
            <button class="upgrade-btn" style="width:100%; margin-top:20px;" onclick="confirmUpgrade()">🎰 КРУТИТЬ</button>
        </div>
    </div>

    <div class="screen" id="resultScreen">
        <div class="screen-header">
            <h2>Результат</h2>
            <button class="close-btn" onclick="closeScreen('resultScreen')">✕</button>
        </div>
        <div class="screen-body">
            <div class="result" id="resultContent"></div>
        </div>
    </div>

    <script>
        let gold = 4000;
        let isSpinning = false;
        let inventory = [
            { id: 'akr', name: 'AKR «Дракон»', icon: '🔫' },
            { id: 'm4', name: 'M4A1 «Ворон»', icon: '🔫' },
            { id: 'awm', name: 'AWM «Хищник»', icon: '🎯' },
            { id: 'knife', name: 'Нож «Тень»', icon: '🔪' },
        ];
        let selectedItem = null;
        let selectedPercent = null;

        const percents = [90, 67, 55, 44, 33, 22];

        function updateBalance() {
            document.getElementById('gold').innerText = gold;
        }

        function openScreen(id) {
            if (id === 'shopScreen') renderShop();
            if (id === 'inventoryScreen') renderInventory();
            if (id === 'upgradeScreen') renderUpgradeScreen();
            document.getElementById(id).classList.add('open');
        }

        function closeScreen(id) {
            document.getElementById(id).classList.remove('open');
        }

        function renderShop() {
            const body = document.getElementById('shopBody');
            body.innerHTML = '';
            const shopItems = [
                { id: 'akr2', name: 'AKR «Огонь»', icon: '🔫', price: 500 },
                { id: 'm42', name: 'M4A1 «Лёд»', icon: '🔫', price: 400 },
                { id: 'awm2', name: 'AWM «Пустыня»', icon: '🎯', price: 800 },
                { id: 'knife2', name: 'Нож «Золото»', icon: '🔪', price: 1000 },
            ];
            shopItems.forEach(item => {
                const canBuy = gold >= item.price;
                body.innerHTML += `
                    <div class="item" onclick="buyItem('${item.id}', '${item.name}', '${item.icon}', ${item.price})">
                        <div class="item-info">
                            <span class="item-icon">${item.icon}</span>
                            <div>
                                <div class="item-name">${item.name}</div>
                                <div class="item-price">${item.price} голды</div>
                            </div>
                        </div>
                        <button class="buy-btn" ${canBuy ? '' : 'disabled'}>${canBuy ? 'Купить' : 'Мало'}</button>
                    </div>
                `;
            });
        }

        function buyItem(id, name, icon, price) {
            if (gold < price) return;
            gold -= price;
            inventory.push({ id, name, icon });
            updateBalance();
            renderShop();
            alert(`✅ Куплено: ${name}`);
        }

        function renderInventory() {
            const body = document.getElementById('inventoryBody');
            if (inventory.length === 0) {
                body.innerHTML = '<p style="color:#888;text-align:center;">Инвентарь пуст.</p>';
            } else {
                body.innerHTML = inventory.map((item, index) => `
                    <div class="item" onclick="selectItem(${index})">
                        <div class="item-info">
                            <span class="item-icon">${item.icon}</span>
                            <div>
                                <div class="item-name">${item.name}</div>
                                <div class="item-price">Нажми, чтобы улучшить</div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        }

        function selectItem(index) {
            selectedItem = inventory[index];
            closeScreen('inventoryScreen');
            openScreen('upgradeScreen');
        }

        function renderUpgradeScreen() {
            if (!selectedItem) {
                document.getElementById('skinPreview').innerHTML = `
                    <div class="icon">❓</div>
                    <div class="name">Скин не выбран</div>
                    <div class="label">Выбери скин в инвентаре</div>
                `;
            } else {
                document.getElementById('skinPreview').innerHTML = `
                    <div class="icon">${selectedItem.icon}</div>
                    <div class="name">${selectedItem.name}</div>
                    <div class="label">Твой скин</div>
                `;
            }
            const list = document.getElementById('percentList');
            list.innerHTML = '';
            percents.forEach(p => {
                list.innerHTML += `<button class="percent-btn" onclick="selectPercent(${p})">${p}%</button>`;
            });
        }

        function selectPercent(p) {
            selectedPercent = p;
            document.querySelectorAll('.percent-btn').forEach(btn => {
                btn.classList.remove('selected');
                if (btn.innerText === p + '%') btn.classList.add('selected');
            });
        }

        function confirmUpgrade() {
            if (!selectedItem) {
                alert('Выбери скин в инвентаре!');
                return;
            }
            if (!selectedPercent) {
                alert('Выбери процент!');
                return;
            }
            spinUpgrade();
        }

        function spinUpgrade() {
            if (isSpinning) return;
            isSpinning = true;

            const miniWheel = document.getElementById('miniWheel');
            const randomDegree = Math.floor(Math.random() * 360) + 1440;
            miniWheel.style.transition = 'transform 8s cubic-bezier(0.1, 0.7, 0.1, 1)';
            miniWheel.style.transform = `rotate(${randomDegree}deg)`;

            setTimeout(() => {
                const chance = selectedPercent;
                const roll = Math.floor(Math.random() * 100) + 1;
                const win = roll <= chance;

                if (win) {
                    gold += 200;
                    updateBalance();
                    showResult(true, `🎉 Улучшено!`, `${selectedItem.name} стал новым! +200 голды`);
                } else {
                    showResult(false, `😢 Сгорел!`, `${selectedItem.name} потерян.`);
                    inventory = inventory.filter(i => i !== selectedItem);
                }

                isSpinning = false;
                selectedPercent = null;
                selectedItem = null;
                closeScreen('upgradeScreen');
            }, 8000);
        }

        function showResult(win, title, subtitle) {
            const content = document.getElementById('resultContent');
            content.className = 'result ' + (win ? 'win' : 'lose');
            content.innerHTML = `
                <div class="big-icon">${win ? '🎉' : '😢'}</div>
                <div class="title">${title}</div>
                <div class="subtitle">${subtitle}</div>
            `;
            openScreen('resultScreen');
        }

        updateBalance();
    </script>

</body>
</html>
