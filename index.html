<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>StandFliutApap</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh;overflow-y:auto;overflow-x:hidden;user-select:none;position:relative}
body::before{content:'StandFliutApap';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-size:60px;font-weight:900;color:rgba(255,255,255,0.04);white-space:nowrap;z-index:0;pointer-events:none}
.top{background:#0f0f1a;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2a4e;position:relative;z-index:1}
.acc{display:flex;align-items:center;gap:8px;cursor:pointer}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7b61ff,#4a3aff);display:flex;justify-content:center;align-items:center;font-size:15px;border:2px solid #9b8aff}
.nick{font-size:12px;font-weight:600}
.bal{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:#ffd700}
.plus{background:linear-gradient(135deg,#7b61ff,#4a3aff);color:#fff;border:none;width:24px;height:24px;border-radius:50%;font-size:16px;font-weight:700;cursor:pointer;margin-left:6px}
.set{background:none;border:none;color:#7b61ff;font-size:20px;cursor:pointer;margin-left:8px}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:12px;position:relative;z-index:1;min-height:100vh}
.skins{display:flex;justify-content:space-between;width:100%;gap:10px;margin-bottom:10px}
.slot{flex:1;background:#12121f;border:2px solid #2a2a4e;border-radius:14px;padding:10px;text-align:center;min-height:110px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.slot .si{font-size:40px;margin-bottom:6px}
.slot .sn{font-size:11px;font-weight:600}
.slot .sl{font-size:9px;color:#888;margin-top:2px}
.wheel-box{position:relative;width:280px;height:280px;margin:10px 0}
.wheel{width:100%;height:100%;border-radius:50%;background:conic-gradient(from 180deg,#ffd700 0deg var(--wa,90deg),#0a0a0f var(--wa,90deg) 360deg);border:8px solid #2a2a4e;position:relative;display:flex;justify-content:center;align-items:center}
.pt{font-size:36px;font-weight:900;color:#ffd700;z-index:2}
.pl{position:absolute;bottom:35%;font-size:12px;color:#aaa;z-index:2}
.arrow{position:absolute;top:0;left:50%;transform-origin:center 140px;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:20px solid #ffd700;filter:drop-shadow(0 0 10px rgba(255,215,0,.9));z-index:10}
.ubtn{width:100%;background:linear-gradient(135deg,#7b61ff,#4a3aff);color:#fff;border:none;padding:14px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;margin-top:10px}
.ubtn:disabled{background:#2a2a4e;color:#666;cursor:not-allowed}
.pcnt{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%;margin-top:10px}
.pb{background:#12121f;border:2px solid #2a2a4e;border-radius:10px;padding:10px 4px;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.pb.sel{border-color:#7b61ff;background:rgba(123,97,255,.15)}
.pb.gray{color:#666;border-color:#1a1a2e}
.bottom{background:#0f0f1a;padding:8px;display:flex;justify-content:space-around;border-top:1px solid #2a2a4e;position:relative;z-index:1}
.nb{background:none;border:none;color:#666;font-size:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 10px;border-radius:10px}
.nb .ic{font-size:20px}
.scr{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0f;z-index:50;flex-direction:column;overflow-y:auto}
.scr.open{display:flex}
.sh{padding:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2a4e;background:#0f0f1a;position:sticky;top:0;z-index:1}
.sh h2{color:#7b61ff;font-size:16px}
.cb{background:none;border:none;color:#7b61ff;font-size:20px;cursor:pointer}
.sb{flex:1;overflow-y:auto;padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#12121f;border:1px solid #2a2a4e;border-radius:10px;margin-bottom:8px}
.row label{font-size:13px}
.row input[type=text]{background:#0a0a0f;border:1px solid #2a2a4e;color:#fff;padding:7px 10px;border-radius:7px;font-size:13px;width:130px}
.res{text-align:center;padding:24px}
.res .bi{font-size:60px;margin-bottom:16px}
.res .t{font-size:20px;font-weight:700;margin-bottom:8px}
.res .s{font-size:13px;color:#888}
.res.win .t{color:#4CAF50}
.res.lose .t{color:#ff4444}
.ph{text-align:center;padding:18px;background:#12121f;border-radius:14px;margin-bottom:14px}
.pa{font-size:50px;margin-bottom:8px}
.pn{font-size:18px;font-weight:700;margin-bottom:4px}
.pr{font-size:13px;color:#ffd700;font-weight:600}
.al{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.ao{font-size:24px;text-align:center;padding:8px;background:#12121f;border:2px solid #2a2a4e;border-radius:10px;cursor:pointer}
.it{background:#12121f;border:1px solid #2a2a4e;border-radius:10px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.it .ii{display:flex;align-items:center;gap:10px}
.it .ic{font-size:22px}
.it .nm{font-size:13px;font-weight:600}
.it .pr{font-size:11px;color:#ffd700}
.bb{background:linear-gradient(135deg,#7b61ff,#4a3aff);color:#fff;border:none;padding:7px 14px;border-radius:18px;font-weight:600;font-size:11px;cursor:pointer}
.admin-panel{background:#1a0a0a;border:2px solid #ff4444;border-radius:12px;padding:12px;margin-bottom:10px}
.admin-panel h3{color:#ff4444;font-size:14px;margin-bottom:8px}
.admin-panel .row{background:#2a0a0a;border-color:#ff4444}
.admin-panel input[type=text]{width:80px}
.case{background:#12121f;border:2px solid #2a2a4e;border-radius:12px;padding:12px;text-align:center;margin-bottom:10px}
.case .ci{font-size:50px}
.case .cn{font-size:14px;font-weight:600;margin-top:6px}
.case .cp{font-size:12px;color:#ffd700;margin-top:4px}
.case .cr{font-size:11px;color:#888;margin-top:4px}
</style>
</head>
<body>
<div class="top">
<div class="acc" onclick="openS('profileScreen')">
<div class="av" id="topAv">👤</div>
<div class="nick" id="nick">Игрок</div>
</div>
<div style="display:flex;align-items:center">
<div class="bal"><span>⭐</span><span id="gold">20000</span></div>
<button class="plus" onclick="openS('shopScreen')">+</button>
<button class="set" onclick="openS('settingsScreen')">☰</button>
</div>
</div>

<div class="main">
<div class="skins">
<div class="slot" id="leftSlot"><div class="si">❓</div><div class="sn">Мой скин</div><div class="sl">Выбери в инвентаре</div></div>
<div class="slot" id="rightSlot"><div class="si">❓</div><div class="sn">Хочу получить</div><div class="sl">Выбери процент</div></div>
</div>
<div class="wheel-box">
<div class="arrow" id="arrow"></div>
<div class="wheel" id="wheel"><div class="pt" id="pt">?%</div><div class="pl">средний шанс</div></div>
</div>
<button class="ubtn" id="upgradeBtn" onclick="spinUpgrade()" disabled>⬆️ ПРОКАЧАТЬ</button>
<div class="pcnt" id="pcntList"></div>
</div>

<div class="bottom">
<button class="nb" onclick="openS('inventoryScreen')"><span class="ic">🎒</span><span>Инвентарь</span></button>
<button class="nb" onclick="spinUpgradeFast()"><span class="ic">⚡</span><span>Быстро</span></button>
<button class="nb" onclick="openS('casesScreen')"><span class="ic">📦</span><span>Кейсы</span></button>
<button class="nb" onclick="openS('tasksScreen')"><span class="ic">📋</span><span>Задания</span></button>
</div>

<div class="scr" id="profileScreen">
<div class="sh"><h2>👤 Профиль</h2><button class="cb" onclick="closeS('profileScreen')">✕</button></div>
<div class="sb">
<div class="ph"><div class="pa" id="pAv">👤</div><div class="pn" id="pName">Игрок</div><div class="pr" id="pRank">Новичок</div></div>
<div style="color:#7b61ff;font-size:13px;margin-bottom:8px">Аватарка:</div>
<div class="al" id="avList"></div>
<div style="margin-top:16px;color:#888;font-size:12px;">Баланс: <span id="profileBal" style="color:#ffd700;font-weight:700;">0</span></div>
</div>
</div>

<div class="scr" id="shopScreen">
<div class="sh"><h2>🛒 Магазин</h2><button class="cb" onclick="closeS('shopScreen')">✕</button></div>
<div class="sb" id="shopBody"></div>
</div>

<div class="scr" id="inventoryScreen">
<div class="sh"><h2>🎒 Инвентарь</h2><button class="cb" onclick="closeS('inventoryScreen')">✕</button></div>
<div class="sb" id="invBody"></div>
</div>

<div class="scr" id="casesScreen">
<div class="sh"><h2>📦 Кейсы</h2><button class="cb" onclick="closeS('casesScreen')">✕</button></div>
<div class="sb" id="casesBody"></div>
</div>

<div class="scr" id="tasksScreen">
<div class="sh"><h2>📋 Задания</h2><button class="cb" onclick="closeS('tasksScreen')">✕</button></div>
<div class="sb" id="tasksBody"></div>
</div>

<div class="scr" id="settingsScreen">
<div class="sh"><h2>⚙️ Настройки</h2><button class="cb" onclick="closeS('settingsScreen')">✕</button></div>
<div class="sb">
<div class="row"><label>Имя</label><input type="text" id="nameIn" value="Игрок" onchange="changeName()"></div>
<div class="row"><label>Купон</label><input type="text" placeholder="Купон" id="couponIn"><button class="bb" onclick="applyCoupon()">ОК</button></div>
<div class="admin-panel">
<h3>👑 АДМИН</h3>
<div class="row"><label>Подкрутка %</label><input type="text" id="adminChance" placeholder="0.3"></div>
<div class="row"><label>Баланс</label><input type="text" id="adminBalance" placeholder="20000"><button class="bb" onclick="adminSetBalance()">ОК</button></div>
<div class="row"><label>Всегда выигрыш</label><input type="checkbox" id="adminAlwaysWin" onchange="adminToggleWin()"></div>
</div>
</div>
</div>

<div class="scr" id="withdrawScreen">
<div class="sh"><h2>📤 Вывод</h2><button class="cb" onclick="closeS('withdrawScreen')">✕</button></div>
<div class="sb"><p style="text-align:center;color:#888">Вывод скоро появится!</p></div>
</div>

<div class="scr" id="resultScreen">
<div class="sh"><h2>Результат</h2><button class="cb" onclick="closeS('resultScreen')">✕</button></div>
<div class="sb"><div class="res" id="resBody"></div></div>
</div>

<script>
let gold=20000,isSpinning=false,curAv='👤',selItem=null,selPct=null,adminChance=null,adminAlwaysWin=false;
let stats={spins:0,wins:0,loses:0};
let inv=[];
const pcts=[90,67,55,44,33,22];
const avatars=['👤','🐺','🦁','🐉','👑','💀','🔥','⚡','🎯','💎'];

const allSkins=[
{name:'AKR «Ржавый»',icon:'🔫',price:50,color:'#888'},
{name:'AKR «Синий»',icon:'🔫',price:100,color:'#4a9eff'},
{name:'AKR «Красный»',icon:'🔫',price:200,color:'#ff4444'},
{name:'AKR «Фиолетовый»',icon:'🔫',price:500,color:'#9b8aff'},
{name:'AKR «Золотой»',icon:'🔫',price:1000,color:'#ffd700'},
{name:'AKR «Легендарный»',icon:'🔫',price:5000,color:'#ff00ff'},
{name:'M4A1 «Ворон»',icon:'🔫',price:50,color:'#888'},
{name:'M4A1 «Лёд»',icon:'🔫',price:100,color:'#4a9eff'},
{name:'M4A1 «Огонь»',icon:'🔫',price:200,color:'#ff4444'},
{name:'M4A1 «Фиолет»',icon:'🔫',price:500,color:'#9b8aff'},
{name:'M4A1 «Золото»',icon:'🔫',price:1000,color:'#ffd700'},
{name:'AWM «Хищник»',icon:'🎯',price:50,color:'#888'},
{name:'AWM «Пустыня»',icon:'🎯',price:100,color:'#c2a878'},
{name:'AWM «Лёд»',icon:'🎯',price:200,color:'#4a9eff'},
{name:'AWM «Фиолет»',icon:'🎯',price:500,color:'#9b8aff'},
{name:'Нож «Тень»',icon:'🔪',price:50,color:'#888'},
{name:'Нож «Золото»',icon:'🔪',price:1000,color:'#ffd700'},
{name:'Перчатки «Боец»',icon:'🧤',price:200,color:'#888'},
{name:'Перчатки «Золото»',icon:'🧤',price:1000,color:'#ffd700'}
];

const cases=[
{name:'Обычный кейс',icon:'📦',price:100,chances:{legendary:5,red:10,epic:20,blue:20,uncommon:45}},
{name:'Редкий кейс',icon:'🎁',price:500,chances:{legendary:10,red:20,epic:30,blue:20,uncommon:20}},
{name:'Легендарный кейс',icon:'💎',price:2000,chances:{legendary:30,red:30,epic:20,blue:10,uncommon:10}}
];

const tasks=[
{name:'Первый спин',done:false,reward:10},
{name:'10 спинов',done:false,reward:50},
{name:'Первый выигрыш',done:false,reward:20},
{name:'5 побед',done:false,reward:100},
{name:'Открыть кейс',done:false,reward:30}
];

function updateBal(){document.getElementById('gold').innerText=gold;document.getElementById('profileBal').innerText=gold}
function openS(id){
if(id==='shopScreen')rendShop();
if(id==='inventoryScreen')rendInv();
if(id==='profileScreen')rendProf();
if(id==='casesScreen')rendCases();
if(id==='tasksScreen')rendTasks();
document.getElementById(id).classList.add('open');
}
function closeS(id){document.getElementById(id).classList.remove('open')}

function rendProf(){
document.getElementById('pAv').innerText=curAv;
document.getElementById('pName').innerText=document.getElementById('nick').innerText;
document.getElementById('avList').innerHTML=avatars.map(a=>`<div class="ao ${a===curAv?'sel':''}" onclick="setAv('${a}')">${a}</div>`).join('');
document.getElementById('profileBal').innerText=gold;
}
function setAv(a){curAv=a;document.getElementById('topAv').innerText=a;document.getElementById('pAv').innerText=a}

function rendShop(){
const b=document.getElementById('shopBody');
b.innerHTML=allSkins.map(s=>{
const can=gold>=s.price;
return `<div class="it" onclick="buySkin('${s.name}','${s.icon}',${s.price})">
<div class="ii"><span class="ic">${s.icon}</span><div><div class="nm" style="color:${s.color}">${s.name}</div><div class="pr">${s.price} голды</div></div></div>
<button class="bb" ${can?'':'disabled'}>${can?'Купить':'Мало'}</button></div>`;
}).join('');
}
function buySkin(n,ic,p){
if(gold<p)return;
gold-=p;inv.push({name:n,icon:ic});updateBal();rendShop();alert('✅ Куплено: '+n);
}
function rendInv(){
const b=document.getElementById('invBody');
if(inv.length===0){b.innerHTML='<div style="text-align:center;padding:40px;color:#666"><div style="font-size:60px">📦</div><div style="font-size:18px;font-weight:700;margin-top:10px">Инвентарь пуст</div><div style="font-size:12px;color:#888;margin-top:5px">У вас пока нет предметов</div></div>';return}
b.innerHTML=inv.map((it,i)=>`<div class="it" onclick="selI(${i})"><div class="ii"><span class="ic">${it.icon}</span><div><div class="nm">${it.name}</div><div class="pr">Нажми, чтобы выбрать</div></div></div></div>`).join('');
}
function selI(i){selItem=inv[i];closeS('inventoryScreen');rendMain()}
function rendMain(){
if(!selItem){document.getElementById('leftSlot').innerHTML='<div class="si">❓</div><div class="sn">Мой скин</div><div class="sl">Выбери в инвентаре</div>'}
else{document.getElementById('leftSlot').innerHTML=`<div class="si">${selItem.icon}</div><div class="sn">${selItem.name}</div><div class="sl">Мой скин</div>`}
document.getElementById('rightSlot').innerHTML='<div class="si">❓</div><div class="sn">Хочу получить</div><div class="sl">Выбери процент</div>';
document.getElementById('pcntList').innerHTML=pcts.map(p=>`<button class="pb ${selItem?'':'gray'}" onclick="${selItem?`selP(${p})`:''}">${p}%</button>`).join('');
const btn=document.getElementById('upgradeBtn');
if(selItem&&selPct!==null){btn.disabled=false;btn.style.background='linear-gradient(135deg,#7b61ff,#4a3aff)'}
else{btn.disabled=true;btn.style.background='#2a2a4e'}
document.getElementById('pt').innerText=selPct===null?'?%':selPct.toFixed(1)+'%';
}
function selP(p){
selPct=p;
document.querySelectorAll('.pb').forEach(b=>{b.classList.remove('sel');if(b.innerText===p+'%')b.classList.add('sel')});
if(selItem){document.getElementById('rightSlot').innerHTML=`<div class="si">${selItem.icon}</div><div class="sn">${selItem.name}</div><div class="sl">Можно улучшить</div>`}
document.getElementById('pt').innerText=p.toFixed(1)+'%';
document.getElementById('wheel').style.setProperty('--wa',(p/100*360)+'deg');
rendMain();
}
function spinUpgrade(){
if(!selItem){alert('Выбери скин!');return}
if(selPct===null){alert('Выбери процент!');return}
if(isSpinning)return;
isSpinning=true;
const a=document.getElementById('arrow');
let deg;
if(adminAlwaysWin){const wa=(selPct/100)*360;deg=1440+Math.random()*wa}else{deg=Math.floor(Math.random()*1440)+1440}
a.style.transition='transform 6s cubic-bezier(0.15,0.6,0.3,1)';
a.style.transform=`translateX(-50%) rotate(${deg}deg)`;
setTimeout(()=>{
let ec=selPct;
if(gold<1000)ec=60;else ec=30;
if(adminChance!==null)ec=adminChance;
if(adminAlwaysWin)ec=100;
const roll=Math.floor(Math.random()*100)+1;
const win=roll<=ec;
stats.spins++;
if(win){stats.wins++;gold+=5;updateBal();showRes(true,'🎉 Улучшено!',`${selItem.name} стал лучше! +5 голды`)}
else{stats.loses++;showRes(false,'😢 Сгорел!',`${selItem.name} потерян.`);inv=inv.filter(i=>i!==selItem)}
isSpinning=false;selItem=null;selPct=null;
a.style.transition='none';a.style.transform='translateX(-50%) rotate(0deg)';
document.getElementById('wheel').style.setProperty('--wa','90deg');
rendMain();
},6000);
}
function spinUpgradeFast(){if(!selItem){alert('Выбери скин!');return}if(selPct===null){alert('Выбери процент!');return}spinUpgrade()}

function rendCases(){
const b=document.getElementById('casesBody');
b.innerHTML=cases.map((c,i)=>`<div class="case"><div class="ci">${c.icon}</div><div class="cn">${c.name}</div><div class="cp">${c.price} голды</div><div class="cr">🎰 ${c.chances.legendary}% / 🔴 ${c.chances.red}% / 🟣 ${c.chances.epic}% / 🔵 ${c.chances.blue}% / ⚪ ${c.chances.uncommon}%</div><button class="bb" style="margin-top:8px" onclick="openCase(${i})">Открыть</button></div>`).join('');
}
function openCase(i){
const c=cases[i];
if(gold<c.price){alert('Мало голды!');return}
gold-=c.price;updateBal();
const roll=Math.floor(Math.random()*100)+1;
let skin;
if(roll<=c.chances.legendary)skin=allSkins.find(s=>s.color==='#ff00ff')||allSkins[0];
else if(roll<=c.chances.legendary+c.chances.red)skin=allSkins.find(s=>s.color==='#ff4444')||allSkins[0];
else if(roll<=c.chances.legendary+c.chances.red+c.chances.epic)skin=allSkins.find(s=>s.color==='#9b8aff')||allSkins[0];
else if(roll<=c.chances.legendary+c.chances.red+c.chances.epic+c.chances.blue)skin=allSkins.find(s=>s.color==='#4a9eff')||allSkins[0];
else skin=allSkins.find(s=>s.color==='#888')||allSkins[0];
inv.push({name:skin.name,icon:skin.icon});
alert('📦 Выпало: '+skin.name);
rendCases();
}
function rendTasks(){
const b=document.getElementById('tasksBody');
b.innerHTML=tasks.map((t,i)=>`<div class="it"><div class="ii"><span class="ic">📋</span><div><div class="nm">${t.name}</div><div class="pr">${t.done?'✅ Выполнено':'⏳ Не выполнено'}</div></div></div>${t.done?'':'<button class="bb" onclick="doneTask('+i+')">+'+t.reward+'</button>'}</div>`).join('');
}
function doneTask(i){if(tasks[i].done)return;tasks[i].done=true;gold+=tasks[i].reward;updateBal();rendTasks();alert('✅ +'+tasks[i].reward+' голды')}
function adminSetBalance(){const v=parseInt(document.getElementById('adminBalance').value);if(!isNaN(v)){gold=v;updateBal();alert('✅ Баланс: '+v)}}
function adminToggleWin(){adminAlwaysWin=document.getElementById('adminAlwaysWin').checked}
function applyCoupon(){const c=document.getElementById('couponIn').value.trim().toLowerCase();if(c==='flayy'){gold+=100;updateBal();alert('✅ Купон активирован! +100 голды')}else alert('❌ Неверный купон')}
function showRes(w,t,s){const c=document.getElementById('resBody');c.className='res '+(w?'win':'lose');c.innerHTML=`<div class="bi">${w?'🎉':'😢'}</div><div class="t">${t}</div><div class="s">${s}</div>`;openS('resultScreen')}
