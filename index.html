<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>Stand Upgrade</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet"><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
/* ================= БАЗА ================= */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
:root{
  --bg:#08080a;--panel:#121216;--panel-l:#1a1a22;--border:#272730;
  --gold:#ffb800;--red:#e50914;--green:#4CAF50;
  --gray:#666;--gray2:#999;--white:#fff;
  --blue:#4a9eff;--purple:#9b8aff;--pink:#ff69b4;
  --shadow:0 8px 32px rgba(0,0,0,0.5);
}
body{background:var(--bg);color:var(--white);min-height:100vh;overflow-x:hidden;font-size:14px}
body.modal-open{overflow:hidden}

/* ================= АНИМИРОВАННЫЙ ФОН (ПАДАЮЩИЕ ЧАСТИЦЫ) ================= */
#bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:0.6}

/* ================= ШАПКА ================= */
header{position:sticky;top:0;z-index:100;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:rgba(8,8,10,0.8);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.05)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;letter-spacing:1px}
.brand span{color:var(--gold)}
.user-info{display:flex;align-items:center;gap:10px}
.balance{background:rgba(255,184,0,0.1);border:1px solid rgba(255,184,0,0.3);padding:6px 12px;border-radius:20px;font-weight:800;display:flex;align-items:center;gap:6px;cursor:pointer;transition:0.2s}
.balance:active{transform:scale(0.95)}
.balance svg{width:16px;height:16px;fill:var(--gold)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--panel-l);border:2px solid var(--border);cursor:pointer;overflow:hidden;transition:0.2s}
.avatar:active{transform:scale(0.95)}
.avatar img{width:100%;height:100%;object-fit:cover}

/* ================= ГЛАВНЫЙ ЭКРАН ================= */
main{padding:16px;max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* LIVE ЛЕНТА */
.live-section{width:100%}
.live-header{font-size:12px;color:var(--gray2);font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:1px}
.live-header::before{content:'';width:6px;height:6px;background:var(--red);border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,9,20,0.7)}50%{box-shadow:0 0 0 6px rgba(229,9,20,0)}}
.live-track{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;scroll-behavior:smooth}
.live-track::-webkit-scrollbar{display:none}
.live-card{flex-shrink:0;width:180px;background:linear-gradient(135deg,rgba(255,255,255,0.05),rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.live-card.golden{border-color:var(--gold);box-shadow:0 0 15px rgba(255,184,0,0.2)}
.live-user{font-size:11px;color:var(--gray2);font-weight:700}
.live-skin{display:flex;align-items:center;justify-content:space-between}
.live-skin img{height:40px;object-fit:contain}
.live-pct{font-size:10px;font-weight:900;background:var(--gold);color:#000;padding:2px 6px;border-radius:4px}

/* КОЛЕСО */
.upgrade-area{background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;position:relative;box-shadow:var(--shadow)}
.wheel-container{position:relative;width:280px;height:280px;margin-bottom:20px}
.wheel-bg{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,var(--panel-l) 0%,#0a0a0c 100%);border:4px solid #1a1a22;box-shadow:inset 0 0 20px #000,0 0 30px rgba(0,0,0,0.8)}
.wheel-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.wheel-svg circle{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dasharray 0.5s ease}
.wheel-arrow{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:24px;color:var(--gold);filter:drop-shadow(0 0 10px var(--gold));z-index:10;transition:transform 5s cubic-bezier(0.15,0.6,0.2,1)}
.chance-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
.chance-val{font-size:48px;font-weight:900;color:var(--white);text-shadow:0 0 20px rgba(255,255,255,0.2);line-height:1}
.chance-lbl{font-size:10px;color:var(--gray2);font-weight:800;letter-spacing:2px;margin-top:4px}

/* СЛОТЫ */
.slots{display:flex;align-items:center;justify-content:center;gap:16px;width:100%;margin-top:10px}
.slot-box{flex:1;max-width:120px;background:rgba(0,0,0,0.3);border:2px dashed rgba(255,255,255,0.1);border-radius:16px;height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer;transition:0.2s;overflow:hidden}
.slot-box:hover{border-color:var(--gold)}
.slot-box img{max-width:80%;max-height:80%;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5))}
.slot-box .empty{font-size:24px;color:rgba(255,255,255,0.2)}
.slot-remove{position:absolute;top:4px;right:4px;width:20px;height:20px;background:var(--red);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.slot-plus{font-size:24px;color:var(--gray)}
.vs-text{font-size:14px;font-weight:900;color:var(--gray2)}

/* КНОПКИ */
.actions{display:flex;flex-direction:column;gap:12px;width:100%;margin-top:20px}
.btn-main{width:100%;padding:18px;border:none;border-radius:16px;background:linear-gradient(135deg,#ffb800,#ff8c00);color:#000;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 8px 20px rgba(255,184,0,0.3);transition:0.2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-main:active{transform:scale(0.98)}
.btn-main:disabled{opacity:0.5;filter:grayscale(1);cursor:not-allowed;box-shadow:none}
.btn-sub{width:100%;padding:14px;border:1px solid var(--border);border-radius:16px;background:rgba(255,255,255,0.03);color:var(--white);font-size:14px;font-weight:800;cursor:pointer;transition:0.2s}
.btn-sub:active{transform:scale(0.98);background:rgba(255,255,255,0.08)}

/* ================= СЕТКА СКИНОВ ================= */
.section-title{font-size:16px;font-weight:900;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:8px;margin-bottom:16px;background:var(--panel);padding:4px;border-radius:12px}
.tab{flex:1;padding:10px;border:none;border-radius:8px;background:transparent;color:var(--gray2);font-weight:800;font-size:12px;cursor:pointer;transition:0.2s}
.tab.active{background:var(--panel-l);color:var(--white)}
.skins-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.skin-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;position:relative;overflow:hidden;transition:0.2s}
.skin-card:active{transform:scale(0.97)}
.skin-card .rarity-bar{position:absolute;top:0;left:0;width:100%;height:3px}
.skin-img-wrap{height:80px;display:flex;align-items:center;justify-content:center}
.skin-img-wrap img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5))}
.skin-info{display:flex;flex-direction:column;gap:2px}
.skin-name{font-size:12px;font-weight:900;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skin-price{font-size:14px;font-weight:900;color:var(--gold)}

/* РЕДКОСТИ */
.rarity-common{border-color:rgba(255,255,255,0.1)}.rarity-common .rarity-bar{background:#888}
.rarity-uncommon{border-color:rgba(74,158,255,0.3)}.rarity-uncommon .rarity-bar{background:var(--blue)}
.rarity-rare{border-color:rgba(155,138,255,0.3)}.rarity-rare .rarity-bar{background:var(--purple)}
.rarity-epic{border-color:rgba(255,68,68,0.3)}.rarity-epic .rarity-bar{background:var(--red)}
.rarity-legend{border-color:rgba(255,215,0,0.5);box-shadow:0 0 15px rgba(255,215,0,0.1)}.rarity-legend .rarity-bar{background:var(--gold)}

/* ================= МОДАЛКИ ================= */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity 0.3s}
.modal-overlay.open{display:flex;opacity:1}
.modal-content{background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:24px;width:100%;max-width:400px;position:relative;transform:translateY(20px);transition:transform 0.3s;box-shadow:var(--shadow)}
.modal-overlay.open .modal-content{transform:translateY(0)}
.modal-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.1);border:none;color:var(--white);width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.modal-title{font-size:20px;font-weight:900;text-align:center;margin-bottom:20px}

/* ПОПАП ВЫИГРЫША/ПРОИГРЫША */
.result-card{text-align:center;padding:30px 20px}
.result-icon{font-size:60px;margin-bottom:16px;animation:bounceIn 0.5s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes bounceIn{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.result-title{font-size:28px;font-weight:900;margin-bottom:8px}
.result-title.win{color:var(--green);text-shadow:0 0 20px rgba(76,175,80,0.5)}
.result-title.lose{color:var(--red);text-shadow:0 0 20px rgba(229,9,20,0.5)}
.result-skin{background:rgba(255,255,255,0.05);border-radius:16px;padding:20px;margin:20px 0}
.result-skin img{max-height:120px;margin-bottom:12px;filter:drop-shadow(0 10px 20px rgba(0,0,0,0.5))}
.result-name{font-size:16px;font-weight:900}
.result-price{font-size:20px;font-weight:900;color:var(--gold);margin-top:4px}

/* КОРЗИНА */
.cart-items{max-height:300px;overflow-y:auto;margin-bottom:20px}
.cart-item{display:flex;align-items:center;gap:12px;padding:10px;background:rgba(255,255,255,0.03);border-radius:12px;margin-bottom:8px}
.cart-item img{width:50px;height:50px;object-fit:contain}
.cart-item-info{flex:1}
.cart-item-name{font-size:12px;font-weight:800}
.cart-item-price{font-size:14px;font-weight:900;color:var(--gold)}
.cart-total{display:flex;justify-content:space-between;font-size:16px;font-weight:900;padding-top:16px;border-top:1px solid var(--border);margin-bottom:20px}

/* ================= АДМИН ПАНЕЛЬ ================= */
.admin-panel{display:none;flex-direction:column;gap:12px}
.admin-panel.active{display:flex}
.input-group{display:flex;flex-direction:column;gap:4px}
.input-group label{font-size:11px;color:var(--gray2);font-weight:800}
.input-group input{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--white);font-size:14px;outline:none;transition:0.2s}
.input-group input:focus{border-color:var(--gold)}
.admin-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-admin{padding:12px;border:none;border-radius:12px;font-weight:900;font-size:12px;cursor:pointer;color:#fff}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-blue{background:var(--blue)}

/* ТОСТ */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--panel-l);border:1px solid var(--border);padding:12px 24px;border-radius:30px;font-weight:800;font-size:13px;color:var(--white);z-index:9999;transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
.toast.show{transform:translateX(-50%) translateY(0)}
</style></head><body>

<canvas id="bg-canvas"></canvas>

<header>

      <span id="goldTop">0</span>
    </div>
    <div class="avatar" onclick="openDrawer()"><img id="topAv" src="" onerror="this.style.display='none'"></div>
  </div>
</header>

<main>
  <!-- LIVE -->
  <div class="live-section">
    <div class="live-header">Live Drops</div>
    <div class="live-track" id="liveTrack">
      <div class="live-card"><div class="live-user">Загрузка...</div></div>
    </div>
  </div>

  <!-- АПГРЕЙД -->
  <div class="upgrade-area">
    <div class="wheel-container">
      <div class="wheel-bg"></div>

        <circle cx="50" cy="50" r="46" stroke="#1a1a22" stroke-width="8" fill="none"/>

        <div class="chance-val" id="chanceVal">0%</div>
        <div class="chance-lbl">CHANCE</div>
      </div>
      <div class="wheel-arrow" id="wheelArrow">▼</div>
    </div>

    <div class="slots">
      <div class="slot-box" onclick="openInventory()" id="slotLeft">
        <div class="empty">+</div>
      </div>
      <div class="vs-text">VS</div>
      <div class="slot-box" onclick="openTarget()" id="slotRight">
        <div class="empty">🎯</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-main" id="btnUpgrade" onclick="doUpgrade()" disabled>
        <span>🚀</span> UPGRADE
      </button>
      <button class="btn-sub" onclick="openInventory()">Изменить скины</button>
    </div>
  </div>

  <!-- ИНВЕНТАРЬ -->
  <div class="section-title">
    <span>Мой инвентарь</span>
    <span style="font-size:12px;color:var(--gray2)" id="invCount">0</span>
  </div>
  <div class="skins-grid" id="invGrid"></div>
</main>

<!-- DRAWER (ПРОФИЛЬ) -->
<div class="modal-overlay" id="drawerOverlay" onclick="closeDrawer(event)">
  <div class="modal-content" onclick="event.stopPropagation()" style="transform:translateX(100%);transition:transform 0.3s;border-radius:24px 0 0 24px;margin-left:auto;height:100%;max-height:100vh;max-width:320px;padding:20px;display:flex;flex-direction:column" id="drawerContent">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div style="font-size:20px;font-weight:900">Меню</div>
      <button class="modal-close" onclick="closeDrawer()" style="position:static">✕</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:20px">
      <button class="tab active" onclick="switchDrawer('profile',this)">Профиль</button>
      <button class="tab" onclick="switchDrawer('admin',this)" id="adminTabBtn" style="display:none">Админ</button>
    </div>
    <div id="drawerBody" style="flex:1;overflow-y:auto"></div>
  </div>
</div>

<!-- МОДАЛКА РЕЗУЛЬТАТА -->
<div class="modal-overlay" id="resultModal">
  <div class="modal-content result-card" id="resultContent">
    <!-- Заполняется через JS -->
  </div>
</div>

<!-- МОДАЛКА ИНВЕНТАРЯ -->
<div class="modal-overlay" id="invModal">
  <div class="modal-content" style="max-height:80vh;display:flex;flex-direction:column">
    <button class="modal-close" onclick="closeModal('invModal')">✕</button>
    <div class="modal-title">Выбери скин</div>
    <div class="skins-grid" id="modalInvGrid" style="overflow-y:auto;padding-bottom:20px"></div>
  </div>
</div>

<!-- МОДАЛКА КОРЗИНЫ -->
<div class="modal-overlay" id="cartModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal('cartModal')">✕</button>
    <div class="modal-title">Корзина</div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-total"><span>Итого:</span><span id="cartTotal">0 G</span></div>
    <button class="btn-main" onclick="checkout()">✅ КУПИТЬ</button>
  </div>
</div>

<!-- ТОСТ -->
<div class="toast" id="toast">Уведомление</div>

  'P350 Oni': { price: 1, color: '#4a9eff', img: CDN + 'skins/P350_Oni.jpg' },
  'P350 Raider': { price: 31, color: '#9b8aff', img: CDN + 'skins/P350_Raider.jpg' },
  'P350 Tag King': { price: 20, color: '#ff69b4', img: CDN + 'skins/P350_TagKing.jpg' },
  'USP 2 Years': { price: 400, color: '#4a9eff', img: CDN + 'skins/Usp_2Yers.jpg' },
  'USP 2 Years Red': { price: 1020, color: '#9b8aff', img: CDN + 'skins/Usp_2YersRed.jpg' },
  'USP Genesis': { price: 23000, color: '#ffd700', img: CDN + 'skins/Usp_Genesis.jpg' },
  'USP Ignite': { price: 7, color: '#4a9eff', img: CDN + 'skins/Usp_Lgnite.jpg' },
  'USP Mirage Menace': { price: 2940, color: '#ff4444', img: CDN + 'skins/Usp_MirageMenace.jpg' },
  'USP Pisces': { price: 20, color: '#9b8aff', img: CDN + 'skins/Usp_Pisces.jpg' },
  'USP Suture': { price: 14, color: '#4a9eff', img: CDN + 'skins/Usp_Suture.jpg' }
};

const allSkins = Object.keys(CATALOG).map(name => ({ name, ...CATALOG[name] }));

// ==================== СОСТОЯНИЕ ====================
const tg = window.Telegram?.WebApp;
if(tg){ tg.ready(); tg.expand(); }
const tgUser = tg?.initDataUnsafe?.user;
const tgInitData = tg?.initData || '';
const userId = tgUser?.id ? String(tgUser.id) : 'dev_user';

let gold = 0;
let inventory = [];
let selectedSkin = null;
let targetSkin = null;
let isUpgrading = false;
let currentChance = 0;
let cart = [];
let history = [];

// ==================== УТИЛИТЫ ====================
function authHeaders() {
  return { 'Content-Type': 'application/json', 'X-TG-Init-Data': tgInitData };
}

async function api(path, opts = {}) {
  const res = await fetch(BOT_URL + path, {
    ...opts,
    headers: { ...authHeaders(), ...(opts.headers || {}) }
  });
  const text = await res.text();
  try { return JSON.parse(text); } 
  catch(e) { throw new Error('Ошибка сервера'); }
}

function toast(msg, type = 'info') {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.style.borderColor = type === 'win' ? 'var(--green)' : type === 'lose' ? 'var(--red)' : 'var(--border)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function getRarity(color) {
  if(color === '#ffd700') return 'legend';
  if(color === '#ff4444') return 'epic';
  if(color === '#ff69b4') return 'rare';
  if(color === '#9b8aff') return 'uncommon';
  return 'common';
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
  document.body.classList.remove('modal-open');
}

// ==================== ФОН (ЧАСТИЦЫ) ====================
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let particles = [];

function initBg() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  particles = [];
  for(let i = 0; i < 50; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2 + 1,
      speedY: Math.random() * 0.5 + 0.1,
      speedX: (Math.random() - 0.5) * 0.2,
      opacity: Math.random() * 0.5 + 0.1
    });
  }
}

function animateBg() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.y += p.speedY;
    p.x += p.speedX;
    if(p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
    ctx.fillStyle = `rgba(255, 184, 0, ${p.opacity})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  requestAnimationFrame(animateBg);
}

window.addEventListener('resize', initBg);
initBg();
animateBg();

// ==================== ЗАГРУЗКА ====================
async function loadGame() {
  try {
    const res = await api('/api/load/' + userId);
    if(res.ok && res.data) {
      gold = res.data.gold || 0;
      inventory = res.data.inv || [];
      if(res.data.photoUrl) document.getElementById('topAv').src = res.data.photoUrl;
      else if(tgUser?.photo_url) document.getElementById('topAv').src = tgUser.photo_url;
    }
    updateUI();
  } catch(e) { toast('Ошибка загрузки', 'lose'); }
}

function updateUI() {
  document.getElementById('goldTop').innerText = Math.floor(gold).toLocaleString('ru-RU');
  document.getElementById('invCount').innerText = inventory.length;
  renderInventory();
  renderSlotLeft();
  renderSlotRight();
  updateChance();
}

// ==================== РЕНДЕР ====================
function renderInventory() {
  const grid = document.getElementById('invGrid');
  grid.innerHTML = inventory.map((skin, i) => `
    <div class="skin-card rarity-${getRarity(skin.color)}" onclick="selectSkin(${i})">
      <div class="rarity-bar"></div>
      <div class="skin-img-wrap"><img src="${skin.img}" onerror="this.style.display='none'"></div>
      <div class="skin-info">
        <div class="skin-name">${skin.name}</div>
        <div class="skin-price">${skin.price} G</div>
      </div>
    </div>
  `).join('') || '<div style="grid-column:1/-1;text-align:center;color:var(--gray);padding:20px">Инвентарь пуст</div>';
}

function renderSlotLeft() {
  const slot = document.getElementById('slotLeft');
  if(selectedSkin) {
    slot.innerHTML = `
      <img src="${selectedSkin.img}">
      <div class="slot-remove" onclick="event.stopPropagation(); selectedSkin=null; updateUI()">✕</div>
    `;
  } else {
    slot.innerHTML = '<div class="empty">+</div>';
  }
}

function renderSlotRight() {
  const slot = document.getElementById('slotRight');
  if(targetSkin) {
    slot.innerHTML = `<img src="${targetSkin.img}">`;
  } else {
    slot.innerHTML = '<div class="empty">🎯</div>';
  }
}

function updateChance() {
  const btn = document.getElementById('btnUpgrade');
  const valEl = document.getElementById('chanceVal');
  const progEl = document.getElementById('wheelProgress');
  
  if(!selectedSkin || !targetSkin) {
    currentChance = 0;
    valEl.innerText = '0%';
    progEl.setAttribute('stroke-dasharray', '0 289');
    btn.disabled = true;
    return;
  }
  
  currentChance = Math.min(90, (selectedSkin.price / targetSkin.price) * 100);
  valEl.innerText = currentChance.toFixed(1) + '%';
  
  const circumference = 2 * Math.PI * 46; // ~289
  const offset = circumference * (1 - currentChance / 100);
  progEl.setAttribute('stroke-dasharray', `${circumference - offset} ${offset}`);
  
  btn.disabled = false;
}

// ==================== ДЕЙСТВИЯ ====================
function selectSkin(idx) {
  if(isUpgrading) return;
  selectedSkin = inventory[idx];
  closeModal('invModal');
  updateUI();
}

function openInventory() {
  if(isUpgrading) return;
  const grid = document.getElementById('modalInvGrid');
  grid.innerHTML = inventory.map((skin, i) => `
    <div class="skin-card rarity-${getRarity(skin.color)}" onclick="selectSkin(${i})">
      <div class="rarity-bar"></div>
      <div class="skin-img-wrap"><img src="${skin.img}"></div>
      <div class="skin-info"><div class="skin-name">${skin.name}</div></div>
    </div>
  `).join('');
  document.getElementById('invModal').classList.add('open');
  document.body.classList.add('modal-open');
}

function openTarget() {
  if(isUpgrading) return;
  const grid = document.getElementById('modalInvGrid');
  grid.innerHTML = allSkins.map((skin, i) => `
    <div class="skin-card rarity-${getRarity(skin.color)}" onclick="selectTarget(${i})">
      <div class="rarity-bar"></div>
      <div class="skin-img-wrap"><img src="${skin.img}"></div>
      <div class="skin-info"><div class="skin-name">${skin.name}</div></div>
    </div>
  `).join('');
  document.getElementById('invModal').classList.add('open');
  document.body.classList.add('modal-open');
}

function selectTarget(idx) {
  targetSkin = allSkins[idx];
  closeModal('invModal');
  updateUI();
}

async function doUpgrade() {
  if(!selectedSkin || !targetSkin || isUpgrading) return;
  isUpgrading = true;
  document.getElementById('btnUpgrade').disabled = true;
  document.getElementById('btnUpgrade').innerHTML = '⏳ UPGRADING...';
  
  const arrow = document.getElementById('wheelArrow');
  arrow.style.transition = 'transform 4s cubic-bezier(0.15, 0.6, 0.2, 1)';
  arrow.style.transform = `rotate(${360 * 5 + Math.random() * 360}deg)`;
  
  try {
    const res = await api('/api/spin/commit', {
      method: 'POST',
      body: JSON.stringify({
        userId,
        targetName: targetSkin.name,
        selectedNames: [selectedSkin.name]
      })
    });
    
    if(!res.ok) throw new Error(res.error);
    
    setTimeout(() => {
      gold = res.newGold;
      inventory = res.newInv;
      showResult(res.win, res.win ? targetSkin : selectedSkin);
      selectedSkin = null;
      targetSkin = null;
      isUpgrading = false;
      arrow.style.transition = 'none';
      arrow.style.transform = 'rotate(0deg)';
      document.getElementById('btnUpgrade').innerHTML = '<span>🚀</span> UPGRADE';
      updateUI();
    }, 4100);
  } catch(e) {
    toast(e.message, 'lose');
    isUpgrading = false;
    document.getElementById('btnUpgrade').innerHTML = '<span>🚀</span> UPGRADE';
    updateUI();
  }
}

function showResult(win, skin) {
  const modal = document.getElementById('resultModal');
  const content = document.getElementById('resultContent');
  
  content.innerHTML = `
    <div class="result-icon">${win ? '🎉' : '💀'}</div>
    <div class="result-title ${win ? 'win' : 'lose'}">${win ? 'ПОБЕДА' : 'ПРОИГРЫШ'}</div>
    <div class="result-skin">
      <img src="${skin.img}">
      <div class="result-name">${skin.name}</div>
      <div class="result-price">${win ? '+' : '-'}${skin.price} G</div>
    </div>
    <button class="btn-main" onclick="closeModal('resultModal')">OK</button>
  `;
  
  modal.classList.add('open');
  document.body.classList.add('modal-open');
}

// ==================== ПРОФИЛЬ / АДМИН ====================
function openDrawer() {
  const overlay = document.getElementById('drawerOverlay');
  overlay.classList.add('open');
  document.body.classList.add('modal-open');
  setTimeout(() => document.getElementById('drawerContent').style.transform = 'translateX(0)', 10);
  
  if(String(userId) === ADMIN_ID) document.getElementById('adminTabBtn').style.display = 'block';
  switchDrawer('profile', document.querySelector('.tab'));
}

function closeDrawer(e) {
  if(e && e.target !== e.currentTarget) return;
  const dc = document.getElementById('drawerContent');
  dc.style.transform = 'translateX(100%)';
  setTimeout(() => {
    document.getElementById('drawerOverlay').classList.remove('open');
    document.body.classList.remove('modal-open');
  }, 300);
}

function switchDrawer(tab, btn) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  
  const body = document.getElementById('drawerBody');
  if(tab === 'profile') {
    body.innerHTML = `
      <div style="text-align:center;margin-bottom:20px">
        <div style="font-size:16px;font-weight:900">${tgUser?.first_name || 'Игрок'}</div>
        <div style="font-size:11px;color:var(--gray2)">ID: ${userId}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px">
        <div style="background:var(--panel-l);padding:12px;border-radius:12px;text-align:center">
          <div style="font-size:18px;font-weight:900;color:var(--gold)">${inventory.length}</div>
          <div style="font-size:10px;color:var(--gray2)">СКИНОВ</div>
        </div>
        <div style="background:var(--panel-l);padding:12px;border-radius:12px;text-align:center">
          <div style="font-size:18px;font-weight:900;color:var(--green)">${Math.floor(gold)}</div>
          <div style="font-size:10px;color:var(--gray2)">GOLD</div>
        </div>
      </div>
      <button class="btn-sub" style="margin-bottom:12px" onclick="closeDrawer();openCart()">🛒 Корзина</button>
      <button class="btn-sub" onclick="showTopup()">💳 Пополнить</button>
    `;
  } else if(tab === 'admin') {
    body.innerHTML = `
      <div class="admin-panel active">
        <div class="input-group">
          <label>ID игрока</label>
          <input type="text" id="admId" placeholder="Введи ID">
        </div>
        <div class="input-group">
          <label>Сумма G</label>
          <input type="number" id="admAmount" placeholder="1000">
        </div>
        <div class="admin-btns">
          <button class="btn-admin btn-green" onclick="adminAct('giveG')">+ Выдать</button>
          <button class="btn-admin btn-red" onclick="adminAct('takeG')">- Забрать</button>
        </div>
        <div class="admin-btns">
          <button class="btn-admin btn-red" onclick="adminAct('banPlayer')">🚫 Бан</button>
          <button class="btn-admin btn-green" onclick="adminAct('unbanPlayer')">✅ Разбан</button>
        </div>
      </div>
    `;
  }
}

async function adminAct(type) {
  const id = document.getElementById('admId').value;
  const amt = document.getElementById('admAmount').value;
  if(!id) return toast('Введи ID', 'lose');
  
  try {
    const body = { targetId: id };
    if(type === 'giveG' || type === 'takeG') body.amount = Number(amt);
    const res = await api('/api/admin/' + type, { method: 'POST', body: JSON.stringify(body) });
    if(res.ok) toast('Успешно', 'win'); else toast(res.error, 'lose');
  } catch(e) { toast(e.message, 'lose'); }
}

function showTopup() { toast('Пополнение скоро', 'info'); }

// ==================== КОРЗИНА ====================
function openCart() {
  const modal = document.getElementById('cartModal');
  const items = document.getElementById('cartItems');
  let total = 0;
  items.innerHTML = cart.map((c, i) => {
    total += c.price;
    return `<div class="cart-item"><img src="${c.img}"><div class="cart-item-info"><div class="cart-item-name">${c.name}</div><div class="cart-item-price">${c.price} G</div></div><button onclick="cart.splice(${i},1);openCart()" style="background:none;border:none;color:var(--red);font-size:18px">✕</button></div>`;
  }).join('') || '<div style="text-align:center;color:var(--gray);padding:20px">Пусто</div>';
  
  document.getElementById('cartTotal').innerText = total + ' G';
  modal.classList.add('open');
  document.body.classList.add('modal-open');
}

async function checkout() {
  toast('Функция в разработке', 'info');
}

// ==================== LIVE ====================
async function loadLive() {
  try {
    const res = await api('/api/live');
    const track = document.getElementById('liveTrack');
    if(!res.list || res.list.length === 0) {
      track.innerHTML = '<div class="live-card"><div class="live-user">Нет дропов</div></div>';
      return;
    }
    track.innerHTML = res.list.map(x => `
      <div class="live-card ${x.skinPrice > 1000 ? 'golden' : ''}">
        <div class="live-user">${x.playerName}</div>
        <div class="live-skin"><img src="${x.skinImg}"><div class="live-pct">${x.pct}%</div></div>
      </div>
    `).join('');
  } catch(e) {}
}

// ==================== ИНИТ ====================
loadGame();
loadLive();
setInterval(loadLive, 30000);
</script>
