.sb{flex:1;padding:14px;overflow-y:auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.card{background:#1a1a22;border-radius:12px;padding:10px;text-align:center;position:relative;cursor:pointer;overflow:hidden}

.card .buy{width:100%;margin-top:6px;background:linear-gradient(135deg,#ffc107,#ff9800);color:#0a0a0f;border:none;padding:8px;border-radius:6px;font-weight:900;font-size:11px;cursor:pointer}
.card .buy:disabled{background:#2a2a3e;color:#666}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,15,20,.98);border:2px solid #ffc107;border-radius:16px;padding:20px 30px;color:#fff;font-size:14px;font-weight:700;z-index:999;opacity:0;pointer-events:none;transition:all .3s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.confetti{position:fixed;width:8px;height:8px;background:#ffc107;z-index:998;pointer-events:none;animation:fall 3s linear forwards}
@keyframes fall{0%{transform:translateY(-100vh)}100%{transform:translateY(100vh);opacity:0}}
</style></head><body>

<script>
  const BOT_URL='https://admin-bot-03ly.onrender.com';
const CDN='https://raw.githubusercontent.com/slavarazinkov333-collab/StandLoyTap-apap/main/skins/';
const allSkins=[
{name:'G22 «Flock»',icon:'🔫',price:22,color:'#4a9eff',img:CDN+'G22_flock.jpg'},
{name:'Berettas «Cascade»',icon:'🔫',price:100,color:'#4a9eff',img:CDN+'Berettas_Cascade.jpg'},
{name:'Berettas «Royal Rose»',icon:'🔫',price:200,color:'#ff4444',img:CDN+'Berettas_RoyalRose.jpg'},
{name:'Desert Eagle «Ace»',icon:'🔫',price:9,color:'#4a9eff',img:CDN+'DesertEagle_Ace.jpg'},
{name:'Desert Eagle «Aureate»',icon:'🔫',price:133400,color:'#ffd700',img:CDN+'DesertEagle_Aureate.jpg'},
{name:'Desert Eagle «Jads Stone»',icon:'🔫',price:5789,color:'#ff4444',img:CDN+'DesertEagle_JadsStone.jpg'},
{name:'Desert Eagle «Predator»',icon:'🔫',price:33,color:'#4a9eff',img:CDN+'DesertEagle_Predator.jpg'},
{name:'G22 «Briar»',icon:'🔫',price:23,color:'#9b8aff',img:CDN+'G22_Briar.jpg'},
{name:'Desert Eagle «Yakuza»',icon:'🔫',price:2909,color:'#ff4444',img:CDN+'DesertEagle_Yakuza.jpg'},
{name:'G22 «Frozen» (ST)',icon:'🔫',price:206700,color:'#ff4444',img:CDN+'G22_Frozen.jpg'},
{name:'G22 «Frost Wyrm»',icon:'🔫',price:43,color:'#ff69b4',img:CDN+'G22_FrostWyrm.jpg'}
];
function getRarity(color){const c=String(color).toLowerCase();if(c==='#ffd700')return'#ffd700';if(c==='#ff4444'||c==='#ff8c00')return'#ff4444';if(c==='#ff69b4'||c==='#ff00ff')return'#ff69b4';if(c==='#9b8aff'||c==='#7b61ff')return'#9b8aff';if(c==='#4a9eff'||c==='#00ffff')return'#4a9eff';return'#2a2a3e'}
function getUserId(){const t=window.Telegram?.WebApp?.initDataUnsafe?.user;return t?.id?String(t.id):'guest'}
let gold=0,inv=[],stats={spins:0,wins:0,loses:0},jackpot=1000,totalWithdraw=0,combo=0,xp=0,level=1,history=[];
let invMode='inv',selectedItems=[],targetSkin=null,selPct=null,isSpinning=false,fastMode=false;
function saveGame(){try{const uid=getUserId();if(uid==='guest')return;const data={gold,inv,stats,jackpot,totalWithdraw,xp,level,combo,history,ts:Date.now()};localStorage.setItem('sfap_save_'+uid,JSON.stringify(data));fetch(BOT_URL+'/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,data})})}catch(e){}}
async function loadGame(){try{const uid=getUserId();if(uid==='guest')return;try{const r=await fetch(BOT_URL+'/api/load/'+uid);const d=await r.json();if(d.ok&&d.data){applySaveData(d.data);return}}catch(e){}const l=localStorage.getItem('sfap_save_'+uid);if(l)applySaveData(JSON.parse(l))}catch(e){}}
function applySaveData(d){if(!d)return;if(typeof d.gold==='number')gold=d.gold;if(Array.isArray(d.inv))inv=d.inv;if(d.stats)stats=d.stats;if(typeof d.jackpot==='number')jackpot=d.jackpot;if(typeof d.totalWithdraw==='number')totalWithdraw=d.totalWithdraw;if(typeof d.xp==='number')xp=d.xp;if(typeof d.level==='number')level=d.level;if(typeof d.combo==='number')combo=d.combo;if(Array.isArray(d.history))history=d.history}
setInterval(saveGame,5000);
function toast(m,t){const e=document.getElementById('toast');e.className='toast '+(t||'')+' show';e.innerText=m;setTimeout(()=>e.classList.remove('show'),2000)}
function confetti(){for(let i=0;i<40;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=['#ffc107','#ff9800','#4CAF50','#ff4444','#4a9eff'][Math.floor(Math.random()*5)];c.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3500)}}
function updateBal(){document.getElementById('goldTop').innerText=Math.floor(gold);}
function formatPct(p){if(p>=0.1)return p.toFixed(1)+'%';if(p>=0.01)return p.toFixed(2)+'%';if(p>=0.001)return p.toFixed(3)+'%';return '0.01%'}
function openS(id){document.getElementById(id).classList.add('open');if(id==='shopScreen')rendInv();if(id==='profileScreen')rendProfile()}
function closeS(id){document.getElementById(id).classList.remove('open')}
function switchInv(m){invMode=m;rendInv()}
function rendInv(){const b=document.getElementById('invList');if(!b)return;
if(invMode==='shop'){let f=allSkins.slice();f.sort((a,b)=>a.price-b.price);b.innerHTML='<div class="grid">'+f.map(s=>{const can=gold>=s.price;const r=getRarity(s.color);return `<div class="card" style="--rarity:${r}">${s.img?`<img src="${s.img}" onerror="this.style.display='none'">`:''}<div class="name">${s.name}</div><div class="price">${s.price} G</div><button class="buy" ${can?'':'disabled'} onclick="buySkin('${s.name}','${s.icon}',${s.price})">${can?'Купить':'Мало'}</button></div>`}).join('')+'</div>'}
else{const f=inv;if(f.length===0){b.innerHTML='<div style="text-align:center;padding:60px 20px;color:#666"><div style="font-size:60px">📦</div><div>Инвентарь пуст</div></div>';return}b.innerHTML='<div class="grid">'+f.map((it,idx)=>{const r=getRarity(it.color||'#888');return `<div class="card" style="--rarity:${r}">${it.img?`<img src="${it.img}" onerror="this.style.display='none'">`:''}<div class="name">${it.name}</div><div class="price">${it.price||0} G</div><button class="buy" onclick="withdrawSkinDirect(${idx})">ВЫВЕСТИ</button></div>`}).join('')+'</div>'}}
function buySkin(n,i,p){if(gold<p){toast('❌ Мало G','lose');return}gold-=p;const sd=allSkins.find(s=>s.name===n);inv.push({name:n,icon:i,price:p,img:sd?sd.img:null,color:sd?sd.color:'#888'});updateBal();saveGame();rendInv();toast('✅ Куплено: '+n,'win');confetti()}
function withdrawSkinDirect(idx){if(idx<0||idx>=inv.length)return;const it=inv[idx];const uid=getUserId();const standCommission=0.2;const listPrice=Math.ceil((it.price||22)/(1-standCommission));const gg22Img=CDN+'G22_flock.jpg';
const modal=document.createElement('div');modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2000;display:flex;justify-content:center;align-items:center;padding:20px';modal.id='wdModal';
modal.innerHTML=`<div style="background:#0f0f14;border:2px solid #ffc107;border-radius:18px;padding:20px;max-width:380px;width:100%"><div style="font-size:14px;color:#ffc107;font-weight:900;text-align:center;margin-bottom:14px">📤 ВЫВОД</div><div style="background:#0a0a0f;border-radius:12px;padding:12px;margin-bottom:12px;text-align:center"><img src="${gg22Img}" style="width:100%;max-height:120px;object-fit:contain;border-radius:8px"><div style="font-size:14px;color:#fff;font-weight:700;margin-top:8px">GG22 «Flock»</div><div style="font-size:11px;color:#888">Купите и выставите за ${listPrice} G</div></div><div style="background:#1a1a22;border-radius:8px;padding:10px;margin-bottom:12px;font-size:12px;display:flex;justify-content:space-between"><span style="color:#888">Цена:</span><span style="color:#ffc107;font-weight:900">${listPrice} G</span></div><input type="text" id="wdPattern" placeholder="Введи паттерн" style="width:100%;background:#0a0a0f;border:2px solid #2a2a3e;color:#fff;padding:10px;border-radius:8px;font-size:13px;outline:none;margin-bottom:12px"><div id="wdErr" style="color:#ff4444;font-size:11px;margin-bottom:8px;display:none"></div><button id="wdOk" style="width:100%;background:linear-gradient(135deg,#ffc107,#ff9800);color:#0a0a0f;border:none;padding:14px;border-radius:10px;font-weight:900;font-size:14px;cursor:pointer;margin-bottom:6px">✅ ОТПРАВИТЬ</button><button onclick="document.getElementById('wdModal').remove()" style="width:100%;background:#2a2a3e;color:#888;border:none;padding:10px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer">❌ ОТМЕНА</button></div>`;
document.body.appendChild(modal);
document.getElementById('wdOk').onclick=async()=>{const pattern=document.getElementById('wdPattern').value.trim();const err=document.getElementById('wdErr');if(!pattern){err.style.display='block';err.innerText='❌ Введи паттерн';return}const account=window.Telegram?.WebApp?.initDataUnsafe?.user?.username?'@'+window.Telegram.WebApp.initDataUnsafe.user.username:'игрок';const btn=document.getElementById('wdOk');btn.disabled=true;btn.innerText='⏳ Отправка...';try{const r=await fetch(BOT_URL+'/api/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({skin:it.name,icon:it.icon,img:gg22Img,price:it.price,listPrice,skinName:'GG22 Flock',pattern,account,userId:uid})});const d=await r.json();if(d.ok){inv=inv.filter(i=>i!==it);totalWithdraw+=it.price||0;saveGame();rendInv();modal.remove();toast('✅ Заявка отправлена','win');confetti()}else{err.style.display='block';err.innerText='❌ Ошибка сервера';btn.disabled=false;btn.innerText='✅ ОТПРАВИТЬ'}}catch(e){err.style.display='block';err.innerText='❌ Нет связи';btn.disabled=false;btn.innerText='✅ ОТПРАВИТЬ'}}}
function spinUpgrade(){toast('🚧 Апгрейд в разработке','lose')}
function rendProfile(){const b=document.getElementById('profileBody');if(!b)return;const tgUser=window.Telegram?.WebApp?.initDataUnsafe?.user;const name=tgUser?.first_name||'Игрок';const photo=tgUser?.photo_url||'';const id=tgUser?.id||'—';b.innerHTML=`<div style="text-align:center;padding:16px"><div style="width:100px;height:100px;border-radius:50%;background:#1a1a22;margin:0 auto 12px;overflow:hidden;border:3px solid #ffc107;position:relative">${photo?`<img src="${photo}" style="width:100%;height:100%;object-fit:cover">`:`<div style="display:flex;justify-content:center;align-items:center;height:100%;font-size:40px">👤</div>`}<div style="position:absolute;bottom:0;right:0;width:20px;height:20px;background:#4caf50;border-radius:50%;border:3px solid #0a0a0f"></div></div><div style="font-size:20px;font-weight:900;color:#fff">${name}</div><div style="font-size:11px;color:#888;margin-top:4px">ID ${id}</div></div><div style="background:#1a1a22;border-radius:14px;padding:16px;margin-bottom:12px"><div style="font-size:11px;color:#888;margin-bottom:6px">Баланс</div><div style="font-size:32px;font-weight:900;color:#fff">${Math.floor(gold)} <span style="color:#ffc107">G</span></div></div><div style="background:#1a1a22;border-radius:14px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between"><div><div style="font-size:10px;color:#888">Всего выведено</div><div style="font-size:18px;font-weight:900;color:#4caf50">${Math.floor(totalWithdraw)} G</div></div><div><div style="font-size:10px;color:#888">Спинов</div><div style="font-size:18px;font-weight:900;color:#ffc107">${stats.spins}</div></div></div>`}
(async()=>{await loadGame();updateBal();rendInv();rendProfile();document.getElementById('onlineCount').innerText=Math.floor(Math.random()*10)+1;document.getElementById('visitsCount').innerText='1000+';setInterval(()=>document.getElementById('onlineCount').innerText=Math.floor(Math.random()*10)+1,5000)})();
</script></body></html>
