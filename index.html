<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>StandFliutApap</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#fff;font-family:Arial;display:flex;flex-direction:column;min-height:100vh;overflow-y:auto;user-select:none;position:relative}
body::before{content:'StandFliutApap';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);font-size:60px;font-weight:900;color:rgba(255,255,255,.04);white-space:nowrap;z-index:0;pointer-events:none}
.top{background:#0f0f1a;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2a4e;position:relative;z-index:1}
.acc{display:flex;align-items:center;gap:8px;cursor:pointer}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7b61ff,#4a3aff);display:flex;justify-content:center;align-items:center;font-size:15px;border:2px solid #9b8aff}
.nick{font-size:12px;font-weight:600}
.bal{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:#ffd700}
.plus{background:linear-gradient(135deg,#7b61ff,#4a3aff);color:#fff;border:none;width:24px;height:24px;border-radius:50%;font-size:16px;font-weight:700;cursor:pointer;margin-left:6px}
.set{background:none;border:none;color:#7b61ff;font-size:20px;cursor:pointer;margin-left:8px}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:12px;position:relative;z-index:1;min-height:100vh}
.skins{display:flex;justify-content:space-between;width:100%;gap:10px;margin-bottom:10px}
.slot{flex:1;background:#12121f;border:2px solid #2a2a4e;border-radius:14px;padding:10px;text-align:center;min-height:110px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.slot .si{font-size:40px;margin-bottom:6px}
.slot .sn{font-size:11px;font-weight:600}
.slot .sl{font-size:9px;color:#888;margin-top:2px}
.wheel-box{position:relative;width:280px;height:280px;margin:10px 0}
.wheel{width:100%;height:100%;border-radius:50%;background:conic-gradient(from 180deg,#ffd700 0deg var(--wa,90deg),#0a0a0f var(--wa,90deg) 360deg);border:8px solid #2a2a4e;position:relative;display:flex;justify-content:center;align-items:center}
.pt{font-size:36px;font-weight:900;color:#ffd700;z-index:2}
.pl{position:absolute;bottom:35%;font-size:12px;color:#aaa;z-index:2}
.arrow{position:absolute;top:0;left:50%;transform-origin:center 140px;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:20px solid #ffd700;filter:drop-shadow(0 0 10px rgba(255,215,0,.9));z-index:10}
.ubtn{width:100%;background:linear-gradient(135deg,#7b61ff,#4a3aff);color:#fff;border:none;padding:14px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;margin-top:10px}
.pcnt{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%;margin-top:10px}
.pb{background:#12121f;border:2px solid #2a2a4e;border-radius:10px;padding:10px 4px;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.pb.sel{border-color:#7b61ff;background:rgba(123,97,255,.15)}
.bottom{background:#0f0f1a;padding:8px;display:flex;justify-content:space-around;border-top:1px solid #2a2a4e;position:relative;z-index:1}
.nb{background:none;border:none;color:#666;font-size:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 10px;border-radius:10px}
.nb .ic{font-size:20px}
.scr{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0f;z-index:50;flex-direction:column;overflow-y:auto}
.scr.open{display:flex}
.sh{padding:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2a4e;background:#0f0f1a;position:sticky;top:0}
.sh h2{color:#7b61ff;font-size:16px}
.cb{background:none;border:none;color:#7b61ff;font-size:20px;cursor:pointer}
.sb{flex:1;overflow-y:auto;padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#12121f;border:1px solid #2a2a4e;border-radius:10px;margin-bottom:8px}
.row label{font-size:13px}
.row input[type=text]{background:#0a0a0f;border:1px solid #2a2a4e;color:#fff;padding:7px 10px;border-radius:7px;font-size:13px;width:130px}
.it{background:#12121f;border:1px solid #2a2a4e;border-radius:10px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.it .ii{display:flex;align-items:center;gap:10px}
.it .ic{font-size:22px}
.it .nm{font-size:13px;font-weight:600}
.it .pr{font-size:11px;color:#ffd700}
.bb{background:linear-gradient(135deg,#7b61ff,#4a3aff);color:#fff;border:none;padding:7px 14px;border-radius:18px;font-weight:600;font-size:11px;cursor:pointer}
.admin{background:#1a0a0a;border:2px solid #ff4444;border-radius:12px;padding:12px;margin-bottom:10px}
.admin h3{color:#ff4444;font-size:14px;margin-bottom:8px}
.admin .row{background:#2a0a0a;border-color:#ff4444}
.admin input[type=text]{width:80px}
</style>
</head>
<body>
<div class="top">
<div class="acc" onclick="openS('profileScreen')"><div class="av" id="topAv">👤</div><div class="nick" id="nick">Игрок</div></div>
<div style="display:flex;align-items:center">
<div class="bal"><span>⭐</span><span id="gold">20000</span></div>
<button class="plus" onclick="openS('shopScreen')">+</button>
<button class="set" onclick="openS('settingsScreen')">⚙️</button>
</div>
</div>
<div class="main">
<div class="skins">
<div class="slot" id="leftSlot"><div class="si">❓</div><div class="sn">Мой скин</div><div class="sl">Выбери в инвентаре</div></div>
<div class="slot" id="rightSlot"><div class="si">❓</div><div class="sn">Хочу получить</div><div class="sl">Выбери процент</div></div>
</div>
<div class="wheel-box"><div class="arrow" id="arrow"></div><div class="wheel" id="wheel"><div class="pt" id="pt">?%</div><div class="pl">средний шанс</div></div></div>
<button class="ubtn" onclick="spin()">⬆️ ПРОКАЧАТЬ</button>
<div class="pcnt" id="pcntList"></div>
</div>
<div class="bottom">
<button class="nb" onclick="openS('inventoryScreen')"><span class="ic">🎒</span><span>Инвентарь</span></button>
<button class="nb" onclick="openS('shopScreen')"><span class="ic">🛒</span><span>Магазин</span></button>
<button class="nb" onclick="openS('withdrawScreen')"><span class="ic">📤</span><span>Вывод</span></button>
</div>
<div class="scr" id="shopScreen"><div class="sh"><h2>🛒 Магазин</h2><button class="cb" onclick="closeS('shopScreen')">✕</button></div><div class="sb" id="shopBody"></div></div>
<div class="scr" id="inventoryScreen"><div class="sh"><h2>🎒 Инвентарь</h2><button class="cb" onclick="closeS('inventoryScreen')">✕</button></div><div class="sb" id="invBody"></div></div>
<div class="scr" id="settingsScreen"><div class="sh"><h2>⚙️ Настройки</h2><button class="cb" onclick="closeS('settingsScreen')">✕</button></div><div class="sb">
<div class="row"><label>Имя</label><input type="text" id="nameIn" value="Игрок" onchange="changeName()"></div>
<div class="admin"><h3>👑 АДМИН</h3>
<div class="row"><label>Подкрутка %</label><input type="text" id="adminChance" placeholder="0.3"></div>
<div class="row"><label>Баланс</label><input type="text" id="adminBalance" placeholder="20000"><button class="bb" onclick="adminSetBalance()">ОК</button></div>
<div class="row"><label>Всегда выигрыш</label><input type="checkbox" id="adminAlwaysWin" onchange="adminToggleWin()"></div>
</div>
</div></div>
<div class="scr" id="withdrawScreen"><div class="sh"><h2>📤 Вывод</h2><button class="cb" onclick="closeS('withdrawScreen')">✕</button></div><div class="sb"><p style="text-align:center;color:#888">Скоро!</p></div></div>
<div class="scr" id="profileScreen"><div class="sh"><h2>👤 Профиль</h2><button class="cb" onclick="closeS('profileScreen')">✕</button></div><div class="sb"><p style="color:#888">Профиль</p></div></div>
<script>
let gold=20000,isSpinning=false,selItem=null,selPct=null,adminChance=null,adminAlwaysWin=false;
let inv=[{id:'akr',name:'AKR «Дракон»',icon:'🔫'},{id:'m4',name:'M4A1 «Ворон»',icon:'🔫'},{id:'awm',name:'AWM «Хищник»',icon:'🎯'}];
const pcts=[90,67,55,44,33,22];
const rewards={90:{name:'AKR «Ржавый»',icon:'🔫'},67:{name:'AKR «Синий»',icon:'🔫'},55:{name:'AKR «Красный»',icon:'🔫'},44:{name:'AKR «Фиолетовый»',icon:'🔫'},33:{name:'AKR «Золотой»',icon:'🔫'},22:{name:'AKR «Легендарный»',icon:'👑'}};
function updBal(){document.getElementById('gold').innerText=gold}
function openS(id){if(id==='shopScreen')rendShop();if(id==='inventoryScreen')rendInv();document.getElementById(id).classList.add('open')}
function closeS(id){document.getElementById(id).classList.remove('open')}
function rendShop(){const b=document.getElementById('shopBody');const items=[{id:'a2',name:'AKR «Огонь»',icon:'🔫',price:500},{id:'m2',name:'M4A1 «Лёд»',icon:'🔫',price:400}];b.innerHTML=items.map(i=>{const c=gold>=i.price;return `<div class="it" onclick="buy('${i.id}','${i.name}','${i.icon}',${i.price})"><div class="ii"><span class="ic">${i.icon}</span><div><div class="nm">${i.name}</div><div class="pr">${i.price} голды</div></div></div><button class="bb" ${c?'':'disabled'}>${c?'Купить':'Мало'}</button></div>`}).join('')}
function buy(id,n,ic,p){if(gold<p)return;gold-=p;inv.push({id,name:n,icon:ic});updBal();rendShop();alert('✅ Куплено: '+n)}
function rendInv(){const b=document.getElementById('invBody');if(inv.length===0){b.innerHTML='<p style="color:#888;text-align:center">Пусто.</p>';return}b.innerHTML=inv.map((it,i)=>`<div class="it" onclick="selItem(${i})"><div class="ii"><span class="ic">${it.icon}</span><div><div class="nm">${it.name}</div><div class="pr">Нажми</div></div></div></div>`).join('')}
function selItem(i){selItem=inv[i];closeS('inventoryScreen');rendMain()}
function rendMain(){if(!selItem){document.getElementById('leftSlot').innerHTML='<div class="si">❓</div><div class="sn">Мой скин</div><div class="sl">Выбери в инвентаре</div>'}else{document.getElementById('leftSlot').innerHTML=`<div class="si">${selItem.icon}</div><div class="sn">${selItem.name}</div><div class="sl">Мой скин</div>`}document.getElementById('rightSlot').innerHTML='<div class="si">❓</div><div class="sn">Хочу получить</div><div class="sl">Выбери процент</div>';document.getElementById('pcntList').innerHTML=pcts.map(p=>`<button class="pb" onclick="selP(${p})">${p}%</button>`).join('');document.getElementById('pt').innerText=selPct===null?'?%':selPct.toFixed(1)+'%'}
function selP(p){selPct=p;document.querySelectorAll('.pb').forEach(b=>{b.classList.remove('sel');if(b.innerText===p+'%')b.classList.add('sel')});if(selItem){const r=rewards[p];document.getElementById('rightSlot').innerHTML=`<div class="si">${r.icon}</div><div class="sn">${r.name}</div><div class="sl">Можно улучшить</div>`}document.getElementById('pt').innerText=p.toFixed(1)+'%';document.getElementById('wheel').style.setProperty('--wa',(p/100*360)+'deg')}
function spin(){if(!selItem){alert('Выбери скин!');return}if(selPct===null){alert('Выбери процент!');return}if(isSpinning)return;isSpinning=true;const a=document.getElementById('arrow');const d=Math.floor(Math.random()*1440)+1440;a.style.transition='transform 6s cubic-bezier(.15,.6,.3,1)';a.style.transform=`translateX(-50%) rotate(${d}deg)`;setTimeout(()=>{let ec=selPct;if(adminChance!==null)ec=adminChance;if(adminAlwaysWin)ec=100;const roll=Math.floor(Math.random()*100)+1;const win=roll<=ec;if(win){gold+=200;updBal();const r=rewards[Math.round(selPct)]||{name:'Новый скин',icon:'🔫'};alert('🎉 Улучшено! '+r.name)}else{alert('😢 Сгорел!');inv=inv.filter(i=>i!==selItem)}isSpinning=false;selItem=null;selPct=null;a.style.transition='none';a.style.transform='translateX(-50%) rotate(0deg)';document.getElementById('wheel').style.setProperty('--wa','90deg');rendMain()},6000)}
function adminSetBalance(){const v=parseInt(document.getElementById('adminBalance').value);if(!isNaN(v)){gold=v;updBal();alert('✅ Баланс: '+v)}}
function adminToggleWin(){adminAlwaysWin=document.getElementById('adminAlwaysWin').checked}
function changeName(){const n=document.getElementById('nameIn').value;document.getElementById('nick').innerText=n}
updBal();rendMain();
</script>
</body>
</html>
