<script>
const BOT_URL='https://admin-bot-03ly.onrender.com';
const CDN='https://raw.githubusercontent.com/slavarazinkov333-collab/StandLoyTap-apap/main/skins/';
const allSkins=[{name:'G22 «Flock»',icon:'🔫',price:22,color:'#4a9eff',img:CDN+'G22_flock.jpg'},{name:'Berettas «Cascade»',icon:'🔫',price:100,color:'#4a9eff',img:CDN+'Berettas_Cascade.jpg'},{name:'Berettas «Royal Rose»',icon:'🔫',price:200,color:'#ff4444',img:CDN+'Berettas_RoyalRose.jpg'},{name:'Desert Eagle «Ace»',icon:'🔫',price:9,color:'#4a9eff',img:CDN+'DesertEagle_Ace.jpg'},{name:'Desert Eagle «Aureate»',icon:'🔫',price:133400,color:'#ffd700',img:CDN+'DesertEagle_Aureate.jpg'},{name:'Desert Eagle «Jads Stone»',icon:'🔫',price:5789,color:'#ff4444',img:CDN+'DesertEagle_JadsStone.jpg'},{name:'Desert Eagle «Predator»',icon:'🔫',price:33,color:'#4a9eff',img:CDN+'DesertEagle_Predator.jpg'},{name:'G22 «Briar»',icon:'🔫',price:23,color:'#9b8aff',img:CDN+'G22_Briar.jpg'},{name:'Desert Eagle «Yakuza»',icon:'🔫',price:2909,color:'#ff4444',img:CDN+'DesertEagle_Yakuza.jpg'},{name:'G22 «Frozen» (ST)',icon:'🔫',price:206700,color:'#ff4444',img:CDN+'G22_Frozen.jpg'},{name:'G22 «Frost Wyrm»',icon:'🔫',price:43,color:'#ff69b4',img:CDN+'G22_FrostWyrm.jpg'}];
function getRarity(c){c=String(c).toLowerCase();if(c==='#ffd700')return'#ffd700';if(c==='#ff4444'||c==='#ff8c00')return'#ff4444';if(c==='#ff69b4'||c==='#ff00ff')return'#ff69b4';if(c==='#9b8aff'||c==='#7b61ff')return'#9b8aff';if(c==='#4a9eff'||c==='#00ffff')return'#4a9eff';return'transparent'}
function getUserId(){const t=window.Telegram?.WebApp?.initDataUnsafe?.user;return t?.id?String(t.id):'guest'}
function getUser(){return window.Telegram?.WebApp?.initDataUnsafe?.user||null}
let gold=0,inv=[],stats={spins:0,wins:0,loses:0},jackpot=1000,totalWithdraw=0,history=[];
let selectedItems=[],targetSkin=null,selPct=null,isSpinning=false;
let cart=[];let invMode='inv',bigTab='inv';
let soundEnabled=localStorage.getItem('sfap_sound')!=='0';
// ==== ЗВУКИ ====
let audioCtx=null;
function initAudio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}}
function beep(f,t,d,v){if(!soundEnabled)return;try{initAudio();if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=f;o.type=t||'sine';g.gain.setValueAtTime(v||.1,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.start();o.stop(audioCtx.currentTime+d)}catch(e){}}
function sClick(){beep(600,'square',.05,.05)}
function sTick(){beep(1500,'sine',.04,.05)}
function sWin(){beep(800,'sine',.3,.15);setTimeout(()=>beep(1000,'sine',.3,.15),100);setTimeout(()=>beep(1300,'sine',.5,.15),200)}
function sLose(){beep(200,'sawtooth',.5,.15)}
function sBuy(){beep(1000,'sine',.15,.1)}
function sPromo(){beep(1200,'sine',.15,.15);setTimeout(()=>beep(1500,'sine',.2,.15),100)}
document.addEventListener('click',e=>{if(e.target.tagName==='BUTTON'||e.target.closest('button'))sClick()},true);
// ==== ИГРА ====
function saveGame(){try{const uid=getUserId();if(uid==='guest')return;const data={gold,inv,stats,jackpot,totalWithdraw,history,ts:Date.now()};localStorage.setItem('sfap_save_'+uid,JSON.stringify(data));fetch(BOT_URL+'/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,data})})}catch(e){}}
async function loadGame(){try{const uid=getUserId();if(uid==='guest')return;try{const r=await fetch(BOT_URL+'/api/load/'+uid);const d=await r.json();if(d.ok&&d.data){applySaveData(d.data);return}}catch(e){}const l=localStorage.getItem('sfap_save_'+uid);if(l)applySaveData(JSON.parse(l))}catch(e){}}
function applySaveData(d){if(!d)return;if(typeof d.gold==='number')gold=d.gold;if(Array.isArray(d.inv))inv=d.inv;if(d.stats)stats=d.stats;if(typeof d.jackpot==='number')jackpot=d.jackpot;if(typeof d.totalWithdraw==='number')totalWithdraw=d.totalWithdraw;if(Array.isArray(d.history))history=d.history}
setInterval(saveGame,5000);
function toast(m,t){const e=document.getElementById('toast');e.className='toast '+(t||'')+' show';e.innerText=m;setTimeout(()=>e.classList.remove('show'),2500)}
function confetti(){for(let i=0;i<80;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=['#e50914','#8b0000','#4CAF50','#fff','#ff2d2d','#ffd700'][Math.floor(Math.random()*6)];c.style.animationDelay=Math.random()*.5+'s';c.style.width=(6+Math.random()*8)+'px';c.style.height=c.style.width;document.body.appendChild(c);setTimeout(()=>c.remove(),3500)}}
function updateBal(){document.getElementById('goldTop').innerText=Math.floor(gold).toLocaleString('ru-RU');document.getElementById('incomeVal').innerText=Math.floor(totalWithdraw).toLocaleString('ru-RU')}
function formatPct(p){if(p>=0.1)return p.toFixed(1)+'%';if(p>=0.01)return p.toFixed(2)+'%';if(p>=0.001)return p.toFixed(3)+'%';return '0.01%'}
function openS(id){document.getElementById(id).classList.add('open');if(id==='profileScreen')rendProfile();if(id==='settingsScreen')rendSettings()}
function closeS(id){document.getElementById(id).classList.remove('open')}
function scrollToShop(){switchBigTab('inv');switchSub('shop');document.getElementById('invList').scrollIntoView({behavior:'smooth'})}
function drawTicks(){const t=document.getElementById('wheelTicks');if(!t)return;let h='';for(let i=0;i<36;i++){const a=i*(360/36);const maj=i%3===0;h+=`<div class="tick ${maj?'major':''}" style="--a:${a}deg"></div>`}t.innerHTML=h}
function switchBigTab(m){bigTab=m;document.getElementById('bigTabInv').classList.toggle('active',m==='inv');document.getElementById('bigTabTarget').classList.toggle('active',m==='target');document.getElementById('panelInv').classList.toggle('active',m==='inv');document.getElementById('panelTarget').classList.toggle('active',m==='target');if(m==='target')rendTargetList()}
function switchSub(m){invMode=m;document.getElementById('subInv').classList.toggle('active',m==='inv');document.getElementById('subShop').classList.toggle('active',m==='shop');rendInv()}
function rendInv(){const b=document.getElementById('invList');if(!b)return;const q=(document.getElementById('searchInp')?.value||'').toLowerCase();
if(invMode==='shop'){let f=allSkins.filter(s=>s.name.toLowerCase().includes(q));f.sort((a,b)=>a.price-b.price);if(f.length===0){b.innerHTML='<div class="empty-block" style="grid-column:span 2"><div class="empty-icon">🔍</div><div class="empty-title">Ничего не найдено</div></div>';return}b.innerHTML=f.map(s=>{const r=getRarity(s.color);const inCart=cart.find(c=>c.name===s.name);return `<div class="card" style="--rarity:${r}" onclick="toggleCart('${s.name}','${s.icon}',${s.price})">${inCart?'<div class="check">✓</div>':''}${s.img?`<img src="${s.img}" onerror="this.style.display='none'">`:''}<div class="cn">${s.name.split(' ')[0]}</div><div class="nn">${s.name}</div><div class="pn"><span class="s1">S1</span><span class="pr">${s.price.toLocaleString('ru-RU')} G</span></div></div>`}).join('')}
else{const f=inv.filter(it=>it.name.toLowerCase().includes(q));if(f.length===0){b.innerHTML='<div class="empty-block" style="grid-column:span 2"><div class="empty-icon">📦</div><div class="empty-title">Инвентарь пуст</div><div class="empty-sub">У вас пока нет подходящих предметов для улучшения</div></div>';return}b.innerHTML=f.map(it=>{const r=getRarity(it.color||'#888');const realIdx=inv.indexOf(it);return `<div class="card" style="--rarity:${r}" id="card-${realIdx}" onclick="toggleCard(${realIdx})">${it.img?`<img src="${it.img}" onerror="this.style.display='none'">`:''}<div class="cn">${it.name.split(' ')[0]}</div><div class="nn">${it.name}</div><div class="pn"><span class="s1">S1</span><span class="pr">${(it.price||0).toLocaleString('ru-RU')} G</span></div><div class="card-actions"><button class="btn-upg" onclick="event.stopPropagation();addToUpgrade(${realIdx})">⬆ В АПГРЕЙД</button><button class="btn-wd" onclick="event.stopPropagation();withdrawSkinDirect(${realIdx})">📤 ВЫВЕСТИ</button><button class="btn-sell" onclick="event.stopPropagation();sellSkin(${realIdx})">💸 ПРОДАТЬ</button></div></div>`}).join('')}}
function rendTargetList(){const b=document.getElementById('targetList');if(!b)return;const q=(document.getElementById('targetSearchInp')?.value||'').toLowerCase();let f=allSkins.filter(s=>s.name.toLowerCase().includes(q));f.sort((a,b)=>a.price-b.price);b.innerHTML=f.map(s=>{const r=getRarity(s.color);const isSel=targetSkin&&targetSkin.name===s.name;return `<div class="card" style="--rarity:${r};${isSel?'border-color:var(--red)':''}" onclick="pickTargetCard('${s.name}','${s.icon}',${s.price},'${s.color}')">${isSel?'<div class="check">✓</div>':''}${s.img?`<img src="${s.img}" onerror="this.style.display='none'">`:''}<div class="cn">${s.name.split(' ')[0]}</div><div class="nn">${s.name}</div><div class="pn"><span class="s1">S1</span><span class="pr">${s.price.toLocaleString('ru-RU')} G</span></div></div>`}).join('')}
function toggleCard(idx){const c=document.getElementById('card-'+idx);if(!c)return;const isOpen=c.classList.contains('open');document.querySelectorAll('.card.open').forEach(x=>x.classList.remove('open'));if(!isOpen)c.classList.add('open')}
function toggleCart(name,icon,price){const i=cart.findIndex(c=>c.name===name);if(i>=0)cart.splice(i,1);else cart.push({name,icon,price,qty:1});updateCartBadge();rendInv()}
function updateCartBadge(){const b=document.getElementById('cartBadge');if(!b)return;const t=cart.reduce((s,c)=>s+c.qty,0);if(t>0){b.style.display='block';b.innerText=t}else b.style.display='none'}
function pickTargetCard(name,icon,price,color){const skin=allSkins.find(s=>s.name===name);targetSkin={name,icon,price,color,img:skin?skin.img:null};rendMain();rendTargetList();toast('🎯 Цель: '+name,'win')}
function addToUpgrade(idx){const it=inv[idx];if(!it)return;if(!selectedItems.includes(it)){if(selectedItems.length>=6){toast('❌ Макс 6','lose');return}selectedItems.push(it)}rendMain();document.querySelectorAll('.card.open').forEach(c=>c.classList.remove('open'));toast('⬆️ Добавлен','win')}
function sellSkin(idx){if(idx<0||idx>=inv.length)return;const it=inv[idx],sp=Math.round((it.price||50)*0.7);gold+=sp;inv.splice(idx,1);selectedItems=selectedItems.filter(i=>i!==it);updateBal();saveGame();rendInv();rendMain();toast('💸 +'+sp+' G','win');sBuy()}
function setPct(p,el){
  if(inv.length===0){toast('❌ Инвентарь пуст','lose');return}
  // Авто-подбор скина из инвентаря под процент (цель = скин × 100 / процент)
  let baseSkin=selectedItems[0]||inv[0];
  if(selectedItems.length>0)baseSkin=selectedItems[0];
  const needTargetPrice=Math.round(baseSkin.price*100/p);
  // Ищем ближайшую цель из магазина
  let closest=allSkins[0],md=Infinity;
  allSkins.forEach(s=>{if(s.price<baseSkin.price)return;const d=Math.abs(s.price-needTargetPrice);if(d<md){md=d;closest=s}});
  if(!closest||closest.price<baseSkin.price){toast('❌ Нет подходящей цели','lose');return}
  targetSkin={...closest};
  selectedItems=[baseSkin];
  selPct=p;
  document.querySelectorAll('.pb').forEach(b=>b.classList.remove('sel'));
  if(el)el.classList.add('sel');
  document.getElementById('pt').innerText=formatPct(p);
  const w=document.getElementById('wheel');
  w.style.setProperty('--wa',(p/100)*360+'deg');
  rendMain();
  toast('🎯 '+baseSkin.name+' → '+closest.name,'win');
}
function rendMain(){if(selectedItems.length===0){document.getElementById('leftIcons').innerHTML='';document.getElementById('selCount').innerText='0 ИЗ 6'}else{const ic=selectedItems.map(s=>s.img?`<img src="${s.img}">`:`<span style="font-size:50px">${s.icon}</span>`).join('');document.getElementById('leftIcons').innerHTML=ic;document.getElementById('selCount').innerText=selectedItems.length+' ИЗ 6'}if(targetSkin){const ih=targetSkin.img?`<img src="${targetSkin.img}">`:`<span style="font-size:50px">${targetSkin.icon}</span>`;document.getElementById('rightIcons').innerHTML=ih;document.getElementById('targetCount').innerText=targetSkin.price+' G'}else{document.getElementById('rightIcons').innerHTML='';document.getElementById('targetCount').innerText='АВТО'}checkUpgradeBtn()}
function checkUpgradeBtn(){const hs=selectedItems.length>0,ht=targetSkin!==null,hp=selPct!==null;const btn=document.getElementById('upgradeBtn');if(hs&&ht&&hp&&!isSpinning){btn.disabled=false;btn.classList.add('active')}else{btn.disabled=true;btn.classList.remove('active')}}
function spinUpgrade(){
  if(selectedItems.length===0){toast('❌ Выбери скины','lose');return}
  if(!targetSkin){toast('❌ Выбери процент','lose');return}
  if(!selPct){toast('❌ Выбери процент','lose');return}
  if(isSpinning)return;
  isSpinning=true;
  const wrap=document.getElementById('arrowWrap');
  const w=document.getElementById('wheel');
  // Против часовой: отрицательный угол
  const ra=Math.floor(Math.random()*360);
  const td=-1440-ra;
  const sd=5;
  wrap.style.transition='none';
  wrap.style.transform='rotate(0deg)';
  wrap.offsetHeight;
  wrap.style.transition='transform '+sd+'s cubic-bezier(.17,.67,.25,1)';
  wrap.style.transform=`rotate(${td}deg)`;
  document.getElementById('upgradeBtn').disabled=true;
  // Звук тика
  let tickCount=0;
  const tickInt=setInterval(()=>{sTick();tickCount++;if(tickCount>30)clearInterval(tickInt)},150);
  setTimeout(()=>{
    clearInterval(tickInt);
    // Угол стрелки от 6 часов, против часовой
    const arrowFromBottom=(Math.abs(td)%360);
    const winZone=(selPct/100)*360;
    const win=arrowFromBottom<=winZone;
    if(win){
      selectedItems.forEach(it=>{inv=inv.filter(i=>i!==it)});
      const ws={...targetSkin};
      inv.push(ws);
      stats.wins++;
      showWinModal(ws);
      sWin();
      confetti();
    } else {
      stats.loses++;
      selectedItems.forEach(it=>{inv=inv.filter(i=>i!==it)});
      showLoseModal();
      sLose();
    }
    stats.spins++;
    isSpinning=false;
    selectedItems=[];
    targetSkin=null;
    selPct=null;
    wrap.style.transition='none';
    wrap.style.transform='rotate(0deg)';
    w.style.setProperty('--wa','0deg');
    document.getElementById('pt').innerText='?%';
    document.querySelectorAll('.pb').forEach(b=>b.classList.remove('sel'));
    rendMain();
    rendInv();
    saveGame();
  },sd*1000);
}

}
function openCart(){if(cart.length===0){toast('🛒 Корзина пуста','lose');return}const m=document.createElement('div');m.id='cartModal';m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:3000;display:flex;justify-content:center;align-items:flex-end';const total=cart.reduce((s,c)=>s+c.price*c.qty,0);m.innerHTML=`<div style="background:var(--dark2);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><div style="font-size:18px;font-weight:900;color:#fff">КОРЗИНА</div><button onclick="document.getElementById('cartModal').remove()" style="background:var(--dark3);border:none;color:#fff;width:36px;height:36px;border-radius:10px;font-size:18px;cursor:pointer">✕</button></div>${cart.map((c,i)=>`<div style="background:var(--dark3);border-radius:14px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px"><div style="width:60px;height:60px;background:var(--dark);border-radius:10px;display:flex;justify-content:center;align-items:center;overflow:hidden">${allSkins.find(s=>s.name===c.name)?.img?`<img src="${allSkins.find(s=>s.name===c.name).img}" style="width:100%;height:100%;object-fit:contain">`:`<span style="font-size:28px">${c.icon}</span>`}</div><div style="flex:1"><div style="font-size:13px;font-weight:900;color:#fff">${c.name}</div><div style="font-size:15px;font-weight:900;color:var(--red);margin-top:4px">${(c.price*c.qty).toLocaleString('ru-RU')} G</div></div><div style="display:flex;gap:4px;align-items:center"><button onclick="changeQty(${i},-1)" style="width:28px;height:28px;background:var(--dark);border:none;color:#fff;border-radius:8px;cursor:pointer">−</button><span style="width:24px;text-align:center;font-weight:900;color:#fff">${c.qty}</span><button onclick="changeQty(${i},1)" style="width:28px;height:28px;background:var(--dark);border:none;color:#fff;border-radius:8px;cursor:pointer">+</button></div></div>`).join('')}<div style="display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-top:1px solid rgba(255,255,255,.05)"><div style="font-size:12px;color:var(--gray);font-weight:800">ИТОГО:</div><div style="font-size:24px;font-weight:900;color:var(--red)">${total.toLocaleString('ru-RU')} G</div></div><div style="display:flex;gap:8px"><button onclick="clearCart()" style="flex:1;background:var(--dark4);color:var(--gray2);border:none;padding:14px;border-radius:12px;font-weight:900;cursor:pointer">ОЧИСТИТЬ</button><button onclick="checkout()" style="flex:2;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border:none;padding:14px;border-radius:12px;font-weight:900;cursor:pointer">КУПИТЬ (${cart.length})</button></div></div>`;document.body.appendChild(m)}
function changeQty(i,d){cart[i].qty+=d;if(cart[i].qty<1)cart.splice(i,1);document.getElementById('cartModal').remove();if(cart.length>0)openCart();updateCartBadge();rendInv()}
function clearCart(){cart=[];document.getElementById('cartModal')?.remove();updateCartBadge();rendInv()}
function checkout(){const total=cart.reduce((s,c)=>s+c.price*c.qty,0);if(gold<total){toast('❌ Мало G','lose');return}cart.forEach(c=>{gold-=c.price*c.qty;const sd=allSkins.find(s=>s.name===c.name);for(let i=0;i<c.qty;i++)inv.push({name:c.name,icon:c.icon,price:c.price,img:sd?sd.img:null,color:sd?sd.color:'#888'})});cart=[];updateCartBadge();document.getElementById('cartModal').remove();updateBal();saveGame();rendInv();toast('✅ Куплено!','win');sBuy();confetti()}
function withdrawSkinDirect(idx){
  const it=inv[idx];if(!it)return;
  const uid=getUserId();
  const u=getUser();
  const listPrice=Math.ceil((it.price||22)/0.8);
  const gg22Img=CDN+'G22_flock.jpg';
  const av=u?.photo_url?`<img src="${u.photo_url}" style="width:100%;max-width:200px;border-radius:50%;margin-bottom:16px;border:3px solid var(--red)">`:'<div style="font-size:80px;margin-bottom:16px">👤</div>';
  const m=document.createElement('div');
  m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:3000;display:flex;justify-content:center;align-items:center;padding:20px;overflow-y:auto';
  m.id='wdModal';
  m.innerHTML=`<div class="wd-step">
    <div class="wd-step-title">📤 ЗАЯВКА НА ВЫВОД</div>
    ${av}
    <div class="wd-step-text"><b>Шаг 1.</b> Поставь эту аватарку в Standoff<br>и добавь @${u?.username||'username'}</div>
    <img src="${gg22Img}">
    <div class="wd-step-text"><b>Шаг 2.</b> Купи скин <b>«GG22 Flock»</b> в магазине и выстави за <b style="color:var(--red)">${listPrice} G</b></div>
    <input type="text" id="wdP" placeholder="Введи паттерн скина" style="width:100%;background:var(--dark);border:1.5px solid var(--dark4);color:#fff;padding:12px;border-radius:10px;font-size:13px;outline:none;margin-bottom:10px;margin-top:10px">
    <div id="wdE" style="color:var(--red);font-size:11px;margin-bottom:10px;display:none;text-align:center"></div>
    <button class="wd-step-btn" id="wdOk">✅ ОТПРАВИТЬ ЗАЯВКУ</button>
    <button class="wd-step-btn secondary" onclick="document.getElementById('wdModal').remove()">❌ ОТМЕНА</button>
  </div>`;
  document.body.appendChild(m);
  document.getElementById('wdOk').onclick=async()=>{
    const pattern=document.getElementById('wdP').value.trim();
    const err=document.getElementById('wdE');
    if(!pattern){err.style.display='block';err.innerText='❌ Введи паттерн';return}
    const account=u?.username?'@'+u.username:'игрок';
    const btn=document.getElementById('wdOk');
    btn.disabled=true;btn.innerText='Отправка...';
    try{
      const r=await fetch(BOT_URL+'/api/withdraw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({skin:it.name,icon:it.icon,img:gg22Img,price:it.price,listPrice,skinName:'GG22 Flock',pattern,account,userId:uid})});
      const d=await r.json();
      if(d.ok){inv=inv.filter(i=>i!==it);totalWithdraw+=it.price||0;saveGame();rendInv();rendMain();m.remove();toast('✅ Заявка отправлена','win');confetti();updateBal();sWin()}
      else{err.style.display='block';err.innerText='❌ Ошибка';btn.disabled=false;btn.innerText='ОТПРАВИТЬ'}
    }catch(e){err.style.display='block';err.innerText='❌ Нет связи';btn.disabled=false;btn.innerText='ОТПРАВИТЬ'}
  };
}
function rendProfile(){const b=document.getElementById('profileBody');if(!b)return;const u=getUser();const name=u?.first_name||'Игрок';const photo=u?.photo_url||'';const id=u?.id||'—';const isLogged=!!u;b.innerHTML=`<div class="profile-header"><div class="profile-avatar">${photo?`<img src="${photo}">`:`<div style="display:flex;justify-content:center;align-items:center;height:100%;font-size:44px">👤</div>`}</div><div class="profile-name">${name}</div><div class="profile-id">ID ${id}</div></div><div class="profile-bal"><div class="profile-bal-label">БАЛАНС</div><div class="profile-bal-val">${Math.floor(gold).toLocaleString('ru-RU')} <span style="color:var(--red);font-size:20px">G</span></div></div><div class="profile-stats"><div class="profile-stat"><div class="profile-stat-label">ВЫВЕДЕНО</div><div class="profile-stat-val" style="color:var(--green)">${Math.floor(totalWithdraw).toLocaleString('ru-RU')}</div></div><div class="profile-stat"><div class="profile-stat-label">СПИНОВ</div><div class="profile-stat-val" style="color:var(--red)">${stats.spins}</div></div><div class="profile-stat"><div class="profile-stat-label">ПОБЕД</div><div class="profile-stat-val" style="color:var(--green)">${stats.wins}</div></div><div class="profile-stat"><div class="profile-stat-label">ПОРАЖЕНИЙ</div><div class="profile-stat-val" style="color:var(--red)">${stats.loses}</div></div></div>${isLogged?`<button class="btn-full" style="background:linear-gradient(135deg,#333,#111);color:#fff" onclick="logout()">🚪 ВЫЙТИ</button>`:`<button class="btn-full" style="background:linear-gradient(135deg,var(--red),var(--red2));color:#fff" onclick="login()">🔐 ВОЙТИ</button>`}`}
function showHistory(){const h=history.length>0?history.slice(0,20).map(x=>`<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px">${x.text||x}</div>`).join(''):'<div style="text-align:center;color:#666;padding:20px">Нет записей</div>';const m=document.createElement('div');m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:3000;display:flex;justify-content:center;align-items:center;padding:20px';m.innerHTML=`<div style="background:var(--dark2);border-radius:20px;padding:20px;max-width:400px;width:100%"><div style="display:flex;justify-content:space-between;margin-bottom:16px"><div style="font-size:16px;font-weight:900;color:#fff">📜 ИСТОРИЯ</div><button onclick="this.closest('div').parentElement.parentElement.remove()" style="background:var(--dark3);border:none;color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer">✕</button></div>${h}</div>`;document.body.appendChild(m)}
function login(){toast('✅ Вход через Telegram','win')}
function logout(){if(confirm('Выйти?')){toast('🚪 Выход','lose');setTimeout(()=>location.reload(),500)}}
function rendSettings(){const b=document.getElementById('settingsBody');if(!b)return;const used=localStorage.getItem('sfap_ref_used_'+getUserId());b.innerHTML=`<div style="font-size:11px;color:var(--red);font-weight:900;margin-bottom:8px">🔊 ЗВУК</div><div class="settings-item"><label>Звуки</label><div class="toggle ${soundEnabled?'on':''}" id="sndToggle" onclick="toggleSound()"></div></div><div style="font-size:11px;color:var(--red);font-weight:900;margin:16px 0 8px">👤 ПРОФИЛЬ</div><div class="settings-item"><label>🎁 Реф. код</label><input type="text" id="refIn" placeholder="${used||'Код'}" ${used?'disabled':''}><button class="settings-btn" onclick="applyRef()">${used?'✅':'ОК'}</button></div><div class="settings-item"><label>🎁 Промокод</label><input type="text" id="promoIn" placeholder="Код"><button class="settings-btn" onclick="applyPromo()">ОК</button></div><div style="font-size:11px;color:var(--red);font-weight:900;margin:16px 0 8px">🗑 СБРОС</div><div class="settings-item"><label>Сбросить</label><button class="settings-btn" style="background:linear-gradient(135deg,#333,#111)" onclick="if(confirm('Удалить?')){localStorage.clear();location.reload()}">СБРОС</button></div>`}
function toggleSound(){soundEnabled=!soundEnabled;localStorage.setItem('sfap_sound',soundEnabled?'1':'0');const t=document.getElementById('sndToggle');if(t)t.classList.toggle('on',soundEnabled);toast(soundEnabled?'🔊 Вкл':'🔇 Выкл','win')}
function applyRef(){const input=document.getElementById('refIn');if(!input||input.disabled)return;const code=input.value.trim().toLowerCase();const codes={'vass':500,'slava':300,'standoff':1000};if(!codes[code]){toast('❌ Неверный','lose');return}localStorage.setItem('sfap_ref_used_'+getUserId(),code);gold+=codes[code];updateBal();saveGame();rendSettings();toast('🎉 +'+codes[code]+' G','win');sPromo();confetti()}
function applyPromo(){const input=document.getElementById('promoIn');if(!input)return;const code=input.value.trim().toLowerCase();const codes={'flayy':500,'admin':5000};if(!codes[code]){toast('❌ Неверный','lose');return}const key='sfap_promo_'+code+'_'+getUserId();if(localStorage.getItem(key)){toast('❌ Уже','lose');return}localStorage.setItem(key,'1');gold+=codes[code];updateBal();saveGame();toast('🎁 +'+codes[code]+' G','win');sPromo();confetti();input.value=''}
(async()=>{await loadGame();drawTicks();updateBal();rendMain();rendInv();rendTargetList();updateCartBadge();const el=document.getElementById('onlineCount');if(el){el.innerText=Math.floor(Math.random()*10)+1;setInterval(()=>el.innerText=Math.floor(Math.random()*10)+1,5000)}})();
</script></body></html>
