<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>StandCraft Bot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 50% 30%, #1a1a2e, #0a0a0f);
            color: white;
            font-family: -apple-system, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .top-bar {
            background: linear-gradient(180deg, #1a1a2e, #0f0f1a);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0c419;
            box-shadow: 0 4px 20px rgba(240, 196, 25, 0.15);
        }
        .account {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f0c419, #e6a800);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            border: 2px solid #fff3b0;
        }
        .nickname {
            font-size: 13px;
            font-weight: bold;
            color: #fff;
        }
        .balance-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            font-weight: bold;
        }
        .balance-item .icon { font-size: 16px; }
        .coins { color: #f0c419; }
        .gold { color: #ffd700; }

        /* ЦЕНТР — РУЛЕТКА */
        .center {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
            padding: 20px;
        }
        .wheel-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #f0c419 0deg 30deg,
                #1a1a2e 30deg 60deg,
                #f0c419 60deg 90deg,
                #1a1a2e 90deg 120deg,
                #f0c419 120deg 150deg,
                #1a1a2e 150deg 180deg,
                #f0c419 180deg 210deg,
                #1a1a2e 210deg 240deg,
                #f0c419 240deg 270deg,
                #1a1a2e 270deg 300deg,
                #f0c419 300deg 330deg,
                #1a1a2e 330deg 360deg
            );
            border: 5px solid #f0c419;
            box-shadow: 0 0 60px rgba(240, 196, 25, 0.5), inset 0 0 40px rgba(0,0,0,0.6);
            transition: transform 20s cubic-bezier(0.1, 0.7, 0.1, 1);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .wheel .center-text {
            font-size: 40px;
            color: #f0c419;
            text-shadow: 0 0 20px rgba(240, 196, 25, 0.8);
            font-weight: bold;
        }
        .arrow {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 50px;
            color: #ffcc00;
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.9), 0 0 40px rgba(255, 204, 0, 0.5);
            z-index: 10;
            filter: drop-shadow(0 0 10px #ffcc00);
        }

        /* НИЖНЯЯ ПАНЕЛЬ */
        .bottom-bar {
            background: linear-gradient(0deg, #1a1a2e, #0f0f1a);
            padding: 12px 8px;
            display: flex;
            justify-content: space-around;
            border-top: 2px solid #f0c419;
            box-shadow: 0 -4px 20px rgba(240, 196, 25, 0.15);
        }
        .nav-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            transition: all 0.2s;
            border-radius: 12px;
        }
        .nav-btn .icon { font-size: 24px; }
        .nav-btn:active {
            background: rgba(240, 196, 25, 0.15);
            color: #f0c419;
            transform: scale(0.95);
        }

        /* МОДАЛЬНОЕ ОКНО */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal.open { display: flex; }
        .modal-content {
            background: #1a1a2e;
            border: 2px solid #f0c419;
            border-radius: 20px;
            padding: 24px;
            width: 85%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 50px rgba(240, 196, 25, 0.4);
        }
        .modal-content h2 {
            color: #f0c419;
            margin-bottom: 16px;
            font-size: 20px;
        }
        .modal-content p {
            color: #aaa;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }
        .modal-content button {
            background: linear-gradient(135deg, #f0c419, #e6a800);
            color: #1a1a2e;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <div class="top-bar">
        <div class="account">
            <div class="avatar">👤</div>
            <div class="nickname">Игрок</div>
        </div>
        <div style="display:flex; gap:12px;">
            <div class="balance-item coins">
                <span class="icon">💰</span>
                <span id="coins">100</span>
            </div>
            <div class="balance-item gold">
                <span class="icon">⭐</span>
                <span id="gold">0</span>
            </div>
        </div>
    </div>

    <!-- ЦЕНТР — РУЛЕТКА -->
    <div class="center">
        <div class="wheel-wrapper">
            <div class="arrow">▼</div>
            <div class="wheel" id="wheel" onclick="spinWheel()">
                <span class="center-text">?</span>
            </div>
        </div>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ -->
    <div class="bottom-bar">
        <button class="nav-btn" onclick="openModal('Инвентарь', 'Здесь твои предметы и ресурсы.')">
            <span class="icon">🎒</span>
            <span>Инвентарь</span>
        </button>
        <button class="nav-btn" onclick="openModal('Магазин', 'Здесь можно купить оружие и ресурсы.')">
            <span class="icon">🛒</span>
            <span>Магазин</span>
        </button>
        <button class="nav-btn" onclick="openModal('Прокачать', 'Здесь можно прокачать рулетку.')">
            <span class="icon">⬆️</span>
            <span>Прокачать</span>
        </button>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Заголовок</h2>
            <p id="modalText">Текст</p>
            <button onclick="closeModal()">Закрыть</button>
        </div>
    </div>

    <script>
        let coins = 100;
        let gold = 0;
        let isSpinning = false;

        function updateBalance() {
            document.getElementById('coins').innerText = coins;
            document.getElementById('gold').innerText = gold;
        }

        function openModal(title, text) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalText').innerText = text;
            document.getElementById('modal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('open');
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;

            const wheel = document.getElementById('wheel');
            const randomDegree = Math.floor(Math.random() * 360) + 3600; // минимум 10 оборотов

            wheel.style.transform = `rotate(${randomDegree}deg)`;

            setTimeout(() => {
                const prizes = [
                    { name: '50 монет', coins: 50, gold: 0, icon: '💰' },
                    { name: '10 голды', coins: 0, gold: 10, icon: '⭐' },
                    { name: '100 монет', coins: 100, gold: 0, icon: '💰' },
                    { name: 'Пусто', coins: 0, gold: 0, icon: '❌' },
                    { name: '25 голды', coins: 0, gold: 25, icon: '⭐' },
                    { name: '200 монет', coins: 200, gold: 0, icon: '💰' }
                ];

                const randomIndex = Math.floor(Math.random() * prizes.length);
                const prize = prizes[randomIndex];

                coins += prize.coins;
                gold += prize.gold;
                updateBalance();

                openModal('🎰 Результат спина', 
                    `${prize.icon} Ты выиграл: ${prize.name}!\n\n` +
                    `💰 Монеты: ${coins}\n⭐ Голда: ${gold}`
                );

                isSpinning = false;
            }, 20000); // 20 секунд
        }

        updateBalance();
    </script>

</body>
</html>
