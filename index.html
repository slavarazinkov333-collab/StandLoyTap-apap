<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>StandCraft Bot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: white;
            font-family: -apple-system, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .top-bar {
            background: linear-gradient(180deg, #1a1a2e, #0f0f1a);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0c419;
            box-shadow: 0 4px 15px rgba(240, 196, 25, 0.2);
        }
        .balance-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: bold;
        }
        .balance-item .icon { font-size: 18px; }
        .coins { color: #f0c419; }
        .gold { color: #ffd700; }

        /* ЦЕНТР */
        .center {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        .logo {
            font-size: 50px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 20px rgba(240, 196, 25, 0.5));
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            color: #f0c419;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 12px;
            color: #666;
            margin-bottom: 40px;
        }
        .play-btn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f0c419, #e6a800);
            border: 4px solid #fff3b0;
            color: #1a1a2e;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(240, 196, 25, 0.6), inset 0 -5px 15px rgba(0,0,0,0.2);
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 5px;
        }
        .play-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 60px rgba(240, 196, 25, 0.9);
        }
        .play-btn .icon { font-size: 40px; }

        /* НИЖНЯЯ ПАНЕЛЬ */
        .bottom-bar {
            background: linear-gradient(0deg, #1a1a2e, #0f0f1a);
            padding: 12px 8px;
            display: flex;
            justify-content: space-around;
            border-top: 2px solid #f0c419;
            box-shadow: 0 -4px 15px rgba(240, 196, 25, 0.2);
        }
        .nav-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            transition: all 0.2s;
            border-radius: 10px;
        }
        .nav-btn .icon { font-size: 22px; }
        .nav-btn:active {
            background: rgba(240, 196, 25, 0.1);
            color: #f0c419;
        }
        .nav-btn.active { color: #f0c419; }

        /* МОДАЛЬНОЕ ОКНО */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal.open { display: flex; }
        .modal-content {
            background: #1a1a2e;
            border: 2px solid #f0c419;
            border-radius: 16px;
            padding: 24px;
            width: 85%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 40px rgba(240, 196, 25, 0.3);
        }
        .modal-content h2 {
            color: #f0c419;
            margin-bottom: 16px;
            font-size: 20px;
        }
        .modal-content p {
            color: #aaa;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .modal-content button {
            background: linear-gradient(135deg, #f0c419, #e6a800);
            color: #1a1a2e;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <div class="top-bar">
        <div class="balance-item coins">
            <span class="icon">💰</span>
            <span id="coins">100</span>
        </div>
        <div class="balance-item gold">
            <span class="icon">⭐</span>
            <span id="gold">0</span>
        </div>
    </div>

    <!-- ЦЕНТР -->
    <div class="center">
        <div class="logo">🎮</div>
        <div class="title">STANDCRAFT BOT</div>
        <div class="subtitle">Экономическая игра</div>
        <button class="play-btn" onclick="startGame()">
            <span class="icon">🚀</span>
            <span>ЗАПУСК</span>
        </button>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ -->
    <div class="bottom-bar">
        <button class="nav-btn" onclick="openModal('Апгрейд', 'Здесь будут улучшения оружия и брони.')">
            <span class="icon">⬆️</span>
            <span>Апгрейд</span>
        </button>
        <button class="nav-btn" onclick="openModal('Инвентарь', 'Здесь твои предметы и ресурсы.')">
            <span class="icon">🎒</span>
            <span>Инвентарь</span>
        </button>
        <button class="nav-btn" onclick="openModal('Магазин', 'Здесь можно купить оружие и ресурсы.')">
            <span class="icon">🛒</span>
            <span>Магазин</span>
        </button>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Заголовок</h2>
            <p id="modalText">Текст</p>
            <button onclick="closeModal()">Закрыть</button>
        </div>
    </div>

    <script>
        function startGame() {
            alert('Игра запускается!');
        }

        function openModal(title, text) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalText').innerText = text;
            document.getElementById('modal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('open');
        }
    </script>

</body>
</html>
