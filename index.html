<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>StandFliutApap</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a0c;--panel:#121216;--panel-l:#1a1a22;--border:#272730;--gold:#ffb800;--red:#e50914;--green:#4CAF50;--gray:#666;--gray2:#999;--white:#fff;--blue:#4a9eff;--purple:#9b8aff}
body{background:var(--bg);color:var(--white);min-height:100vh;overflow-x:hidden;padding-bottom:90px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes popIn{0%{transform:scale(0.8);opacity:0}100%{transform:scale(1);opacity:1}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}@keyframes scrollLeft{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.animate-slide{animation:slideUp 0.4s ease}
#loader{position:fixed;inset:0;background:var(--bg);z-index:10000;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity 0.5s}
.loader-logo{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,var(--red),#8b0000);display:flex;justify-content:center;align-items:center;font-size:40px;animation:pulse 2s infinite;margin-bottom:20px}
.loader-text{font-size:24px;font-weight:900;letter-spacing:2px;color:#ffb800}
.loader-sub{font-size:12px;color:var(--gray2);margin-top:8px;font-weight:700}
.top{position:sticky;top:0;z-index:100;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,12,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.top-left{display:flex;align-items:center;gap:12px}
.logo-svg{width:34px;height:34px}
.rank-badge{display:flex;flex-direction:column;font-size:10px;font-weight:800;color:var(--gray2)}
.rank-badge .rn{color:var(--gold);font-size:12px;text-transform:uppercase}
.top-right{display:flex;align-items:center;gap:8px}
.cart-btn{width:38px;height:38px;border-radius:10px;background:var(--panel);display:flex;justify-content:center;align-items:center;cursor:pointer;border:1px solid var(--border);position:relative}
.cart-btn svg{width:18px;height:18px;fill:var(--white)}
.cart-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:9px;font-weight:900;border-radius:10px;padding:2px 5px;border:2px solid var(--bg);display:none}
.bal-pill{display:flex;align-items:center;gap:8px;background:var(--panel);padding:6px 12px;border-radius:10px;border:1px solid var(--border);cursor:pointer}
.bal-plus{width:24px;height:24px;background:linear-gradient(135deg,#ffd700,#ff8c00);border-radius:6px;display:flex;justify-content:center;align-items:center;font-size:16px;color:#1a1a1a;font-weight:900}
.bal-num{font-size:15px;font-weight:900}
.bal-g{font-size:11px;font-weight:900;color:var(--gold)}
.av-top{width:38px;height:38px;border-radius:10px;background:var(--panel);display:flex;justify-content:center;align-items:center;font-size:16px;cursor:pointer;border:1px solid var(--border);overflow:hidden}
.av-top img{width:100%;height:100%;object-fit:cover}
.live-bar{margin:12px 16px;background:var(--panel);border:1px solid var(--border);border-radius:12px;height:60px;overflow:hidden;position:relative;display:flex;align-items:center}
.live-bar::before{content:'LIVE';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:9px;font-weight:900;color:#fff;background:var(--red);padding:4px 10px;border-radius:6px;z-index:3}
.live-track{display:flex;gap:12px;white-space:nowrap;animation:scrollLeft 30s linear infinite;padding-left:70px;align-items:center;height:100%}
.live-item{display:flex;align-items:center;gap:12px;flex-shrink:0;padding:8px 14px;background:var(--panel-l);border-radius:10px;border:1px solid var(--border);border-left:3px solid var(--gold);cursor:pointer}
.live-info{display:flex;flex-direction:column;gap:2px}
.live-name{font-size:12px;font-weight:900;color:#fff}
.live-pct{font-size:10px;font-weight:900;color:#1a1a1a;background:var(--gold);padding:2px 6px;border-radius:4px;width:fit-content}
.live-skin{width:55px;height:35px;object-fit:contain}
.live-empty{padding-left:70px;font-size:11px;color:var(--gray);font-weight:700}
.friends-btn-wrap{margin:0 16px 12px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.friends-btn-wrap::-webkit-scrollbar{display:none}
.friends-btn{flex-shrink:0;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 16px;color:var(--gray2);font-size:12px;font-weight:800;cursor:pointer}
.main{padding:0 16px}
.wheel-wrap{position:relative;width:100%;aspect-ratio:1;max-width:340px;margin:10px auto;display:flex;justify-content:center;align-items:center}
.wheel{width:90%;height:90%;border-radius:50%;background:radial-gradient(circle at center,var(--panel-l) 0%,var(--panel) 60%,#0a0a0c 100%);position:relative;display:flex;justify-content:center;align-items:center;box-shadow:0 0 60px rgba(0,0,0,.9),0 0 80px rgba(255,184,0,.15),inset 0 0 40px rgba(0,0,0,.6);border:4px solid #1a1a22}
.wheel-zone{position:absolute;inset:-4px;border-radius:50%;pointer-events:none;z-index:1;overflow:hidden}
.wheel-zone-fill{position:absolute;top:0;left:0;width:100%;height:100%;background:conic-gradient(from 180deg,var(--gold) 0deg,var(--gold) var(--pct-angle,0deg),#1a1a22 var(--pct-angle,0deg),#1a1a22 360deg);opacity:0;transition:opacity .4s}
.wheel-zone-fill.visible{opacity:.9}
.wheel::before{content:'';position:absolute;width:75%;height:75%;border-radius:50%;background:var(--bg);border:1px solid var(--border);z-index:2}
.wheel-ticks{position:absolute;width:100%;height:100%;border-radius:50%;pointer-events:none;z-index:3}
.tick{position:absolute;top:0;left:50%;width:2px;height:8px;background:rgba(255,184,0,.4);transform-origin:center 150px;transform:translateX(-50%) rotate(var(--a));border-radius:1px}
.tick.major{width:3px;height:14px;background:var(--gold);box-shadow:0 0 8px rgba(255,184,0,.8)}
.wheel-center{position:relative;z-index:5;text-align:center}
.pt{font-size:52px;font-weight:900;line-height:1;letter-spacing:-2px;text-shadow:0 0 20px rgba(255,184,0,.4)}
.pl{font-size:9px;color:var(--gray2);letter-spacing:4px;margin-top:4px;font-weight:700}
.arrow-wrap{position:absolute;inset:0;pointer-events:none;z-index:25}
.arrow{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:32px;height:44px;filter:drop-shadow(0 4px 10px rgba(255,184,0,.8))}
.pcnt-row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:20px}
.pb{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 4px;color:var(--gray2);font-size:11px;font-weight:800;cursor:pointer}
.pb.sel{border-color:var(--gold);background:rgba(255,184,0,.1);color:var(--gold)}
.action-row{display:flex;gap:8px;margin-top:12px}
.lightning-btn{width:56px;height:56px;background:var(--panel);border:1px solid var(--border);border-radius:12px;cursor:pointer;display:flex;justify-content:center;align-items:center}
.lightning-btn.on{border-color:var(--gold);background:rgba(255,184,0,.1)}
.lightning-btn .ic{font-size:20px;filter:grayscale(1);opacity:.5}
.lightning-btn.on .ic{filter:grayscale(0);opacity:1}
.upgrade-btn{flex:1;background:linear-gradient(135deg,var(--gold),#ff8c00);color:#1a1a1a;border:none;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer}
.upgrade-btn:disabled{opacity:.5;background:var(--panel)}
.upg-guarantee{text-align:center;margin-top:16px;margin-bottom:8px}
.upg-guarantee-title{font-size:10px;font-weight:800;color:var(--gray2);text-transform:uppercase}
.upg-guarantee-val{font-size:16px;font-weight:900;color:var(--gold)}
.upg-guarantee-sub{font-size:9px;color:var(--gray2);font-weight:700}
.upg-container{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.upg-box{background:linear-gradient(180deg,#1a1a1c 0%,#0f0f11 100%);border:1.5px solid #2a2a2e;border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;min-height:160px;position:relative;cursor:pointer}
.upg-box-title{font-size:11px;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:.5px;text-align:center}
.upg-box-count{font-size:12px;font-weight:900;color:#ffb800;margin-bottom:8px}
.upg-skins-list{display:flex;flex-direction:column;gap:6px;align-items:center;width:100%;flex:1;justify-content:center}
.upg-skin-item{width:70px;height:70px;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(0,0,0,0.6))}
.upg-empty-icon{width:50px;height:50px;border:2px dashed #ffb800;border-radius:16px;display:flex;justify-content:center;align-items:center;font-size:20px;color:#ffb800;opacity:0.8}
.upg-price-bottom{margin-top:auto;font-size:16px;font-weight:900;color:#ffb800}
.big-tabs{display:flex;gap:4px;margin-top:16px;background:var(--panel);padding:4px;border-radius:12px}
.big-tab{flex:1;background:none;border:none;color:var(--gray2);font-size:11px;font-weight:800;padding:10px;border-radius:8px;cursor:pointer}
.big-tab.active{background:var(--panel-l);color:var(--white)}
.panel{display:none;margin-top:16px}
.panel.active{display:block}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.inv-card{background:linear-gradient(180deg,#1b1b1b 0%,#111111 100%);border-radius:12px;padding:12px;display:flex;flex-direction:column;cursor:pointer;border:1px solid #222;position:relative;overflow:hidden;min-height:180px}
.inv-card-img{width:100%;height:100px;object-fit:contain;margin-bottom:8px;filter:drop-shadow(0 8px 12px rgba(0,0,0,0.6));transition:0.3s}
.inv-card.active .inv-card-img{opacity:0.1;filter:blur(4px)}
.inv-card-name{font-size:12px;font-weight:800;color:#888;line-height:1.1}
.inv-card-skin{font-size:15px;font-weight:900;line-height:1.1;margin-bottom:4px}
.inv-card-divider{height:1px;background:#333;margin:6px 0}
.inv-card-bottom{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:16px;font-weight:900;color:#fff;margin-top:auto}
.inv-card-price-icon{width:18px;height:18px;background:#fff;color:#000;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:10px;font-weight:900}
.card-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:12px;opacity:0;pointer-events:none;transition:opacity 0.3s;z-index:10;background:rgba(15,15,15,0.9);backdrop-filter:blur(2px)}
.inv-card.active .card-overlay{opacity:1;pointer-events:auto}
.card-btn{width:100%;padding:10px;border-radius:8px;font-size:12px;font-weight:900;border:none;cursor:pointer;margin-bottom:6px}
.btn-upg-action{background:linear-gradient(180deg,#ffd700,#ffb800);color:#1a1a1a}
.btn-sell-action{background:#2a2a2a;color:#fff;border:1px solid #444}
.btn-withdraw-action{background:linear-gradient(180deg,#4CAF50,#2e7d32);color:#fff}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(12,12,15,0.95);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.05);padding:8px 16px 20px 16px;display:flex;justify-content:space-between;align-items:flex-end}
.nb{background:none;border:none;color:var(--gray);font-size:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;font-weight:800}
.nb svg{width:24px;height:24px;fill:currentColor}
.nb.active{color:var(--white)}.nb.active svg{fill:var(--gold)}
.nb-plus{position:relative;top:-15px;display:flex;justify-content:center;align-items:center}
.nb-plus .circle{width:56px;height:56px;background:linear-gradient(135deg,var(--gold),#ff8c00);border-radius:50%;display:flex;justify-content:center;align-items:center;box-shadow:0 8px 20px rgba(255,184,0,0.4)}
.nb-plus .circle svg{width:28px;height:28px;fill:#1a1a1a}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(5px);z-index:1000;display:flex;justify-content:center;align-items:center;padding:16px;overflow-y:auto}
.modal-content{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;max-width:400px;position:relative;max-height:90vh;overflow-y:auto;animation:popIn 0.3s}
.modal-title{font-size:18px;font-weight:900;margin-bottom:16px;text-align:center}
.modal-close{position:absolute;top:16px;right:16px;background:var(--panel-l);border:none;color:var(--gray2);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;z-index:10}
.scr{position:fixed;inset:0;background:var(--bg);z-index:600;display:none;flex-direction:column;animation:slideUp 0.3s}
.scr.open{display:flex}
.sh{padding:16px;display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-bottom:1px solid var(--border)}
.sh h2{font-size:16px;font-weight:900}
.cb{background:var(--panel-l);border:none;color:var(--gray2);width:30px;height:30px;border-radius:8px;cursor:pointer}
.sb{flex:1;overflow-y:auto;padding:16px}
.profile-wrap{padding:16px}
.profile-main-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;text-align:center}
.profile-avatar-big{width:80px;height:80px;border-radius:50%;margin:0 auto 12px;border:2px solid var(--gold);overflow:hidden;background:var(--panel-l)}
.profile-avatar-big img{width:100%;height:100%;object-fit:cover}
.profile-username{font-size:20px;font-weight:900;margin-bottom:4px}
.profile-id-text{font-size:12px;color:var(--gray2);font-family:monospace;margin-bottom:12px}
.profile-balance-val{font-size:24px;font-weight:900;color:var(--gold)}
.profile-section{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.profile-section-title h2{font-size:13px;font-weight:900;color:var(--gray2);text-transform:uppercase;margin-bottom:12px}
.stats-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat-block{background:var(--panel-l);border-radius:8px;padding:12px;text-align:center}
.stat-block-label{font-size:10px;color:var(--gray2);font-weight:800}
.stat-block-val{font-size:16px;font-weight:900}
.best-drop-card{background:linear-gradient(135deg,#1a1408,#0a0800);border:2px solid var(--gold);border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px;box-shadow:0 0 30px rgba(255,184,0,.4)}
.best-drop-img{width:60px;height:60px;object-fit:contain;flex-shrink:0}
.best-drop-label{font-size:10px;font-weight:900;color:var(--gold);margin-bottom:4px}
.best-drop-name{font-size:14px;font-weight:900;margin-bottom:4px}
.best-drop-price{font-size:16px;font-weight:900;color:var(--gold)}
.settings-item{background:var(--panel-l);border-radius:12px;padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.settings-item label{font-size:14px;font-weight:800;color:var(--white)}
.toggle{position:relative;width:50px;height:28px;background:var(--border);border-radius:14px;cursor:pointer;transition:all .3s}
.toggle.on{background:var(--green)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:all .3s}
.toggle.on::after{left:25px}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--border);padding:16px 24px;border-radius:12px;color:var(--white);font-size:14px;font-weight:800;z-index:9999;text-align:center;display:none;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.task-item{background:var(--panel-l);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.task-ico{width:40px;height:40px;background:var(--border);border-radius:8px;display:flex;justify-content:center;align-items:center;font-size:20px;flex-shrink:0}
.task-info{flex:1}
.task-title{font-size:12px;font-weight:900}
.task-progress{font-size:10px;color:var(--gray2);font-weight:800}
.task-claim{background:var(--green);color:#fff;border:none;padding:8px 12px;border-radius:8px;font-size:10px;font-weight:900;cursor:pointer}
.task-claim:disabled{background:var(--border);color:var(--gray)}
</style></head><body>
<div id="loader"><div class="loader-logo">🔥</div><div class="loader-text">StandFliutApap</div><div class="loader-sub">Загрузка данных...</div></div>

<div class="top"><div class="top-left"><svg class="logo-svg" viewBox="0 0 40 40"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e50914"/><stop offset="1" stop-color="#8b0000"/></linearGradient></defs><path fill="url(#lg)" d="M20 2L4 20h8v16h16V20h8L20 2zm0 6l8 10h-4v10h-8V18h-4l8-10z"/></svg><div class="rank-badge"><div class="rn" id="rankNameTop">НОВИЧОК</div><div id="rankLevelTop">LVL 1</div></div></div><div class="top-right"><div class="cart-btn" onclick="openCart()"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg><div class="cart-badge" id="cartBadge">0</div></div><div class="bal-pill" onclick="openS('topupScreen')"><div class="bal-plus">+</div><div class="bal-num" id="goldTop">0</div><div class="bal-g">G</div></div><div class="av-top" id="topAv" onclick="openS('profileScreen')">👤</div></div></div>

<div class="live-bar"><div class="live-track" id="liveTrack"><span class="live-empty">Загрузка ленты...</span></div></div>

<script>
const BOT_URL='https://admin-bot-03ly.onrender.com';
const CDN_BASE='https://raw.githubusercontent.com/slavarazinkov333-collab/StandLoyTap-apap/main/';
const allSkins=[{name:'AKR Carbon',price:56,color:'#4a9eff',img:CDN_BASE+'skins/AKR_CARBON.jpg'},{name:'AKR Evolution',price:3,color:'#4a9eff',img:CDN_BASE+'skins/AKR_EVOLUTION.jpg'},{name:'AKR Nano',price:23,color:'#4a9eff',img:CDN_BASE+'skins/AKR_NANO.jpg'},{name:'AKR 12 Carbon',price:10,color:'#4a9eff',img:CDN_BASE+'skins/AKR12_CARBON.jpg'},{name:'AKR 12 Hanami',price:220,color:'#ff4444',img:CDN_BASE+'skins/AKR12_HANAMI.jpg'},{name:'AKR 12 Railgun',price:1100,color:'#ff69b4',img:CDN_BASE+'skins/AKR12_RAILGUN.jpg'},{name:'AWM Sport V2',price:74250,color:'#ffd700',img:CDN_BASE+'skins/AWM_SPORTV2.jpg'},{name:'AWM Treasure Hunter',price:104200,color:'#ffd700',img:CDN_BASE+'skins/AWM_TREASUREHUNTER.jpg'},{name:'Butterfly Dragon Glass',price:2250,color:'#ff4444',img:CDN_BASE+'skins/Butterfly_DragonGlass.jpg'},{name:'Butterfly Starfall',price:1407,color:'#ff4444',img:CDN_BASE+'skins/Butterfly_Starfall.jpg'},{name:'Butterfly Twilight',price:1000000,color:'#ffd700',img:CDN_BASE+'skins/Butterfly_Twilight.jpg'},{name:'M4 Ironclad',price:34,color:'#9b8aff',img:CDN_BASE+'skins/M4_IRONCLAD.jpg'},{name:'M4 Necromancer',price:880,color:'#ff69b4',img:CDN_BASE+'skins/M4_NECROMANCER.jpg'},{name:'M4 Pixel Storm',price:766,color:'#ff4444',img:CDN_BASE+'skins/M4_PiXELSTORM.jpg'},{name:'M4 Samurai',price:500,color:'#ff4444',img:CDN_BASE+'skins/M4_SAMURAI.jpg'},{name:'M4A1 Bubblegum',price:225,color:'#ff4444',img:CDN_BASE+'skins/M4A1_Bublgam.jpg'},{name:'M4A1 Kitsune',price:2,color:'#4a9eff',img:CDN_BASE+'skins/M4A1_KITSUNE.jpg'},{name:'M4A1 Sour',price:24,color:'#9b8aff',img:CDN_BASE+'skins/M4A1_SOUR.jpg'},{name:'M4A1 Sparkling Gaze',price:95,color:'#ff4444',img:CDN_BASE+'skins/M4a1_SparkingGaze.jpg'},{name:'M9 Bayonet Amber Koi',price:3700,color:'#ff4444',img:CDN_BASE+'skins/M9BAYONET_AmberKOI.jpg'},{name:'M9 Bayonet Dragon Glass',price:34000,color:'#ff4444',img:CDN_BASE+'skins/M9BAYONET_DragonGlass.jpg'},{name:'Tanto Dojo',price:990,color:'#ff4444',img:CDN_BASE+'skins/Tanto_Dojo.jpg'},{name:'G22 Monster',price:670,color:'#9b8aff',img:CDN_BASE+'skins/G22_Monster.jpg'},{name:'G22 Nest',price:540,color:'#ff4444',img:CDN_BASE+'skins/G22_Nest.jpg'},{name:'G22 Relic',price:11780,color:'#ffd700',img:CDN_BASE+'skins/G22_Relic.jpg'},{name:'G22 Twilight (ST)',price:1951,color:'#ff4444',img:CDN_BASE+'skins/G22_Twilight.jpg'},{name:'M4A1 Demon',price:5,color:'#4a9eff',img:CDN_BASE+'skins/M4a1_Demon.jpg'},{name:'P90 Burning King',price:710,color:'#ff4444',img:CDN_BASE+'skins/P90_BurnngKing.jpg'},{name:'P90 Iron Will',price:45,color:'#9b8aff',img:CDN_BASE+'skins/P90_IronWill.jpg'},{name:'P90 Opps',price:50,color:'#ff69b4',img:CDN_BASE+'skins/P90_Opps.jpg'},{name:'P350 Forest Spirit',price:890,color:'#ff4444',img:CDN_BASE+'skins/P350_ForestSpirit.jpg'},{name:'P350 Oni',price:1,color:'#4a9eff',img:CDN_BASE+'skins/P350_Oni.jpg'},{name:'P350 Raider',price:31,color:'#9b8aff',img:CDN_BASE+'skins/P350_Raider.jpg'},{name:'P350 Tag King',price:20,color:'#ff69b4',img:CDN_BASE+'skins/P350_TagKing.jpg'},{name:'USP 2 Years',price:400,color:'#4a9eff',img:CDN_BASE+'skins/Usp_2Yers.jpg'},{name:'USP 2 Years Red',price:1020,color:'#9b8aff',img:CDN_BASE+'skins/Usp_2YersRed.jpg'},{name:'USP Genesis',price:23000,color:'#ffd700',img:CDN_BASE+'skins/Usp_Genesis.jpg'},{name:'USP Ignite',price:7,color:'#4a9eff',img:CDN_BASE+'skins/Usp_Lgnite.jpg'},{name:'USP Mirage Menace',price:2940,color:'#ff4444',img:CDN_BASE+'skins/Usp_MirageMenace.jpg'},{name:'USP Pisces',price:20,color:'#9b8aff',img:CDN_BASE+'skins/Usp_Pisces.jpg'},{name:'USP Suture',price:14,color:'#4a9eff',img:CDN_BASE+'skins/Usp_Suture.jpg'}];

const DEFAULT_PCTS=[90,67,55,44,33,22];
let gold=0, inv=[], stats={spins:0,wins:0,loses:0}, bestDrop=null, history=[], upgradeHistory=[];
let selectedItems=[], targetSkin=null, selPct=null, isSpinning=false;
let cart=[], invMode='inv', bigTab='inv';
let soundEnabled=true, gameLoaded=false, lightningOn=false;
let vipData={isVip:false,expires:0}, refData={isLegend:false};
let customPcts=[...DEFAULT_PCTS], activeCardName=null;

function getUserId(){const t=window.Telegram?.WebApp?.initDataUnsafe?.user;return t?.id?String(t.id):'guest'}
function getUser(){return window.Telegram?.WebApp?.initDataUnsafe?.user||null}
function toast(m){const e=document.getElementById('toast');if(!e)return;e.style.display='block';e.innerText=m;setTimeout(()=>e.style.display='none',2500)}
function updateBal(){const el=document.getElementById('goldTop');if(el)el.innerText=Math.floor(gold).toLocaleString('ru-RU')}
function openS(id){const el=document.getElementById(id);if(!el)return;el.classList.add('open');if(id==='profileScreen')rendProfile();if(id==='settingsScreen')rendSettings()}
function closeS(id){const el=document.getElementById(id);if(el)el.classList.remove('open')}
function scrollToShop(){switchBigTab('inv');switchSub('shop');document.getElementById('invList').scrollIntoView({behavior:'smooth'})}

function saveGame(){
  try{
    const uid=getUserId(); if(uid==='guest')return; if(!gameLoaded)return;
    const data={gold,inv,stats,bestDrop,history,upgradeHistory,isLegend:refData.isLegend,isVip:vipData.isVip,vipExpires:vipData.expires,ts:Date.now()};
    localStorage.setItem('sfap_save_'+uid,JSON.stringify(data));
    fetch(BOT_URL+'/api/save-merge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,data})}).catch(()=>{});
  }catch(e){}
}
async function loadGame(){
  try{
    const uid=getUserId();
    if(uid==='guest'){gameLoaded=true;return}
    try{const r=await fetch(BOT_URL+'/api/load/'+uid);const d=await r.json();if(d.ok&&d.data){applySaveData(d.data);localStorage.setItem('sfap_save_'+uid,JSON.stringify(d.data));gameLoaded=true;return}}catch(e){}
    const l=localStorage.getItem('sfap_save_'+uid);if(l)applySaveData(JSON.parse(l));
    gameLoaded=true;
  }catch(e){gameLoaded=true}
}
function applySaveData(d){if(!d)return;if(typeof d.gold==='number')gold=d.gold;if(Array.isArray(d.inv))inv=d.inv;if(d.stats)stats=d.stats;if(d.bestDrop)bestDrop=d.bestDrop;if(Array.isArray(d.history))history=d.history;if(Array.isArray(d.upgradeHistory))upgradeHistory=d.upgradeHistory;if(d.isLegend!==undefined)refData.isLegend=!!d.isLegend;if(d.isVip!==undefined)vipData.isVip=!!d.isVip;if(d.vipExpires!==undefined)vipData.expires=d.vipExpires||0}
setInterval(saveGame,5000);

function toggleCard(name){if(activeCardName===name)activeCardName=null;else activeCardName=name;rendInv();if(document.getElementById('profileScreen').classList.contains('open'))rendProfile()}
function addToUpgradeByName(name){if(selectedItems.length>=10){toast('Макс 10');return}const idx=inv.findIndex(x=>x.name===name);if(idx>=0){selectedItems.push(inv[idx]);rendMain()}}
function sellSkinByName(name){const idx=inv.findIndex(x=>x.name===name);if(idx>=0){const p=Math.floor(inv[idx].price*0.7);gold+=p;inv.splice(idx,1);updateBal();rendInv();rendProfile();toast('Продано за '+p+' G');saveGame()}}

function toggleCart(name,price){const i=cart.findIndex(c=>c.name===name);if(i>=0){cart.splice(i,1);toast('Удалено из корзины')}else{cart.push({name,price});toast('Добавлено в корзину')}updateCartBadge();rendInv()}
function updateCartBadge(){const b=document.getElementById('cartBadge');if(!b)return;if(cart.length>0){b.style.display='block';b.innerText=cart.length}else b.style.display='none'}
function openCart(){
  const m=document.getElementById('cartModal'),list=document.getElementById('cartList');
  if(!m||!list)return; m.style.display='flex';
  if(cart.length===0){list.innerHTML='<div style="text-align:center;padding:20px;color:var(--gray2)">Корзина пуста</div>';return}
  let total=0;
  list.innerHTML=cart.map((c,i)=>{const s=allSkins.find(x=>x.name===c.name);total+=c.price;return `<div style="background:var(--panel-l);border-radius:8px;padding:10px;margin-bottom:8px;display:flex;align-items:center;gap:12px"><img src="${s?.img||''}" style="width:50px;height:50px;object-fit:contain;background:var(--bg);border-radius:6px"><div style="flex:1"><div style="font-size:12px;font-weight:900;color:var(--white)">${c.name}</div><div style="font-size:13px;color:var(--gold);font-weight:900">${c.price} G</div></div><button onclick="cart.splice(${i},1);openCart();rendInv();updateCartBadge()" style="background:none;border:none;color:var(--red);font-size:16px;font-weight:900;cursor:pointer">✕</button></div>`}).join('');
  list.innerHTML+=`<div style="display:flex;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border);margin-top:12px"><div style="font-size:12px;color:var(--gray2);font-weight:800">ИТОГО:</div><div style="font-size:20px;font-weight:900;color:var(--gold)">${total} G</div></div><button class="vip-buy-btn" style="width:100%;padding:14px;border-radius:10px;background:linear-gradient(135deg,#ffd700,#ff9500);color:#1a1a1a;font-weight:900;border:none;cursor:pointer;margin-top:16px" onclick="checkout()">✅ КУПИТЬ</button>`;
}
async function checkout(){
  const total=cart.reduce((s,c)=>s+c.price,0);
  if(gold<total){toast('❌ Мало G');return}
  cart.forEach(c=>{gold-=c.price;const s=allSkins.find(x=>x.name===c.name);inv.push({name:c.name,price:c.price,img:s?.img,color:s?.color})});
  cart=[];updateCartBadge();updateBal();rendInv();document.getElementById('cartModal').style.display='none';toast('✅ Куплено!');saveGame();
}

function switchBigTab(m){bigTab=m;document.getElementById('bigTabInv').classList.toggle('active',m==='inv');document.getElementById('bigTabTarget').classList.toggle('active',m==='target');document.getElementById('panelInv').classList.toggle('active',m==='inv');document.getElementById('panelTarget').classList.toggle('active',m==='target');if(m==='target')rendTargetList()}
function switchSub(m){invMode=m;document.getElementById('subInv').style.background=m==='inv'?'var(--panel-l)':'none';document.getElementById('subInv').style.color=m==='inv'?'var(--white)':'var(--gray2)';document.getElementById('subShop').style.background=m==='shop'?'var(--panel-l)':'none';document.getElementById('subShop').style.color=m==='shop'?'var(--white)':'var(--gray2)';rendInv()}

function rendInv(){
  const b=document.getElementById('invList');if(!b)return;
  const q=(document.getElementById('searchInp')?.value||'').toLowerCase();
  let f=invMode==='shop'?allSkins:inv;f=f.filter(it=>it.name.toLowerCase().includes(q));
  b.innerHTML=f.map(it=>{
    const fn=it.name.split(' ')[0],sn=it.name.split(' ').slice(1).join(' ')||'Skin',isA=activeCardName===it.name,inC=cart.find(c=>c.name===it.name);
    return `<div class="inv-card ${isA?'active':''}" onclick="toggleCard('${it.name}')"><img src="${it.img||''}" class="inv-card-img"><div class="inv-card-name">${fn}</div><div class="inv-card-skin" style="color:${it.color||'#fff'}">${sn}</div><div class="inv-card-divider"></div><div class="inv-card-bottom">${it.price} <div class="inv-card-price-icon">G</div></div><div class="card-overlay">${invMode==='shop'?`<button class="card-btn btn-upg-action" onclick="event.stopPropagation();toggleCart('${it.name}',${it.price});toggleCard('${it.name}')">${inC?'✓ В КОРЗИНЕ':'В КОРЗИНУ'}</button>`:`<button class="card-btn btn-upg-action" onclick="event.stopPropagation();addToUpgradeByName('${it.name}');toggleCard('${it.name}')">В АПГРЕЙД</button><button class="card-btn btn-sell-action" onclick="event.stopPropagation();sellSkinByName('${it.name}');toggleCard('${it.name}')">ПРОДАТЬ</button>`}</div></div>`
  }).join('');
}
function rendTargetList(){
  const b=document.getElementById('targetList');if(!b)return;const q=(document.getElementById('targetSearchInp')?.value||'').toLowerCase();
  b.innerHTML=allSkins.filter(s=>s.name.toLowerCase().includes(q)).map(it=>{const fn=it.name.split(' ')[0],sn=it.name.split(' ').slice(1).join(' ')||'Skin',isS=targetSkin&&targetSkin.name===it.name;return `<div class="inv-card" style="border-color:${isS?'var(--gold)':'#222'}" onclick="pickTarget('${it.name}',${it.price},'${it.color}','${it.img}')"><img src="${it.img||''}" class="inv-card-img"><div class="inv-card-name">${fn}</div><div class="inv-card-skin" style="color:${it.color}">${sn}</div><div class="inv-card-divider"></div><div class="inv-card-bottom">${it.price} <div class="inv-card-price-icon">G</div></div></div>`}).join('');
}
function pickTarget(name,price,color,img){targetSkin={name,price,color,img};toast('Цель выбрана: '+name);rendMain();switchBigTab('inv')}
function rendMain(){const sc=document.getElementById('selCount'),li=document.getElementById('leftIcons'),ss=document.getElementById('selSum'),ri=document.getElementById('rightIcons'),tc=document.getElementById('targetCount');if(sc)sc.innerText=selectedItems.length+' ИЗ 10';if(li)li.innerHTML=selectedItems.map(s=>`<img src="${s.img}" class="upg-skin-item">`).join('')||'<div class="upg-empty-icon">+</div>';if(ss)ss.innerText=selectedItems.reduce((a,b)=>a+(b.price||0),0)+' G';if(targetSkin){if(ri)ri.innerHTML=`<img src="${targetSkin.img}" class="upg-skin-item">`;if(tc)tc.innerText=targetSkin.price+' G'}else{if(ri)ri.innerHTML='<div class="upg-empty-icon">🎯</div>';if(tc)tc.innerText='0 G'}}
function toggleLightning(){lightningOn=!lightningOn;document.getElementById('lightningBtn').classList.toggle('on')}

function spinUpgrade(){
  if(isSpinning)return;if(selectedItems.length===0||!targetSkin){toast('Выбери скины и цель!');return}
  isSpinning=true;document.getElementById('upgradeBtn').disabled=true;
  const wrap=document.getElementById('arrowWrap');wrap.style.transition='transform 3s cubic-bezier(.15,.6,.2,1)';wrap.style.transform=`rotate(-${1800+Math.random()*360}deg)`;
  setTimeout(()=>{
    isSpinning=false;document.getElementById('upgradeBtn').disabled=false;wrap.style.transition='none';wrap.style.transform='rotate(0deg)';
    const win=Math.random()<0.4,lost=[...selectedItems],sum=lost.reduce((a,b)=>a+(b.price||0),0);
    selectedItems=[];
    if(win){toast('🎉 ПОБЕДА!');inv.push(targetSkin);stats.wins++;if(!bestDrop||targetSkin.price>bestDrop.price)bestDrop=targetSkin}
    else{toast('💀 ПРОИГРЫШ');stats.loses++;const ref=Math.floor(sum*0.6);if(ref>0){setTimeout(()=>toast('🛡 Возврат '+ref+' G'),2000);gold+=ref}}
    if(!win)lost.forEach(i=>{const idx=inv.indexOf(i);if(idx>=0)inv.splice(idx,1)});
    stats.spins++;updateBal();rendMain();rendInv();saveGame();
  },3000);
}

function rendProfile(){
  const b=document.getElementById('profileBody');if(!b)return;const u=getUser(),n=u?.first_name||'Игрок',p=u?.photo_url||'',wr=stats.spins>0?Math.round((stats.wins/stats.spins)*100):0;
  b.innerHTML=`<div class="profile-wrap"><div class="profile-main-card"><div class="profile-avatar-big">${p?`<img src="${p}">`:'👤'}</div><div class="profile-username">${n}</div><div class="profile-id-text">ID: #${getUserId().slice(-5)}</div><div class="profile-balance-val">${Math.floor(gold).toLocaleString('ru-RU')} G</div></div><div class="profile-section"><div class="profile-section-title"><h2>📊 СТАТИСТИКА</h2></div><div class="stats-grid-3"><div class="stat-block"><div class="stat-block-label">СПИНЫ</div><div class="stat-block-val">${stats.spins}</div></div><div class="stat-block"><div class="stat-block-label">ПОБЕДЫ</div><div class="stat-block-val" style="color:var(--green)">${stats.wins}</div></div><div class="stat-block"><div class="stat-block-label">ВИНРЕЙТ</div><div class="stat-block-val" style="color:var(--gold)">${wr}%</div></div></div></div>${bestDrop?`<div class="profile-section"><div class="profile-section-title"><h2>🏆 ЛУЧШИЙ ДРОП</h2></div><div class="best-drop-card"><img src="${bestDrop.img}" class="best-drop-img"><div><div class="best-drop-label">★ РЕКОРД</div><div class="best-drop-name">${bestDrop.name}</div><div class="best-drop-price">${bestDrop.price} G</div></div></div></div>`:''}<div class="profile-section"><div class="profile-section-title"><h2>🎒 ИНВЕНТАРЬ (${inv.length})</h2></div><div class="grid">${inv.length===0?'<div style="grid-column:span 2;text-align:center;color:var(--gray2)">Пусто</div>':inv.map((it,idx)=>{const fn=it.name.split(' ')[0],sn=it.name.split(' ').slice(1).join(' ')||'Skin',isA=activeCardName===it.name;return `<div class="inv-card ${isA?'active':''}" onclick="toggleCard('${it.name}')"><img src="${it.img}" class="inv-card-img"><div class="inv-card-name">${fn}</div><div class="inv-card-skin" style="color:${it.color}">${sn}</div><div class="inv-card-divider"></div><div class="inv-card-bottom">${it.price} <div class="inv-card-price-icon">G</div></div><div class="card-overlay"><button class="card-btn btn-upg-action" onclick="event.stopPropagation();addToUpgradeByName('${it.name}');toggleCard('${it.name}');closeS('profileScreen')">В АПГРЕЙД</button><button class="card-btn btn-sell-action" onclick="event.stopPropagation();sellSkinByName('${it.name}');toggleCard('${it.name}')">ПРОДАТЬ</button></div></div>`}).join('')}</div></div></div>`;
}
function openFriends(){document.getElementById('friendsModal').style.display='flex';loadFriends()}
function loadFriends(){
  const list=document.getElementById('friendsList');list.innerHTML='<div style="text-align:center;padding:20px;color:var(--gray2)">Загрузка...</div>';
  fetch(BOT_URL+'/api/friends/list/'+getUserId()).then(r=>r.json()).then(d=>{
    if(!d.ok||!d.friends||d.friends.length===0){list.innerHTML='<div style="text-align:center;padding:20px;color:var(--gray2)">Нет друзей</div>';return}
    list.innerHTML=d.friends.map(f=>`<div onclick="openFriendProfile('${f.id}')" style="display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel-l);border-radius:12px;margin-bottom:10px;cursor:pointer"><div style="width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--border)"><img src="${f.photoUrl||''}" style="width:100%;height:100%;object-fit:cover"></div><div style="flex:1"><div style="font-size:14px;font-weight:900">${f.name}</div><div style="font-size:11px;color:var(--gold)">${Math.floor(f.gold||0)} G</div></div></div>`).join('');
  }).catch(()=>list.innerHTML='<div style="text-align:center;padding:20px;color:var(--red)">Ошибка</div>');
}
function openFriendProfile(fid){
  const m=document.getElementById('frProfileModal'),b=document.getElementById('frProfileBody');m.style.display='flex';b.innerHTML='<div style="text-align:center;padding:40px;color:var(--gray2)">Загрузка...</div>';
  fetch(BOT_URL+'/api/friends/profile/'+fid+'/'+getUserId()).then(r=>r.json()).then(d=>{
    if(!d.ok||!d.profile)throw new Error();const p=d.profile,ps=p.stats||{spins:0,wins:0,loses:0},pr=ps.spins>0?Math.round((ps.wins/ps.spins)*100):0;
    b.innerHTML=`<button class="modal-close" onclick="document.getElementById('frProfileModal').style.display='none'">✕</button><div class="profile-main-card" style="margin-top:10px"><div class="profile-avatar-big"><img src="${p.photoUrl||''}"></div><div class="profile-username">${p.name}</div><div class="profile-id-text">ID: ${fid}</div><div class="profile-balance-val">${Math.floor(p.gold||0)} G</div></div><div class="profile-section"><div class="profile-section-title"><h2>📊 СТАТИСТИКА</h2></div><div class="stats-grid-3"><div class="stat-block"><div class="stat-block-label">СПИНЫ</div><div class="stat-block-val">${ps.spins}</div></div><div class="stat-block"><div class="stat-block-label">ПОБЕДЫ</div><div class="stat-block-val" style="color:var(--green)">${ps.wins}</div></div><div class="stat-block"><div class="stat-block-label">ВИНРЕЙТ</div><div class="stat-block-val" style="color:var(--gold)">${pr}%</div></div></div></div>${p.bestDrop?`<div class="profile-section"><div class="profile-section-title"><h2>🏆 ЛУЧШИЙ ДРОП</h2></div><div class="best-drop-card"><img src="${p.bestDrop.img}" class="best-drop-img"><div><div class="best-drop-label">★ РЕКОРД</div><div class="best-drop-name">${p.bestDrop.name}</div><div class="best-drop-price">${p.bestDrop.price} G</div></div></div></div>`:''}`;
  }).catch(()=>b.innerHTML='<div style="text-align:center;padding:40px;color:var(--red)">Ошибка</div>');
}
function loadLiveFeed(){
  const track=document.getElementById('liveTrack');if(!track)return;
  fetch(BOT_URL+'/api/live').then(r=>r.json()).then(d=>{
    if(!d.ok||!d.list||d.list.length===0){track.innerHTML='<span class="live-empty">Пока нет рекордов</span>';return}
    const items=d.list.slice(0,10).map(x=>`<div class="live-item" onclick="openFriendProfile('${x.userId}')"><div class="live-info"><div class="live-name">${x.playerName}</div><div class="live-pct">${x.pct||0}%</div></div><img src="${x.skinImg}" class="live-skin"></div>`).join('');
    track.innerHTML=items+items;
  }).catch(()=>track.innerHTML='<span class="live-empty">Ошибка загрузки</span>');
}
function rendSettings(){
  const b=document.getElementById('settingsBody');if(!b)return;
  b.innerHTML=`<div class="settings-item" onclick="openS('profileScreen');closeS('settingsScreen')"><label>👤 Профиль</label><span style="color:var(--gray2)">></span></div><div class="settings-item" onclick="toast('Режимы в разработке')"><label>🎮 Режимы игры</label><span style="color:var(--gray2)">></span></div><div class="settings-item"><label>🔊 Звуки</label><div class="toggle ${soundEnabled?'on':''}" onclick="soundEnabled=!soundEnabled;localStorage.setItem('sfap_sound',soundEnabled?'1':'0');rendSettings()"></div></div><div class="settings-item" onclick="if(confirm('Сбросить игру?')){localStorage.clear();location.reload()}"><label style="color:var(--red)">🗑 Сбросить игру</label></div>`;
}
function openVipModal(){document.getElementById('vipModal').style.display='flex'}
function openTasksModal(){
  const m=document.getElementById('tasksModal'),list=document.getElementById('tasksList');m.style.display='flex';list.innerHTML='<div style="text-align:center;padding:20px;color:var(--gray2)">Загрузка...</div>';
  fetch(BOT_URL+'/api/tasks/status/'+getUserId()).then(r=>r.json()).then(d=>{
    if(!d.ok)throw new Error();
    list.innerHTML=d.tasks.map(t=>{const done=t.progress>=t.need;return `<div class="task-item"><div class="task-ico">🎯</div><div class="task-info"><div class="task-title">${t.title}</div><div class="task-progress">${t.progress} / ${t.need}</div></div><button class="task-claim" ${t.claimed||!done?'disabled':''} onclick="claimTask('${t.id}')">${t.claimed?'ПОЛУЧЕНО':(done?'ЗАБРАТЬ':'ЖДЕМ')}</button></div>`}).join('');
  }).catch(()=>list.innerHTML='<div style="color:var(--red)">Ошибка</div>');
}
function claimTask(id){fetch(BOT_URL+'/api/tasks/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:getUserId(),taskId:id})}).then(r=>r.json()).then(d=>{if(d.ok&&d.skin){inv.push(d.skin);saveGame();rendInv();toast('🎁 Получен скин!');document.getElementById('tasksModal').style.display='none'}else toast('❌ Ошибка')}).catch(()=>toast('❌ Ошибка'))}

(async()=>{
  setTimeout(()=>{const l=document.getElementById('loader');if(l){l.style.opacity='0';setTimeout(()=>l.style.display='none',500)}},1500);
  await loadGame();updateBal();rendInv();rendMain();renderPctRow();loadLiveFeed();setInterval(loadLiveFeed,30000);
  const u=getUser();if(u&&u.photo_url){const av=document.getElementById('topAv');if(av)av.innerHTML=`<img src="${u.photo_url}">`}
})();
</script></body></html>
