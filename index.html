<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#87b6d9">
<title>Мёртвый город</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#87b6d9;font-family:'Courier New',monospace}
#app{position:fixed;inset:0}
canvas{display:block}

#rotate{position:fixed;inset:0;display:none;justify-content:center;align-items:center;flex-direction:column;background:#0d1117;z-index:600;color:#c9d1d9;text-align:center;padding:30px}
#rotate .ico{font-size:56px;margin-bottom:16px}
#rotate .txt{font-size:15px;font-weight:700;letter-spacing:2px}
@media(orientation:portrait){#rotate{display:flex}#menu{display:none!important}#cutscene{display:none!important}}

#menu{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;overflow:hidden;background:#0d1117}
#menu::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(120,80,20,.3) 0%,rgba(13,17,23,.98) 70%),repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.2) 2px,rgba(0,0,0,.2) 4px);animation:flicker 4s infinite}
@keyframes flicker{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.7}49%{opacity:1}72%{opacity:.85}73%{opacity:1}}
#menu-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:22px;padding:20px}
#menu h1{color:#d4d4d4;font-size:clamp(38px,9vw,68px);font-weight:900;letter-spacing:8px;text-align:center;text-shadow:0 0 30px rgba(180,120,30,.6),0 4px 0 #2a1a0a;animation:titlePulse 3s infinite}
#menu h1 .dead{color:#c97a1e;text-shadow:0 0 40px rgba(229,150,20,.9),0 4px 0 #3a1f05}
@keyframes titlePulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.15)}}
#menu .sub{color:#7a8a99;font-size:12px;letter-spacing:4px;text-transform:uppercase;margin-top:-14px}
#menu .desc{color:#8899a6;font-size:13px;font-weight:600;text-align:left;max-width:420px;line-height:1.7;border-left:2px solid #c97a1e;padding-left:14px}
#playBtn{position:relative;background:linear-gradient(180deg,#2a1a0a,#1a0f05);border:2px solid #c97a1e;color:#d4d4d4;font-weight:900;font-size:20px;padding:18px 70px;border-radius:6px;cursor:pointer;letter-spacing:6px;box-shadow:0 0 30px rgba(201,122,30,.4),inset 0 0 20px rgba(201,122,30,.15);transition:.2s}
#playBtn:hover{background:linear-gradient(180deg,#3a250d,#2a1a0a);box-shadow:0 0 50px rgba(229,150,20,.7);color:#fff}
#playBtn:active{transform:scale(.97)}
#menu .hint{color:#5a6a79;font-size:11px;letter-spacing:1px;text-align:center;line-height:1.8}

#cutscene{position:fixed;inset:0;display:none;z-index:150;background:#000}
#cutscene.on{display:block}
#cutsceneText{position:absolute;bottom:15%;left:50%;transform:translateX(-50%);color:#fff;font-size:clamp(16px,3vw,22px);font-weight:700;text-align:center;max-width:80%;text-shadow:0 2px 12px #000,0 0 30px rgba(0,0,0,.9);opacity:0;transition:opacity .6s;letter-spacing:1px;line-height:1.5;font-style:italic}
#cutsceneText.on{opacity:1}
#skipBtn{position:absolute;top:20px;right:20px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;font-weight:900;padding:8px 16px;border-radius:4px;cursor:pointer;letter-spacing:2px;z-index:10}
#fadeOverlay{position:absolute;inset:0;background:#000;opacity:0;transition:opacity 1.5s;pointer-events:none}

#ui{position:fixed;inset:0;pointer-events:none;display:none;z-index:50}
#ui.on{display:block}
#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22px;height:22px;pointer-events:none}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,.8);box-shadow:0 0 3px #000}
#crosshair::before{left:50%;top:0;width:1px;height:100%;transform:translateX(-50%)}
#crosshair::after{top:50%;left:0;height:1px;width:100%;transform:translateY(-50%)}

#hpWrap{position:absolute;left:22px;bottom:22px;width:220px}
#hpLabel{font-size:10px;font-weight:900;color:#c9d1d9;letter-spacing:3px;margin-bottom:5px;text-shadow:0 2px 4px #000}
#hpBar{height:12px;background:rgba(0,0,0,.7);border:1px solid rgba(200,30,30,.5);border-radius:2px;overflow:hidden}
#hpFill{height:100%;width:100%;background:linear-gradient(90deg,#4CAF50,#66bb6a);transition:width .2s;box-shadow:0 0 12px rgba(76,175,80,.6)}

#ammoWrap{position:absolute;right:22px;bottom:22px;text-align:right}
#ammoVal{font-size:38px;font-weight:900;color:#d4d4d4;line-height:1;text-shadow:0 0 20px rgba(255,255,255,.2),0 3px 6px #000}
#ammoVal small{font-size:16px;color:#7a8a99}
#ammoLabel{font-size:9px;font-weight:900;color:#7a8a99;letter-spacing:3px;margin-top:4px}

#partsHud{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:rgba(13,17,23,.7);border:1px solid rgba(201,122,30,.5);border-radius:4px;padding:10px 20px;display:flex;align-items:center;gap:10px;backdrop-filter:blur(4px)}
#partsHud .ico{font-size:18px}
#partsHud .txt{color:#c9d1d9;font-size:13px;font-weight:900;letter-spacing:2px}
#partsHud .txt b{color:#ffb800;font-size:16px}
#partsHud .txt small{color:#7a8a99;font-size:11px}

#hintMsg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#d4d4d4;font-size:16px;font-weight:900;letter-spacing:3px;text-align:center;background:rgba(13,17,23,.85);border:1px solid rgba(201,122,30,.5);padding:14px 28px;border-radius:4px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:80%}
#hintMsg.on{opacity:1}

#voiceText{position:absolute;top:12%;left:50%;transform:translateX(-50%);color:#fff;font-size:clamp(14px,2.4vw,18px);font-weight:700;font-style:italic;text-align:center;max-width:80%;text-shadow:0 2px 8px #000,0 0 20px rgba(0,0,0,.8);opacity:0;transition:opacity .5s;pointer-events:none;letter-spacing:.5px;line-height:1.5}
#voiceText.on{opacity:1}

#leftZone{position:absolute;left:0;top:0;bottom:0;width:42%;pointer-events:auto}
#joy{position:absolute;left:30px;bottom:60px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);pointer-events:none}
#joyBase{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:rgba(201,122,30,.8);box-shadow:0 0 20px rgba(201,122,30,.5)}

#rightZone{position:absolute;right:0;top:0;bottom:0;width:58%;pointer-events:auto}

.hud-btn{position:absolute;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);pointer-events:auto;display:flex;justify-content:center;align-items:center;color:#fff;touch-action:none;backdrop-filter:blur(3px);font-weight:900}
.hud-btn:active{background:rgba(201,122,30,.5);transform:scale(.94)}
#fireBtn{right:40px;bottom:110px;width:88px;height:88px;font-size:32px;background:rgba(201,122,30,.25);border-color:rgba(229,150,20,.6)}
#fireBtn:active{background:rgba(229,150,20,.7)}
#reloadBtn{right:150px;bottom:60px;width:64px;height:64px;font-size:24px}
#flashlightBtn{right:150px;bottom:140px;width:64px;height:64px;font-size:24px;background:rgba(255,220,120,.15);border-color:rgba(255,220,120,.5)}
#flashlightBtn.on{background:rgba(255,220,120,.5);box-shadow:0 0 25px rgba(255,220,120,.6)}

#actionBtn{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);padding:16px 40px;background:linear-gradient(180deg,#2a5a2a,#1a3a1a);border:2px solid #4CAF50;color:#fff;font-weight:900;font-size:16px;letter-spacing:3px;border-radius:8px;pointer-events:auto;display:none;cursor:pointer;box-shadow:0 0 30px rgba(76,175,80,.5)}
#actionBtn.on{display:block}
#actionBtn:active{transform:translateX(-50%) scale(.96)}

#repairBar{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70%;max-width:400px;display:none;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
#repairBar.on{display:flex}
#repairLabel{color:#fff;font-size:14px;font-weight:900;letter-spacing:3px;text-shadow:0 2px 8px #000}
#repairProgress{width:100%;height:20px;background:rgba(0,0,0,.6);border:2px solid rgba(76,175,80,.6);border-radius:10px;overflow:hidden}
#repairFill{height:100%;width:0%;background:linear-gradient(90deg,#4CAF50,#66bb6a);transition:width .1s}
#repairTimer{color:#ffb800;font-size:28px;font-weight:900;text-shadow:0 0 20px rgba(255,184,0,.6)}

#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .06s}
#damageVignette{position:absolute;inset:0;box-shadow:inset 0 0 140px rgba(184,30,30,.9);opacity:0;pointer-events:none;transition:opacity .25s}

#result{position:fixed;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;background:rgba(3,4,6,.96);z-index:300;gap:16px;padding:20px;text-align:center}
#result.on{display:flex}
#result h1{font-size:clamp(36px,8vw,58px);font-weight:900;letter-spacing:6px}
#result h1.win{color:#66bb6a;text-shadow:0 0 50px rgba(102,187,106,.6)}
#result p{color:#8899a6;font-size:14px;font-weight:600;max-width:420px;line-height:1.7;letter-spacing:1px}
#result button{background:linear-gradient(180deg,#2a1a0a,#1a0f05);border:2px solid #c97a1e;color:#d4d4d4;font-weight:900;font-size:16px;padding:15px 44px;border-radius:6px;cursor:pointer;letter-spacing:4px;margin-top:10px}
</style>
</head>
<body>

<div id="app"></div>

<div id="rotate"><div class="ico">📱</div><div class="txt">ПОВЕРНИ ТЕЛЕФОН ГОРИЗОНТАЛЬНО</div></div>

<div id="menu">
  <div id="menu-content">
    <h1>МЁРТВЫЙ <span class="dead">ГОРОД</span></h1>
    <div class="sub">DAY ZERO · ВЫЖИВАНИЕ</div>
    <div class="desc">
      Вертолёт упал. Ты один в городе.<br>
      Найди 5 деталей, почини вертолёт и улетай.
    </div>
    <button id="playBtn">НАЧАТЬ</button>
    <div class="hint">Левая часть — движение · Правая — обзор<br>🔥 огонь · ⚡ фонарь · 🔄 перезарядка</div>
  </div>
</div>

<div id="cutscene">
  <div id="cutsceneText"></div>
  <div id="fadeOverlay"></div>
  <button id="skipBtn">ПРОПУСТИТЬ ▸</button>
</div>

<div id="ui">
  <div id="crosshair"></div>
  <div id="hpWrap">
    <div id="hpLabel">ЗДОРОВЬЕ</div>
    <div id="hpBar"><div id="hpFill"></div></div>
  </div>
  <div id="ammoWrap">
    <div id="ammoVal"><span id="ammoNum">12</span><small> / <span id="ammoMax">12</span></small></div>
    <div id="ammoLabel">ПАТРОНЫ</div>
  </div>
  <div id="partsHud">
    <div class="ico">🔧</div>
    <div class="txt">ДЕТАЛИ: <b id="partsNum">0</b><small>/5</small></div>
  </div>
  <div id="hintMsg"></div>
  <div id="voiceText"></div>

  <div id="leftZone"><div id="joy"><div id="joyBase"></div></div></div>
  <div id="rightZone"></div>

  <div class="hud-btn" id="fireBtn">🔥</div>
  <div class="hud-btn" id="flashlightBtn">⚡</div>
  <div class="hud-btn" id="reloadBtn">🔄</div>

  <div id="actionBtn">🔧 ПОЧИНИТЬ</div>

  <div id="repairBar">
    <div id="repairLabel">РЕМОНТ ВЕРТОЛЁТА</div>
    <div id="repairProgress"><div id="repairFill"></div></div>
    <div id="repairTimer">30</div>
  </div>

  <div id="flash"></div>
  <div id="damageVignette"></div>
</div>

<div id="result">
  <h1 id="resultTitle"></h1>
  <p id="resultText"></p>
  <button id="restartBtn">ЗАНОВО</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ==========================================
// ФУЛЛСКРИН
// ==========================================
function goFullscreen(){
  try{
    const el = document.documentElement;
    if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    if(window.Telegram && window.Telegram.WebApp){
      try{ window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); if(window.Telegram.WebApp.requestFullscreen) window.Telegram.WebApp.requestFullscreen(); }catch(e){}
    }
  }catch(e){}
}

// ==========================================
// ГОЛОС
// ==========================================
let voiceReady = false;
function initVoices(){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = ()=>{ voiceReady = true; };
}
initVoices();

function speak(text, opts = {}){
  if(!window.speechSynthesis) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ru-RU';
    u.rate = opts.rate || 0.85;
    u.pitch = opts.pitch || 0.7;
    u.volume = opts.volume || 1;
    const voices = window.speechSynthesis.getVoices();
    const ruVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ru'));
    if(ruVoice) u.voice = ruVoice;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

// ==========================================
// КАТ-СЦЕНА
// ==========================================
const cutScene = new THREE.Scene();
cutScene.background = new THREE.Color(0x87b6d9);
cutScene.fog = new THREE.Fog(0x87b6d9, 40, 140);

const cutRenderer = new THREE.WebGLRenderer({ antialias: true });
cutRenderer.setSize(innerWidth, innerHeight);
cutRenderer.setPixelRatio(Math.min(devicePixelRatio, 2));
cutRenderer.domElement.style.position = 'absolute';
cutRenderer.domElement.style.inset = '0';

const cutCamera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);

cutScene.add(new THREE.AmbientLight(0xffffff, 1.8));
const cutSun = new THREE.DirectionalLight(0xffffff, 2.2);
cutSun.position.set(30, 50, 20);
cutScene.add(cutSun);

const cutGround = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 300),
  new THREE.MeshLambertMaterial({ color: 0x4a7c3a })
);
cutGround.rotation.x = -Math.PI/2;
cutScene.add(cutGround);

// вертолёт
const heli = new THREE.Group();
const heliMat = new THREE.MeshLambertMaterial({ color: 0x3a4a2a });
const heliDark = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
const glassMat = new THREE.MeshLambertMaterial({ color: 0x4a9eff, transparent: true, opacity: 0.5 });

const fuselage = new THREE.Mesh(new THREE.SphereGeometry(1.6, 16, 12), heliMat);
fuselage.scale.set(1, 0.9, 1.4);
heli.add(fuselage);
const nose = new THREE.Mesh(new THREE.SphereGeometry(1.1, 14, 12), glassMat);
nose.position.set(0, -0.1, 1.4); nose.scale.set(1, 0.8, 0.9); heli.add(nose);
const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.35, 4.5, 8), heliMat);
tail.rotation.x = Math.PI/2; tail.position.set(0, 0.4, -3.2); heli.add(tail);
const fin = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.2, 0.8), heliMat);
fin.position.set(0, 1, -5); heli.add(fin);
const skidGeo = new THREE.CylinderGeometry(0.06, 0.06, 3.5, 6);
const skidL = new THREE.Mesh(skidGeo, heliDark); skidL.rotation.x = Math.PI/2; skidL.position.set(-0.9, -1.6, 0); heli.add(skidL);
const skidR = new THREE.Mesh(skidGeo, heliDark); skidR.rotation.x = Math.PI/2; skidR.position.set(0.9, -1.6, 0); heli.add(skidR);
[-0.9, 0.9].forEach(x=>{ [-0.6, 0.8].forEach(z=>{ const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.8, 6), heliDark); strut.position.set(x, -1.2, z); heli.add(strut); }); });
const rotorHub = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.25, 8), heliDark); rotorHub.position.y = 1.7; heli.add(rotorHub);
const rotor = new THREE.Group();
const bladeGeo = new THREE.BoxGeometry(0.08, 0.04, 5.5);
for(let i=0;i<4;i++){ const b = new THREE.Mesh(bladeGeo, heliDark); b.rotation.y = i * Math.PI/2; rotor.add(b); }
rotor.position.y = 1.85; heli.add(rotor);
const tailRotor = new THREE.Group();
const tb = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.6, 0.04), heliDark); tailRotor.add(tb);
const tb2 = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.6, 0.04), heliDark); tb2.rotation.y = Math.PI/2; tailRotor.add(tb2);
tailRotor.position.set(0.15, 1, -5); heli.add(tailRotor);

heli.position.set(0, 12, 0);
cutScene.add(heli);

const cutEl = document.getElementById('cutscene');
const cutText = document.getElementById('cutsceneText');
const fadeOverlay = document.getElementById('fadeOverlay');
const skipBtn = document.getElementById('skipBtn');

let cutActive = false, cutTime = 0, cutPhase = 0;

const CUT_PHASES = [
  { t: 0.5, text: 'Отсюда нет выхода...', speak: true },
  { t: 4.0, text: '', speak: false },
  { t: 4.5, text: 'Это конец.', speak: true },
  { t: 7.0, text: '', speak: false },
  { t: 8.5, text: 'НЕТ! ДЕРЖИСЬ!', speak: true },
  { t: 11.0, text: '', speak: false }
];

function startCutscene(){
  cutActive = true; cutTime = 0; cutPhase = 0;
  cutEl.classList.add('on');
  cutEl.appendChild(cutRenderer.domElement);
  cutText.classList.remove('on');
  fadeOverlay.style.opacity = '0';
  heli.position.set(0, 12, 0);
  heli.rotation.set(0, 0, 0);
  goFullscreen();
  // прогреваем голос жестом
  if(window.speechSynthesis){ window.speechSynthesis.getVoices(); }
}

function endCutscene(){
  cutActive = false;
  cutEl.classList.remove('on');
  cutRenderer.domElement.remove();
  startGame();
}

skipBtn.addEventListener('click', ()=>{
  if(cutActive){ if(window.speechSynthesis) window.speechSynthesis.cancel(); endCutscene(); }
});

function animateCutscene(dt){
  if(!cutActive) return;
  cutTime += dt;
  rotor.rotation.y += dt * 25;
  tailRotor.rotation.y += dt * 30;

  while(cutPhase < CUT_PHASES.length && cutTime >= CUT_PHASES[cutPhase].t){
    const p = CUT_PHASES[cutPhase];
    if(p.text){ cutText.innerText = p.text; cutText.classList.add('on'); if(p.speak) speak(p.text, {rate:0.85, pitch:0.6}); }
    else { cutText.classList.remove('on'); }
    cutPhase++;
  }

  if(cutTime < 4){
    heli.position.y = 12 + Math.sin(cutTime*2)*0.4;
    heli.position.z = Math.sin(cutTime*0.5)*6;
    heli.rotation.z = Math.sin(cutTime*1.5)*0.05;
  } else if(cutTime < 9){
    const t = (cutTime - 4) / 5;
    heli.position.y = 12 - t * 12;
    heli.rotation.z = t * 1.2;
    heli.rotation.x = t * 0.7;
    if(t > 0.88) heli.position.y = 0.5;
  } else {
    if(cutTime > 10.5){
      const t = Math.min(1, (cutTime - 10.5) / 1.5);
      fadeOverlay.style.opacity = String(t);
    }
    if(cutTime > 12){ endCutscene(); return; }
  }

  if(cutTime < 9){
    cutCamera.position.set(Math.sin(cutTime*0.4)*18, 14 + Math.sin(cutTime*0.5)*2, 18);
    cutCamera.lookAt(heli.position.x, heli.position.y, heli.position.z);
  } else {
    cutCamera.position.set(10 + Math.sin(cutTime*0.5)*3, 5, 10);
    cutCamera.lookAt(0, 1.5, 0);
  }

  cutRenderer.render(cutScene, cutCamera);
}

// ==========================================
// ОСНОВНАЯ СЦЕНА — СОЛНЕЧНЫЙ ДЕНЬ
// ==========================================
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b6d9);
scene.fog = new THREE.Fog(0x87b6d9, 80, 250);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.05, 400);
camera.position.set(0, 1.7, 0);
scene.add(camera); // ВАЖНО: камера в сцене, чтобы фонарь работал

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = false;
app.appendChild(renderer.domElement);

// солнце
scene.add(new THREE.AmbientLight(0xffffff, 1.8));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(50, 80, 30);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x88aaff, 0.6);
fill.position.set(-30, 20, -20);
scene.add(fill);

// ==========================================
// ГОРОД
// ==========================================
const obstacleList = [];
const wallR = 130;
const buildingData = [];

function makeBuilding(x, z, w, h, d, enterable){
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshLambertMaterial({ color: 0x8a8a90 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bodyMat);
  body.position.y = h/2;
  g.add(body);

  const winMat = new THREE.MeshBasicMaterial({ color: 0x4a5a6a });
  const winGeo = new THREE.BoxGeometry(0.6, 0.8, 0.1);
  for(let fy=1.5; fy<h-1; fy+=2.2){
    for(let fx=-w/2+1; fx<w/2-0.5; fx+=1.8){
      if(Math.random() < 0.12) continue;
      const win = new THREE.Mesh(winGeo, winMat);
      win.position.set(fx + 0.3, fy, d/2 + 0.06);
      g.add(win);
    }
  }

  g.position.set(x, 0, z);
  scene.add(g);

  if(enterable){
    const innerW = w - 1.2, innerD = d - 1.2, innerH = h - 0.5;
    const floor = new THREE.Mesh(new THREE.BoxGeometry(innerW, 0.1, innerD), new THREE.MeshLambertMaterial({ color: 0x5a5040 }));
    floor.position.set(x, 0.05, z); scene.add(floor);
    const wallMatIn = new THREE.MeshLambertMaterial({ color: 0x9a9080 });
    const wallThick = 0.2, wallH = innerH;
    const bw = new THREE.Mesh(new THREE.BoxGeometry(innerW, wallH, wallThick), wallMatIn);
    bw.position.set(x, wallH/2, z + innerD/2); scene.add(bw);
    const doorW = 1.6, sideW = (innerW - doorW) / 2;
    const fwL = new THREE.Mesh(new THREE.BoxGeometry(sideW, wallH, wallThick), wallMatIn);
    fwL.position.set(x - (innerW/2 - sideW/2), wallH/2, z - innerD/2); scene.add(fwL);
    const fwR = new THREE.Mesh(new THREE.BoxGeometry(sideW, wallH, wallThick), wallMatIn);
    fwR.position.set(x + (innerW/2 - sideW/2), wallH/2, z - innerD/2); scene.add(fwR);
    const fwTop = new THREE.Mesh(new THREE.BoxGeometry(doorW, wallH - 2.2, wallThick), wallMatIn);
    fwTop.position.set(x, 2.2 + (wallH - 2.2)/2, z - innerD/2); scene.add(fwTop);
    const lw = new THREE.Mesh(new THREE.BoxGeometry(wallThick, wallH, innerD), wallMatIn);
    lw.position.set(x - innerW/2, wallH/2, z); scene.add(lw);
    const rw = new THREE.Mesh(new THREE.BoxGeometry(wallThick, wallH, innerD), wallMatIn);
    rw.position.set(x + innerW/2, wallH/2, z); scene.add(rw);
    const ceil = new THREE.Mesh(new THREE.BoxGeometry(innerW, 0.1, innerD), new THREE.MeshLambertMaterial({ color: 0x7a7060 }));
    ceil.position.set(x, wallH, z); scene.add(ceil);

    obstacleList.push({ x, z: z + innerD/2, r: innerW/2 });
    obstacleList.push({ x: x - innerW/2, z, r: innerD/2 });
    obstacleList.push({ x: x + innerW/2, z, r: innerD/2 });
    obstacleList.push({ x: x - (innerW/2 - sideW/2), z: z - innerD/2, r: sideW/2 });
    obstacleList.push({ x: x + (innerW/2 - sideW/2), z: z - innerD/2, r: sideW/2 });
    buildingData.push({ x, z, w, d, h, enterable: true });
  } else {
    obstacleList.push({ x, z, r: Math.max(w,d)*0.55 });
    buildingData.push({ x, z, w, d, h, enterable: false });
  }
}

const blockSize = 28;
const blocks = 5;
for(let i=-blocks; i<=blocks; i++){
  for(let j=-blocks; j<=blocks; j++){
    if(i===0 && j===0) continue;
    const cx = i*blockSize + (Math.random()-0.5)*10;
    const cz = j*blockSize + (Math.random()-0.5)*10;
    if(Math.sqrt(cx*cx + cz*cz) > wallR - 20) continue;
    if(Math.random() < 0.25) continue;
    const w = 9 + Math.random()*9;
    const d = 9 + Math.random()*9;
    const h = 6 + Math.random()*14;
    const enterable = Math.random() < 0.35;
    makeBuilding(cx, cz, w, h, d, enterable);
  }
}

const PARTS_TOTAL = 5;

const partPositions = [];

function placeParts(){
  partMeshes.forEach(p=>scene.remove(p));
  partMeshes.length = 0;
  partPositions.length = 0;
  for(let i=0;i<PARTS_TOTAL;i++){
    let x, z, ok = false, tries = 0;
    const inBuilding = i < 2 && buildingData.filter(b=>b.enterable).length > 0;
    if(inBuilding){
      const builds = buildingData.filter(b=>b.enterable);
      const b = builds[Math.floor(Math.random()*builds.length)];
      x = b.x; z = b.z;
    } else {
      while(!ok && tries < 100){
        tries++;
        const a = Math.random()*Math.PI*2;
        const r = 25 + Math.random()*(wallR - 40);
        x = Math.cos(a)*r; z = Math.sin(a)*r;
        ok = true;
        for(const o of obstacleList){ const dx = x-o.x, dz = z-o.z; if(dx*dx + dz*dz < (o.r + 3)*(o.r + 3)){ ok = false; break; } }
        if(Math.abs(x) < 8 && Math.abs(z - heliGroundPos.z) < 8) ok = false;
      }
    }
    const g = new THREE.Group();
    const box = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 0.8), new THREE.MeshLambertMaterial({ color: 0xb8860b, emissive: 0x5a3a00 }));
    box.position.y = 0.3; g.add(box);
    const glow = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffb800, transparent: true, opacity: 0.35 }));
    glow.position.y = 0.3; g.add(glow);
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.15, 6, 6, 1, true), new THREE.MeshBasicMaterial({ color: 0xffb800, transparent: true, opacity: 0.12, side: THREE.DoubleSide }));
    beam.position.y = 3; g.add(beam);
    g.position.set(x, 0, z);
    scene.add(g);
    partMeshes.push(g);
    partPositions.push({ x, z, mesh: g, collected: false, glow });
  }
}

const leftZone = document.getElementById('leftZone');

let joyActive = false, joyVec = {x:0,y:0}, joyId = null;

leftZone.addEventListener('pointerdown', e=>{
  e.preventDefault();
  joyActive = true; joyId = e.pointerId;
  leftZone.setPointerCapture(e.pointerId);
  const rect = leftZone.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  joy.style.left = (x - 70) + 'px'; joy.style.top = (y - 70) + 'px'; joy.style.bottom = 'auto';
  joyBase.style.transform = 'translate(-50%,-50%)';
  joyMove(e);
});
leftZone.addEventListener('pointermove', e=>{ if(joyActive && e.pointerId===joyId){ e.preventDefault(); joyMove(e); } });
function joyMove(e){
  const rect = joy.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  let dx = e.clientX - cx, dy = e.clientY - cy;
  const max = rect.width/2 - 12;
  const d = Math.sqrt(dx*dx + dy*dy);
  if(d > max){ dx = dx/d*max; dy = dy/d*max; }
  joyBase.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  joyVec.x = dx/max; joyVec.y = dy/max;
}
function joyEnd(e){
  if(e.pointerId !== joyId) return;
  joyActive = false; joyId = null; joyVec.x = 0; joyVec.y = 0;
  joy.style.left = '30px'; joy.style.top = 'auto'; joy.style.bottom = '60px';
  joyBase.style.transform = 'translate(-50%,-50%)';
}
leftZone.addEventListener('pointerup', joyEnd);

let audioCtx = null;
function getAudioCtx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
function soundShot(){ try{ const ctx = getAudioCtx(); const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.type = 'square'; o.frequency.value = 180; g.gain.setValueAtTime(0.15, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12); o.start(); o.stop(ctx.currentTime + 0.12); }catch(e){} }
function soundReload(){ try{ const ctx = getAudioCtx(); [0,0.3,0.7,1.1].forEach((t,i)=>{ const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.type='square'; o.frequency.value = 400+i*100; g.gain.setValueAtTime(0.06, ctx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+t+0.08); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.08); }); }catch(e){} }
function soundPickup(){ try{ const ctx = getAudioCtx(); [523,659,784].forEach((f,i)=>{ const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.type='sine'; o.frequency.value = f; g.gain.setValueAtTime(0.08, ctx.currentTime+i*0.1); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+i*0.1+0.2); o.start(ctx.currentTime+i*0.1); o.stop(ctx.currentTime+i*0.1+0.2); }); }catch(e){} }
function soundStep(){ try{ const ctx = getAudioCtx(); const buf = ctx.createBuffer(1, ctx.sampleRate*0.06, ctx.sampleRate); const data = buf.getChannelData(0); for(let i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * Math.exp(-i/data.length*4) * 0.5; const src = ctx.createBufferSource(); src.buffer = buf; const g = ctx.createGain(); g.gain.value = 0.05; src.connect(g); g.connect(ctx.destination); src.start(); }catch(e){} }

function collides(x, z, radius){
  for(const o of obstacleList){
    const dx = x-o.x, dz = z-o.z;
    const rr = o.r + radius;
    if(dx*dx + dz*dz < rr*rr) return true;
  }
  const d = Math.sqrt(x*x + z*z);
  if(d > wallR - 1.5) return true;
  return false;
}

function startGame(){
  player.x = 0; player.z = 0; player.y = 1.7;
  player.yaw = 0; player.pitch = 0;
  player.hp = player.maxHp;
  player.ammo = player.maxAmmo;
  player.partsCollected = 0;
  player.repaired = false;
  player.inHeli = false;
  player.shootCooldown = 0;
  reloading = false; reloadAnim = 0;
  repairing = false;
  repairBar.classList.remove('on');
  actionBtn.classList.remove('on');

  placeParts();
  heliGround.position.set(heliGroundPos.x, 0, heliGroundPos.z);

  updateHpUI(); updateAmmoUI(); updatePartsUI();
  document.getElementById('menu').style.display = 'none';
  document.getElementById('ui').classList.add('on');
  resultEl.classList.remove('on');
  gameActive = true;

  setTimeout(()=>showVoice('Кажется, я пропал...', 3000), 600);
  setTimeout(()=>showVoice('Надо выбираться отсюда.', 3000), 4200);
  setTimeout(()=>showVoice('Пять деталей. Собрать и починить вертолёт.', 3500), 7800);
}

document.getElementById('playBtn').addEventListener('click', ()=>{ goFullscreen(); startCutscene(); });
document.getElementById('restartBtn').addEventListener('click', ()=>{ resultEl.classList.remove('on'); startCutscene(); });

// ==========================================
// ЦИКЛ
// ==========================================
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if(cutActive){ animateCutscene(dt); return; }

  if(gameActive){
    // движение
    let ix = 0, iz = 0;
    if(keys['KeyW'] || keys['ArrowUp']) iz -= 1;
    if(keys['KeyS'] || keys['ArrowDown']) iz += 1;
    if(keys['KeyA'] || keys['ArrowLeft']) ix -= 1;
    if(keys['KeyD'] || keys['ArrowRight']) ix += 1;
    ix += joyVec.x; iz += joyVec.y;
    const len = Math.sqrt(ix*ix + iz*iz);
    if(len > 1){ ix /= len; iz /= len; }

    if(len > 0.05 && !player.inHeli){
      // ПРАВИЛЬНОЕ ДВИЖЕНИЕ ОТНОСИТЕЛЬНО КАМЕРЫ:
      // iz = -1 (джойстик вверх) → идём вперёд по направлению взгляда
      const wx = ix*Math.cos(player.yaw) + iz*Math.sin(player.yaw);
      const wz = -ix*Math.sin(player.yaw) + iz*Math.cos(player.yaw);
      const nx = player.x + wx * player.speed * dt;
      const nz = player.z + wz * player.speed * dt;
      if(!collides(nx, player.z, 0.4)) player.x = nx;
      if(!collides(player.x, nz, 0.4)) player.z = nz;
    }

    if(!player.inHeli){
      camera.position.set(player.x, player.y, player.z);
      const dir = new THREE.Vector3(
        -Math.sin(player.yaw) * Math.cos(player.pitch),
        Math.sin(player.pitch),
        -Math.cos(player.yaw) * Math.cos(player.pitch)
      );
      camera.lookAt(player.x + dir.x, player.y + dir.y, player.z + dir.z);

      // фонарь светит по направлению взгляда — цель в 20 юнитов вперёд
      flashlightTarget.position.set(dir.x * 20, dir.y * 20, dir.z * 20);
      flashlightTarget.updateMatrixWorld();

      // оружие
      const bobSpeed = len > 0.05 ? 8 : 0;
      const bobX = Math.sin(performance.now()*0.001*bobSpeed) * 0.012 * (len>0.05?1:0);
      const bobY = Math.abs(Math.cos(performance.now()*0.001*bobSpeed)) * 0.015 * (len>0.05?1:0);
      weaponSway.x += (-bobX - weaponSway.x) * 0.15;
      weaponSway.y += (-bobY - weaponSway.y) * 0.15;
      weaponRecoil.x += (0 - weaponRecoil.x) * 0.2;
      weaponRecoil.y += (0 - weaponRecoil.y) * 0.2;
      weaponRecoil.z += (0 - weaponRecoil.z) * 0.2;

      let reloadOffsetY = 0;
      if(reloading){ const t = 1 - reloadAnim; reloadOffsetY = -Math.sin(t*Math.PI)*0.35; weaponGroup.rotation.z = Math.sin(t*Math.PI)*0.4; }
      else { weaponGroup.rotation.z += (0 - weaponGroup.rotation.z) * 0.2; }

      weaponGroup.position.set(
        weaponBase.x + weaponSway.x + weaponRecoil.x,
        weaponBase.y + weaponSway.y + weaponRecoil.y + reloadOffsetY,
        weaponBase.z + weaponRecoil.z
      );
      weaponGroup.rotation.x = weaponRecoil.z * 0.5;
      weaponGroup.visible = true;

      // стрельба
      player.shootCooldown -= dt;
      if(firing && player.shootCooldown <= 0 && !reloading){
        if(player.ammo > 0){
          player.ammo--; player.shootCooldown = 0.22;
          updateAmmoUI(); soundShot(); muzzleFlashShow();
          weaponRecoil.z = 0.08; weaponRecoil.y = 0.04;
          player.pitch += 0.015;
          if(player.ammo === 0) startReload();
        } else { player.shootCooldown = 0.3; startReload(); }
      }
    }

    // подбор деталей
    for(const p of partPositions){
      if(p.collected) continue;
      p.mesh.rotation.y += dt * 2;
      p.glow.material.opacity = 0.25 + Math.sin(performance.now()*0.003) * 0.15;
      const dx = player.x - p.x, dz = player.z - p.z;
      if(dx*dx + dz*dz < 1.5*1.5){
        p.collected = true; scene.remove(p.mesh);
        player.partsCollected++; updatePartsUI(); soundPickup();
        if(player.partsCollected >= PARTS_TOTAL){
          showHint('Все детали собраны! Иди к вертолёту и почини его.', 4000);
          speak('Все детали собраны. Иди к вертолёту.', {rate:0.9, pitch:0.7});
        } else {
          showHint('Деталь найдена (' + player.partsCollected + '/5)', 1500);
        }
      }
    }

    // кнопка действия у вертолёта
    const hdx = player.x - heliGroundPos.x, hdz = player.z - heliGroundPos.z;
    const hdist = Math.sqrt(hdx*hdx + hdz*hdz);
    if(hdist < 5 && player.partsCollected >= PARTS_TOTAL && !player.repaired && !repairing){
      actionBtn.classList.add('on');
      actionBtn.innerText = '🔧 ПОЧИНИТЬ';
    } else if(hdist < 5 && player.repaired && !player.inHeli){
      actionBtn.classList.add('on');
      actionBtn.innerText = '🚁 СЕСТЬ В ВЕРТОЛЁТ';
    } else {
      actionBtn.classList.remove('on');
    }

    // ремонт
    if(repairing){
      const elapsed = (performance.now() - repairStart) / 1000;
      const left = Math.max(0, REPAIR_TIME - elapsed);
      repairFill.style.width = ((REPAIR_TIME - left) / REPAIR_TIME * 100) + '%';
      repairTimer.innerText = Math.ceil(left);
      if(left <= 0){
        repairing = false;
        player.repaired = true;
        repairBar.classList.remove('on');
        showHint('Вертолёт починен! Садись и улетай.', 4000);
        speak('Вертолёт починен. Садись и улетай.', {rate:0.9, pitch:0.8});
      }
    }

    if(hintTimer > 0){ hintTimer -= dt; if(hintTimer <= 0) hintMsg.classList.remove('on'); }
    if(voiceTimer > 0){ voiceTimer -= dt; if(voiceTimer <= 0) voiceText.classList.remove('on'); }
  }

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
  cutCamera.aspect = innerWidth/innerHeight; cutCamera.updateProjectionMatrix(); cutRenderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
