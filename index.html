<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>StandDash</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a0c;--panel:#121216;--panel-l:#1a1a22;--border:#272730;--gold:#ffb800;--red:#e50914;--green:#2e7d32;--green-l:#4CAF50;--gray:#666;--gray2:#999;--white:#fff;--blue:#4a9eff;--purple:#9b8aff}
body{background:var(--bg);color:var(--white);min-height:100vh;overflow-x:hidden;padding-bottom:20px}
body.light{--bg:#f0f0f5;--panel:#fff;--panel-l:#e8e8f0;--border:#d0d0dd;--white:#1a1a2a;--gray2:#666}

#preloader{position:fixed;inset:0;background:radial-gradient(circle at center,#1a1a22 0%,#0a0a0c 100%);z-index:99999;display:none;justify-content:center;align-items:center;flex-direction:column;gap:20px}
#preloader.on{display:flex}
.preload-logo{font-size:36px;font-weight:900;letter-spacing:4px;background:linear-gradient(135deg,#ffd700,#ff8c00,#ffd700);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:preloadGradient 2s ease-in-out infinite}
.preload-logo span{-webkit-text-fill-color:transparent}
@keyframes preloadGradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.preload-bar{width:200px;height:4px;background:var(--panel-l);border-radius:2px;overflow:hidden}
.preload-bar-fill{height:100%;width:0;background:linear-gradient(90deg,#ffd700,#ff8c00);animation:preloadFill 1.2s ease-in-out forwards}
@keyframes preloadFill{0%{width:0}100%{width:100%}}
.preload-text{font-size:11px;color:var(--gray2);font-weight:800;letter-spacing:2px}

body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 0%,rgba(255,184,0,.06) 0%,transparent 50%);transition:opacity 1s}
body.night::before{background:radial-gradient(2px 2px at 20% 15%,rgba(255,255,255,.7),transparent),radial-gradient(1.5px 1.5px at 70% 25%,rgba(255,255,255,.6),transparent),radial-gradient(2px 2px at 15% 75%,rgba(255,255,255,.5),transparent),radial-gradient(ellipse at 50% 0%,rgba(74,100,180,.12) 0%,transparent 50%);background-size:200px 200px;animation:starsTwinkle 8s ease-in-out infinite}
@keyframes starsTwinkle{0%,100%{opacity:.7}50%{opacity:1}}
#bgParticles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-particle{position:absolute;border-radius:50%;background:rgba(255,215,0,.5);box-shadow:0 0 4px rgba(255,215,0,.8);animation:particleFloat linear infinite}
@keyframes particleFloat{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translateY(-10vh) scale(1.2);opacity:0}}

body.weather-rain::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(90deg,transparent 0%,transparent 49%,rgba(120,150,200,.15) 50%,transparent 51%);background-size:100% 100%;animation:rainFall .8s linear infinite;opacity:0;transition:opacity 1.5s}
body.weather-rain.weather-on::after{opacity:1}
@keyframes rainFall{0%{background-position:0 0}100%{background-position:0 60px}}
body.weather-snow::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle,rgba(255,255,255,.6) 1px,transparent 1.5px);background-size:60px 60px;animation:snowFall 8s linear infinite;opacity:0;transition:opacity 1.5s}
body.weather-snow.weather-on::after{opacity:1}
@keyframes snowFall{0%{background-position:0 0}100%{background-position:30px 60px}}

.top{position:sticky;top:0;z-index:100;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(15,15,20,.98) 0%,rgba(10,10,12,.95) 100%);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top-left{display:flex;align-items:center;gap:12px;cursor:pointer}
.logo-svg{width:34px;height:34px;filter:drop-shadow(0 0 12px rgba(229,9,20,.5));animation:logoPulse 3s ease-in-out infinite}
@keyframes logoPulse{0%,100%{filter:drop-shadow(0 0 12px rgba(229,9,20,.5))}50%{filter:drop-shadow(0 0 20px rgba(229,9,20,.8))}}
.rank-badge{display:flex;flex-direction:column;font-size:9px;font-weight:800;color:var(--gray2)}
.rank-badge .rn{color:var(--gold);font-size:11px}
.rank-progress{height:3px;background:var(--panel-l);border-radius:2px;overflow:hidden;margin-top:4px;width:80px}
.rank-progress-fill{height:100%;background:linear-gradient(90deg,#ffd700,#ff8c00);transition:width .5s}
.top-right{display:flex;align-items:center;gap:8px}
.cart-btn{width:38px;height:38px;border-radius:10px;background:var(--panel);display:flex;justify-content:center;align-items:center;cursor:pointer;border:1px solid var(--border);position:relative}
.cart-btn svg{width:18px;height:18px;fill:var(--white)}
.cart-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:9px;font-weight:900;border-radius:10px;padding:2px 5px;border:2px solid var(--bg);display:none}
.bal-pill{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,rgba(255,215,0,.12),rgba(255,140,0,.08));padding:6px 12px;border-radius:10px;border:1px solid rgba(255,184,0,.4);cursor:pointer;animation:balGlow 4s ease-in-out infinite}
@keyframes balGlow{0%,100%{box-shadow:0 0 10px rgba(255,184,0,.15)}50%{box-shadow:0 0 20px rgba(255,184,0,.3)}}
.bal-plus{width:24px;height:24px;background:linear-gradient(135deg,#ffd700,#ff8c00);border-radius:6px;display:flex;justify-content:center;align-items:center;font-size:16px;color:#1a1a1a;font-weight:900}
.bal-num{font-size:14px;font-weight:900}
.bal-g{font-size:11px;font-weight:900;color:var(--gold)}
.av-top{width:38px;height:38px;border-radius:10px;background:var(--panel);display:flex;justify-content:center;align-items:center;font-size:16px;cursor:pointer;border:1px solid var(--border);overflow:hidden;position:relative}
.av-top img{width:100%;height:100%;object-fit:cover}
.weather-indicator{font-size:16px;padding:6px 8px;background:var(--panel);border:1px solid var(--border);border-radius:8px;cursor:pointer;display:flex;align-items:center}

.profile-menu{position:fixed;top:60px;right:16px;width:260px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;z-index:150;transform:translateY(-20px);opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.4,0,.2,1);box-shadow:0 10px 40px rgba(0,0,0,.6)}
.profile-menu.open{transform:translateY(0);opacity:1;pointer-events:auto}
.pm-header{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:12px}
.pm-avatar{width:48px;height:48px;border-radius:12px;background:var(--panel-l);border:2px solid var(--gold);overflow:hidden;display:flex;justify-content:center;align-items:center;font-size:20px;flex-shrink:0}
.pm-avatar img{width:100%;height:100%;object-fit:cover}
.pm-name{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-id{font-size:10px;color:var(--gray2);font-family:monospace}
.pm-btn{display:flex;align-items:center;gap:10px;padding:12px;background:var(--panel-l);border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:13px;font-weight:800;border:none;color:var(--white);width:100%;text-align:left}
.pm-btn .ico{font-size:16px;width:24px;text-align:center}

.live-bar{margin:12px 16px;background:var(--panel);border:1px solid var(--border);border-radius:12px;height:56px;overflow:hidden;position:relative;display:flex;align-items:center;padding-right:80px}
.live-bar::before{content:'LIVE';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:9px;font-weight:900;color:#fff;background:var(--red);padding:3px 8px;border-radius:4px;z-index:3}
.live-track{display:flex;gap:12px;white-space:nowrap;animation:scrollLeft 40s linear infinite;padding-left:65px;align-items:center;height:100%}
@keyframes scrollLeft{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.live-item{display:flex;align-items:center;gap:10px;flex-shrink:0;padding:6px 12px;background:var(--panel-l);border-radius:8px;border:1px solid var(--border);border-left:4px solid var(--gold)}
.live-name{font-size:12px;font-weight:900}
.live-pct{font-size:10px;font-weight:900;color:#1a1a1a;background:var(--gold);padding:2px 6px;border-radius:4px}
.live-skin{width:44px;height:28px;object-fit:contain}
.live-empty{padding-left:65px;font-size:10px;color:var(--gray);font-weight:700}

.bp-card{position:absolute;top:12px;right:16px;width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,#1a1408,#0a0800);border:2px solid var(--gold);cursor:pointer;z-index:90;overflow:hidden;display:flex;justify-content:center;align-items:center;box-shadow:0 0 20px rgba(255,184,0,.4);animation:bpPulse 2.5s ease-in-out infinite}
.bp-card::before{content:'';position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent 0deg,rgba(255,215,0,.4) 60deg,transparent 120deg,rgba(255,215,0,.4) 180deg,transparent 240deg,rgba(255,215,0,.4) 300deg,transparent 360deg);animation:bpRotate 4s linear infinite;pointer-events:none;z-index:0}
.bp-card::after{content:'BATTLE PASS';position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.85);color:var(--gold);font-size:7px;font-weight:900;text-align:center;padding:2px 0;z-index:3}
.bp-card img{width:70%;height:70%;object-fit:contain;position:relative;z-index:2}
@keyframes bpPulse{0%,100%{box-shadow:0 0 20px rgba(255,184,0,.4)}50%{box-shadow:0 0 35px rgba(255,184,0,.7)}}
@keyframes bpRotate{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

.bp-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1500;display:flex;justify-content:center;align-items:center;padding:16px;overflow-y:auto}
.bp-modal-panel{background:linear-gradient(165deg,#1a1408 0%,#0a0800 100%);border:2px solid var(--gold);border-radius:20px;padding:20px;width:100%;max-width:440px;position:relative;max-height:90vh;overflow-y:auto}
.bp-modal-header{text-align:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid rgba(255,184,0,.2)}
.bp-modal-title{font-size:24px;font-weight:900;background:linear-gradient(135deg,#ffd700,#ff8c00,#ffd700);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;margin-bottom:6px}
.bp-modal-sub{font-size:11px;color:var(--gray2);font-weight:800;letter-spacing:2px}
.bp-progress-bar{width:100%;height:24px;background:rgba(0,0,0,.5);border:1px solid rgba(255,184,0,.3);border-radius:12px;overflow:hidden;position:relative;margin-bottom:20px}
.bp-progress-fill{height:100%;background:linear-gradient(90deg,#ffd700,#ff8c00,#ffd700);background-size:200% 100%;animation:bpBarShine 2s linear infinite;transition:width .6s}
@keyframes bpBarShine{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.bp-progress-text{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;color:#1a1a1a;font-size:11px;font-weight:900;z-index:2}
.bp-levels{display:flex;flex-direction:column;gap:8px}
.bp-level{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;align-items:center;gap:12px}
.bp-level.unlocked{border-color:var(--gold);background:linear-gradient(135deg,rgba(255,215,0,.1),rgba(255,140,0,.03))}
.bp-level.claimed{opacity:.5}
.bp-level.current{border-color:var(--gold);box-shadow:0 0 20px rgba(255,184,0,.3)}
.bp-level-num{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#1a1a22,#0f0f14);border:2px solid var(--border);display:flex;justify-content:center;align-items:center;font-size:14px;font-weight:900;color:var(--gray2);flex-shrink:0}
.bp-level.unlocked .bp-level-num{background:linear-gradient(135deg,#ffd700,#ff8c00);border-color:var(--gold);color:#1a1a1a}
.bp-level-info{flex:1;min-width:0}
.bp-level-title{font-size:12px;font-weight:900;color:#fff;margin-bottom:2px}
.bp-level-reward{font-size:10px;font-weight:800;color:var(--gold)}
.bp-level-btn{padding:8px 14px;border-radius:8px;border:none;font-size:10px;font-weight:900;cursor:pointer;background:var(--border);color:var(--gray2);flex-shrink:0}
.bp-level.unlocked .bp-level-btn{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#1a1a1a}
.bp-level.claimed .bp-level-btn{background:rgba(76,175,80,.2);color:var(--green-l)}
.bp-xp-bar{background:rgba(0,0,0,.4);border-radius:8px;padding:12px;margin-bottom:16px;text-align:center}
.bp-xp-bar .lbl{font-size:10px;color:var(--gray2);font-weight:800;letter-spacing:1px;margin-bottom:6px}
.bp-xp-bar .val{font-size:20px;font-weight:900;color:var(--gold)}

.main{padding:0 16px}
.wheel-wrap{position:relative;width:100%;aspect-ratio:1;max-width:340px;margin:10px auto;display:flex;justify-content:center;align-items:center}
.wheel{width:90%;height:90%;border-radius:50%;background:radial-gradient(circle at center,var(--panel-l) 0%,var(--panel) 60%,#0a0a0c 100%);position:relative;display:flex;justify-content:center;align-items:center;box-shadow:0 0 60px rgba(0,0,0,.9),0 0 80px rgba(255,184,0,.15),inset 0 0 40px rgba(0,0,0,.6);border:4px solid #1a1a22;transition:border-color .5s,box-shadow .5s}
.wheel.zone-green{border-color:var(--green-l);box-shadow:0 0 60px rgba(76,175,80,.5),inset 0 0 40px rgba(0,0,0,.6)}
.wheel.zone-yellow{border-color:var(--gold);box-shadow:0 0 60px rgba(255,184,0,.5),inset 0 0 40px rgba(0,0,0,.6)}
.wheel.zone-red{border-color:var(--red);box-shadow:0 0 60px rgba(229,9,20,.5),inset 0 0 40px rgba(0,0,0,.6)}
.wheel::after{content:'';position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(255,184,0,.2);pointer-events:none;animation:pulseRing 3s ease-in-out infinite}
@keyframes pulseRing{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(1.08);opacity:.7}}
.wheel-zone{position:absolute;inset:-4px;border-radius:50%;pointer-events:none;z-index:1;overflow:hidden}
.wheel-zone-fill{position:absolute;top:0;left:0;width:100%;height:100%;background:conic-gradient(from 180deg,var(--zone-color,var(--gold)) 0deg,var(--zone-color,var(--gold)) var(--pct-angle,0deg),#1a1a22 var(--pct-angle,0deg),#1a1a22 360deg);opacity:0;transition:opacity .4s}
.wheel-zone-fill.visible{opacity:.95}
.wheel::before{content:'';position:absolute;width:75%;height:75%;border-radius:50%;background:var(--bg);border:1px solid var(--border);z-index:2}
.wheel-ticks{position:absolute;width:100%;height:100%;border-radius:50%;pointer-events:none;z-index:3}
.tick{position:absolute;top:0;left:50%;width:2px;height:8px;background:rgba(255,184,0,.4);transform-origin:center 150px;transform:translateX(-50%) rotate(var(--a));border-radius:1px}
.tick.major{width:3px;height:14px;background:var(--gold);box-shadow:0 0 8px rgba(255,184,0,.8)}
.wheel-center{position:relative;z-index:5;text-align:center}
.pt{font-size:52px;font-weight:900;line-height:1;letter-spacing:-2px;text-shadow:0 0 20px rgba(255,184,0,.4);transition:color .4s}
.pl{font-size:9px;color:var(--gray2);letter-spacing:4px;margin-top:4px;font-weight:700}
.chance-label{font-size:10px;font-weight:900;letter-spacing:2px;margin-top:6px;padding:3px 10px;border-radius:6px;display:inline-block}
.chance-label.green{background:rgba(76,175,80,.2);color:var(--green-l);border:1px solid rgba(76,175,80,.5)}
.chance-label.yellow{background:rgba(255,184,0,.2);color:var(--gold);border:1px solid rgba(255,184,0,.5)}
.chance-label.red{background:rgba(229,9,20,.2);color:var(--red);border:1px solid rgba(229,9,20,.5)}
.arrow-wrap{position:absolute;inset:0;pointer-events:none;z-index:25;will-change:transform;transform:rotate(0deg)}
.arrow{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:32px;height:44px;filter:drop-shadow(0 4px 10px rgba(255,184,0,.8))}
.arrow-wrap.spinning .arrow{animation:arrowGlow .4s ease-in-out infinite alternate}
@keyframes arrowGlow{0%{filter:drop-shadow(0 4px 10px rgba(255,184,0,.6))}100%{filter:drop-shadow(0 6px 20px rgba(255,184,0,1))}}

.wheel-secret-sector{position:absolute;inset:-4px;border-radius:50%;pointer-events:none;z-index:2;opacity:0;transition:opacity .4s}
.wheel-secret-sector.visible{opacity:1}
.wheel-secret-sector-fill{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 180deg,transparent 0deg,transparent 332deg,rgba(255,140,0,.18) 342deg,rgba(255,215,0,.75) 353deg,#fff8d0 358.5deg,rgba(255,215,0,.75) 360deg);animation:secretPulse 2.2s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(255,215,0,.55))}
.wheel-secret-sector-fill::before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,rgba(255,255,255,.95) 10deg,transparent 22deg);animation:secretSweep 2.4s linear infinite;-webkit-mask:conic-gradient(from 180deg,transparent 0deg,transparent 334deg,#000 348deg,#000 360deg);mask:conic-gradient(from 180deg,transparent 0deg,transparent 334deg,#000 348deg,#000 360deg)}
@keyframes secretSweep{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes secretPulse{0%,100%{filter:drop-shadow(0 0 10px rgba(255,215,0,.4)) brightness(1)}50%{filter:drop-shadow(0 0 24px rgba(255,215,0,.95)) brightness(1.4)}}
.wheel-secret-icon{position:absolute;top:calc(50% + 70px);left:calc(50% - 70px);font-size:20px;font-weight:900;color:#ffe680;text-shadow:0 0 8px rgba(255,215,0,.9),0 0 22px rgba(255,140,0,.7);z-index:10;pointer-events:none;display:none;transform:translate(-50%,-50%);animation:secretIconPulse 1.6s ease-in-out infinite}
.wheel-secret-icon.visible{display:block}
@keyframes secretIconPulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.3)}}

.pcnt-row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:20px}
.pb{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 4px;color:var(--gray2);font-size:11px;font-weight:800;cursor:pointer}
.pb.sel{border-color:var(--gold);background:rgba(255,184,0,.1);color:var(--gold)}
.pb.sel.green{border-color:var(--green-l);background:rgba(76,175,80,.1);color:var(--green-l)}
.pb.sel.red{border-color:var(--red);background:rgba(229,9,20,.1);color:var(--red)}

.action-row{display:flex;gap:8px;margin-top:12px}
.lightning-btn{width:56px;height:56px;background:var(--panel);border:1px solid var(--border);border-radius:12px;cursor:pointer;display:flex;justify-content:center;align-items:center}
.lightning-btn.on{border-color:var(--gold);background:rgba(255,184,0,.1)}
.lightning-btn .ic{font-size:20px;filter:grayscale(1);opacity:.5}
.lightning-btn.on .ic{filter:grayscale(0);opacity:1}
.upgrade-btn{flex:1;background:linear-gradient(135deg,var(--gold),#ff8c00);color:#1a1a1a;border:none;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer;padding:16px;letter-spacing:2px;position:relative;overflow:hidden}
.upgrade-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);animation:shine 3s infinite}
@keyframes shine{0%{left:-100%}50%,100%{left:100%}}
.upgrade-btn:disabled{opacity:.5;background:var(--panel);color:var(--gray2);cursor:not-allowed}
.upgrade-btn:disabled::before{display:none}

.slots-preview{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.slot-prev{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;min-height:130px}
.slot-prev-lbl{font-size:10px;font-weight:800;color:var(--gray2);margin-bottom:10px}
.slot-prev-icons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:180px;margin:0 auto;justify-items:center}
.slot-cell{width:100%;aspect-ratio:1;display:flex;justify-content:center;align-items:center;position:relative}
.slot-cell img{width:100%;height:100%;object-fit:contain;background:var(--panel-l);border-radius:8px;padding:4px;border:1px solid var(--border)}
.slot-prev-icons .empty-slot{width:100%;aspect-ratio:1;background:var(--panel-l);border:1px dashed var(--border);border-radius:8px}
.slot-prev-icons .slot-remove{position:absolute;top:-6px;right:-6px;width:20px;height:20px;background:var(--red);border-radius:50%;display:flex;justify-content:center;align-items:center;color:#fff;font-size:12px;font-weight:900;cursor:pointer;border:2px solid var(--bg)}
.slot-sum{font-size:11px;font-weight:900;color:var(--gold);margin-top:6px}
.slot-clear{font-size:9px;font-weight:900;color:var(--red);margin-top:4px;cursor:pointer;background:none;border:none}

function playMultiplierSound(m){if(!soundEnabled)return;try{const ctx=getAudioContext();if(!ctx)return;const baseFreq=600+m*150;[baseFreq,baseFreq*1.25,baseFreq*1.5].forEach((freq,i)=>{const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='triangle';o.frequency.value=freq;const st=ctx.currentTime+i*0.08;g.gain.setValueAtTime(0.12,st);g.gain.exponentialRampToValueAtTime(0.001,st+0.4);o.start(st);o.stop(st+0.4)})}catch(e){}}

function confetti(){for(let i=0;i<40;i++){const c=document.createElement('div');c.style.cssText='position:fixed;width:8px;height:8px;background:'+['#ffb800','#fff','#4CAF50','#ff4444'][Math.floor(Math.random()*4)]+';left:'+(Math.random()*100)+'%;top:-20px;z-index:9998;pointer-events:none;transition:transform 2s linear,opacity 2s linear';document.body.appendChild(c);requestAnimationFrame(()=>{c.style.transform='translateY(110vh) rotate(720deg)';c.style.opacity='0'});setTimeout(()=>c.remove(),2000)}}
function updateBal(){const el=document.getElementById('goldTop');if(el)el.innerText=Math.floor(gold).toLocaleString('ru-RU')}
function formatPct(p){if(p>=1)return Math.round(p)+'%';if(p>=0.1)return p.toFixed(1)+'%';return p.toFixed(2)+'%'}
function openS(id){const el=document.getElementById(id);if(!el)return;el.classList.add('open');if(id==='profileScreen')rendProfile();if(id==='settingsScreen')rendSettings();if(id==='craftScreen')renderCraftScreen()}

l" onclick="event.stopPropagation();sellSkin(${realIdx});closeCard()">💸 ПРОДАТЬ</button></div></div>`}).join('')}}

function openCart(){if(cart.length===0){toast('🛒 Корзина пуста','lose');return}const m=document.createElement('div');m.className='modal-overlay';m.id='cartModal';m.onclick=(e)=>{if(e.target===m)m.remove()};const total=cart.reduce((s,c)=>s+c.price*(c.qty||1),0);m.innerHTML=`<div class="modal-content" style="max-width:450px"><button class="modal-close" onclick="document.getElementById('cartModal').remove()">✕</button><div class="modal-title">🛒 КОРЗИНА</div><div style="max-height:50vh;overflow-y:auto;margin-bottom:16px">${cart.map((c,i)=>{const s=allSkins.find(x=>x.name===c.name);return `<div class="cart-item-row"><img src="${s?.img||''}" style="width:44px;height:44px;object-fit:contain;background:var(--bg);border-radius:6px" onerror="this.style.display='none'"><div style="flex:1;min-width:0"><div style="font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.name}</div><div style="font-size:11px;color:var(--gold);font-weight:900">${c.price} G × ${c.qty||1}</div></div><div style="display:flex;align-items:center;gap:4px"><button class="qty-btn" onclick="changeQty(${i},-1)">−</button><span style="min-width:24px;text-align:center;font-weight:900;font-size:12px">${c.qty||1}</span><button class="qty-btn" onclick="changeQty(${i},1)">+</button><button class="qty-btn" style="background:var(--red)" onclick="removeFromCart(${i})">✕</button></div></div>`}).join('')}</div><div style="display:flex;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border);margin-bottom:16px"><div style="font-size:12px;color:var(--gray2);font-weight:800">ИТОГО:</div><div style="font-size:20px;font-weight:900;color:var(--gold)">${total} G</div></div><button class="vip-buy-btn" onclick="checkout()">✅ КУПИТЬ</button></div>`;document.body.appendChild(m)}

function sellSkin(idx){const it=inv[idx];if(!it)return;const sp=Math.round((it.price||50)*0.7);if(confirm(`Продать ${it.name} за ${sp} G?`)){gold+=sp;inv.splice(idx,1);selectedItems=selectedItems.filter(i=>i!==it);updateBal();markDirty();saveGame();rendInv();rendMain();toast('💸 +'+sp+' G','win')}}
function recomputePct(){if(selectedItems.length===0||!targetSkin){selPct=null;checkUpgradeBtn();updateChanceZone(null);return}const invSum=selectedItems.reduce((s,it)=>s+(it.price||0),0);let pct=(invSum/targetSkin.price)*100;if(pct>90)pct=90;if(pct<0.5)pct=0.5;selPct=pct;updateWheelPct(pct);updateChanceZone(pct);checkUpgradeBtn()}
function updateChanceZone(pct){const wheel=document.getElementById('wheel');const label=document.getElementById('chanceLabel');const fill=document.getElementById('wheelZoneFill');if(!wheel||!label||!fill)return;wheel.classList.remove('zone-green','zone-yellow','zone-red');label.className='chance-label';if(pct===null||pct===undefined){label.style.display='none';fill.style.setProperty('--zone-color','#ffb800');return}label.style.display='inline-block';if(pct>=50){wheel.classList.add('zone-green');label.classList.add('green');label.innerText='🛡 БЕЗОПАСНЫЙ';fill.style.setProperty('--zone-color','#4CAF50')}else if(pct>=20){wheel.classList.add('zone-yellow');label.classList.add('yellow');label.innerText='⚖ СРЕДНИЙ';fill.style.setProperty('--zone-color','#ffb800')}else{wheel.classList.add('zone-red');label.classList.add('red');label.innerText='🔥 МИНИМАЛЬНЫЙ';fill.style.setProperty('--zone-color','#e50914')}const ptEl=document.getElementById('pt');if(ptEl){ptEl.style.color=pct>=50?'var(--green-l)':(pct>=20?'var(--gold)':'var(--red)')}}
function updateWheelPct(pct){const ptEl=document.getElementById('pt');if(ptEl){ptEl.innerText=formatPct(pct)}const fill=document.getElementById('wheelZoneFill');if(!fill)return;const targetAngle=(pct/100)*360;fill.classList.add('visible');const startAngle=currentWheelAngle;const startTime=performance.now();const duration=900;function anim(now){const t=Math.min(1,(now-startTime)/duration);const eased=1-Math.pow(1-t,4);currentWheelAngle=startAngle+(targetAngle-startAngle)*eased;fill.style.setProperty('--pct-angle',currentWheelAngle+'deg');if(t<1)wheelAnimId=requestAnimationFrame(anim);else wheelAnimId=null}if(wheelAnimId)cancelAnimationFrame(wheelAnimId);wheelAnimId=requestAnimationFrame(anim)}
function clearWheelPct(){const ptEl=document.getElementById('pt');if(ptEl)ptEl.innerText='?%';const fill=document.getElementById('wheelZoneFill');if(fill)fill.classList.remove('visible');currentWheelAngle=0;if(wheelAnimId){cancelAnimationFrame(wheelAnimId);wheelAnimId=null}updateChanceZone(null)}
function setPct(p,el){if(isSpinning)return;if(selectedItems.length===0){toast('❌ Выбери скины','lose');return}const safePct=Math.min(90,Math.max(0.5,p));const invSum=selectedItems.reduce((s,it)=>s+(it.price||0),0);const idealPrice=invSum/(safePct/100);let closest=allSkins[0],minDiff=Math.abs(allSkins[0].price-idealPrice);allSkins.forEach(s=>{const d=Math.abs(s.price-idealPrice);if(d<minDiff){minDiff=d;closest=s}});targetSkin={name:closest.name,price:closest.price,color:closest.color,img:closest.img};let realPct=(invSum/targetSkin.price)*100;if(realPct>90)realPct=90;if(realPct<0.5)realPct=0.5;selPct=realPct;document.querySelectorAll('.pb').forEach(b=>b.classList.remove('sel','green','red'));if(el)el.classList.add('sel');updateWheelPct(realPct);updateChanceZone(realPct);rendMain();rendTargetList();checkUpgradeBtn();updateSecretSectorVisibility()}
function checkUpgradeBtn(){const btn=document.getElementById('upgradeBtn');if(!btn)return;btn.disabled=!(selectedItems.length>0&&targetSkin&&selPct&&!isSpinning)}
function rendMain(){const leftIcons=document.getElementById('leftIcons');if(leftIcons){let h='';for(let i=0;i<MAX_UPGRADE;i++){const s=selectedItems[i];if(s){h+=`<div class="slot-cell">${s.img?`<img src="${s.img}">`:'📦'}<div class="slot-remove" onclick="removeFromUpgradeItem(selectedItems[${i}])">✕</div></div>`}else if(i<6){h+='<div class="empty-slot"></div>'}}leftIcons.innerHTML=h}const selCount=document.getElementById('selCount');if(selCount)selCount.innerText=selectedItems.length+' ИЗ '+MAX_UPGRADE;const sum=selectedItems.reduce((s,it)=>s+(it.price||0),0);const sumEl=document.getElementById('selSum');if(sumEl)sumEl.innerText=sum.toLocaleString('ru-RU')+' G';const rightIcons=document.getElementById('rightIcons');if(rightIcons){if(targetSkin){rightIcons.innerHTML=`<div class="slot-cell" style="grid-column:1/-1;max-width:80px"><img src="${targetSkin.img}"></div>`;const tc=document.getElementById('targetCount');if(tc)tc.innerText=targetSkin.price+' G'}else{rightIcons.innerHTML='<div class="empty-slot"></div>';const tc=document.getElementById('targetCount');if(tc)tc.innerText='НЕ ВЫБРАНА'}}checkUpgradeBtn()}
function pickTargetCard(name,price,color){if(isSpinning)return;const skin=allSkins.find(s=>s.name===name);targetSkin={name,price,color,img:skin?skin.img:null};const invSum=selectedItems.reduce((s,it)=>s+(it.price||0),0);if(invSum>0){selPct=Math.min(90,Math.max(0.5,(invSum/targetSkin.price)*100));updateWheelPct(selPct);updateChanceZone(selPct)}rendMain();rendTargetList();checkUpgradeBtn();updateSecretSectorVisibility()}
function toggleLightning(){if(isSpinning)return;lightningOn=!lightningOn;document.getElementById('lightningBtn').classList.toggle('on',lightningOn)}

function wheelEasing(t){
  // плавный разгон + красивое долгое замедление (easeInOutQuint) + лёгкая «посадка»
  let e=t<0.5?16*Math.pow(t,5):1-16*Math.pow(1-t,5);
  if(t>0.94){const lt=(t-0.94)/0.06;e+=Math.sin(lt*Math.PI*3)*(1-lt)*0.012}
  return e;
}
function isVipActive(){return vipData.isVip&&(vipData.expires===0||vipData.expires>Date.now())}

function isSecretSectorAvailable(){return targetSkin&&SECRET_GOLD_SKINS.includes(targetSkin.name)}

function isSecretSectorHit(angle){const a=((angle%360)+360)%360;return a>=162&&a<=180}

function showMultiplierModal(currentSkin,baseSkin,multiplier){
  const old=document.getElementById('multModal');if(old)old.remove();
  const m=document.createElement('div');m.className='mult-overlay';m.id='multModal';
  const nextPrice=Math.round(baseSkin.price*(multiplier+1));
  const isLimitReached=nextPrice>SECRET_MAX_PRICE;
  const canContinue=multiplier<6&&!isLimitReached;
  let dots='';for(let i=2;i<=6;i++){let cls='';if(i<multiplier)cls='done';else if(i===multiplier)cls='active';dots+=`<div class="mult-progress-dot ${cls}"></div>`}
  m.innerHTML=`<div class="mult-card"><div class="mult-title">⚡ СЕКРЕТНЫЙ МУЛЬТИПЛИКАТОР ⚡</div><div class="mult-subtitle">×${multiplier}</div><div class="mult-progress">${dots}</div><div class="mult-skin-box shaking" id="multSkinBox"><img src="${currentSkin.img||''}" onerror="this.style.display='none'"></div><div class="mult-skin-name">${currentSkin.name}</div><div class="mult-skin-price">${currentSkin.price.toLocaleString('ru-RU')} G<small>было: ${baseSkin.price.toLocaleString('ru-RU')} G</small></div><div class="mult-chance">${canContinue?'ШАНС ПРОДОЛЖИТЬ: 22%':(multiplier>=6?'МАКСИМУМ':'ЛИМИТ ЦЕНЫ')}</div><div class="mult-buttons"><button class="mult-btn take" onclick='takeMultiplier(${JSON.stringify(currentSkin).replace(/'/g,"&#39;")})'>✅ ЗАБРАТЬ ×${multiplier}</button>${canContinue?`<button class="mult-btn continue" onclick='continueMultiplier(${JSON.stringify(baseSkin).replace(/'/g,"&#39;")},${multiplier+1})'>🎰 ПРОДОЛЖИТЬ (×${multiplier+1})</button>`:''}</div>${isLimitReached?'<div class="mult-limit">⚠️ ЛИМИТ ДОСТИГНУТ</div>':''}</div>`;
  document.body.appendChild(m);
  setTimeout(()=>{const box=document.getElementById('multSkinBox');if(box){box.classList.remove('shaking');box.classList.add('bumping');playMultiplierSound(multiplier);haptic('heavy')}},3000);
}

function takeMultiplier(skin){
  const old=document.getElementById('multModal');if(old)old.remove();
  const finalPrice=Math.min(skin.price,SECRET_MAX_PRICE);
  inv.push({name:skin.name,price:finalPrice,color:skin.color,img:skin.img,multiplier:skin.multiplier});
  toast(`⚡ ×${skin.multiplier} ЗАБРАН! +${finalPrice.toLocaleString('ru-RU')} G`,'win');
  confetti();confetti();sWin();haptic('heavy');
  markDirty();saveGame();rendInv();rendMain();
  upgradeHistory.unshift({win:true,targetName:skin.name,targetPrice:finalPrice,targetImg:skin.img,betName:'Секрет ×'+skin.multiplier,betPrice:0,betImg:skin.img,betCount:1,pct:0,isSecret:true,ts:Date.now()});
  if(upgradeHistory.length>100)upgradeHistory.pop();
}

function startSecretMultiplier(baseSkin,multiplier){
  const currentSkin={...baseSkin,price:Math.round(baseSkin.price*multiplier),multiplier:multiplier,originalPrice:baseSkin.price};
  showMultiplierModal(currentSkin,baseSkin,multiplier);
}

async function continueMultiplier(baseSkin,nextMultiplier){
  const old=document.getElementById('multModal');if(old)old.remove();
  const spinPct=22;const winDeg=(spinPct/100)*360;const win=(Math.random()*100)<spinPct;
  let targetAbsolute;if(win){targetAbsolute=(180+winDeg/2+(Math.random()-0.5)*winDeg*0.3+360)%360}else{const gl=360-winDeg;targetAbsolute=(180+winDeg+gl/2+(Math.random()-0.5)*gl*0.3+360)%360}
  const fullTurns=3;const duration=3000;const start=arrowCurrentAngle;const startMod=((start%360)+360)%360;let delta=targetAbsolute-startMod;if(delta<=0)delta+=360;const totalDelta=fullTurns*360+delta;const end=start-totalDelta;
  const wrap=document.getElementById('arrowWrap');wrap.classList.add('spinning');
  if(soundEnabled){let tc=0;const ti=setInterval(()=>{sTick();tc++;if(tc>=15)clearInterval(ti)},200)}
  const startTime=performance.now();
  function anim(now){
    const t=Math.min(1,(now-startTime)/duration);const eased=wheelEasing(t);
    const current=start+(end-start)*eased;wrap.style.transform=`rotate(${current}deg)`;
    if(t<1)requestAnimationFrame(anim);
    else{
      wrap.classList.remove('spinning');arrowCurrentAngle=end;if(arrowCurrentAngle<-36000)arrowCurrentAngle=arrowCurrentAngle%360;
      setTimeout(()=>{
        if(win){haptic('heavy');playSecretSound();confetti();startSecretMultiplier(baseSkin,nextMultiplier)}
        else{
          haptic('light');sLose();
          const m=document.createElement('div');m.className='mult-overlay';m.id='multLoseModal';
          const x2={...baseSkin,price:Math.round(baseSkin.price*2),multiplier:2,originalPrice:baseSkin.price};

async function spinUpgrade(){
  if(selectedItems.length===0||!targetSkin||!selPct||isSpinning)return;
  isSpinning=true;lockUI(true);rendInv();rendTargetList();
  const spinPct=Math.min(90,selPct);
  const totalPct=Math.min(90,spinPct+(refBoost.spinsLeft>0?5:0)+(isVipActive()?5:0));
  const isFirstSpin=stats.spins===0;
  let win=false,serverDecided=false,animation=null;
  if(isFirstSpin&&selPct>=5){win=true;animation=2}
  else{try{const ctrl=new AbortController();const tId=setTimeout(()=>ctrl.abort(),3500);const sc=await fetch(BOT_URL+'/api/spinControl/'+getUserId(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pct:totalPct,betSum:selectedItems.reduce((s,it)=>s+(it.price||0),0),target:targetSkin.name,targetPrice:targetSkin.price}),signal:ctrl.signal});clearTimeout(tId);const scd=await sc.json();if(scd&&(scd.result==='win'||scd.result==='lose')){win=scd.result==='win';serverDecided=true;if(scd.animation&&scd.animation>=1&&scd.animation<=4)animation=scd.animation}}catch(e){}}
  if(!isFirstSpin&&!serverDecided){win=(Math.random()*100)<totalPct}
  if(!animation){animation=Math.floor(Math.random()*3)+1}
  const winDeg=(totalPct/100)*360;
  let targetAbsolute;
  if(win){targetAbsolute=(180+winDeg/2+(Math.random()-0.5)*winDeg*0.3+360)%360}
  else{targetAbsolute=(180+winDeg+(360-winDeg)/2+(Math.random()-0.5)*(360-winDeg)*0.3+360)%360}
  let fullTurns,duration;
  if(isVipActive()||lightningOn){fullTurns=3;duration=2200}
  else if(animation===1){fullTurns=2;duration=1500}
  else if(animation===2){fullTurns=6;duration=8500}
  else if(animation===3){fullTurns=9;duration=7000}
  else{fullTurns=4;duration=4500}
  const start=arrowCurrentAngle;
  const startMod=((start%360)+360)%360;
  let delta=targetAbsolute-startMod;
  if(delta<=0)delta+=360;
  const totalDelta=fullTurns*360+delta;
  const end=start-totalDelta;
  const wrap=document.getElementById('arrowWrap');
  wrap.classList.add('spinning');
  if(soundEnabled){let tc=0;const ti=setInterval(()=>{sTick();tc++;if(tc>=Math.floor(duration/200))clearInterval(ti)},200)}
  const startTime=performance.now();
  function anim(now){
    const t=Math.min(1,(now-startTime)/duration);
    const eased=wheelEasing(t);
    const current=start+(end-start)*eased;
    wrap.style.transform=`rotate(${current}deg)`;
    if(t<1)requestAnimationFrame(anim);
    else{
      wrap.classList.remove('spinning');arrowCurrentAngle=end;
      if(arrowCurrentAngle<-36000)arrowCurrentAngle=arrowCurrentAngle%360;
      setTimeout(()=>{
        const lostItems=[...selectedItems];
        for(let i=lostItems.length-1;i>=0;i--){const idx=inv.indexOf(lostItems[i]);if(idx>=0)inv.splice(idx,1)}
        const totalValue=lostItems.reduce((s,it)=>s+(it.price||0),0);
        const avgImg=lostItems[0]?.img||null;
        const avgName=lostItems.length===1?lostItems[0].name:(lostItems.length+' скинов');
        selectedItems=[];
        bpAddSpinXp(win,targetSkin?targetSkin.price:0);
        if(win){
          stats.wins++;
          if(!bestDrop||targetSkin.price>bestDrop.price)bestDrop={name:targetSkin.name,img:targetSkin.img,price:targetSkin.price,ts:Date.now()};
          upgradeHistory.unshift({win:true,targetName:targetSkin.name,targetPrice:targetSkin.price,targetImg:targetSkin.img,betName:avgName,betPrice:totalValue,betImg:avgImg,betCount:lostItems.length,pct:spinPct,ts:Date.now()});
          const isSecretTarget=SECRET_GOLD_SKINS.includes(targetSkin.name);
          const isSecretHit=isSecretTarget&&isSecretSectorHit(targetAbsolute);
          if(isSecretHit){playSecretSound();confetti();haptic('heavy');setTimeout(()=>{startSecretMultiplier(targetSkin,2)},500)}
          else{inv.push({...targetSkin});haptic('heavy');playSmartWinSound(targetSkin);confetti();showResultModal(targetSkin,true)}
        }else{
          stats.loses++;haptic('light');sLose();
          const lost=lostItems[0]||{name:'—',img:'',price:0};
          showResultModal(lost,false);
          upgradeHistory.unshift({win:false,targetName:targetSkin.name,targetPrice:targetSkin.price,targetImg:targetSkin.img,betName:avgName,betPrice:totalValue,betImg:avgImg,betCount:lostItems.length,pct:spinPct,ts:Date.now()});
        }
        if(upgradeHistory.length>100)upgradeHistory.pop();
        if(refBoost.spinsLeft>0)refBoost.spinsLeft--;
        stats.spins++;checkAchievements();
        isSpinning=false;clearWheelPct();
        document.querySelectorAll('.pb').forEach(b=>b.classList.remove('sel','green','red'));
        lockUI(false);updateRankUI();updateRankProgress();markDirty();saveGame();
        loadLiveFeed();
        setTimeout(()=>{const f=document.querySelector('.live-item');if(f){f.classList.add('win-flash');setTimeout(()=>f.classList.remove('win-flash'),800)}},500);
      },800);
    }
  }
  requestAnimationFrame(anim);
}

function getRank(){let r=RANKS[0];for(const rank of RANKS){if(stats.spins>=rank.need)r=rank;else break}return r}
function getRankName(){const r=RANKS.find(r=>r.title===currentTitle);return r?r.name:'НОВИЧОК'}
function updateRankUI(){const r=getRank();const rn=document.getElementById('rankNameTop');const rl=document.getElementById('rankLevelTop');if(rn)rn.innerText=r.name;if(rl)rl.innerText='LVL '+(RANKS.indexOf(r)+1)}
function updateRankProgress(){const fill=document.getElementById('rankProgressFill');if(!fill)return;const r=getRank();const idx=RANKS.indexOf(r);const cr=RANKS[idx];const nr=RANKS[idx+1];if(!nr){fill.style.width='100%';return}const need=nr.need-cr.need;const have=stats.spins-cr.need;const pct=Math.min(100,(have/need)*100);fill.style.width=pct+'%'}
function updateTopAvatar(){const el=document.getElementById('topAv');if(!el)return;const u=getUser();if(u?.photo_url)el.innerHTML=`<img src="${u.photo_url}">`;else el.innerText='👤'}
function checkAchievements(){let n=[];ACHIEVEMENTS.forEach(a=>{if(!unlockedAch.includes(a.id)&&a.cond(stats)){unlockedAch.push(a.id);n.push(a)}});if(n.length>0){localStorage.setItem('sfap_ach',JSON.stringify(unlockedAch));n.forEach(a=>{gold+=a.reward||0;toast('🏅 '+a.ico+' '+a.name+' +'+a.reward+'G','win')});updateBal();markDirty();saveGame()}}
function openAchievements(){const m=document.createElement('div');m.className='modal-overlay';m.id='achModal';m.onclick=(e)=>{if(e.target===m)m.remove()};m.innerHTML=`<div class="modal-content" style="max-width:450px"><button class="modal-close" onclick="document.getElementById('achModal').remove()">✕</button><div class="modal-title">🏅 ДОСТИЖЕНИЯ (${unlockedAch.length}/${ACHIEVEMENTS.length})</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${ACHIEVEMENTS.map(a=>{const un=unlockedAch.includes(a.id);return `<div style="padding:12px;background:${un?'rgba(255,184,0,.1)':'var(--panel-l)'};border:1px solid ${un?'var(--gold)':'var(--border)'};border-radius:10px;text-align:center"><div style="font-size:26px;filter:${un?'grayscale(0)':'grayscale(1)'};opacity:${un?'1':'.4'}">${a.ico}</div><div style="font-size:9px;font-weight:900;color:${un?'var(--gold)':'var(--gray2)'};margin-top:4px">${a.name}</div></div>`}).join('')}</div></div>`;document.body.appendChild(m)}

function rendSettings(){const b=document.getElementById('settingsBody');b.innerHTML=`<div class="settings-item"><label>🔊 Звуки</label><div class="toggle ${soundEnabled?'on':''}" onclick="toggleSound()"></div></div><div class="settings-item"><label>📳 Вибрация</label><div class="toggle ${hapticEnabled?'on':''}" onclick="toggleHaptic()"></div></div><div class="settings-item"><label>🎨 Тема</label><button class="settings-btn" style="background:var(--blue)" onclick="toggleTheme();rendSettings()">${lightTheme?'СВЕТЛАЯ':'ТЁМНАЯ'}</button></div><div class="settings-item"><label>🗑 Сброс</label><button class="settings-btn" onclick="if(confirm('Сбросить?')){localStorage.clear();location.reload()}">СБРОС</button></div>`}

function openCraft(){craftSelected=[];openS('craftScreen')}
function renderCraftScreen(){renderCraftPreview();renderCraftSlots();renderCraftRarityTabs();renderCraftSkinList();updateCraftButton()}
function renderCraftPreview(){const p=document.getElementById('craftPreview');if(!p)return;p.className='craft-preview';if(craftSelected.length>0){const last=craftSelected[craftSelected.length-1];p.innerHTML=`<img src="${last.img}" onerror="this.style.display='none'">`}else{p.innerHTML='<div class="placeholder">🔮</div>'}const cnt=document.getElementById('craftCount');if(cnt)cnt.innerText=craftSelected.length+' / '+CRAFT_NEED}
function renderCraftSlots(){const g=document.getElementById('craftSlots');if(!g)return;let h='';for(let i=0;i<CRAFT_NEED;i++){const it=craftSelected[i];if(it){h+=`<div class="craft-slot filled"><img src="${it.img}" onerror="this.style.display='none'"><div class="rm" onclick="removeCraftItem(${i})">✕</div></div>`}else{h+='<div class="craft-slot"></div>'}}g.innerHTML=h}
function renderCraftRarityTabs(){const tabs=document.getElementById('craftRarityTabs');if(!tabs)return;const rs=['r-common','r-uncommon','r-rare','r-epic','r-legend'];tabs.innerHTML=rs.map(r=>{const c=inv.filter(it=>getRarity(it.color||'#888')===r).length;return `<div class="craft-rarity-tab ${craftRarity===r?'active':''}" onclick="switchCraftRarity('${r}')">${RARITY_LABEL[r]} (${c})</div>`}).join('')}
function switchCraftRarity(r){craftRarity=r;craftSelected=[];renderCraftScreen()}
function renderCraftSkinList(){const list=document.getElementById('craftSkinList');if(!list)return;const av=inv.filter(it=>getRarity(it.color||'#888')===craftRarity);if(av.length===0){list.innerHTML='<div style="text-align:center;padding:20px;color:var(--gray2);font-size:11px;font-weight:800;grid-column:1/-1">Нет скинов этой редкости</div>';return}list.innerHTML=av.map(it=>{const idx=inv.indexOf(it);const sc=craftSelected.filter(x=>x===it).length;return `<div class="craft-skin-cell ${sc>0?'disabled':''}" onclick="addToCraft(${idx})"><img src="${it.img}" onerror="this.style.display='none'"><div class="nm">${it.name}</div>${sc>0?`<div style="font-size:9px;color:var(--gold);font-weight:900">× ${sc}</div>`:''}</div>`}).join('')}
function addToCraft(idx){if(craftInProgress)return;const it=inv[idx];if(!it)return;if(getRarity(it.color||'#888')!==craftRarity){toast('❌ Только одной редкости','lose');return}if(craftSelected.indexOf(it)>=0){toast('⚠️ Уже выбран','lose');return}if(craftSelected.length>=CRAFT_NEED){toast('❌ Уже '+CRAFT_NEED,'lose');return}craftSelected.push(it);renderCraftSlots();renderCraftPreview();renderCraftSkinList();updateCraftButton();const p=document.getElementById('craftPreview');p.classList.add('shuffling');setTimeout(()=>p.classList.remove('shuffling'),300)}
function removeCraftItem(i){if(craftInProgress)return;if(i<0||i>=craftSelected.length)return;craftSelected.splice(i,1);renderCraftSlots();renderCraftPreview();renderCraftSkinList();updateCraftButton()}
function updateCraftButton(){const btn=document.getElementById('craftBtn');if(!btn)return;btn.disabled=craftSelected.length!==CRAFT_NEED||craftInProgress}
function doCraft(){if(craftInProgress)return;if(craftSelected.length!==CRAFT_NEED){toast('❌ Нужно '+CRAFT_NEED+' скинов','lose');return}if(!craftSelected.every(it=>getRarity(it.color||'#888')===craftRarity)){toast('❌ Все скины одной редкости','lose');return}craftInProgress=true;const co=RARITY_ORDER[craftRarity];const isWin=Math.random()<0.30;const preview=document.getElementById('craftPreview');const btn=document.getElementById('craftBtn');btn.disabled=true;let sc=0;const si=setInterval(()=>{const rs=allSkins[Math.floor(Math.random()*allSkins.length)];preview.innerHTML=`<img src="${rs.img}" onerror="this.style.display='none'">`;preview.classList.add('shuffling');setTimeout(()=>preview.classList.remove('shuffling'),300);sc++;if(sc>=12){clearInterval(si);scr()}},200);function scr(){const to=isWin?Math.min(4,co+1):Math.max(0,co-1);const trk=Object.keys(RARITY_ORDER).find(k=>RARITY_ORDER[k]===to);let pool=allSkins.filter(s=>getRarity(s.color)===trk);if(pool.length===0||to===co){const ap=craftSelected.reduce((s,it)=>s+(it.price||0),0)/craftSelected.length;const as=allSkins.filter(s=>getRarity(s.color)===craftRarity);if(isWin){pool=as.filter(s=>s.price>ap);if(pool.length===0)pool=as}else{pool=as.filter(s=>s.price<ap);if(pool.length===0)pool=as}}const result=pool[Math.floor(Math.random()*pool.length)];for(let i=0;i<craftSelected.length;i++){const idx=inv.indexOf(craftSelected[i]);if(idx>=0)inv.splice(idx,1)}inv.push({name:result.name,price:result.price,color:result.color,img:result.img});stats.crafts=(stats.crafts||0)+1;bpAddCraftXp();checkAchievements();markDirty();saveGame();preview.innerHTML=`<img src="${result.img}" onerror="this.style.display='none'">`;preview.classList.add('revealed',isWin?'win':'lose');setTimeout(()=>{craftSelected=[];craftInProgress=false;renderCraftSlots();renderCraftRarityTabs();renderCraftSkinList();updateCraftButton();sCraft();if(isWin){haptic('heavy');playSmartWinSound(result);confetti();showResultModal(result,true)}else{haptic('light');showResultModal(result,false)}},1200)}}

function spawnBgParticles(){const c=document.getElementById('bgParticles');if(!c)return;for(let i=0;i<25;i++){const p=document.createElement('div');p.className='bg-particle';const s=1+Math.random()*2;p.style.width=s+'px';p.style.height=s+'px';p.style.left=Math.random()*100+'%';p.style.animationDuration=(15+Math.random()*25)+'s';p.style.animationDelay=(Math.random()*20)+'s';const h=Math.random();if(h<0.6)p.style.background='rgba(255,215,0,.5)';else if(h<0.85)p.style.background='rgba(74,158,255,.5)';else p.style.background='rgba(155,138,255,.5)';c.appendChild(p)}}

function bpAddXp(a){bpData.xp=(bpData.xp||0)+a;localStorage.setItem('sfap_bp',JSON.stringify(bpData));markDirty();saveGame()}

function openBattlePass(){const m=document.createElement('div');m.className='bp-modal-overlay';m.id='bpModal';m.onclick=(e)=>{if(e.target===m)m.remove()};const cl=bpGetCurrentLevel();const nl=BP_LEVELS.find(b=>bpData.xp<b.xp);const pp=nl?Math.min(100,(bpData.xp/nl.xp)*100):100;let lh='';for(const bp of BP_LEVELS){const un=bpData.xp>=bp.xp;const cl2=bpData.claimed&&bpData.claimed.includes(bp.lvl);const cur=!cl2&&un&&bp.lvl===cl;lh+=`<div class="bp-level ${un?'unlocked':''} ${cl2?'claimed':''} ${cur?'current':''}"><div class="bp-level-num">${cl2?'✓':bp.lvl}</div><div class="bp-level-info"><div class="bp-level-title">Уровень ${bp.lvl}</div><div class="bp-level-reward">${bp.type==='gold'?'💰':'🎁'} ${bp.title}</div></div><button class="bp-level-btn" ${!un||cl2?'disabled':''} onclick="claimBpLevel(${bp.lvl})">${cl2?'ПОЛУЧЕНО':(un?'ЗАБРАТЬ':bp.xp+' XP')}</button></div>`}m.innerHTML=`<div class="bp-modal-panel"><button class="modal-close" onclick="document.getElementById('bpModal').remove()">✕</button><div class="bp-modal-header"><div class="bp-modal-title">⚔️ BATTLE PASS</div><div class="bp-modal-sub">СЕЗОН 1 · 10 УРОВНЕЙ</div></div><div class="bp-xp-bar"><div class="lbl">ТВОЙ ОПЫТ</div><div class="val">${bpData.xp} XP</div></div><div class="bp-progress-bar"><div class="bp-progress-fill" style="width:${pp}%"></div><div class="bp-progress-text">${nl?`${bpData.xp} / ${nl.xp} XP`:'МАКСИМУМ'}</div></div><div class="bp-levels">${lh}</div><div style="margin-top:20px;padding:12px;background:rgba(74,158,255,.1);border:1px solid rgba(74,158,255,.3);border-radius:10px;text-align:center"><div style="font-size:10px;color:var(--gray2);font-weight:800;margin-bottom:4px">КАК ПОЛУЧАТЬ XP</div><div style="font-size:11px;color:#fff;font-weight:700;line-height:1.6">🎰 +10 XP за спин<br>🏆 +50 XP за победу<br>🔮 +100 XP за крафт<br>💰 +5 XP за каждые 10 G выигрыша</div></div></div>`;document.body.appendChild(m)}
function claimBpLevel(lvl){const bp=BP_LEVELS.find(b=>b.lvl===lvl);if(!bp)return;if(bpData.xp<bp.xp){toast('❌ Недостаточно XP','lose');return}if(bpData.claimed&&bpData.claimed.includes(lvl)){toast('⚠️ Уже получено','lose');return}if(bp.type==='gold'){gold+=bp.reward;updateBal();toast('💰 +'+bp.reward+' G','win')}else{const pool=allSkins.filter(s=>getRarity(s.color)===bp.rarity);if(pool.length>0){const skin=pool[Math.floor(Math.random()*pool.length)];inv.push({name:skin.name,price:skin.price,color:skin.color,img:skin.img});toast('🎁 '+skin.name,'win');rendInv()}}if(!bpData.claimed)bpData.claimed=[];bpData.claimed.push(lvl);localStorage.setItem('sfap_bp',JSON.stringify(bpData));markDirty();saveGame();confetti();playRarityWinSound('r-legend');document.getElementById('bpModal')?.remove();openBattlePass()}

em"><span class="ico">👑</span> <span>VIP-значок и рамка</span></div><div class="vip-feature-item"><span class="ico">📈</span> <span>x1.5 к рефералам</span></div><div class="vip-feature-item"><span class="ico">💸</span> <span><b>-5%</b> при выводе</span></div></div><div class="vip-purchase-card ${can?'recommended':''}" onclick="buyVipGold()"><div class="label">💰 ЗА ГОЛДУ</div><div class="price">780 G</div><div class="features">У тебя: ${Math.floor(gold).toLocaleString('ru-RU')} G</div><button class="btn" ${can?'':'disabled'}>${can?'КУПИТЬ ЗА G':'НЕДОСТАТОЧНО G'}</button></div><div class="vip-purchase-card" onclick="buyVipMoney()"><div class="label">💵 ЗА ДЕНЬГИ</div><div class="price">690 ₽</div><div class="features">Через Telegram Stars</div><button class="btn" style="background:linear-gradient(135deg,#4a9eff,#2e6db8);color:#fff">КУПИТЬ ЗА ₽</button></div><button class="vip-close-btn" onclick="document.getElementById('vipModal').remove()">ЗАКРЫТЬ</button></div></div>`}document.body.appendChild(m)}
async function buyVipGold(){if(isVipActive()){toast('👑 VIP уже активен','lose');return}if(gold<780){toast('❌ Мало G','lose');return}gold-=780;vipData.isVip=true;vipData.expires=Date.now()+30*24*60*60*1000;updateBal();markDirty();saveGame();try{fetch(BOT_URL+'/api/vip/buy-gold',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:getUserId(),duration:30*24*60*60*1000})}).catch(()=>{})}catch(e){}document.getElementById('vipModal')?.remove();showVipSuccess()}
async function buyVipMoney(){if(isVipActive()){toast('👑 VIP уже активен','lose');return}try{const r=await fetch(BOT_URL+'/api/vip/buy-money',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:getUserId(),price:690})});const d=await r.json();if(d.ok){vipData.isVip=true;vipData.expires=Date.now()+30*24*60*60*1000;markDirty();saveGame();document.getElementById('vipModal')?.remove();showVipSuccess()}else toast('❌ '+(d.error||'Ошибка оплаты'),'lose')}catch(e){toast('❌ Оплата временно недоступна','lose')}}
function showVipSuccess(){const flash=document.createElement('div');flash.className='vip-flash';document.body.appendChild(flash);setTimeout(()=>flash.remove(),800);for(let i=0;i<25;i++){const crown=document.createElement('div');crown.className='vip-crown-particle';crown.innerText='👑';crown.style.left=Math.random()*100+'%';crown.style.animationDelay=(Math.random()*0.5)+'s';document.body.appendChild(crown);setTimeout(()=>crown.remove(),2500)}haptic('heavy');confetti();sWin();setTimeout(()=>{const m=document.createElement('div');m.className='modal-overlay';m.id='vipSuccessModal';m.onclick=(e)=>{if(e.target===m)m.remove()};m.innerHTML=`<div class="vip-panel" style="max-width:340px;text-align:center"><div class="vip-panel-content"><div class="vip-crown-big">👑</div><div class="vip-title">VIP АКТИВИРОВАН</div><div class="vip-subtitle">ДОБРО ПОЖАЛОВАТЬ</div><div class="vip-feature-list" style="text-align:left"><div class="vip-feature-item"><span class="ico">🎰</span> <span><b>+5%</b> к шансу</span></div><div class="vip-feature-item"><span class="ico">⚡</span> <span>Быстрая анимация</span></div><div class="vip-feature-item"><span class="ico">🎁</span> <span><b>+20 G</b> ежедневно</span></div></div><button class="vip-buy-btn" onclick="document.getElementById('vipSuccessModal').remove()">🎉 ОТЛИЧНО!</button></div></div>`;document.body.appendChild(m)},500)}
