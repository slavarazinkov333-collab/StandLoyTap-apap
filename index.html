<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>StandFliutApap</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a0c;--panel:#121216;--panel-l:#1a1a22;--border:#272730;--gold:#ffb800;--red:#e50914;--green:#2e7d32;--green-l:#4CAF50;--gray:#666;--gray2:#999;--white:#fff;--blue:#4a9eff;--purple:#9b8aff}
body{background:var(--bg);color:var(--white);min-height:100vh;overflow-x:hidden;padding-bottom:20px}
body.modal-open{overflow:hidden}

/* TOP BAR */
.top{position:sticky;top:0;z-index:100;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,12,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.top-left{display:flex;align-items:center;gap:12px}
.logo-svg{width:34px;height:34px}
.rank-badge{display:flex;flex-direction:column;font-size:9px;font-weight:800;color:var(--gray2)}
.rank-badge .rn{color:var(--gold);font-size:11px}
.top-right{display:flex;align-items:center;gap:8px}
.cart-btn{width:38px;height:38px;border-radius:10px;background:var(--panel);display:flex;justify-content:center;align-items:center;cursor:pointer;border:1px solid var(--border);position:relative}
.cart-btn svg{width:18px;height:18px;fill:var(--white)}
.cart-badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:9px;font-weight:900;border-radius:10px;padding:2px 5px;border:2px solid var(--bg);display:none}
.bal-pill{display:flex;align-items:center;gap:8px;background:var(--panel);padding:6px 12px;border-radius:10px;border:1px solid var(--border);cursor:pointer}
.bal-plus{width:24px;height:24px;background:linear-gradient(135deg,#ffd700,#ff8c00);border-radius:6px;display:flex;justify-content:center;align-items:center;font-size:16px;color:#1a1a1a;font-weight:900}
.bal-num{font-size:14px;font-weight:900}
.bal-g{font-size:11px;font-weight:900;color:var(--gold)}
.av-top{width:38px;height:38px;border-radius:10px;background:var(--panel);display:flex;justify-content:center;align-items:center;font-size:16px;cursor:pointer;border:1px solid var(--border);overflow:hidden}
.av-top img{width:100%;height:100%;object-fit:cover}

/* TOP ACTIONS */
.top-actions{display:flex;gap:8px;padding:0 16px;margin-top:12px}
.action-chip{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:800;color:var(--white);cursor:pointer}
.vip-chip{border-color:rgba(255,184,0,0.4);background:linear-gradient(135deg,rgba(255,184,0,0.1),transparent);animation:vipPulse 10s infinite}
@keyframes vipPulse{0%,85%,100%{box-shadow:0 0 0 rgba(255,184,0,0)}90%{box-shadow:0 0 25px rgba(255,184,0,0.8);border-color:var(--gold)}}
.bonus-chip{border-color:rgba(76,175,80,0.4);background:linear-gradient(135deg,rgba(76,175,80,0.1),transparent);animation:bonusPulse 3s infinite}
@keyframes bonusPulse{0%,100%{box-shadow:0 0 0 rgba(76,175,80,0)}50%{box-shadow:0 0 15px rgba(76,175,80,0.5);border-color:var(--green-l)}}

/* LIVE SCROLL - ИСПРАВЛЕНО */
.live-wrap{margin:16px 0;position:relative;overflow:hidden}
.live-title{font-size:11px;font-weight:900;color:var(--gray2);text-transform:uppercase;letter-spacing:1px;padding:0 16px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.live-title::before{content:'';width:8px;height:8px;background:var(--red);border-radius:50%;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.live-track-wrap{overflow:hidden;width:100%}
.live-track{display:flex;gap:12px;padding:0 16px 10px;width:max-content;animation:scrollLive 20s linear infinite}
.live-track:hover{animation-play-state:paused} /* Останавливается при наведении (для ПК) */
@keyframes scrollLive{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

.live-card{flex-shrink:0;width:220px;height:70px;background:linear-gradient(135deg,#1a1a1c,#0a0a0c);border:1.5px solid var(--border);border-radius:12px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;position:relative;overflow:hidden;cursor:pointer}
.live-card.top-drop{border-color:var(--gold);box-shadow:0 0 15px rgba(255,184,0,0.3)}
.live-card.purple-drop{border-color:var(--purple);box-shadow:0 0 10px rgba(155,138,255,0.3)}
.live-card.red-drop{border-color:var(--red);box-shadow:0 0 10px rgba(229,9,20,0.3)}
.live-info{display:flex;flex-direction:column;gap:4px;z-index:2}
.live-name{font-size:11px;font-weight:900;color:var(--white);text-shadow:0 2px 4px rgba(0,0,0,0.8);max-width:120px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.live-pct{font-size:9px;font-weight:900;color:#1a1a1a;background:var(--gold);padding:1px 6px;border-radius:4px;width:fit-content}
.live-skin{width:90px;height:55px;object-fit:contain;position:absolute;right:-5px;bottom:-5px;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.8));z-index:1;pointer-events:none}

/* WHEEL */
.main{padding:0 16px;margin-top:10px}
.wheel-wrap{position:relative;width:100%;aspect-ratio:1;max-width:340px;margin:10px auto;display:flex;justify-content:center;align-items:center}
.wheel{width:90%;height:90%;border-radius:50%;background:radial-gradient(circle at center,var(--panel-l) 0%,var(--panel) 60%,#0a0a0c 100%);position:relative;display:flex;justify-content:center;align-items:center;box-shadow:0 0 60px rgba(0,0,0,.9),inset 0 0 40px rgba(0,0,0,.6);border:4px solid #1a1a22}
.wheel-zone{position:absolute;inset:-4px;border-radius:50%;pointer-events:none;z-index:1;overflow:hidden}
.wheel-zone-fill{position:absolute;top:0;left:0;width:100%;height:100%;background:conic-gradient(from 180deg,var(--gold) 0deg,var(--gold) var(--pct-angle,0deg),#1a1a22 var(--pct-angle,0deg),#1a1a22 360deg);opacity:0;transition:opacity .4s}
.wheel-zone-fill.visible{opacity:1;animation:glowPulse 2s infinite}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 5px rgba(255,184,0,0.5))}50%{filter:drop-shadow(0 0 25px var(--gold))}}
.wheel::before{content:'';position:absolute;width:75%;height:75%;border-radius:50%;background:var(--bg);border:1px solid var(--border);z-index:2}
.wheel-ticks{position:absolute;width:100%;height:100%;border-radius:50%;pointer-events:none;z-index:3}
.tick{position:absolute;top:0;left:50%;width:2px;height:8px;background:rgba(255,184,0,.4);transform-origin:center 150px;transform:translateX(-50%) rotate(var(--a));border-radius:1px}
.tick.major{width:3px;height:14px;background:var(--gold);box-shadow:0 0 8px rgba(255,184,0,.8)}
.wheel-center{position:relative;z-index:5;text-align:center}
.pt{font-size:52px;font-weight:900;line-height:1;letter-spacing:-2px;text-shadow:0 0 20px rgba(255,184,0,.4)}
.pl{font-size:9px;color:var(--gray2);letter-spacing:4px;margin-top:4px;font-weight:700}
.arrow-wrap{position:absolute;inset:0;pointer-events:none;z-index:25}
.arrow{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:32px;height:44px;filter:drop-shadow(0 4px 10px rgba(255,184,0,.8))}
.pcnt-row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:20px}
.pb{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 4px;color:var(--gray2);font-size:11px;font-weight:800;cursor:pointer}
.pb.sel{border-color:var(--gold);background:rgba(255,184,0,.1);color:var(--gold)}
.action-row{display:flex;gap:8px;margin-top:12px}
.lightning-btn{width:56px;height:56px;background:var(--panel);border:1px solid var(--border);border-radius:12px;cursor:pointer;display:flex;justify-content:center;align-items:center}
.lightning-btn.on{border-color:var(--gold);background:rgba(255,184,0,.1)}
.lightning-btn .ic{font-size:20px;filter:grayscale(1);opacity:.5}
.lightning-btn.on .ic{filter:grayscale(0);opacity:1}
.upgrade-btn{flex:1;background:linear-gradient(135deg,var(--gold),#ff8c00);color:#1a1a1a;border:none;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 4px 15px rgba(255,184,0,0.3)}
.upgrade-btn:disabled{opacity:.5;background:var(--panel);box-shadow:none}

/* SLOTS & INVENTORY */
.slots-preview{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.slot-prev{background:linear-gradient(180deg,#1a1a1c 0%,#0f0f11 100%);border:1.5px solid #2a2a2e;border-radius:18px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;min-height:190px;position:relative;cursor:pointer}
.slot-prev-lbl{font-size:11px;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;text-align:center}
.slot-prev-cnt{font-size:13px;font-weight:900;color:#ffb800;margin-bottom:12px;text-align:center}
.slot-prev-icons{display:flex;flex-direction:column;gap:8px;width:100%;flex:1;justify-content:center;align-items:center;position:relative}
.slot-cell{width:100%;display:flex;justify-content:center;align-items:center;position:relative}
.slot-cell img{width:80px;height:80px;object-fit:contain;filter:drop-shadow(0 8px 15px rgba(0,0,0,0.7))}
.slot-cell .empty-slot{width:70px;height:70px;border:2px dashed #333;border-radius:16px;display:flex;justify-content:center;align-items:center;font-size:24px;color:#444}
.slot-remove{position:absolute;top:-5px;right:calc(50% - 45px);width:24px;height:24px;background:var(--red);border-radius:50%;display:flex;justify-content:center;align-items:center;color:#fff;font-size:14px;font-weight:900;cursor:pointer;border:2px solid #0a0a0c;z-index:5}
.slot-sum{font-size:16px;font-weight:900;color:#ffb800;margin-top:10px;text-align:center}
.slot-clear{font-size:11px;font-weight:900;color:var(--red);margin-top:8px;cursor:pointer;background:rgba(229,9,20,0.1);border:1px solid rgba(229,9,20,0.3);padding:6px 14px;border-radius:8px}

.big-tabs{display:flex;gap:4px;margin-top:20px;background:var(--panel);padding:4px;border-radius:12px}
.big-tab{flex:1;background:none;border:none;color:var(--gray2);font-size:11px;font-weight:800;padding:10px;border-radius:8px;cursor:pointer}
.big-tab.active{background:var(--panel-l);color:var(--white)}
.panel{display:none;margin-top:16px}
.panel.active{display:block}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

/* GLASS CARDS */
.card{background:rgba(255,255,255,0.03);backdrop-filter:blur(10px);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,0.1);cursor:pointer;transition:0.3s;position:relative;min-height:180px}
.card:active{transform:scale(0.98)}
.card-img-wrap{width:100%;aspect-ratio:1.1;background:radial-gradient(circle at center,rgba(255,255,255,0.05) 0%,transparent 70%);display:flex;justify-content:center;align-items:center;padding:10px;transition:0.3s}
.card-img-wrap img{width:90%;height:90%;object-fit:contain;filter:drop-shadow(0 10px 15px rgba(0,0,0,0.6));transition:0.3s}
.card-info{padding:12px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(to top, rgba(0,0,0,0.8), transparent);position:relative;z-index:2;transition:0.3s}
.card-name{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--white)}
.card-price{font-size:14px;font-weight:900;color:var(--gold)}

.card.expanded{border-color:var(--gold);box-shadow:0 0 20px rgba(255,184,0,0.4);z-index:10}
.card.expanded .card-img-wrap{opacity:0.3;filter:blur(4px);transform:scale(1.1)}
.card.expanded .card-info{opacity:0;pointer-events:none}
.card-actions-overlay{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;gap:8px;padding:12px;background:rgba(10,10,12,0.4);backdrop-filter:blur(8px);z-index:20}
.card.expanded .card-actions-overlay{display:flex}
.btn-act{width:100%;padding:10px;border-radius:10px;border:none;font-weight:900;font-size:11px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:4px;transition:0.2s;color:#fff}
.btn-act:active{transform:scale(0.95)}
.btn-act.upg{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000}
.btn-act.sell{background:var(--panel-l);border:1px solid var(--border);color:var(--white)}
.btn-act.wd{background:var(--red)}

.r-common{border-color:rgba(255,255,255,0.1);box-shadow:0 4px 15px rgba(0,0,0,0.3)}
.r-uncommon{border-color:rgba(74,158,255,0.5);box-shadow:0 4px 15px rgba(74,158,255,0.15)}
.r-rare{border-color:rgba(155,138,255,0.6);box-shadow:0 4px 15px rgba(155,138,255,0.2)}
.r-epic{border-color:rgba(255,68,68,0.7);box-shadow:0 4px 20px rgba(255,68,68,0.3)}
.r-legend{border-color:rgba(255,215,0,0.8);box-shadow:0 4px 25px rgba(255,215,0,0.4)}

/* DRAWER */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(5px);z-index:1500;opacity:0;pointer-events:none;transition:0.3s}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:85%;max-width:360px;background:var(--panel);z-index:1501;transform:translateX(100%);transition:transform 0.3s;display:flex;flex-direction:column;border-left:1px solid var(--border)}
.drawer.open{transform:translateX(0)}
.drawer-header{padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.drawer-close{background:var(--panel-l);border:none;color:var(--white);width:32px;height:32px;border-radius:8px;font-size:16px;cursor:pointer}
.drawer-nav{display:flex;gap:6px;padding:12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.drawer-nav::-webkit-scrollbar{display:none}
.dnav-btn{flex-shrink:0;padding:8px 16px;border-radius:8px;background:var(--panel-l);border:none;color:var(--gray2);font-size:12px;font-weight:800;cursor:pointer}
.dnav-btn.active{background:var(--white);color:#000}
.drawer-content{flex:1;overflow-y:auto;padding:20px}

/* PROFILE CONTENT */
.profile-card{background:linear-gradient(135deg,#1a1a1c,#0a0a0c);border:1px solid var(--border);border-radius:16px;padding:16px;text-align:center;margin-bottom:16px}
.profile-ava{width:80px;height:80px;border-radius:50%;background:var(--panel-l);margin:0 auto 12px;border:2px solid var(--gold);overflow:hidden}
.profile-ava img{width:100%;height:100%;object-fit:cover}
.profile-name{font-size:18px;font-weight:900}
.profile-id{font-size:11px;color:var(--gray2);font-family:monospace}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.stat-box{background:var(--panel-l);border-radius:12px;padding:10px;text-align:center}
.stat-val{font-size:16px;font-weight:900}
.stat-lbl{font-size:9px;color:var(--gray2);font-weight:800}

/* ACH & HISTORY */
.ach-item{background:var(--panel-l);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.ach-ico{width:40px;height:40px;background:var(--panel);border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:20px}
.ach-info{flex:1}
.ach-name{font-size:13px;font-weight:900}
.ach-desc{font-size:10px;color:var(--gray2);font-weight:600}
.ach-reward{font-size:12px;font-weight:900;color:var(--gold)}

.hist-item{display:flex;align-items:center;gap:12px;background:var(--panel-l);border-radius:8px;padding:8px;margin-bottom:8px}
.hist-img{width:40px;height:40px;object-fit:contain}
.hist-name{flex:1;font-size:12px;font-weight:900}
.hist-win{color:var(--green-l);font-weight:900;font-size:12px}
.hist-lose{color:var(--red);font-weight:900;font-size:12px}

/* UTILS */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--border);padding:16px 24px;border-radius:12px;color:var(--white);font-size:13px;font-weight:800;z-index:9999;text-align:center;display:none}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(5px);z-index:1000;display:flex;justify-content:center;align-items:center;padding:16px}
.modal-content{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:20px;width:100%;max-width:400px;position:relative;max-height:90vh;overflow-y:auto}
.modal-title{font-size:18px;font-weight:900;margin-bottom:16px;text-align:center}
.modal-close{position:absolute;top:16px;right:16px;background:var(--panel-l);border:none;color:var(--gray2);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px}
.filter-bar{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--gray2);font-size:11px;font-weight:800;cursor:pointer}
.filter-chip.active{border-color:var(--gold);color:var(--gold);background:rgba(255,184,0,.1)}

@keyframes popupIn{0%{opacity:0;transform:scale(.9) translateY(20px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.popup-win-card{animation:popupIn .5s}
.popup-lose-card{animation:popupIn .5s}
.popup-item{animation:itemFloat 2s ease-in-out infinite}
@keyframes itemFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.02)}}
</style></head><body>

<div class="top">
  <div class="top-left">
    <svg class="logo-svg" viewBox="0 0 40 40"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e50914"/><stop offset="1" stop-color="#8b0000"/></linearGradient></defs><path fill="url(#lg)" d="M20 2L4 20h8v16h16V20h8L20 2zm0 6l8 10h-4v10h-8V18h-4l8-10z"/></svg>
    <div class="rank-badge"><div class="rn" id="rankNameTop">НОВИЧОК</div><div id="rankLevelTop">LVL 1</div></div>
  </div>
  <div class="top-right">
    <div class="cart-btn" onclick="openCart()"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg><div class="cart-badge" id="cartBadge">0</div></div>
    <div class="bal-pill" onclick="showTopup()"><div class="bal-plus">+</div><div class="bal-num" id="goldTop">0</div><div class="bal-g">G</div></div>
    <div class="av-top" id="topAv" onclick="openDrawer()">👤</div>
  </div>
</div>

<div class="top-actions">
  <button class="action-chip bonus-chip" onclick="showTopup()">🎁 БОНУС</button>
  <button class="action-chip vip-chip" onclick="openVipModal()" style="color:var(--gold)">👑 VIP</button>
</div>

<div class="live-wrap">
  <div class="live-title">LIVE ДРОПЫ</div>
  <div class="live-track-wrap">
    <div class="live-track" id="liveTrack">
      <div class="live-card"><div class="live-info"><div class="live-name">Загрузка...</div></div></div>
    </div>
  </div>
</div>

<div class="main">
  <div class="wheel-wrap">
    <div class="wheel" id="wheel">
      <div class="wheel-zone"><div class="wheel-zone-fill" id="wheelZoneFill"></div></div>
      <div class="wheel-ticks" id="wheelTicks"></div>
      <div class="wheel-center"><div class="pt" id="pt">?%</div><div class="pl">CHANCE</div></div>
    </div>
    <div class="arrow-wrap" id="arrowWrap"><div class="arrow"><svg viewBox="0 0 40 52"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb800"/><stop offset="1" stop-color="#ff8c00"/></linearGradient></defs><path fill="url(#ag)" d="M20 52L8 32h7V8h10v24h7L20 52z"/></svg></div></div>
  </div>
  <div class="pcnt-row" id="pcntRow"></div>
  <div class="action-row">
    <button class="lightning-btn" id="lightningBtn" onclick="toggleLightning()"><div class="ic">⚡</div></button>
    <button class="upgrade-btn" id="upgradeBtn" onclick="spinUpgrade()" disabled>UPGRADE</button>
  </div>
  
  <div class="slots-preview">

// ==================== UTILS ====================
function toast(msg, type){
  const e = document.getElementById('toast');
  e.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid ' + (type === 'win' ? 'var(--green-l)' : type === 'lose' ? 'var(--red)' : 'var(--border)') + ';padding:16px 24px;border-radius:12px;color:var(--white);font-size:13px;font-weight:800;z-index:9999;text-align:center;display:block';
  e.innerText = msg;
  setTimeout(() => e.style.display = 'none', 2500);
}
function formatPct(p){ return p >= 0.1 ? p.toFixed(1) + '%' : p.toFixed(2) + '%'; }
function getRarity(c){
  c = String(c || '#888').toLowerCase();
  if(c === '#ffd700') return 'r-legend';
  if(c === '#ff4444') return 'r-epic';
  if(c === '#ff69b4') return 'r-rare';
  if(c === '#9b8aff') return 'r-uncommon';
  return 'r-common';
}
function updateBal(){ document.getElementById('goldTop').innerText = Math.floor(gold).toLocaleString('ru-RU'); }
function lockBody(v){ document.body.classList.toggle('modal-open', v); }
function showTopup(){ toast('💰 Пополнение скоро', 'win'); }

// ==================== API ====================
async function apiCall(path, opts){
  opts = opts || {};
  const headers = authHeaders(opts.headers);
  const res = await fetch(BOT_URL + path, { ...opts, headers });
  const text = await res.text();
  let data;
  try{ data = JSON.parse(text); } 
  catch(e){ throw new Error('Сервер вернул ошибку'); }
  if(!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
  return data;
}

// ==================== LOAD ====================
async function loadGame(){
  try{
    const d = await apiCall('/api/load/' + userId);
    if(d.ok && d.data){
      gold = d.data.gold || 0;
      inv = Array.isArray(d.data.inv) ? d.data.inv : [];
      stats = d.data.stats || { spins: 0, wins: 0, loses: 0 };
      bestDrop = d.data.bestDrop || null;
      vipData = { isVip: !!d.data.isVip, expires: Number(d.data.vipExpires || 0) };
      if(d.data.photoUrl){ document.getElementById('topAv').innerHTML = '<img src="' + d.data.photoUrl + '">'; }
    }
    gameLoaded = true;
  }catch(e){
    toast('❌ ' + e.message, 'lose');
    gameLoaded = true;
  }
}
async function loadRefData(){
  try{
    const d = await apiCall('/api/ref/my/' + userId);
    if(d.ok){ refData = { code: d.code, invited: d.invited }; }
  }catch(e){}
}
async function loadHistory(){

    if(d.ok){ historyData = d.list || []; }

}

// ==================== WHEEL ====================
function drawTicks(){
  const t = document.getElementById('wheelTicks');
  let h = '';
  for(let i = 0; i < 36; i++){ h += `<div class="tick${i%3===0?' major':''}" style="--a:${i*10}deg"></div>`; }
  t.innerHTML = h;
}
function renderPctRow(){
  document.getElementById('pcntRow').innerHTML = customPcts.map(p => `<button class="pb" onclick="setPct(${p},this)">${p}%</button>`).join('');
}
function updateWheelPct(pct){
  document.getElementById('pt').innerText = formatPct(pct);
  const fill = document.getElementById('wheelZoneFill');
  const targetAngle = (pct/100) * 360;
  fill.classList.add('visible');
  fill.style.setProperty('--pct-angle', targetAngle + 'deg');
}
function clearWheelPct(){
  document.getElementById('pt').innerText = '?%';
  document.getElementById('wheelZoneFill').classList.remove('visible');
}

// ==================== INVENTORY ====================
function switchBigTab(m){
  document.getElementById('bigTabInv').classList.toggle('active', m === 'inv');
  document.getElementById('bigTabTarget').classList.toggle('active', m === 'target');
  document.getElementById('panelInv').classList.toggle('active', m === 'inv');
  document.getElementById('panelTarget').classList.toggle('active', m === 'target');
  if(m === 'target') rendTargetList();
}
function switchSub(m){
  invMode = m;
  document.getElementById('subInv').style.background = m === 'inv' ? 'var(--panel-l)' : 'none';
  document.getElementById('subInv').style.color = m === 'inv' ? 'var(--white)' : 'var(--gray2)';
  document.getElementById('subShop').style.background = m === 'shop' ? 'var(--panel-l)' : 'none';
  document.getElementById('subShop').style.color = m === 'shop' ? 'var(--white)' : 'var(--gray2)';
  document.getElementById('searchInp').value = '';
  invFilter = 'all';
  renderFilters(); rendInv();
}
function renderFilters(){
  const fb = document.getElementById('filterBar');
  const filters = [{k:'all',l:'ВСЕ'},{k:'legend',l:'🟡 LEGEND'},{k:'epic',l:'🔴 EPIC'},{k:'rare',l:'🟣 RARE'},{k:'uncommon',l:'🔵 UNCOMMON'},{k:'common',l:'⚪ COMMON'}];
  fb.innerHTML = filters.map(f => `<div class="filter-chip ${invFilter===f.k?'active':''}" onclick="invFilter='${f.k}';renderFilters();rendInv()">${f.l}</div>`).join('');
}
function rendInv(){
  const b = document.getElementById('invList');
  const q = (document.getElementById('searchInp')?.value || '').toLowerCase();
  
  if(invMode === 'shop'){
    let f = allSkins.filter(s => s.name.toLowerCase().includes(q)).sort((a,b)=>a.price-b.price);
    b.innerHTML = f.map(s => {
      const r = getRarity(s.color);
      const inCart = cart.find(c => c.name === s.name);
      return `<div class="card ${r}" onclick="toggleCart('${s.name}',${s.price})">
        <div class="card-img-wrap"><img src="${s.img}"></div>
        <div class="card-info"><div class="card-name">${s.name}</div><div class="card-price">${s.price.toLocaleString('ru-RU')} G</div></div>
        <div style="position:absolute;bottom:10px;right:10px;background:${inCart?'var(--red)':'var(--panel-l)'};padding:6px 10px;border-radius:8px;font-size:10px;font-weight:900;border:1px solid var(--border);z-index:3">${inCart?'В КОРЗИНЕ':'🛒'}</div>
      </div>`;
    }).join('');
    return;
  }
  
  let f = inv.filter(it => it.name.toLowerCase().includes(q));
  if(invFilter !== 'all') f = f.filter(it => getRarity(it.color) === 'r-' + invFilter);
  if(f.length === 0){ b.innerHTML = '<div style="grid-column:span 2;text-align:center;padding:40px;color:var(--gray2)">Ничего не найдено</div>'; return; }
  
  b.innerHTML = f.map((it, idx) => {
    const r = getRarity(it.color);
    return `<div class="card ${r}" id="card-${idx}" onclick="expandCard(this)">
      <div class="card-img-wrap"><img src="${it.img}"></div>
      <div class="card-info"><div class="card-name">${it.name}</div><div class="card-price">${it.price} G</div></div>
      <div class="card-actions-overlay">
        <button class="btn-act upg" onclick="event.stopPropagation(); addToUpgrade('${it.name}'); closeAllCards();">⬆ Апгрейд</button>
        <button class="btn-act sell" onclick="event.stopPropagation(); sellSkin('${it.name}'); closeAllCards();">💸 Продать</button>
        <button class="btn-act wd" onclick="event.stopPropagation(); openWithdrawModal('${it.name}'); closeAllCards();">📤 Вывести</button>
      </div>
    </div>`;
  }).join('');
}
let activeCardId = null;
function expandCard(el){
  if(activeCardId === el.id){ closeAllCards(); return; }
  closeAllCards(); el.classList.add('expanded'); activeCardId = el.id;
}
function closeAllCards(){
  document.querySelectorAll('.card.expanded').forEach(c => c.classList.remove('expanded'));
  activeCardId = null;
}
function rendTargetList(){
  const b = document.getElementById('targetList');
  const q = (document.getElementById('targetSearchInp')?.value || '').toLowerCase();
  let f = allSkins.filter(s => s.name.toLowerCase().includes(q)).sort((a,b)=>a.price-b.price);
  b.innerHTML = f.map(s => {
    const r = getRarity(s.color);
    const isSel = targetSkin && targetSkin.name === s.name;
    return `<div class="card ${r}" style="border-color:${isSel?'var(--white)':'var(--border)'}" onclick="pickTarget('${s.name}')">
      <div class="card-img-wrap"><img src="${s.img}"></div>
      <div class="card-info"><div class="card-name">${s.name}</div><div class="card-price">${s.price.toLocaleString('ru-RU')} G</div></div>
    </div>`;
  }).join('');
}

// ==================== UPGRADE ====================
function addToUpgrade(name){
  if(isSpinning) return toast('⏳ Подожди', 'lose');
  if(selectedItems.find(x => x.name === name)) return toast('⚠️ Уже добавлен', 'lose');
  const it = inv.find(x => x.name === name);
  if(!it) return toast('❌ Нет скина', 'lose');
  selectedItems.push(it); recomputePct(); rendMain();
}
function removeFromUpgrade(name){
  selectedItems = selectedItems.filter(x => x.name !== name);
  recomputePct(); rendMain();
}
function clearUpgrade(){
  selectedItems = []; targetSkin = null; selPct = null;
  clearWheelPct(); rendMain();
}
function pickTarget(name){
  const s = CATALOG_CLIENT[name];
  targetSkin = { name, price: s.price, color: s.color, img: s.img };
  recomputePct(); rendMain(); rendTargetList(); switchBigTab('inv');
}
function recomputePct(){
  if(selectedItems.length === 0 || !targetSkin){ selPct = null; checkUpgradeBtn(); return; }
  const sum = selectedItems.reduce((s, it) => s + (it.price || 0), 0);
  selPct = Math.min(90, Math.max(0.01, (sum / targetSkin.price) * 100));
  updateWheelPct(selPct); checkUpgradeBtn();
}
function setPct(p){
  if(selectedItems.length === 0) return toast('❌ Выбери скины', 'lose');
  const sum = selectedItems.reduce((s, it) => s + (it.price || 0), 0);
  const ideal = sum / (p / 100);
  let closest = allSkins[0], minDiff = Infinity;
  allSkins.forEach(s => { const d = Math.abs(s.price - ideal); if(d < minDiff){ minDiff = d; closest = s; } });
  targetSkin = { name: closest.name, price: closest.price, color: closest.color, img: closest.img };
  recomputePct(); rendMain(); rendTargetList();
}
function checkUpgradeBtn(){
  document.getElementById('upgradeBtn').disabled = !(selectedItems.length > 0 && targetSkin && !isSpinning);
}
function rendMain(){
  const left = document.getElementById('leftIcons');
  left.innerHTML = selectedItems.length === 0 ? '<div class="empty-slot">+</div>' :
    selectedItems.map(s => `<div class="slot-cell"><img src="${s.img}"><div class="slot-remove" onclick="removeFromUpgrade('${s.name}')">✕</div></div>`).join('');
  document.getElementById('selCount').innerText = selectedItems.length + ' ИЗ 10';
  document.getElementById('selSum').innerText = selectedItems.reduce((s, it) => s + (it.price || 0), 0).toLocaleString() + ' G';
  
  const right = document.getElementById('rightIcons');
  if(targetSkin){
    right.innerHTML = `<div class="slot-cell"><img src="${targetSkin.img}"></div>`;
    document.getElementById('targetCount').innerText = targetSkin.price.toLocaleString() + ' G';
  } else {
    right.innerHTML = '<div class="empty-slot">🎯</div>';
    document.getElementById('targetCount').innerText = 'НЕ ВЫБРАНА';
  }
  checkUpgradeBtn();
}
function toggleLightning(){ lightningOn = !lightningOn; document.getElementById('lightningBtn').classList.toggle('on', lightningOn); }

// ==================== SPIN ====================
async function spinUpgrade(){
  if(selectedItems.length === 0 || !targetSkin || isSpinning) return;
  isSpinning = true; checkUpgradeBtn();
  document.getElementById('upgradeBtn').innerText = '⏳...';
  
  try{
    const result = await apiCall('/api/spin/commit', {
      method: 'POST',
      body: JSON.stringify({ userId, targetName: targetSkin.name, selectedNames: selectedItems.map(x=>x.name) })
    });
    
    gold = result.newGold; inv = result.newInv; stats.spins++;
    if(result.win){ stats.wins++; if(!bestDrop || result.target.price > bestDrop.price) bestDrop = result.target; }
    else stats.loses++;
    updateBal();
    
    const duration = lightningOn ? 2000 : 10000;
    const wrap = document.getElementById('arrowWrap');
    wrap.style.transition = 'transform ' + (duration/1000) + 's cubic-bezier(.15,.6,.2,1)';
    wrap.style.transform = `rotate(${-(5*360 + Math.random()*360)}deg)`;
    
    setTimeout(() => {
      if(result.win) showWinModal(result.target); else showLoseModal(selectedItems);
      isSpinning = false; wrap.style.transition = 'none'; wrap.style.transform = 'rotate(0deg)';
      selectedItems = []; targetSkin = null; selPct = null;
      clearWheelPct(); document.getElementById('upgradeBtn').innerText = 'UPGRADE';
      rendMain(); rendInv(); rendTargetList();
    }, duration);
  }catch(e){
    toast('❌ ' + e.message, 'lose'); isSpinning = false;
    document.getElementById('upgradeBtn').innerText = 'UPGRADE'; checkUpgradeBtn();
  }
}

// ==================== CART ====================
function toggleCart(name, price){
  const i = cart.findIndex(c => c.name === name);
  if(i >= 0) cart.splice(i, 1); else cart.push({ name, price });
  document.getElementById('cartBadge').style.display = cart.length > 0 ? 'block' : 'none';
  document.getElementById('cartBadge').innerText = cart.length;
  rendInv();
}
async function checkout(){
  try{
    const d = await apiCall('/api/buy', { method: 'POST', body: JSON.stringify({ userId, items: cart.map(c=>({name:c.name})) }) });
    gold = d.newGold; inv = d.newInv; cart = [];
    document.getElementById('cartBadge').style.display = 'none';
    updateBal(); rendInv(); toast('✅ Куплено!', 'win');
  }catch(e){ toast('❌ ' + e.message, 'lose'); }
}
async function sellSkin(name){
  if(!confirm('Продать ' + name + '?')) return;
  try{
    const d = await apiCall('/api/sell', { method: 'POST', body: JSON.stringify({ userId, skinName: name }) });
    gold = d.newGold; inv = d.newInv; updateBal(); rendInv(); toast('💸 +' + d.earned + ' G', 'win');
  }catch(e){ toast('❌ ' + e.message, 'lose'); }
}

// ==================== LIVE ====================
async function loadLiveFeed(){
  const track = document.getElementById('liveTrack');
  try{
    const d = await apiCall('/api/live');
    if(!d.list || d.list.length === 0){ track.innerHTML = '<div class="live-card"><div class="live-info"><div class="live-name">Нет рекордов</div></div></div>'; return; }
    const items = d.list.map((x, i) => {
      let cls = i === 0 ? 'top-drop' : x.skinPrice > 1000 ? 'red-drop' : x.skinPrice > 100 ? 'purple-drop' : '';
      return `<div class="live-card ${cls}">
        <div class="live-info"><div class="live-name">${x.playerName || 'Игрок'}</div><div class="live-pct">${x.pct}%</div></div>
        <img src="${x.skinImg}" class="live-skin" onerror="this.style.display='none'">
      </div>`;
    }).join('');
    track.innerHTML = items + items;
  }catch(e){ track.innerHTML = '<div class="live-card"><div class="live-info"><div class="live-name">Ошибка загрузки</div></div></div>'; }
}
setInterval(loadLiveFeed, 30000);

// ==================== DRAWER (Профиль) ====================
function openDrawer(){
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
  lockBody(true); renderDrawerContent(currentDrawerTab);
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
  lockBody(false);
}
function switchDrawerTab(tab, btn){
  currentDrawerTab = tab;
  document.querySelectorAll('.dnav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); renderDrawerContent(tab);
}

  if(tab === 'profile'){
    await loadRefData(); await loadHistory();
    body.innerHTML = `
      <div class="profile-card">
        <div class="profile-ava">${tgUser?.photo_url ? `<img src="${tgUser.photo_url}">` : '👤'}</div>
        <div class="profile-name">${tgUser?.first_name || 'Игрок'}</div>
        <div class="profile-id">ID: #${userId.slice(-5)}</div>
      </div>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-val">${stats.spins}</div><div class="stat-lbl">СПИНЫ</div></div>
        <div class="stat-box"><div class="stat-val" style="color:var(--green-l)">${stats.wins}</div><div class="stat-lbl">ПОБЕДЫ</div></div>
        <div class="stat-box"><div class="stat-val" style="color:var(--gold)">${stats.spins>0?Math.round(stats.wins/stats.spins*100):0}%</div><div class="stat-lbl">ВИНРЕЙТ</div></div>
      </div>
      ${bestDrop ? `<div style="background:linear-gradient(135deg,#1a1408,#0a0800);border:2px solid var(--gold);border-radius:16px;padding:12px;display:flex;align-items:center;gap:12px;margin-bottom:16px"><img src="${bestDrop.img}" style="width:60px"><div><div style="color:var(--gold);font-size:10px;font-weight:900">🏆 ЛУЧШИЙ ДРОП</div><div style="font-size:14px;font-weight:900">${bestDrop.name}</div></div></div>` : ''}
      
      <div style="font-size:12px;font-weight:900;color:var(--gray2);margin-bottom:8px">ИНВЕНТАРЬ (${inv.length})</div>
      <div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">
        ${inv.slice(0, 6).map(it => `<div class="card ${getRarity(it.color)}" style="padding:4px;min-height:auto"><div class="card-img-wrap" style="padding:4px"><img src="${it.img}" style="height:40px"></div></div>`).join('')}
      </div>

      <div style="font-size:12px;font-weight:900;color:var(--gray2);margin-bottom:8px">ИСТОРИЯ ИГР</div>
      ${historyData.slice(0, 5).map(h => `<div class="hist-item"><img src="${h.targetImg}" class="hist-img"><div class="hist-name">${h.targetName}</div><div class="${h.win ? 'hist-win' : 'hist-lose'}">${h.win ? 'WIN' : 'LOSE'}</div></div>`).join('')}

      <div style="font-size:12px;font-weight:900;color:var(--gray2);margin:16px 0 8px">ПРОМОКОД</div>
      <div style="display:flex;gap:6px;margin-bottom:16px"><input type="text" id="promoInp" placeholder="Введи код" style="flex:1;background:var(--panel-l);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--white);outline:none"><button onclick="applyPromo()" style="background:var(--purple);color:#fff;border:none;border-radius:8px;padding:0 16px;font-weight:900;cursor:pointer">OK</button></div>

      <div style="font-size:12px;font-weight:900;color:var(--gray2);margin-bottom:8px">РЕФЕРАЛЬНЫЙ КОД</div>
      <div style="background:var(--panel-l);padding:12px;border-radius:8px;text-align:center;font-weight:900;color:var(--gold);font-size:16px;margin-bottom:16px">${refData.code}</div>
    `;
  }
  else if(tab === 'ach'){
    body.innerHTML = `<div class="ach-item unlocked"><div class="ach-ico">🏆</div><div class="ach-info"><div class="ach-name">Первый спин</div><div class="ach-desc">Сделай 1 апгрейд</div></div><div class="ach-reward">+10 G</div></div>`;
  }
  else if(tab === 'friends'){
    body.innerHTML = `<div style="text-align:center;padding:40px;color:var(--gray2)">Друзья скоро вернутся...</div>`;
  }
  else if(tab === 'settings'){
    body.innerHTML = `<div style="text-align:center;padding:40px;color:var(--gray2)">Настройки в разработке...</div>`;
  }
}
async function applyPromo(){
  const code = document.getElementById('promoInp')?.value;
  if(!code) return;
  try{
    const d = await apiCall('/api/promo/apply', { method: 'POST', body: JSON.stringify({ userId, code }) });
    gold += d.amount; updateBal(); toast('🎁 +' + d.amount + ' G', 'win');
  }catch(e){ toast('❌ ' + e.message, 'lose'); }
}

(async () => {
  drawTicks(); renderPctRow(); updateBal(); rendMain(); renderFilters(); rendInv(); rendTargetList();

  if(tgUser?.photo_url) document.getElementById('topAv').innerHTML = `<img src="${tgUser.photo_url}">`;
  await loadGame();

})();
document.addEventListener('click', (e) => { if(!e.target.closest('.card')) closeAllCards(); });
