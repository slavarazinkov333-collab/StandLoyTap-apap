*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#05070f;font-family:'Courier New',monospace}
#app{position:fixed;inset:0}
canvas{display:block}

#menu{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;overflow:hidden;background:#05070f}
#menu::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(20,40,80,.25) 0%,rgba(5,7,15,.98) 70%);animation:flicker 4s infinite}

@keyframes titlePulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.15)}}

#leftZone{position:absolute;left:0;top:0;bottom:0;width:42%;pointer-events:auto}

#actionBtn{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);padding:16px 40px;background:linear-gradient(180deg,#0a1a2a,#05101a);border:2px solid #4a9eff;color:#fff;font-weight:900;font-size:16px;letter-spacing:3px;border-radius:8px;pointer-events:auto;display:none;cursor:pointer;box-shadow:0 0 30px rgba(74,158,255,.5)}
#actionBtn.on{display:block}

#result h1.lose{color:#b81e1e;text-shadow:0 0 50px rgba(184,30,30,.8)}

#result button{background:linear-gradient(180deg,#0a1a2a,#05101a);border:2px solid #4a9eff;color:#d4d4d4;font-weight:900;font-size:16px;padding:15px 44px;border-radius:6px;cursor:pointer;letter-spacing:4px;margin-top:10px}
</style>

<script type="module">
import * as THREE from 'three';

// ========== UTILS ==========
function goFullscreen(){
  try{
    const el = document.documentElement;
    if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    if(window.Telegram && window.Telegram.WebApp){
      try{ window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); if(window.Telegram.WebApp.requestFullscreen) window.Telegram.WebApp.requestFullscreen(); }catch(e){}
    }
  }catch(e){}
}

// ========== AUDIO ==========
let audioCtx = null;
function getAudioCtx(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(audioCtx.state==='suspended') audioCtx.resume().catch(()=>{}); return audioCtx; }
function soundShot(){
  const ctx = getAudioCtx(); if(!ctx) return;
  try{
    const buf = ctx.createBuffer(1, ctx.sampleRate*0.15, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/d.length*5);
    const src = ctx.createBufferSource(); src.buffer=buf;
    const g1 = ctx.createGain(); g1.gain.value=0.4;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2000;
    src.connect(lp); lp.connect(g1); g1.connect(ctx.destination); src.start();
    const o = ctx.createOscillator(), g2 = ctx.createGain();
    o.connect(g2); g2.connect(ctx.destination);
    o.type='square'; o.frequency.setValueAtTime(220, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(80, ctx.currentTime+0.1);
    g2.gain.setValueAtTime(0.2, ctx.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.12);
    o.start(); o.stop(ctx.currentTime+0.12);
  }catch(e){}
}
function soundReload(){
  const ctx = getAudioCtx(); if(!ctx) return;
  try{
    [[0,220],[700,380],[1200,600]].forEach(([t,f])=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type='square'; o.frequency.value=f;
      g.gain.setValueAtTime(0.08, ctx.currentTime+t/1000);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+t/1000+0.07);
      o.start(ctx.currentTime+t/1000); o.stop(ctx.currentTime+t/1000+0.07);
    });
  }catch(e){}
}
function soundPickup(){
  const ctx = getAudioCtx(); if(!ctx) return;
  try{
    [523,659,784,1047].forEach((f,i)=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.1, ctx.currentTime+i*0.08);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+i*0.08+0.18);
      o.start(ctx.currentTime+i*0.08); o.stop(ctx.currentTime+i*0.08+0.18);
    });
  }catch(e){}
}
function soundStep(){
  const ctx = getAudioCtx(); if(!ctx) return;
  try{
    const buf = ctx.createBuffer(1, ctx.sampleRate*0.08, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/d.length*3)*0.4;
    const src = ctx.createBufferSource(); src.buffer=buf;
    const g = ctx.createGain(); g.gain.value=0.06;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=400;
    src.connect(lp); lp.connect(g); g.connect(ctx.destination); src.start();
  }catch(e){}
}
let ambientNodes = null;
function startAmbient(){
  const ctx = getAudioCtx(); if(!ctx || ambientNodes) return;
  try{
    const buf = ctx.createBuffer(2, ctx.sampleRate*4, ctx.sampleRate);
    for(let ch=0;ch<2;ch++){ const d=buf.getChannelData(ch); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*0.3; }
    const noise = ctx.createBufferSource(); noise.buffer=buf; noise.loop=true;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=180; lp.Q.value=2;
    const g = ctx.createGain(); g.gain.value=0.08;
    noise.connect(lp); lp.connect(g); g.connect(ctx.destination); noise.start();
    const lfo = ctx.createOscillator(), lg = ctx.createGain();
    lfo.type='sine'; lfo.frequency.value=0.08; lg.gain.value=0.04;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
    ambientNodes = { noise, g, lfo };
  }catch(e){}
}
function stopAmbient(){ if(!ambientNodes) return; try{ ambientNodes.noise.stop(); ambientNodes.lfo.stop(); }catch(e){} ambientNodes=null; }
function randomCreak(){
  const ctx = getAudioCtx(); if(!ctx) return;
  try{
    if(Math.random()<0.5){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type='sawtooth'; o.frequency.setValueAtTime(50+Math.random()*30, ctx.currentTime);
      o.frequency.linearRampToValueAtTime(35, ctx.currentTime+1.5);
      g.gain.setValueAtTime(0.001, ctx.currentTime);
      g.gain.linearRampToValueAtTime(0.03, ctx.currentTime+0.3);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+1.5);
      o.start(); o.stop(ctx.currentTime+1.5);
    } else {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type='triangle';
      o.frequency.setValueAtTime(800+Math.random()*400, ctx.currentTime);
      o.frequency.linearRampToValueAtTime(300+Math.random()*200, ctx.currentTime+0.6);
      g.gain.setValueAtTime(0.04, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.8);
      o.start(); o.stop(ctx.currentTime+0.8);
    }
  }catch(e){}
}
function soundDoorOpen(){
  const ctx = getAudioCtx(); if(!ctx) return;
  try{
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type='sawtooth'; o.frequency.setValueAtTime(120, ctx.currentTime);
    o.frequency.linearRampToValueAtTime(180, ctx.currentTime+0.4);
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.linearRampToValueAtTime(0.08, ctx.currentTime+0.1);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.5);
    o.start(); o.stop(ctx.currentTime+0.5);
  }catch(e){}
}
function soundExplosion(){
  const ctx = getAudioCtx(); if(!ctx) return;
  try{
    const buf = ctx.createBuffer(1, ctx.sampleRate*1.2, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++){ const t=i/d.length; d[i]=(Math.random()*2-1)*Math.exp(-t*3)*(1-t*0.5); }
    const src = ctx.createBufferSource(); src.buffer=buf;
    const g = ctx.createGain(); g.gain.value=0.5;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=800;
    src.connect(lp); lp.connect(g); g.connect(ctx.destination); src.start();
  }catch(e){}
}
function soundTakeoff(){
  const ctx = getAudioCtx(); if(!ctx) return;
  try{
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type='sawtooth'; o.frequency.setValueAtTime(40, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(120, ctx.currentTime+2.5);
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime+0.5);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+2.5);
    o.start(); o.stop(ctx.currentTime+2.5);
  }catch(e){}
}
function soundRepairTick(){
  const ctx = getAudioCtx(); if(!ctx) return;
  try{
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type='triangle'; o.frequency.setValueAtTime(800+Math.random()*300, ctx.currentTime);
    g.gain.setValueAtTime(0.08, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.05);
    o.start(); o.stop(ctx.currentTime+0.05);
  }catch(e){}
}
function soundZombieGroan(){
  const ctx = getAudioCtx(); if(!ctx) return;
  try{
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type='sawtooth';
    o.frequency.setValueAtTime(55+Math.random()*25, ctx.currentTime);
    o.frequency.linearRampToValueAtTime(40, ctx.currentTime+1.2);
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.linearRampToValueAtTime(0.06, ctx.currentTime+0.2);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+1.3);
    o.start(); o.stop(ctx.currentTime+1.3);
  }catch(e){}
}
let heliSound = null;
function startHeliSound(v=0.15){
  const ctx = getAudioCtx(); if(!ctx || heliSound) return;
  try{
    const o = ctx.createOscillator(), g = ctx.createGain();
    const lfo = ctx.createOscillator(), lg = ctx.createGain();
    o.type='sawtooth'; o.frequency.value=60;
    lfo.type='sine'; lfo.frequency.value=18; lg.gain.value=15;
    lfo.connect(lg); lg.connect(o.frequency);
    g.gain.value=v; o.connect(g); g.connect(ctx.destination);
    o.start(); lfo.start();
    heliSound = { o, g, lfo };
  }catch(e){}
}
function stopHeliSound(){ if(!heliSound) return; try{ heliSound.o.stop(); heliSound.lfo.stop(); }catch(e){} heliSound=null; }
function setHeliVolume(v){ if(heliSound) try{ heliSound.g.gain.value=v; }catch(e){} }

// ========== VOICE ==========
function speak(text, opts={}){
  if(!window.speechSynthesis) return;
  try{

    const vs = window.speechSynthesis.getVoices();
    const ru = vs.find(v=>v.lang && v.lang.toLowerCase().startsWith('ru'));
    if(ru) u.voice=ru;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function startCutscene(){
  cutActive=true; cutTime=0; cutPhase=0;
  cutEl.classList.add('on'); cutEl.appendChild(cutRenderer.domElement);
  cutText.classList.remove('on'); fadeOverlay.style.opacity='0';

function animateCutscene(dt){
  if(!cutActive) return;
  cutTime += dt;
  heliObj.rotor.rotation.y += dt*25;
  heliObj.tailRotor.rotation.y += dt*30;
  while(cutPhase<CUT_PHASES.length && cutTime>=CUT_PHASES[cutPhase].t){
    const p=CUT_PHASES[cutPhase];
    if(p.text){ cutText.innerText=p.text; cutText.classList.add('on'); if(p.v) speak(p.text,{rate:0.85,pitch:0.6}); }
    else cutText.classList.remove('on');
    cutPhase++;
  }
  if(cutTime<4){
    heli.position.y=12+Math.sin(cutTime*2)*0.4;
    heli.position.z=Math.sin(cutTime*0.5)*6;
    heli.rotation.z=Math.sin(cutTime*1.5)*0.05;
  } else if(cutTime<9){
    const t=(cutTime-4)/5;
    heli.position.y=12-t*12; heli.rotation.z=t*1.2; heli.rotation.x=t*0.7;
    if(t>0.88) heli.position.y=0.5;
    setHeliVolume(0.12+t*0.3);
    if(t>0.85 && cutPhase<CUT_PHASES.length){ soundExplosion(); cutPhase=CUT_PHASES.length; }
  } else {
    setHeliVolume(0);
    if(cutTime>10.5) fadeOverlay.style.opacity=String(Math.min(1,(cutTime-10.5)/1.5));
    if(cutTime>12){ endCutscene(); return; }
  }
  if(cutTime<9){
    cutCamera.position.set(Math.sin(cutTime*0.4)*18, 14+Math.sin(cutTime*0.5)*2, 18);
    cutCamera.lookAt(heli.position.x, heli.position.y, heli.position.z);
  } else {
    cutCamera.position.set(10+Math.sin(cutTime*0.5)*3, 5, 10);
    cutCamera.lookAt(0,1.5,0);
  }
  cutRenderer.render(cutScene, cutCamera);
}

// ========== ЗДАНИЯ С СИЛУЭТАМИ ВО ВСЕХ ТЁМНЫХ ОКНАХ ==========
function createBuilding(cx, cz, w, h, d){
  const floors = Math.max(2, Math.floor(h / 3));
  const g = new THREE.Group();
  g.position.set(cx, 0, cz);
  scene.add(g);

  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({color:0x2a2a30}));
  body.position.y = h/2;
  g.add(body);

  const roof = new THREE.Mesh(new THREE.BoxGeometry(w+0.3, 0.4, d+0.3), new THREE.MeshLambertMaterial({color:0x1a1a20}));
  roof.position.y = h+0.2;
  g.add(roof);

  // ОКНА — все тёмные с силуэтами, часть горит
  const winGeo = new THREE.PlaneGeometry(0.9, 1.2);
  const winMatDark = new THREE.MeshBasicMaterial({color:0x0a1018});
  const winMatLit = new THREE.MeshBasicMaterial({color:0xffcc88});
  const winMatDim = new THREE.MeshBasicMaterial({color:0x3a2a18});
  const silMat = new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0.85});

  const facades = [
    { n:[0,0,1], pos:[0,0,d/2+0.02], count:Math.floor(w/1.8) },
    { n:[0,0,-1], pos:[0,0,-d/2-0.02], count:Math.floor(w/1.8) },
    { n:[1,0,0], pos:[w/2+0.02,0,0], count:Math.floor(d/1.8) },
    { n:[-1,0,0], pos:[-w/2-0.02,0,0], count:Math.floor(d/1.8) }
  ];

  const silhouettes = [];

  facades.forEach(f=>{
    for(let fy=0; fy<floors; fy++){
      for(let fx=0; fx<f.count; fx++){
        const roll = Math.random();
        let mat;
        if(roll < 0.05) mat = winMatLit;
        else if(roll < 0.15) mat = winMatDim;
        else mat = winMatDark;

        const win = new THREE.Mesh(winGeo, mat);
        const y = 1.6 + fy*3;
        const off = (fx - (f.count-1)/2)*1.8;
        if(f.n[2] !== 0){
          win.position.set(off, y, f.pos[2]);
          win.rotation.y = f.n[2]>0 ? 0 : Math.PI;
        } else {
          win.position.set(f.pos[0], y, off);
          win.rotation.y = f.n[0]>0 ? Math.PI/2 : -Math.PI/2;
        }
        g.add(win);

        // СИЛУЭТ ВО ВСЕХ ТЁМНЫХ ОКНАХ
        if(mat === winMatDark){
          const sil = new THREE.Mesh(new THREE.PlaneGeometry(0.45, 1.1), silMat);
          sil.position.copy(win.position);
          sil.rotation.copy(win.rotation);
          sil.position.x += f.n[0]*0.01;
          sil.position.z += f.n[2]*0.01;
          g.add(sil);
          silhouettes.push({ mesh: sil, phase: Math.random()*Math.PI*2, speed: 0.3 + Math.random()*0.5 });
        }
      }
    }
  });

  buildingList.push({ x:cx, z:cz, w, d, h, floors, silhouettes });

  obstacles.push({x:cx, z:cz+d/2, r:w/2});
  obstacles.push({x:cx, z:cz-d/2, r:w/2});
  obstacles.push({x:cx-w/2, z:cz, r:d/2});
  obstacles.push({x:cx+w/2, z:cz, r:d/2});
}

// ========== LOD ИНТЕРЬЕРОВ ==========
const activeInteriors = new Map(); // buildingIdx -> {group, doors}
const MAX_INTERIORS = 3;

function buildInterior(bIdx){
  const b = buildingList[bIdx];
  if(!b) return null;
  const g = new THREE.Group();
  g.position.set(b.x, 0, b.z);

  const wallMat = new THREE.MeshLambertMaterial({color:0x3a3530});
  const floorMat = new THREE.MeshLambertMaterial({color:0x2a2520});
  const doorMat = new THREE.MeshLambertMaterial({color:0x5a3a2a});
  const furnMat = new THREE.MeshLambertMaterial({color:0x4a3a2a});
  const clothMat = new THREE.MeshLambertMaterial({color:0x3a2a2a});

  const W = b.w - 1.2, D = b.d - 1.2;
  const H = b.h - 0.3;
  const floors = b.floors;
  const floorH = b.h / floors;
  const corW = 2.2;
  const corD = D - 1;

  // полы
  for(let f=0; f<floors; f++){
    const y = f * floorH;
    const fl = new THREE.Mesh(new THREE.BoxGeometry(W, 0.15, D), floorMat);
    fl.position.set(0, y+0.075, 0);
    g.add(fl);
  }

  // лестница
  const stepsPerFloor = 8;
  for(let f=0; f<floors-1; f++){
    const y0 = f * floorH;
    for(let s=0; s<stepsPerFloor; s++){
      const stepY = y0 + (s+1)*(floorH/stepsPerFloor);
      const step = new THREE.Mesh(new THREE.BoxGeometry(corW, floorH/stepsPerFloor, 0.5), wallMat);
      const z = s < stepsPerFloor/2 ? corD/2 - 1 - s*0.55 : -corD/2 + 1 + (s-stepsPerFloor/2)*0.55;
      step.position.set(0, stepY, z);
      g.add(step);
    }
  }

  // квартиры: упрощённая мебель, но только 4 объекта на этаж
  for(let f=0; f<floors; f++){
    const y = f * floorH + 0.15;

    // левая: кровать + шкаф
    const bed = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.5, 2), furnMat);
    bed.position.set(-W/2+1.5, y+0.25, -D/2+2);
    g.add(bed);
    const wardrobe = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2, 0.6), furnMat);
    wardrobe.position.set(-W/2+2.5, y+1, -D/2+0.5);
    g.add(wardrobe);

    // правая: диван + тумба
    const sofa = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.5, 0.9), clothMat);
    sofa.position.set(W/2-2, y+0.3, -D/2+1.5);
    g.add(sofa);
    const tvStand = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.5, 0.5), furnMat);
    tvStand.position.set(W/2-2, y+0.25, -D/2+4);
    g.add(tvStand);
  }

  // двери
  const localDoors = [];
  for(let f=0; f<floors; f++){
    const y = f * floorH;
    // левая
    const doorL = new THREE.Group();
    const dl = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2.1, 1.1), doorMat);
    dl.position.set(0, 1.05, 0);
    doorL.add(dl);
    doorL.position.set(-corW/2 - 0.1, y+0.15, 0);
    g.add(doorL);
    const dlData = { buildingIdx: bIdx, x: b.x - corW/2 - 0.1, z: b.z, y: y+0.15, mesh: doorL, open: false, side:'L', floor: f, isOpen: false, angle0: 0 };
    localDoors.push(dlData);

    // правая
    const doorR = new THREE.Group();
    const dr = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2.1, 1.1), doorMat);
    dr.position.set(0, 1.05, 0);
    doorR.add(dr);
    doorR.position.set(corW/2 + 0.1, y+0.15, 0);
    g.add(doorR);
    const drData = { buildingIdx: bIdx, x: b.x + corW/2 + 0.1, z: b.z, y: y+0.15, mesh: doorR, open: false, side:'R', floor: f, isOpen: false, angle0: 0 };
    localDoors.push(drData);
  }

  // коридорные стены
  const corWallL = new THREE.Mesh(new THREE.BoxGeometry(0.15, H, 1), wallMat);
  corWallL.position.set(-corW/2 - 0.2, H/2, 0); g.add(corWallL);
  const corWallR = new THREE.Mesh(new THREE.BoxGeometry(0.15, H, 1), wallMat);
  corWallR.position.set(corW/2 + 0.2, H/2, 0); g.add(corWallR);

  scene.add(g);
  return { group: g, doors: localDoors };
}

function updateInteriorLOD(){
  // расстояния до зданий
  const dists = buildingList.map((b, i) => ({
    i,
    d: Math.sqrt((b.x - player.x)**2 + (b.z - player.z)**2)
  })).sort((a,b) => a.d - b.d);
  const nearest = dists.slice(0, MAX_INTERIORS).filter(x => x.d < 40);

  // удалить дальние
  for(const [idx, obj] of activeInteriors){
    if(!nearest.find(n => n.i === idx)){
      scene.remove(obj.group);
      activeInteriors.delete(idx);
      // удалить двери этого здания из doorData
      for(let k = doorData.length-1; k >= 0; k--){
        if(doorData[k].buildingIdx === idx) doorData.splice(k, 1);
      }
    }
  }

  // добавить ближние
  for(const n of nearest){
    if(!activeInteriors.has(n.i)){
      const obj = buildInterior(n.i);
      if(obj){
        activeInteriors.set(n.i, obj);
        doorData.push(...obj.doors);
      }
    }
  }
}

function spawnZombies(){
  zombies.forEach(z=>scene.remove(z.group));
  zombies.length=0;
  for(let i=0;i<ZOMBIE_COUNT;i++){
    let x, z, ok=false, tries=0;
    while(!ok && tries<100){
      tries++;
      const a = Math.random()*Math.PI*2;
      const r = 25 + Math.random()*(wallR-40);
      x = Math.cos(a)*r; z = Math.sin(a)*r;
      ok = true;
      for(const o of obstacles){
        const dx=x-o.x, dz=z-o.z;
        if(dx*dx+dz*dz < (o.r+2)*(o.r+2)){ ok=false; break; }
      }
      if(Math.abs(x)<10 && Math.abs(z-15)<10) ok=false;
    }
    if(!ok) continue;
    const mesh = createZombieMesh();
    mesh.group.position.set(x,0,z);
    scene.add(mesh.group);
    zombies.push({
      ...mesh, x, z,
      hp: 100, speed: 1.2 + Math.random()*0.8,
      state:'idle', attackCd:0, hitFlash:0,
      dead:false, walkPhase: Math.random()*Math.PI*2,
      groanCd: 2 + Math.random()*8
    });
  }
}

});
leftZone.addEventListener('pointermove', e=>{ if(joyActive && e.pointerId===joyId){ e.preventDefault(); joyMove(e); } });
function joyMove(e){
  const r = joy.getBoundingClientRect();
  const cx = r.left+r.width/2, cy = r.top+r.height/2;
  let dx = e.clientX-cx, dy = e.clientY-cy;
  const max = r.width/2-12;
  const d = Math.sqrt(dx*dx+dy*dy);
  if(d>max){ dx=dx/d*max; dy=dy/d*max; }
  joyBase.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  joyVec.x = dx/max; joyVec.y = dy/max;
}
function joyEnd(e){
  if(e.pointerId!==joyId) return;
  joyActive=false; joyId=null; joyVec.x=0; joyVec.y=0;
  joy.style.left='30px'; joy.style.top='auto'; joy.style.bottom='60px';
  joyBase.style.transform='translate(-50%,-50%)';
}

function collides(x, z, radius){
  for(const o of obstacles){
    const dx=x-o.x, dz=z-o.z;
    const rr = o.r + radius;
    if(dx*dx+dz*dz < rr*rr) return true;
  }
  const d = Math.sqrt(x*x+z*z);
  if(d > wallR-1.5) return true;
  return false;
}

function placeParts(){
  partMeshes.forEach(p=>scene.remove(p));
  partMeshes.length=0; partPositions.length=0;
  for(let i=0;i<PARTS_TOTAL;i++){
    let x, z, ok=false, tries=0;
    while(!ok && tries<150){
      tries++;
      const a = Math.random()*Math.PI*2;
      const r = 25 + Math.random()*(wallR-50);
      x = Math.cos(a)*r; z = Math.sin(a)*r;
      ok = true;
      for(const o of obstacles){
        const dx=x-o.x, dz=z-o.z;
        if(dx*dx+dz*dz < (o.r+3)*(o.r+3)){ ok=false; break; }
      }
      if(Math.abs(x)<10 && Math.abs(z-heliGroundPos.z)<10) ok=false;
    }
    const g = new THREE.Group();
    const box = new THREE.Mesh(new THREE.BoxGeometry(0.8,0.6,0.8), new THREE.MeshLambertMaterial({color:0xb8860b, emissive:0x5a3a00}));

    glow.position.y=0.3; g.add(glow);
    g.position.set(x,0,z);
    scene.add(g);
    partMeshes.push(g);
    partPositions.push({x,z,mesh:g,collected:false,glow});
  }
}

function openDoor(d){
  if(!d || d.isOpen) return;
  d.isOpen = true;
  soundDoorOpen();
  const startAngle = d.mesh.rotation.y;
  const targetAngle = startAngle + Math.PI/2 * (d.side === 'L' ? -1 : 1);
  const startTime = performance.now();
  function anim(){
    const t = Math.min(1, (performance.now()-startTime)/400);
    d.mesh.rotation.y = startAngle + (targetAngle-startAngle)*t;
    if(t<1) requestAnimationFrame(anim);
  }
  anim();
}

function getNearDoor(){
  let closest = null, minD = 2.5;
  for(const d of doorData){
    if(d.isOpen) continue;
    const dx = player.x-d.x, dz = player.z-d.z;
    const dist = Math.sqrt(dx*dx+dz*dz);
    if(dist < minD){ minD = dist; closest = d; }
  }
  return closest;
}

// ========== ЦИКЛ ==========
const clock = new THREE.Clock();
let lodTimer = 0;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if(cutActive){ animateCutscene(dt); return; }

  if(gameActive){
    // движение
    let ix=0, iz=0;
    if(keys['KeyW']||keys['ArrowUp']) iz-=1;
    if(keys['KeyS']||keys['ArrowDown']) iz+=1;
    if(keys['KeyA']||keys['ArrowLeft']) ix-=1;
    if(keys['KeyD']||keys['ArrowRight']) ix+=1;
    ix+=joyVec.x; iz+=joyVec.y;
    const len = Math.sqrt(ix*ix+iz*iz);
    if(len>1){ ix/=len; iz/=len; }

    if(len>0.05 && !player.inHeli){
      const wx = ix*Math.cos(player.yaw) + iz*Math.sin(player.yaw);
      const wz = -ix*Math.sin(player.yaw) + iz*Math.cos(player.yaw);
      const nx = player.x + wx*player.speed*dt;
      const nz = player.z + wz*player.speed*dt;
      if(!collides(nx, player.z, 0.4)) player.x = nx;
      if(!collides(player.x, nz, 0.4)) player.z = nz;
      player.stepTimer -= dt;
      if(player.stepTimer<=0){ player.stepTimer=0.55; soundStep(); }
    }

    if(!player.inHeli){
      camera.position.set(player.x, player.y, player.z);
      const dir = new THREE.Vector3(
        -Math.sin(player.yaw)*Math.cos(player.pitch),
        Math.sin(player.pitch),
        -Math.cos(player.yaw)*Math.cos(player.pitch)
      );
      camera.lookAt(player.x+dir.x, player.y+dir.y, player.z+dir.z);
      flashlightTarget.position.set(player.x+dir.x*30, player.y+dir.y*30, player.z+dir.z*30);
      flashlightTarget.updateMatrixWorld();

      // оружие
      const bobSpeed = len>0.05 ? 8 : 0;
      const bobX = Math.sin(performance.now()*0.001*bobSpeed)*0.012*(len>0.05?1:0);
      const bobY = Math.abs(Math.cos(performance.now()*0.001*bobSpeed))*0.015*(len>0.05?1:0);
      weaponSway.x += (-bobX - weaponSway.x)*0.15;
      weaponSway.y += (-bobY - weaponSway.y)*0.15;
      weaponRecoil.x += (0-weaponRecoil.x)*0.2;
      weaponRecoil.y += (0-weaponRecoil.y)*0.2;
      weaponRecoil.z += (0-weaponRecoil.z)*0.2;

      let reloadOffsetY=0, magOffsetY=0, slideOffsetZ=0;
      if(reloading){
        const t = (performance.now()-reloadStartTime)/1400;
        if(t<0.3) reloadOffsetY = -t/0.3*0.35;
        else if(t<0.5){ const p=(t-0.3)/0.2; reloadOffsetY=-0.35; magOffsetY=-p*0.6; magMesh.rotation.z=p*0.4; }
        else if(t<0.75){ const p=(t-0.5)/0.25; reloadOffsetY=-0.35; magOffsetY=-0.6+p*0.6; magMesh.rotation.z=0.4*(1-p); }
        else if(t<0.9){ const p=(t-0.75)/0.15; reloadOffsetY=-0.35+p*0.35; slideOffsetZ=Math.sin(p*Math.PI)*0.08; }
        else reloadOffsetY=0;
        weaponGroup.rotation.z = Math.sin(t*Math.PI)*0.35;
      } else {
        weaponGroup.rotation.z += (0-weaponGroup.rotation.z)*0.2;
      }

      weaponGroup.position.set(
        weaponBase.x+weaponSway.x+weaponRecoil.x,
        weaponBase.y+weaponSway.y+weaponRecoil.y+reloadOffsetY,
        weaponBase.z+weaponRecoil.z
      );
      weaponGroup.rotation.x = weaponRecoil.z*0.5;

      if(magMesh){ magMesh.position.y = -0.32+magOffsetY; if(!reloading) magMesh.rotation.z=0; }
      if(slideMesh){
        slideMesh.position.z = slideBaseZ + slideOffsetZ;
        if(!reloading && weaponRecoil.z<0.01) slideMesh.position.z = slideBaseZ;
        if(weaponRecoil.z>0.05) slideMesh.position.z = slideBaseZ+0.04;
      }

      player.shootCooldown -= dt;
      if(firing && player.shootCooldown<=0 && !reloading){
        if(player.ammo>0){
          player.ammo--; player.shootCooldown=0.22;
          updateAmmoUI(); soundShot(); muzzleFlashShow();
          weaponRecoil.z=0.08; weaponRecoil.y=0.04;
          player.pitch += 0.015;
          // попадание по зомби
          const origin = new THREE.Vector3(player.x, player.y, player.z);
          for(const z of zombies){
            if(z.dead) continue;
            const dx = z.x - player.x, dz = z.z - player.z;
            const dist = Math.sqrt(dx*dx+dz*dz);
            if(dist > 30) continue;
            // проверка направления
            const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
            const toZ = new THREE.Vector3(dx, 0, dz).normalize();
            const dot = forward.dot(toZ);
            if(dot > 0.9){ // в конусе прицела
              z.hp -= 50; z.hitFlash = 0.1; z.state='chase';
              if(z.hp <= 0){ z.dead = true; scene.remove(z.group); }
              break;
            }
          }
          if(player.ammo===0) startReload();
        } else { player.shootCooldown=0.3; startReload(); }
      }
    }

    // зомби
    for(const z of zombies){
      if(z.dead) continue;
      const dx = player.x-z.x, dz = player.z-z.z;
      const dist = Math.sqrt(dx*dx+dz*dz);
      if(dist < 12 && z.state==='idle') z.state='chase';

      z.groanCd -= dt;
      if(z.groanCd <= 0 && dist < 20){ z.groanCd = 5 + Math.random()*10; soundZombieGroan(); }

      if(z.state==='chase'){
        if(dist > 1.3){
          const nx = z.x + (dx/dist)*z.speed*dt;
          const nz = z.z + (dz/dist)*z.speed*dt;
          if(!collides(nx, z.z, 0.35)) z.x = nx;
          if(!collides(z.x, nz, 0.35)) z.z = nz;
          z.group.rotation.y = Math.atan2(dx, dz);
        } else {
          z.attackCd -= dt;
          if(z.attackCd <= 0){
            z.attackCd = 1.2;
            player.hp -= 8;
            hitDamageFlash(); updateHpUI();
            if(player.hp <= 0){
              gameActive = false;
              resultTitle.innerText='ТЫ МЁРТВ';
              resultTitle.className='lose';
              resultText.innerText='Тебя сожрали. Деталей: ' + player.partsCollected + '/5';
              resultEl.classList.add('on');
              return;
            }
          }
        }
      }

      z.group.position.set(z.x, Math.abs(Math.sin(z.walkPhase))*0.05, z.z);
      z.walkPhase += dt*4;
      z.armL.rotation.x = Math.sin(z.walkPhase)*0.3;
      z.armR.rotation.x = -Math.sin(z.walkPhase)*0.3;

      if(z.hitFlash > 0){
        z.hitFlash -= dt;
        z.group.traverse(c=>{ if(c.material && c.material.color && c.material.userData.orig===undefined) c.material.userData.orig=c.material.color.getHex(); });
        z.group.traverse(c=>{ if(c.material && c.material.color) c.material.color.setHex(0xffffff); });
        if(z.hitFlash <= 0){
          z.group.traverse(c=>{ if(c.material && c.material.color && c.material.userData.orig!==undefined) c.material.color.setHex(c.material.userData.orig); });
        }
      }
    }

    // подбор деталей
    for(const p of partPositions){
      if(p.collected) continue;
      p.mesh.rotation.y += dt*2;
      p.glow.material.opacity = 0.25 + Math.sin(performance.now()*0.003)*0.15;
      const dx = player.x-p.x, dz = player.z-p.z;
      if(dx*dx+dz*dz < 1.5*1.5){
        p.collected=true; scene.remove(p.mesh);
        player.partsCollected++; updatePartsUI(); soundPickup();
        if(player.partsCollected >= PARTS_TOTAL){
          showHint('Все детали собраны!', 4000);
          showVoice('Все пять деталей. Пора к вертолёту.', 3000);
        } else {
          showHint('Деталь ' + player.partsCollected + '/5', 1500);
          if(player.partsCollected === 1) showVoice('Первая деталь.', 2000);
        }
      }
    }

    // кнопки действия
    if(!repairing){
      const doorNear = getNearDoor();
      if(doorNear){
        actionBtn.classList.add('on');
        actionBtn.innerText = '🚪 ОТКРЫТЬ ДВЕРЬ';
        actionBtn.dataset.door = doorData.indexOf(doorNear);
      } else {
        delete actionBtn.dataset.door;
        const hdx = player.x-heliGroundPos.x, hdz = player.z-heliGroundPos.z;
        const hdist = Math.sqrt(hdx*hdx+hdz*hdz);
        if(hdist<5 && player.partsCollected >= PARTS_TOTAL && !player.repaired){
          actionBtn.classList.add('on');
          actionBtn.innerText = '🔧 ПОЧИНИТЬ';
        } else if(hdist<5 && player.repaired && !player.inHeli){
          actionBtn.classList.add('on');
          actionBtn.innerText = '🚁 СЕСТЬ';
        } else {
          actionBtn.classList.remove('on');
        }
      }
    }

    // LOD интерьеров — раз в 0.5 сек
    lodTimer -= dt;
    if(lodTimer <= 0){ lodTimer = 0.5; updateInteriorLOD(); }

    // ремонт
    if(repairing){
      const elapsed = (performance.now()-repairStart)/1000;
      const left = Math.max(0, REPAIR_TIME-elapsed);
      repairFill.style.width = ((REPAIR_TIME-left)/REPAIR_TIME*100)+'%';
      repairTimer.innerText = Math.ceil(left);
      if(performance.now()-lastRepairTick>400){ lastRepairTick=performance.now(); soundRepairTick(); }
      if(left<=0){
        repairing=false; player.repaired=true;
        repairBar.classList.remove('on');
        showHint('Вертолёт починен!', 4000);
        showVoice('Готово. Вертолёт на ходу.', 3000);
        soundPickup();
      }
    }

    // случайные звуки
    ambientTimer -= dt;
    if(ambientTimer <= 0){ ambientTimer = 8 + Math.random()*15; randomCreak(); }

    // силуэты в окнах — обновление раз в 0.2 сек (не каждый кадр)
    if(!animate._silTimer) animate._silTimer = 0;
    animate._silTimer += dt;
    if(animate._silTimer > 0.2){
      animate._silTimer = 0;
      const t = performance.now()*0.001;
      for(const b of buildingList){
        for(const s of b.silhouettes){
          s.mesh.material.opacity = 0.3 + 0.55*Math.abs(Math.sin(t*s.speed + s.phase));
        }
      }
    }

    if(hintTimer>0){ hintTimer-=dt; if(hintTimer<=0) hintMsg.classList.remove('on'); }
    if(voiceTimer>0){ voiceTimer-=dt; if(voiceTimer<=0) voiceText.classList.remove('on'); }
  }

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
  cutCamera.aspect = innerWidth/innerHeight; cutCamera.updateProjectionMatrix(); cutRenderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
