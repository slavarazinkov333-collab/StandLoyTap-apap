<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>StandCraft Bot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 50% 30%, #1a1a2e, #0a0a0f);
            color: white;
            font-family: -apple-system, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .top-bar {
            background: linear-gradient(180deg, #1a1a2e, #0f0f1a);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0c419;
            box-shadow: 0 4px 20px rgba(240, 196, 25, 0.15);
        }
        .account { display: flex; align-items: center; gap: 10px; }
        .avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: linear-gradient(135deg, #f0c419, #e6a800);
            display: flex; justify-content: center; align-items: center;
            font-size: 18px; border: 2px solid #fff3b0;
        }
        .nickname { font-size: 13px; font-weight: bold; }
        .balance-item { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: bold; }
        .coins { color: #f0c419; }
        .gold { color: #ffd700; }

        /* ЦЕНТР — СПИН */
        .center {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
            padding: 20px;
        }
        .spin-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .spin-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #2a2a4e, #0f0f1a);
            border: 5px solid #f0c419;
            box-shadow: 0 0 60px rgba(240, 196, 25, 0.5), inset 0 0 40px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.3s;
        }
        .spin-circle:active { transform: scale(0.95); }
        .spin-circle .icon { font-size: 60px; margin-bottom: 5px; }
        .spin-circle .text { font-size: 16px; font-weight: bold; color: #f0c419; letter-spacing: 1px; }

        .arrow {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 50px;
            color: #ffcc00;
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.9);
            z-index: 10;
        }

        /* КНОПКА УЛУЧШИТЬ */
        .upgrade-btn {
            margin-top: 30px;
            background: linear-gradient(135deg, #f0c419, #e6a800);
            color: #1a1a2e;
            border: none;
            padding: 14px 50px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(240, 196, 25, 0.4);
            transition: all 0.2s;
        }
        .upgrade-btn:active { transform: scale(0.95); }

        /* НИЖНЯЯ ПАНЕЛЬ */
        .bottom-bar {
            background: linear-gradient(0deg, #1a1a2e, #0f0f1a);
            padding: 12px 8px;
            display: flex;
            justify-content: space-around;
            border-top: 2px solid #f0c419;
            box-shadow: 0 -4px 20px rgba(240, 196, 25, 0.15);
        }
        .nav-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            transition: all 0.2s;
            border-radius: 12px;
        }
        .nav-btn .icon { font-size: 24px; }
        .nav-btn:active { background: rgba(240, 196, 25, 0.15); color: #f0c419; transform: scale(0.95); }

        /* ЭКРАНЫ */
        .screen {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0a0a0f;
            z-index: 50;
            flex-direction: column;
        }
        .screen.open { display: flex; }
        .screen-header {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0c419;
            background: #1a1a2e;
        }
        .screen-header h2 { color: #f0c419; font-size: 18px; }
        .close-btn { background: none; border: none; color: #f0c419; font-size: 24px; cursor: pointer; }
        .screen-body { flex: 1; overflow-y: auto; padding: 16px; }

        /* ПРЕДМЕТЫ */
        .item {
            background: #1a1a2e;
            border: 1px solid #2a2a4e;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .item:active { border-color: #f0c419; transform: scale(0.98); }
        .item-info { display: flex; align-items: center; gap: 12px; }
        .item-icon { font-size: 28px; }
        .item-name { font-size: 14px; font-weight: bold; }
        .item-price { font-size: 12px; color: #f0c419; }
        .buy-btn {
            background: linear-gradient(135deg, #f0c419, #e6a800);
            color: #1a1a2e;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }
        .buy-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

        /* ПРОЦЕНТЫ */
        .percent-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        .percent-btn {
            background: #1a1a2e;
            border: 2px solid #2a2a4e;
            border-radius: 12px;
            padding: 16px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .percent-btn:active { border-color: #f0c419; background: rgba(240, 196, 25, 0.1); }
        .percent-btn.selected { border-color: #f0c419; background: rgba(240, 196, 25, 0.2); }

        /* РЕЗУЛЬТАТ */
        .result {
            text-align: center;
            padding: 30px;
        }
        .result .big-icon { font-size: 80px; margin-bottom: 20px; }
        .result .title { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .result .subtitle { font-size: 14px; color: #aaa; }
        .result.win .title { color: #4CAF50; }
        .result.lose .title { color: #ff4444; }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <div class="top-bar">
        <div class="account">
            <div class="avatar">👤</div>
            <div class="nickname">Игрок</div>
        </div>
        <div style="display:flex; gap:12px;">
            <div class="balance-item coins"><span>💰</span><span id="coins">100</span></div>
            <div class="balance-item gold"><span>⭐</span><span id="gold">0</span></div>
        </div>
    </div>

    <!-- ЦЕНТР — СПИН -->
    <div class="center">
        <div class="spin-wrapper">
            <div class="arrow">▼</div>
            <div class="spin-circle" id="spinCircle" onclick="spinWheel()">
                <span class="icon">🎰</span>
                <span class="text">КРУТИТЬ</span>
            </div>
        </div>
        <button class="upgrade-btn" onclick="openScreen('upgradeScreen')">⬆️ УЛУЧШИТЬ</button>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ -->
    <div class="bottom-bar">
        <button class="nav-btn" onclick="openScreen('inventoryScreen')">
            <span class="icon">🎒</span><span>Инвентарь</span>
        </button>
        <button class="nav-btn" onclick="openScreen('shopScreen')">
            <span class="icon">🛒</span><span>Магазин</span>
        </button>
        <button class="nav-btn" onclick="openScreen('upgradeScreen')">
            <span class="icon">⬆️</span><span>Прокачать</span>
        </button>
    </div>

    <!-- ЭКРАН: МАГАЗИН -->
    <div class="screen" id="shopScreen">
        <div class="screen-header">
            <h2>🛒 Магазин</h2>
            <button class="close-btn" onclick="closeScreen('shopScreen')">✕</button>
        </div>
        <div class="screen-body" id="shopBody"></div>
    </div>

    <!-- ЭКРАН: ИНВЕНТАРЬ -->
    <div class="screen" id="inventoryScreen">
        <div class="screen-header">
            <h2>🎒 Инвентарь</h2>
            <button class="close-btn" onclick="closeScreen('inventoryScreen')">✕</button>
        </div>
        <div class="screen-body" id="inventoryBody"></div>
    </div>

    <!-- ЭКРАН: ВЫБОР ПРОЦЕНТА -->
    <div class="screen" id="percentScreen">
        <div class="screen-header">
            <h2>🎯 Выбери процент</h2>
            <button class="close-btn" onclick="closeScreen('percentScreen')">✕</button>
        </div>
        <div class="screen-body">
            <div id="percentTitle" style="text-align:center; margin-bottom:15px; color:#f0c419; font-size:16px;"></div>
            <div class="percent-list" id="percentList"></div>
            <button class="upgrade-btn" style="width:100%; margin-top:20px;" onclick="confirmPercent()">✅ ПОДТВЕРДИТЬ</button>
        </div>
    </div>

    <!-- ЭКРАН: РЕЗУЛЬТАТ -->
    <div class="screen" id="resultScreen">
        <div class="screen-header">
            <h2>Результат</h2>
            <button class="close-btn" onclick="closeScreen('resultScreen')">✕</button>
        </div>
        <div class="screen-body">
            <div class="result" id="resultContent"></div>
        </div>
    </div>

    <script>
        let coins = 100;
        let gold = 0;
        let isSpinning = false;
        let inventory = [];
        let selectedItem = null;
        let selectedPercent = null;

        const shopItems = [
            { id: 'akr', name: 'AKR «Дракон»', icon: '🔫', price: 500 },
            { id: 'm4', name: 'M4A1 «Ворон»', icon: '🔫', price: 400 },
            { id: 'awm', name: 'AWM «Хищник»', icon: '🎯', price: 800 },
            { id: 'knife', name: 'Нож «Тень»', icon: '🔪', price: 1000 },
        ];

        const percents = [90, 67, 55, 44, 33, 22];

        function updateBalance() {
            document.getElementById('coins').innerText = coins;
            document.getElementById('gold').innerText = gold;
        }

        function openScreen(id) {
            if (id === 'shopScreen') renderShop();
            if (id === 'inventoryScreen') renderInventory();
            document.getElementById(id).classList.add('open');
        }

        function closeScreen(id) {
            document.getElementById(id).classList.remove('open');
        }

        function renderShop() {
            const body = document.getElementById('shopBody');
            body.innerHTML = '';
            shopItems.forEach(item => {
                const canBuy = coins >= item.price;
                body.innerHTML += `
                    <div class="item" onclick="buyItem('${item.id}')">
                        <div class="item-info">
                            <span class="item-icon">${item.icon}</span>
                            <div>
                                <div class="item-name">${item.name}</div>
                                <div class="item-price">${item.price} монет</div>
                            </div>
                        </div>
                        <button class="buy-btn" ${canBuy ? '' : 'disabled'}>${canBuy ? 'Купить' : 'Мало'}</button>
                    </div>
                `;
            });
        }

        function buyItem(id) {
            const item = shopItems.find(i => i.id === id);
            if (!item || coins < item.price) return;
            coins -= item.price;
            inventory.push(item);
            updateBalance();
            renderShop();
            alert(`✅ Куплено: ${item.name}`);
        }

        function renderInventory() {
            const body = document.getElementById('inventoryBody');
            if (inventory.length === 0) {
                body.innerHTML = '<p style="color:#888;text-align:center;">Инвентарь пуст.</p>';
            } else {
                body.innerHTML = inventory.map((item, index) => `
                    <div class="item" onclick="selectItem(${index})">
                        <div class="item-info">
                            <span class="item-icon">${item.icon}</span>
                            <div>
                                <div class="item-name">${item.name}</div>
                                <div class="item-price">Нажми, чтобы улучшить</div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        }

        function selectItem(index) {
            selectedItem = inventory[index];
            closeScreen('inventoryScreen');
            openPercentScreen();
        }

        function openPercentScreen() {
            document.getElementById('percentTitle').innerText = `Улучшаем: ${selectedItem.name}`;
            const list = document.getElementById('percentList');
            list.innerHTML = '';
            percents.forEach(p => {
                list.innerHTML += `<button class="percent-btn" onclick="selectPercent(${p})">${p}%</button>`;
            });
            openScreen('percentScreen');
        }

        function selectPercent(p) {
            selectedPercent = p;
            document.querySelectorAll('.percent-btn').forEach(btn => {
                btn.classList.remove('selected');
                if (btn.innerText === p + '%') btn.classList.add('selected');
            });
        }

        function confirmPercent() {
            if (!selectedPercent) {
                alert('Выбери процент!');
                return;
            }
            closeScreen('percentScreen');
            spinWheel();
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;

            const circle = document.getElementById('spinCircle');
            const randomDegree = Math.floor(Math.random() * 360) + 3600;
            circle.style.transition = 'transform 20s cubic-bezier(0.1, 0.7, 0.1, 1)';
            circle.style.transform = `rotate(${randomDegree}deg)`;

            setTimeout(() => {
                const chance = selectedPercent;
                const roll = Math.floor(Math.random() * 100) + 1;
                const win = roll <= chance;

                if (win) {
                    coins += 200;
                    gold += 10;
                    updateBalance();
                    showResult(true, `Ты улучшил ${selectedItem.name}!`, `+200 монет, +10 голды`);
                } else {
                    showResult(false, `Неудача!`, `Ты потерял ${selectedItem.name}`);
                    inventory = inventory.filter(i => i !== selectedItem);
                }

                isSpinning = false;
                selectedPercent = null;
                selectedItem = null;
            }, 20000);
        }

        function showResult(win, title, subtitle) {
            const content = document.getElementById('resultContent');
            content.className = 'result ' + (win ? 'win' : 'lose');
            content.innerHTML = `
                <div class="big-icon">${win ? '🎉' : '😢'}</div>
                <div class="title">${title}</div>
                <div class="subtitle">${subtitle}</div>
            `;
            openScreen('resultScreen');
        }

        updateBalance();
    </script>

</body>
    </html>
