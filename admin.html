<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ADMIN PANEL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--red:#e50914;--red2:#8b0000;--dark:#0a0a0a;--dark2:#121214;--dark3:#1a1a1f;--dark4:#222228;--gray:#666;--gray2:#999;--green:#4CAF50;--blue:#4a9eff;--yellow:#ffd700;--orange:#FFA500;--gold:#ffb800}
body{background:var(--dark);color:#fff;min-height:100vh;overflow-x:hidden;padding-bottom:40px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,rgba(229,9,20,.08),transparent 40%),radial-gradient(circle at 80% 80%,rgba(139,0,0,.06),transparent 40%);pointer-events:none;z-index:0}
#lockScreen{position:fixed;inset:0;background:var(--dark);z-index:9999;display:flex;justify-content:center;align-items:center;padding:20px}
.lock-inner{text-align:center;max-width:340px}
.lock-icon{font-size:80px;margin-bottom:16px;filter:drop-shadow(0 0 20px rgba(229,9,20,.6))}
.lock-title{font-size:24px;font-weight:900;color:#fff;margin-bottom:8px}
.lock-sub{font-size:13px;color:var(--gray2);margin-bottom:20px}
.lock-id{background:var(--dark2);border:1.5px solid var(--red);border-radius:12px;padding:14px;font-size:13px;color:var(--red);font-weight:900;font-family:monospace}
.top{position:sticky;top:0;z-index:100;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,10,.98);backdrop-filter:blur(20px);border-bottom:1px solid rgba(229,9,20,.2)}
.top-left{display:flex;align-items:center;gap:10px}
.admin-logo{width:36px;height:36px;background:linear-gradient(135deg,var(--red),var(--red2));border-radius:10px;display:flex;justify-content:center;align-items:center;font-size:18px;box-shadow:0 0 15px rgba(229,9,20,.5)}
.admin-title{font-size:14px;font-weight:900;color:#fff;letter-spacing:1px}
.admin-title span{color:var(--red)}
.refresh-btn{background:var(--dark3);border:1.5px solid rgba(229,9,20,.3);color:var(--red);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:18px;display:flex;justify-content:center;align-items:center;font-weight:900}
.tabs{display:flex;gap:4px;padding:10px 12px;background:var(--dark2);overflow-x:auto;scrollbar-width:none;border-bottom:1px solid rgba(229,9,20,.1)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;background:var(--dark3);border:1.5px solid var(--dark4);border-radius:10px;padding:10px 14px;color:var(--gray);font-size:11px;font-weight:900;cursor:pointer;letter-spacing:.5px;transition:all .2s}
.tab.active{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border-color:var(--red);box-shadow:0 0 15px rgba(229,9,20,.4)}
.content{padding:12px 16px;position:relative;z-index:1}
.panel{display:none}
.panel.active{display:block}
.search-box{background:var(--dark3);border:1px solid rgba(229,9,20,.15);border-radius:12px;padding:12px 16px;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.search-box input{background:none;border:none;color:#fff;flex:1;font-size:13px;font-weight:600;outline:none}
.search-box input::placeholder{color:var(--gray)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:linear-gradient(165deg,rgba(30,30,35,.95),rgba(15,15,18,.95));border:1.5px solid rgba(229,9,20,.15);border-radius:16px;padding:14px;position:relative;overflow:hidden}
.stat-label{font-size:10px;color:var(--gray2);font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}
.stat-val{font-size:24px;font-weight:900;color:#fff;position:relative;line-height:1.1}
.stat-val.g{color:var(--green)}.stat-val.r{color:var(--red)}.stat-val.y{color:var(--yellow)}.stat-val.b{color:var(--blue)}.stat-val.o{color:var(--orange)}
.player-card{background:linear-gradient(165deg,rgba(30,30,35,.95),rgba(15,15,18,.95));border:1.5px solid rgba(229,9,20,.15);border-radius:16px;padding:14px;margin-bottom:10px;position:relative}
.player-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.player-id{font-size:12px;font-weight:900;color:#fff;font-family:monospace;word-break:break-all;line-height:1.3}
.player-date{font-size:10px;color:var(--gray);font-weight:700;margin-top:4px}
.player-bal{background:linear-gradient(135deg,rgba(229,9,20,.15),rgba(139,0,0,.08));border:1px solid rgba(229,9,20,.3);border-radius:10px;padding:6px 12px;font-size:14px;font-weight:900;color:var(--yellow);white-space:nowrap;flex-shrink:0}
.player-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:10px;font-weight:800;color:var(--gray2)}
.player-stats span{background:var(--dark3);padding:4px 8px;border-radius:6px}
.player-stats span b{color:#fff}
.player-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.p-btn{padding:10px 6px;border-radius:10px;font-size:11px;font-weight:900;cursor:pointer;border:none;letter-spacing:.5px}
.p-btn.give{background:linear-gradient(135deg,var(--green),#2e7d32);color:#fff}
.p-btn.take{background:linear-gradient(135deg,var(--orange),#cc8400);color:#fff}
.p-btn.skin{background:linear-gradient(135deg,var(--blue),#2e6db8);color:#fff}
.p-btn.ban{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff}
.p-btn.unban{background:linear-gradient(135deg,#333,#111);color:#fff}
.empty{text-align:center;padding:60px 20px;color:var(--gray)}
.empty-icon{font-size:60px;margin-bottom:16px;opacity:.5}
.empty-title{font-size:16px;font-weight:900;color:#fff;margin-bottom:6px}
.empty-sub{font-size:13px;color:var(--gray)}
.promo-card{background:linear-gradient(165deg,rgba(30,30,35,.95),rgba(15,15,18,.95));border:1.5px solid rgba(76,175,80,.25);border-radius:16px;padding:14px;margin-bottom:10px;position:relative}
.promo-code{font-size:20px;font-weight:900;color:var(--green);font-family:monospace;letter-spacing:2px;margin-bottom:6px}
.promo-info{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--gray2);font-weight:700}
.promo-info b{color:#fff}
.promo-del{position:absolute;top:12px;right:12px;background:rgba(229,9,20,.15);border:1px solid var(--red);color:var(--red);width:30px;height:30px;border-radius:8px;cursor:pointer;font-weight:900;font-size:14px}
.log-card{background:linear-gradient(165deg,rgba(30,30,35,.95),rgba(15,15,18,.95));border-left:3px solid var(--red);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:11px}
.log-top{display:flex;justify-content:space-between;margin-bottom:4px}
.log-action{font-weight:900;color:var(--red);text-transform:uppercase;letter-spacing:1px}
.log-time{color:var(--gray);font-size:10px}
.log-details{color:var(--gray2);font-weight:700;font-family:monospace;font-size:10px;word-break:break-all}
.section-title{font-size:14px;font-weight:900;color:#fff;letter-spacing:1px;margin:16px 0 10px;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:4px;height:16px;background:linear-gradient(135deg,var(--red),var(--red2));border-radius:2px}
.form-group{margin-bottom:12px}
.form-label{font-size:11px;color:var(--gray2);font-weight:800;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
.form-input{width:100%;background:var(--dark3);border:1.5px solid var(--dark4);color:#fff;padding:12px 14px;border-radius:10px;font-size:13px;font-weight:700;outline:none}
.form-input:focus{border-color:var(--red)}
.form-btn{width:100%;padding:14px;border-radius:12px;font-weight:900;font-size:13px;cursor:pointer;border:none;letter-spacing:1px;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;box-shadow:0 0 20px rgba(229,9,20,.4);margin-bottom:16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);z-index:5000;display:flex;justify-content:center;align-items:center;padding:20px}
.modal-inner{background:linear-gradient(165deg,#16161a,#0a0a0d);border:1.5px solid rgba(229,9,20,.3);border-radius:22px;padding:22px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.8);max-height:90vh;overflow-y:auto}
.modal-title{font-size:18px;font-weight:900;color:#fff;margin-bottom:6px;text-align:center}
.modal-sub{font-size:12px;color:var(--gray2);margin-bottom:18px;text-align:center;font-weight:700}
.modal-info{background:var(--dark3);border-radius:12px;padding:12px;margin-bottom:14px;font-size:12px;color:var(--gray2);font-weight:700;text-align:center;border-left:3px solid var(--red)}
.modal-info b{color:var(--yellow);font-size:14px;font-weight:900}
.modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.modal-btn{padding:14px;border-radius:12px;font-weight:900;font-size:13px;cursor:pointer;border:none;letter-spacing:1px}
.modal-btn.primary{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff}
.modal-btn.secondary{background:var(--dark3);color:var(--gray2)}
.modal-btn.green{background:linear-gradient(135deg,var(--green),#2e7d32);color:#fff}
.skins-grid{max-height:340px;overflow-y:auto;padding-right:4px;margin-bottom:12px}
.skin-item{display:flex;align-items:center;gap:10px;background:var(--dark3);border:1.5px solid var(--dark4);border-radius:12px;padding:8px;margin-bottom:6px;cursor:pointer}
.skin-item.sel{border-color:var(--red);background:rgba(229,9,20,.08)}
.skin-item img{width:50px;height:50px;object-fit:contain;background:var(--dark);border-radius:8px;padding:4px;flex-shrink:0}
.skin-info{flex:1;min-width:0}
.skin-name{font-size:12px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skin-price{font-size:11px;font-weight:900;color:var(--yellow);margin-top:2px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:rgba(10,10,10,.98);border:2px solid var(--red);border-radius:14px;padding:14px 24px;color:#fff;font-size:13px;font-weight:800;z-index:9999;transition:transform .3s ease;text-align:center;max-width:90%}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.win{border-color:var(--green);color:var(--green)}
.toast.lose{border-color:var(--red);color:var(--red)}
.loading{text-align:center;padding:40px;color:var(--gray2);font-weight:800}
.spinner{width:40px;height:40px;border:3px solid rgba(229,9,20,.2);border-top-color:var(--red);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.filter-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filter-btn{padding:8px 14px;background:var(--dark3);border:1.5px solid var(--dark4);border-radius:10px;color:var(--gray2);font-size:11px;font-weight:900;cursor:pointer}
.filter-btn.active{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border-color:transparent}
.wd-card{background:linear-gradient(165deg,rgba(30,30,35,.95),rgba(15,15,18,.95));border:1.5px solid rgba(229,9,20,.2);border-radius:18px;padding:14px;margin-bottom:12px;position:relative}
.wd-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.06)}
.wd-ava{width:48px;height:48px;border-radius:50%;border:2px solid var(--red);background:var(--dark3);flex-shrink:0;overflow:hidden;display:flex;justify-content:center;align-items:center;font-size:22px}
.wd-ava img{width:100%;height:100%;object-fit:cover}
.wd-name-block{flex:1;min-width:0}
.wd-name{font-size:14px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wd-id{font-size:10px;color:var(--gray2);font-family:monospace;font-weight:800;margin-top:2px}
.wd-status{padding:5px 12px;border-radius:8px;font-size:10px;font-weight:900;letter-spacing:1px}
.wd-status.pending{background:rgba(255,165,0,.15);color:var(--orange);border:1px solid rgba(255,165,0,.4)}
.wd-status.done{background:rgba(76,175,80,.15);color:var(--green);border:1px solid rgba(76,175,80,.4)}
.wd-status.rejected{background:rgba(229,9,20,.15);color:var(--red);border:1px solid rgba(229,9,20,.4)}
.wd-skin-block{display:flex;align-items:center;gap:12px;background:var(--dark3);border-radius:12px;padding:12px;margin-bottom:12px}
.wd-skin-img{width:80px;height:80px;object-fit:contain;background:var(--dark);border-radius:10px;padding:6px;flex-shrink:0;border:1px solid rgba(229,9,20,.3)}
.wd-skin-info{flex:1;min-width:0}
.wd-skin-name{font-size:14px;font-weight:900;color:#fff;margin-bottom:6px;line-height:1.2}
.wd-skin-price{font-size:13px;font-weight:900;color:var(--red)}
.wd-skin-list{font-size:12px;font-weight:900;color:var(--yellow);margin-top:3px}
.wd-pattern{font-size:11px;color:var(--gray2);font-weight:800;margin-top:6px}
.wd-pattern b{color:#fff}
.wd-time{font-size:10px;color:#555;font-weight:700;margin-bottom:12px}
.wd-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wd-btn{padding:14px;border-radius:12px;font-size:13px;font-weight:900;cursor:pointer;border:none;letter-spacing:1px}
.wd-btn.accept{background:linear-gradient(135deg,var(--green),#2e7d32);color:#fff;box-shadow:0 0 15px rgba(76,175,80,.4)}
.wd-btn.reject{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;box-shadow:0 0 15px rgba(229,9,20,.4)}
.wd-btn:disabled{opacity:.5;cursor:not-allowed}
.player-bal,.stat-val.y,.wd-skin-price,.wd-skin-list,.promo-info b{color:transparent !important;background:linear-gradient(135deg,#ffd700 0%,#4a9eff 60%,#1e5cb8 100%) !important;-webkit-background-clip:text !important;background-clip:text !important;-webkit-text-fill-color:transparent !important;font-weight:900 !important;filter:drop-shadow(0 0 8px rgba(74,158,255,.7)) drop-shadow(0 0 15px rgba(255,215,0,.5))}
.spin-ctrl-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.spin-ctrl-btn{padding:10px 6px;border-radius:10px;font-size:10px;font-weight:900;cursor:pointer;border:1.5px solid rgba(255,255,255,.1);background:rgba(0,0,0,.4);color:var(--gray2);letter-spacing:.5px;transition:all .2s}
.spin-ctrl-btn.win{border-color:rgba(76,175,80,.4);color:#4CAF50}
.spin-ctrl-btn.win.active{background:linear-gradient(135deg,#4CAF50,#2e7d32);color:#fff;box-shadow:0 0 15px rgba(76,175,80,.6)}
.spin-ctrl-btn.lose{border-color:rgba(229,9,20,.4);color:#e50914}
.spin-ctrl-btn.lose.active{background:linear-gradient(135deg,#e50914,#8b0000);color:#fff;box-shadow:0 0 15px rgba(229,9,20,.6)}
.spin-ctrl-btn.off{border-color:rgba(255,255,255,.15);color:var(--gray2)}
.spin-ctrl-btn.off.active{background:linear-gradient(135deg,#333,#111);color:#fff}
</style></head><body>
<div id="lockScreen"><div class="lock-inner"><div class="lock-icon">🔒</div><div class="lock-title">ДОСТУП ЗАПРЕЩЁН</div><div class="lock-sub">Эта страница доступна только администратору.<br>Открой через Telegram.</div><div class="lock-id">ID: <span id="lockId">—</span></div></div></div>

<div class="top">
<div class="top-left"><div class="admin-logo">🔐</div><div class="admin-title">ADMIN <span>PANEL</span></div></div>
<button class="refresh-btn" onclick="refreshAll()">🔄</button>
</div>

<div class="tabs">
<button class="tab active" data-tab="players" onclick="switchTab('players')">👥 Игроки</button>
<button class="tab" data-tab="withdraws" onclick="switchTab('withdraws')">📤 Заявки</button>
<button class="tab" data-tab="promos" onclick="switchTab('promos')">🎟 Промокоды</button>
<button class="tab" data-tab="stats" onclick="switchTab('stats')">📈 Статистика</button>
<button class="tab" data-tab="bans" onclick="switchTab('bans')">🚫 Баны</button>
<button class="tab" data-tab="logs" onclick="switchTab('logs')">📜 Логи</button>
</div>

<div class="content">
<div class="panel active" id="panel-players">
<div class="search-box"><span>🔍</span><input type="text" id="searchPlayers" placeholder="Поиск по ID..." oninput="renderPlayers()"></div>
<div id="playersList"><div class="loading"><div class="spinner"></div>Загрузка...</div></div>
</div>

<div class="panel" id="panel-withdraws">
<div class="filter-row">
<button class="filter-btn active" id="wFilterAll" onclick="setWFilter('all')">Все</button>
<button class="filter-btn" id="wFilterPending" onclick="setWFilter('pending')">⏳ Ожидание</button>
<button class="filter-btn" id="wFilterDone" onclick="setWFilter('done')">✅ Одобрено</button>
<button class="filter-btn" id="wFilterRejected" onclick="setWFilter('rejected')">❌ Отклонено</button>
</div>
<div id="withdrawsList"><div class="loading"><div class="spinner"></div>Загрузка...</div></div>
</div>

<div class="panel" id="panel-promos">
<div class="section-title">Создать промокод</div>
<div class="form-group"><div class="form-label">Код (латиница)</div><input class="form-input" id="promoCode" placeholder="например: WELCOME" maxlength="20"></div>
<div class="form-group"><div class="form-label">Награда (G)</div><input class="form-input" id="promoAmount" type="number" placeholder="500"></div>
<div class="form-group"><div class="form-label">Макс. использований (0 = ∞)</div><input class="form-input" id="promoMax" type="number" placeholder="0" value="0"></div>
<button class="form-btn" onclick="createPromo()">➕ СОЗДАТЬ ПРОМОКОД</button>
<div class="section-title">Активные промокоды</div>
<div id="promosList"><div class="loading"><div class="spinner"></div>Загрузка...</div></div>
</div>

<div class="panel" id="panel-stats"><div id="statsContent"><div class="loading"><div class="spinner"></div>Загрузка...</div></div></div>

<div class="panel" id="panel-bans"><div id="bansList"><div class="loading"><div class="spinner"></div>Загрузка...</div></div></div>

<div class="panel" id="panel-logs"><div id="logsList"><div class="loading"><div class="spinner"></div>Загрузка...</div></div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const BOT_URL='https://admin-bot-03ly.onrender.com';
const ADMIN_ID='8683946808';
const CDN_BASE='https://raw.githubusercontent.com/slavarazinkov333-collab/StandLoyTap-apap/main/';
const allSkins=[/* ВСТАВЬ СЮДА МАССИВ СКИНОВ ИЗ index.html */];
let adminUid='';
let playersData=[];
let withdrawsData=[];
let wFilter='all';
let promosData={};
let bansData={};
let currentTab='players';
let selectedSkinForGive=null;

function getTgUser(){try{return window.Telegram?.WebApp?.initDataUnsafe?.user||null}catch(e){return null}}
function toast(msg,type){const t=document.getElementById('toast');t.className='toast '+(type||'')+' show';t.innerText=msg;setTimeout(()=>t.classList.remove('show'),2500)}
function fmt(n){return Math.floor(n||0).toLocaleString('ru-RU')}

// ==================== ФИКС ОШИБКИ "Unexpected token '<'" ====================
async function api(path,opts){
  opts=opts||{};
  if(opts.body){
    opts.headers={'Content-Type':'application/json'};
    opts.body=JSON.stringify(opts.body);
  }
  try {
    const r=await fetch(BOT_URL+path,opts);
    const text = await r.text();
    try {
      return JSON.parse(text);
    } catch(e) {
      console.error('Server returned HTML instead of JSON');
      return { ok: false, error: 'Ошибка сервера' };
    }
  } catch(e) {
    console.error('Network error:', e);
    return { ok: false, error: 'Сеть недоступна' };
  }
}

function initLock(){const u=getTgUser();const idEl=document.getElementById('lockId');if(!u||!u.id){if(idEl)idEl.innerText='нет Telegram';return false}if(idEl)idEl.innerText=String(u.id);if(String(u.id)!==ADMIN_ID)return false;adminUid=String(u.id);document.getElementById('lockScreen').style.display='none';return true}
function switchTab(t){currentTab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));const p=document.getElementById('panel-'+t);if(p)p.classList.add('active');if(t==='players')loadPlayers();if(t==='withdraws')loadWithdraws();if(t==='promos')loadPromos();if(t==='stats')loadStats();if(t==='bans')loadBans();if(t==='logs')loadLogs()}

async function loadPlayers(){const list=document.getElementById('playersList');list.innerHTML='<div class="loading"><div class="spinner"></div>Загрузка...</div>';try{const d=await api('/api/admin/players?uid='+adminUid);if(!d.ok)throw new Error(d.error||'err');playersData=d.players||[];renderPlayers()}catch(e){list.innerHTML='<div class="empty"><div class="empty-icon">❌</div><div class="empty-title">Ошибка</div><div class="empty-sub">'+e.message+'</div></div>'}}
function renderPlayers(){const list=document.getElementById('playersList');const q=(document.getElementById('searchPlayers')?.value||'').toLowerCase();let f=playersData.filter(p=>p.id.toLowerCase().includes(q));if(f.length===0){list.innerHTML='<div class="empty"><div class="empty-icon">👥</div><div class="empty-title">Игроков нет</div></div>';return}list.innerHTML=f.map(p=>{const date=p.ts?new Date(p.ts).toLocaleString('ru-RU'):'—';const banned=bansData[p.id]?'🚫':'';return '<div class="player-card"><div class="player-top"><div style="flex:1;min-width:0"><div class="player-id">'+p.id+' '+banned+'</div><div class="player-date">📅 '+date+'</div></div><div class="player-bal">'+fmt(p.gold)+' G</div></div><div class="player-stats"><span>🎰 <b>'+(p.stats.spins||0)+'</b></span><span>🏆 <b>'+(p.stats.wins||0)+'</b></span><span>💀 <b>'+(p.stats.loses||0)+'</b></span><span>🎒 <b>'+(p.inv.length||0)+'</b></span></div><div class="player-actions"><button class="p-btn give" onclick="openGive(\''+p.id+'\')">➕</button><button class="p-btn take" onclick="openTake(\''+p.id+'\')">➖</button><button class="p-btn skin" onclick="openGiveSkin(\''+p.id+'\')">🎁</button></div><div class="spin-ctrl-row"><button class="spin-ctrl-btn win" id="sctrl-'+p.id+'-win" onclick="setSpinCtrl(\''+p.id+'\',\'win\')">✅ ПОБЕДА</button><button class="spin-ctrl-btn lose" id="sctrl-'+p.id+'-lose" onclick="setSpinCtrl(\''+p.id+'\',\'lose\')">❌ ПРОИГРЫШ</button><button class="spin-ctrl-btn off" id="sctrl-'+p.id+'-off" onclick="setSpinCtrl(\''+p.id+'\',\'off\')">🚫 ВЫКЛ</button></div><div class="player-actions" style="grid-template-columns:1fr 1fr 1fr;margin-top:6px"><button class="p-btn" style="background:linear-gradient(135deg,#9b8aff,#6a4cff);color:#fff" onclick="openAddFriends(\''+p.id+'\')">👥 +ДРУЗЬЯ</button><button class="p-btn" style="background:linear-gradient(135deg,#ffd700,#ffb800);color:#1a1a1a" onclick="toggleLegend(\''+p.id+'\')">👑 ЛЕГЕНДА</button><button class="p-btn" style="background:var(--dark3);color:var(--gray2)" onclick="copyId(\''+p.id+'\')">📋 ID</button></div><div class="player-actions" style="grid-template-columns:1fr 1fr;margin-top:6px">'+(bansData[p.id]?'<button class="p-btn unban" onclick="unbanPlayer(\''+p.id+'\')">✅ РАЗБАН</button>':'<button class="p-btn ban" onclick="openBan(\''+p.id+'\')">🚫 БАН</button>')+'<button class="p-btn" style="background:var(--dark3);color:var(--gray2)" onclick="openSpinProfile(\''+p.id+'\')">👤 ПРОФИЛЬ</button></div></div>'}).join('');playersData.forEach(p=>{api('/api/spinControl/'+p.id).then(d=>{if(d&&d.result&&d.result!=='off'){const el=document.getElementById('sctrl-'+p.id+'-'+d.result);if(el)el.classList.add('active')}})})}
function copyId(id){navigator.clipboard.writeText(id).then(()=>toast('✅ ID скопирован','win')).catch(()=>toast('❌ Ошибка','lose'))}
function openModal(html){const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML='<div class="modal-inner">'+html+'</div>';document.body.appendChild(m)}
function closeModal(){const m=document.getElementById('modal');if(m)m.remove()}
function openGive(id){openModal('<div class="modal-title">➕ ВЫДАТЬ G</div><div class="modal-sub">Игроку <b style="color:var(--yellow);font-family:monospace">'+id+'</b></div><div class="form-group"><div class="form-label">Сумма (G)</div><input class="form-input" id="giveAmt" type="number" placeholder="1000" autofocus></div><div class="modal-btns"><button class="modal-btn green" onclick="doGive(\''+id+'\')">✅ ВЫДАТЬ</button><button class="modal-btn secondary" onclick="closeModal()">❌ ОТМЕНА</button></div>')}
async function doGive(id){const amt=Number(document.getElementById('giveAmt').value);if(!amt||amt<=0){toast('❌ Неверная сумма','lose');return}try{const d=await api('/api/admin/giveG',{method:'POST',body:{uid:adminUid,targetId:id,amount:amt}});if(d.ok){toast('✅ Выдано '+fmt(amt)+' G','win');closeModal();loadPlayers()}else toast('❌ '+(d.error||'err'),'lose')}catch(e){toast('❌ '+e.message,'lose')}}
function openTake(id){openModal('<div class="modal-title">➖ ЗАБРАТЬ G</div><div class="modal-sub">У игрока <b style="color:var(--yellow);font-family:monospace">'+id+'</b></div><div class="form-group"><div class="form-label">Сумма (G)</div><input class="form-input" id="takeAmt" type="number" placeholder="1000" autofocus></div><div class="modal-btns"><button class="modal-btn primary" onclick="doTake(\''+id+'\')">✅ ЗАБРАТЬ</button><button class="modal-btn secondary" onclick="closeModal()">❌ ОТМЕНА</button></div>')}
async function doTake(id){const amt=Number(document.getElementById('takeAmt').value);if(!amt||amt<=0){toast('❌ Неверная сумма','lose');return}try{const d=await api('/api/admin/giveG',{method:'POST',body:{uid:adminUid,targetId:id,amount:-amt}});if(d.ok){toast('✅ Забрано '+fmt(amt)+' G','win');closeModal();loadPlayers()}else toast('❌ '+(d.error||'err'),'lose')}catch(e){toast('❌ '+e.message,'lose')}}
function openGiveSkin(id){selectedSkinForGive=null;const html='<div class="modal-title">🎁 ВЫДАТЬ СКИН</div><div class="modal-sub">Игроку <b style="color:var(--yellow);font-family:monospace">'+id+'</b></div><div class="search-box" style="margin-bottom:8px"><span>🔍</span><input type="text" id="skinSearch" placeholder="Поиск скина..." oninput="filterSkinList()"></div><div class="skins-grid" id="skinsGrid">'+allSkins.map(s=>'<div class="skin-item" data-name="'+s.name.toLowerCase()+'" onclick="selectSkin(\''+s.name.replace(/'/g,"\\'")+'\','+s.price+',\''+s.img+'\',\''+s.color+'\')"><img src="'+s.img+'" onerror="this.style.display=\'none\'"><div class="skin-info"><div class="skin-name">'+s.name+'</div><div class="skin-price">'+fmt(s.price)+' G</div></div></div>').join('')+'</div><div class="modal-btns"><button class="modal-btn green" onclick="doGiveSkin(\''+id+'\')">✅ ВЫДАТЬ</button><button class="modal-btn secondary" onclick="closeModal()">❌ ОТМЕНА</button></div>';openModal(html)}
function filterSkinList(){const q=(document.getElementById('skinSearch').value||'').toLowerCase();document.querySelectorAll('.skin-item').forEach(el=>{el.style.display=el.dataset.name.includes(q)?'flex':'none'})}
function selectSkin(name,price,img,color){selectedSkinForGive={name,price,img,color};document.querySelectorAll('.skin-item').forEach(el=>el.classList.remove('sel'));event.currentTarget.classList.add('sel')}
async function doGiveSkin(id){if(!selectedSkinForGive){toast('❌ Выбери скин','lose');return}try{const d=await api('/api/admin/giveSkin',{method:'POST',body:{uid:adminUid,targetId:id,skinName:selectedSkinForGive.name,skinPrice:selectedSkinForGive.price,skinImg:selectedSkinForGive.img,skinColor:selectedSkinForGive.color}});if(d.ok){toast('✅ Скин выдан','win');closeModal();loadPlayers()}else toast('❌ '+(d.error||'err'),'lose')}catch(e){toast('❌ '+e.message,'lose')}}
function openBan(id){openModal('<div class="modal-title">🚫 ЗАБАНИТЬ</div><div class="modal-sub">Игрока <b style="color:var(--red);font-family:monospace">'+id+'</b></div><div class="form-group"><div class="form-label">Причина</div><input class="form-input" id="banReason" placeholder="Нарушение правил" autofocus></div><div class="modal-btns"><button class="modal-btn primary" onclick="doBan(\''+id+'\')">🚫 ЗАБАНИТЬ</button><button class="modal-btn secondary" onclick="closeModal()">❌ ОТМЕНА</button></div>')}
async function doBan(id){const reason=document.getElementById('banReason').value.trim()||'Нарушение';try{const d=await api('/api/admin/ban',{method:'POST',body:{uid:adminUid,targetId:id,reason}});if(d.ok){toast('✅ Забанен','win');closeModal();loadPlayers();loadBans()}else toast('❌ Ошибка','lose')}catch(e){toast('❌ '+e.message,'lose')}}
async function unbanPlayer(id){if(!confirm('Разбанить '+id+'?'))return;try{const d=await api('/api/admin/unban',{method:'POST',body:{uid:adminUid,targetId:id}});if(d.ok){toast('✅ Разбанен','win');loadPlayers();loadBans()}}catch(e){toast('❌ '+e.message,'lose')}}

async function loadWithdraws(){const list=document.getElementById('withdrawsList');list.innerHTML='<div class="loading"><div class="spinner"></div>Загрузка...</div>';try{const d=await api('/api/admin/withdraws?uid='+adminUid);if(!d.ok)throw new Error(d.error||'err');withdrawsData=d.list||[];renderWithdraws()}catch(e){list.innerHTML='<div class="empty"><div class="empty-icon">❌</div><div class="empty-title">Ошибка</div><div class="empty-sub">'+e.message+'</div></div>'}}
function setWFilter(f){wFilter=f;document.getElementById('wFilterAll').classList.toggle('active',f==='all');document.getElementById('wFilterPending').classList.toggle('active',f==='pending');document.getElementById('wFilterDone').classList.toggle('active',f==='done');document.getElementById('wFilterRejected').classList.toggle('active',f==='rejected');renderWithdraws()}
function renderWithdraws(){const list=document.getElementById('withdrawsList');let arr=withdrawsData.slice();if(wFilter!=='all')arr=arr.filter(x=>x.status===wFilter);if(arr.length===0){list.innerHTML='<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">Заявок нет</div><div class="empty-sub">Пока никто не выводил</div></div>';return}list.innerHTML=arr.map(x=>{let statusTxt,statusCls;if(x.status==='pending'){statusTxt='⏳ ОЖИДАНИЕ';statusCls='pending'}else if(x.status==='done'){statusTxt='✅ ОДОБРЕНО';statusCls='done'}else{statusTxt='❌ ОТКЛОНЕНО';statusCls='rejected'}const canAct=(x.status==='pending');return '<div class="wd-card"><div class="wd-head"><div class="wd-ava">👤</div><div class="wd-name-block"><div class="wd-name">'+x.skin+'</div><div class="wd-id">ID: '+x.userId+'</div></div><div class="wd-status '+statusCls+'">'+statusTxt+'</div></div><div class="wd-skin-block"><img class="wd-skin-img" src="'+(x.img||'')+'" onerror="this.style.background=\'linear-gradient(135deg,#e50914,#8b0000)\';this.src=\'\'"><div class="wd-skin-info"><div class="wd-skin-name">'+x.skinName+'</div><div class="wd-skin-price">💰 '+fmt(x.price)+' G</div><div class="wd-skin-list">🏷 Список: '+fmt(x.listPrice)+' G</div><div class="wd-pattern">🎯 Паттерн: <b>'+(x.pattern||'—')+'</b></div></div></div><div class="wd-time">📅 '+(x.time||'')+'</div>'+(canAct?'<div class="wd-actions"><button class="wd-btn accept" onclick="approveWD('+x.id+')">✅ ПРИНЯТЬ</button><button class="wd-btn reject" onclick="rejectWD('+x.id+')">❌ ОТКЛОНИТЬ</button></div>':'')+'</div>'}).join('')}
async function approveWD(id){if(!confirm('Принять заявку #'+id+'?'))return;try{const d=await api('/api/admin/withdrawApprove',{method:'POST',body:{uid:adminUid,targetId:id}});if(d.ok){toast('✅ Заявка одобрена','win');loadWithdraws()}else toast('❌ '+(d.error||'err'),'lose')}catch(e){toast('❌ '+e.message,'lose')}}
function rejectWD(id){openModal('<div class="modal-title">❌ ОТКЛОНИТЬ ЗАЯВКУ</div><div class="modal-sub">Заявка #'+id+'</div><div class="form-group"><div class="form-label">Причина отказа</div><input class="form-input" id="rejReason" placeholder="Например: Неверный паттерн" autofocus></div><div class="modal-btns"><button class="modal-btn primary" onclick="doRejectWD('+id+')">❌ ОТКЛОНИТЬ</button><button class="modal-btn secondary" onclick="closeModal()">↩️ ОТМЕНА</button></div>')}
async function doRejectWD(id){const reason=document.getElementById('rejReason').value.trim()||'Без причины';try{const d=await api('/api/admin/withdrawReject',{method:'POST',body:{uid:adminUid,targetId:id,reason}});if(d.ok){toast('❌ Заявка отклонена','lose');closeModal();loadWithdraws()}else toast('❌ '+(d.error||'err'),'lose')}catch(e){toast('❌ '+e.message,'lose')}}

async function loadPromos(){const list=document.getElementById('promosList');list.innerHTML='<div class="loading"><div class="spinner"></div>Загрузка...</div>';try{const d=await api('/api/admin/promos?uid='+adminUid);if(!d.ok)throw new Error(d.error||'err');promosData=d.promos||{};const keys=Object.keys(promosData);if(keys.length===0){list.innerHTML='<div class="empty"><div class="empty-icon">🎟</div><div class="empty-title">Промокодов нет</div></div>';return}list.innerHTML=keys.map(k=>{const p=promosData[k];return '<div class="promo-card"><button class="promo-del" onclick="deletePromo(\''+k+'\')">✕</button><div class="promo-code">'+p.code+'</div><div class="promo-info"><span>💰 <b>'+fmt(p.amount)+' G</b></span><span>👥 <b>'+(p.used||0)+'/'+(p.maxUses||'∞')+'</b></span><span>📅 <b>'+(p.created||'')+'</b></span></div></div>'}).join('')}catch(e){list.innerHTML='<div class="empty"><div class="empty-icon">❌</div><div class="empty-title">Ошибка</div><div class="empty-sub">'+e.message+'</div></div>'}}
async function createPromo(){const code=(document.getElementById('promoCode').value||'').trim().toLowerCase();const amount=Number(document.getElementById('promoAmount').value);const maxUses=Number(document.getElementById('promoMax').value)||0;if(!code){toast('❌ Введи код','lose');return}if(!amount||amount<=0){toast('❌ Введи сумму','lose');return}try{const d=await api('/api/admin/promo',{method:'POST',body:{uid:adminUid,code,amount,maxUses}});if(d.ok){toast('✅ Промокод создан','win');document.getElementById('promoCode').value='';document.getElementById('promoAmount').value='';loadPromos()}else toast('❌ '+(d.error||'err'),'lose')}catch(e){toast('❌ '+e.message,'lose')}}
async function deletePromo(code){if(!confirm('Удалить промокод '+code+'?'))return;try{const d=await api('/api/admin/promoDelete',{method:'POST',body:{uid:adminUid,code}});if(d.ok){toast('✅ Удалён','win');loadPromos()}}catch(e){toast('❌ '+e.message,'lose')}}

async function loadStats(){const c=document.getElementById('statsContent');c.innerHTML='<div class="loading"><div class="spinner"></div>Загрузка...</div>';try{const d=await api('/api/admin/stats?uid='+adminUid);if(!d.ok)throw new Error(d.error||'err');const s=d.stats;c.innerHTML='<div class="stats-grid"><div class="stat-card"><div class="stat-label">👥 Игроков</div><div class="stat-val b">'+fmt(s.players)+'</div></div><div class="stat-card"><div class="stat-label">💰 Всего G</div><div class="stat-val y">'+fmt(s.totalGold)+'</div></div><div class="stat-card"><div class="stat-label">🎰 Спинов</div><div class="stat-val r">'+fmt(s.totalSpins)+'</div></div><div class="stat-card"><div class="stat-label">🏆 Побед</div><div class="stat-val g">'+fmt(s.totalWins)+'</div></div><div class="stat-card"><div class="stat-label">💀 Поражений</div><div class="stat-val r">'+fmt(s.totalLoses)+'</div></div><div class="stat-card"><div class="stat-label">🎒 Скинов</div><div class="stat-val b">'+fmt(s.totalInv)+'</div></div><div class="stat-card"><div class="stat-label">📤 Заявок</div><div class="stat-val o">'+fmt(s.withdrawsTotal)+'</div></div><div class="stat-card"><div class="stat-label">⏳ В ожидании</div><div class="stat-val o">'+fmt(s.withdrawsPending)+'</div></div><div class="stat-card"><div class="stat-label">✅ Выдано</div><div class="stat-val g">'+fmt(s.withdrawsDone)+'</div></div><div class="stat-card"><div class="stat-label">❌ Отклонено</div><div class="stat-val r">'+fmt(s.withdrawsRejected)+'</div></div><div class="stat-card"><div class="stat-label">💎 Всего выведено</div><div class="stat-val y">'+fmt(s.totalWithdrawn)+'</div></div><div class="stat-card"><div class="stat-label">🎟 Промокодов</div><div class="stat-val b">'+fmt(s.promos)+'</div></div><div class="stat-card"><div class="stat-label">🚫 Банов</div><div class="stat-val r">'+fmt(s.bans)+'</div></div></div>'}catch(e){c.innerHTML='<div class="empty"><div class="empty-icon">❌</div><div class="empty-title">Ошибка</div><div class="empty-sub">'+e.message+'</div></div>'}}

async function loadBans(){const list=document.getElementById('bansList');list.innerHTML='<div class="loading"><div class="spinner"></div>Загрузка...</div>';try{const d=await api('/api/admin/bans?uid='+adminUid);if(!d.ok)throw new Error(d.error||'err');bansData=d.bans||{};const keys=Object.keys(bansData);if(keys.length===0){list.innerHTML='<div class="empty"><div class="empty-icon">✅</div><div class="empty-title">Банов нет</div></div>';return}list.innerHTML=keys.map(k=>{const b=bansData[k];return '<div class="player-card" style="border-color:rgba(229,9,20,.5)"><div class="player-top"><div style="flex:1;min-width:0"><div class="player-id">🚫 '+k+'</div><div class="player-date">📅 '+(b.time||'')+'</div></div></div><div class="player-stats"><span>📝 <b>'+(b.reason||'—')+'</b></span></div><div class="player-actions" style="grid-template-columns:1fr"><button class="p-btn unban" onclick="unbanPlayer(\''+k+'\')">✅ РАЗБАНИТЬ</button></div></div>'}).join('')}catch(e){list.innerHTML='<div class="empty"><div class="empty-icon">❌</div><div class="empty-title">Ошибка</div></div>'}}

async function loadLogs(){const list=document.getElementById('logsList');list.innerHTML='<div class="loading"><div class="spinner"></div>Загрузка...</div>';try{const d=await api('/api/admin/logs?uid='+adminUid);if(!d.ok)throw new Error(d.error||'err');const logs=d.logs||[];if(logs.length===0){list.innerHTML='<div class="empty"><div class="empty-icon">📜</div><div class="empty-title">Логов нет</div></div>';return}list.innerHTML=logs.map(l=>'<div class="log-card"><div class="log-top"><div class="log-action">'+l.action+'</div><div class="log-time">'+(l.time||'')+'</div></div><div class="log-details">'+JSON.stringify(l.details||{})+'</div></div>').join('')}catch(e){list.innerHTML='<div class="empty"><div class="empty-icon">❌</div><div class="empty-title">Ошибка</div></div>'}}

// ========== SPIN CONTROL ==========
async function setSpinCtrl(id, result){
  try{
    const d = await api('/api/admin/setSpinResult',{
      method:'POST',
      body:{uid:adminUid, targetId:id, result}
    });
    if(!d.ok){toast('❌ '+(d.error||'Ошибка'),'lose');return}
    ['win','lose','off'].forEach(r=>{
      const el=document.getElementById('sctrl-'+id+'-'+r);
      if(el)el.classList.remove('active');
    });
    const el=document.getElementById('sctrl-'+id+'-'+result);
    if(el)el.classList.add('active');
    const names={win:'✅ ПОБЕДА',lose:'❌ ПРОИГРЫШ',off:'🚫 ВЫКЛ'};
    toast('🎯 '+names[result]+' для '+id.slice(-6),'win');
  }catch(e){toast('❌ '+e.message,'lose')}
}

// ========== ADD FRIENDS ==========
function openAddFriends(id){
  openModal(
    '<div class="modal-title">👥 ДОБАВИТЬ ДРУЗЕЙ</div>'+
    '<div class="modal-sub">Игроку <b style="color:#9b8aff;font-family:monospace">'+id+'</b></div>'+
    '<div class="form-group"><div class="form-label">Сколько добавить</div>'+
    '<input class="form-input" id="addFrCount" type="number" placeholder="10" value="10" autofocus></div>'+
    '<div class="modal-info">При достижении <b>100</b> друзей игрок автоматически станет 👑 ЛЕГЕНДОЙ и получит 600 G</div>'+
    '<div class="modal-btns">'+
    '<button class="modal-btn" style="background:linear-gradient(135deg,#9b8aff,#6a4cff);color:#fff" onclick="doAddFriends(\''+id+'\')">✅ ДОБАВИТЬ</button>'+
    '<button class="modal-btn secondary" onclick="closeModal()">❌ ОТМЕНА</button>'+
    '</div>'
  );
}
async function doAddFriends(id){
  const count = Number(document.getElementById('addFrCount').value)||0;
  if(count<=0){toast('❌ Введи число > 0','lose');return}
  try{
    const d = await api('/api/admin/addFriends',{
      method:'POST',
      body:{uid:adminUid, targetId:id, count}
    });
    if(d.ok){
      toast('✅ +'+count+' друзей. Всего: '+(d.newInvited||0)+(d.isLegend?' 👑 ЛЕГЕНДА!':''),'win');
      closeModal();
      loadPlayers();
    }else toast('❌ '+(d.error||'Ошибка'),'lose');
  }catch(e){toast('❌ '+e.message,'lose')}
}

// ========== LEGEND ==========
async function toggleLegend(id){
  try{
    const d = await api('/api/admin/setLegend',{
      method:'POST',
      body:{uid:adminUid, targetId:id, value:true}
    });
    if(d.ok){toast('👑 Легенда выдана','win');loadPlayers()}
    else toast('❌ '+(d.error||'Ошибка'),'lose');
  }catch(e){toast('❌ '+e.message,'lose')}
}

function openSpinProfile(id){
  toast('👤 Профиль: '+id,'win');
}
function refreshAll(){loadPlayers();if(currentTab==='withdraws')loadWithdraws();if(currentTab==='promos')loadPromos();if(currentTab==='stats')loadStats();if(currentTab==='bans')loadBans();if(currentTab==='logs')loadLogs();toast('🔄 Обновлено','win')}

(async function init(){
  try{if(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.ready)window.Telegram.WebApp.ready()}catch(e){}
  await new Promise(r=>setTimeout(r,300));
  if(!initLock())return;
  await loadBans();
  loadPlayers();
})();
</script></body></html>
